name: Publish CineTracker v1.0.2 Release

on:
  workflow_dispatch:
  push:
    branches: [release/1.0.2]
    paths:
      - '.github/workflows/publish-v102-release.yml'
      - 'apps/web/runtime-r206-f1-rewatch-fix.js'
      - 'apps/web/build-r206.mjs'
      - 'scripts/prepare-android-v1002.mjs'
      - 'scripts/test-android-v1002.mjs'
      - 'apps/android/app/build.gradle'

permissions:
  contents: write
concurrency:
  group: cinetracker-publish-v102-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Install signing key
        run: |
          set -euo pipefail
          test -f ~/.cinetracker/cinetracker.keystore
          mkdir -p ~/.android
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - name: Build Web 1.0.2 bundle
        run: node apps/web/build-r206.mjs
      - name: Assert Web rewatch runtime
        run: |
          set -euo pipefail
          grep -Fq 'r206-official-1.0.2' apps/web/dist/app-v206.js
          grep -Fq 'click-to-rpc-persistent-plays' apps/web/dist/app-v206.js
          grep -Fq 'cinetracker_mark_watch_v0994' apps/web/dist/app-v206.js
          grep -Fq '[data-ct171-rewatch-media],[data-ct171-rewatch-episode],[data-rewatch-episode]' apps/web/dist/app-v206.js
      - name: Assert Web F1 and Sports runtime
        run: |
          set -euo pipefail
          grep -Fq 'jolpica-f1-hub-calendar-standings-results' apps/web/dist/app-v206.js
          grep -Fq 'current/driverstandings' apps/web/dist/app-v206.js
          grep -Fq 'current/constructorstandings' apps/web/dist/app-v206.js
          grep -Fq 'current/last/results' apps/web/dist/app-v206.js
          grep -Fq 'remove-status-statistics-summary-card-runtime' apps/web/dist/app-v206.js
      - name: Assert Web final assets
        run: |
          set -euo pipefail
          grep -Fq 'app-v206.js' apps/web/dist/index.html
          grep -Fq 'app-v206.js' apps/web/dist/service-worker.js
      - name: Prepare Android 1.0.2
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.2'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10044' apps/android/app/build.gradle
          node scripts/prepare-android-v1002.mjs
          node scripts/test-android-v1002.mjs
      - name: Build APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate and package APK
        run: |
          set -euo pipefail
          APK='apps/android/app/build/outputs/apk/debug/app-debug.apk'
          OUT='CineTracker-1.0.2.apk'
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          grep -Fq "versionName='1.0.2'" <<<"$BADGING"
          grep -Fq "versionCode='10044'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct102-index.html
          grep -Fq 'name="ct-official-version" content="1.0.2"' /tmp/ct102-index.html
          grep -Fq "window.__ctR244='f1-hub-rewatch-functional-sports-cleanup-android'" /tmp/ct102-index.html
          grep -Fq 'cinetracker_mark_watch_v0994' /tmp/ct102-index.html
          grep -Fq '[data-ct171-rewatch-media],[data-ct171-rewatch-episode],[data-rewatch-episode]' /tmp/ct102-index.html
          grep -Fq 'https://api.jolpi.ca/ergast/f1' /tmp/ct102-index.html
          grep -Fq 'current/driverstandings' /tmp/ct102-index.html
          grep -Fq 'current/constructorstandings' /tmp/ct102-index.html
          grep -Fq 'current/last/results' /tmp/ct102-index.html
          grep -Fq 'current/last/qualifying' /tmp/ct102-index.html
          grep -Fq 'remove-status-statistics-summary-card-runtime' /tmp/ct102-index.html
          grep -Fq 'watchlist-swap-uses-active-ct186-selected-pool' /tmp/ct102-index.html
          grep -Fq 'native-webview-horizontal-no-manual-touch' /tmp/ct102-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee CineTracker-1.0.2-SHA256.txt
          stat -c '%s' "$OUT" | tee CineTracker-1.0.2-size.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CineTracker-1.0.2
          path: |
            CineTracker-1.0.2.apk
            CineTracker-1.0.2-SHA256.txt
            CineTracker-1.0.2-size.txt
      - name: Publish GitHub Release v1.0.2
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          # CineTracker 1.0.2
          - Reassistir filmes e episódios corrigido no clique real, com contador persistente 2x, 3x, 4x...
          - Card antigo de status/estatísticas do Sports removido
          - Hub de Fórmula 1 em Esportes: próximo GP, calendário, pilotos, construtores, equipes, grid/qualificação e resultados
          - Dados via Jolpica com cache local e fallback
          - Web e runtime final do WebView Android validados
          - Preservados Watchlist pool e Top 10 nativo Android
          - Android 1.0.2 / versionCode 10044 validado por aapt e apksigner
          EOF
          )
          if gh release view v1.0.2 >/dev/null 2>&1; then
            gh release upload v1.0.2 CineTracker-1.0.2.apk CineTracker-1.0.2-SHA256.txt CineTracker-1.0.2-size.txt --clobber
            gh release edit v1.0.2 --title 'CineTracker 1.0.2' --notes "$NOTES" --latest
          else
            gh release create v1.0.2 CineTracker-1.0.2.apk CineTracker-1.0.2-SHA256.txt CineTracker-1.0.2-size.txt --target "$GITHUB_SHA" --title 'CineTracker 1.0.2' --notes "$NOTES" --latest
          fi
      - name: Verify published assets
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          gh release view v1.0.2 --json tagName,name,isDraft,isPrerelease,url,assets > /tmp/release.json
          grep -Fq 'CineTracker-1.0.2.apk' /tmp/release.json
          grep -Fq 'CineTracker-1.0.2-SHA256.txt' /tmp/release.json
          cat /tmp/release.json
