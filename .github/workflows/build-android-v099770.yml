name: Build Android 0.99.7.70

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/runtime-r242-active-foryou-renderer.js'
      - 'apps/android/app/build.gradle'
      - 'scripts/prepare-android-v099770.mjs'
      - '.github/workflows/build-android-v099770.yml'

permissions:
  contents: read

concurrency:
  group: cinetracker-android-v099770-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Install cached signing key
        run: |
          test -f ~/.cinetracker/cinetracker.keystore
          mkdir -p ~/.android
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate r242 source scope
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r242-active-foryou-renderer.js
          node --check scripts/prepare-android-v099770.mjs
          grep -Fq "versionName '0.99.7.70'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10040' apps/android/app/build.gradle
          grep -Fq "window.__ctR242Fix='ct186-final-renderer-section-ownership'" apps/android/runtime-r242-active-foryou-renderer.js
          grep -Fq "window.__ctR242Events='none-r237-remains-single-swap-authority'" apps/android/runtime-r242-active-foryou-renderer.js
          ! grep -Fq "addEventListener('pointerup'" apps/android/runtime-r242-active-foryou-renderer.js
          ! grep -Fq "addEventListener('click'" apps/android/runtime-r242-active-foryou-renderer.js

      - name: Prepare Android 0.99.7.70
        run: |
          set -euo pipefail
          node scripts/prepare-android-v099770.mjs
          INDEX='apps/android/app/src/main/assets/hotfix5/index.html'
          grep -Fq 'android-v0.99.7.70-r242-active-foryou-renderer' "$INDEX"
          grep -Fq 'ct186-final-renderer-section-ownership' "$INDEX"
          grep -Fq 'window.__ctR242ActiveForYouRenderer=ct186RenderForYou' "$INDEX"
          grep -Fq 'data-ct241-slot-key=' "$INDEX"
          grep -Fq 'grid-auto-rows:auto!important' "$INDEX"
          grep -Fq 'contain:layout paint!important' "$INDEX"
          grep -Fq 'native-webview-horizontal-no-manual-touch' "$INDEX"
          ! grep -Fq 'android-v0.99.7.68-r240-watchlist-hit-route' "$INDEX"

      - name: Validate actual active ct186 renderer
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r242-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r242 embedded JS missing');
          const js=h.slice(a+marker.length,b);
          fs.writeFileSync('/tmp/ct99770-prebuild.js',js);

          const r0=js.indexOf('function ct186RenderForYou(data){');
          const r1=js.indexOf('\nct166RenderForYou=ct186RenderForYou;renderForYou158=ct186RenderForYou;',r0);
          if(r0<0||r1<r0)throw new Error('ACTIVE ct186 renderer missing');
          const active=js.slice(r0,r1);
          for(const sec of ['daily','watchlist','fresh'])if(!active.includes(`data-ct241-section="${sec}"`))throw new Error('ACTIVE ct186 renderer lacks section '+sec);
          if(!js.includes('ct166RenderForYou=ct186RenderForYou;renderForYou158=ct186RenderForYou;window.__ctR242ActiveForYouRenderer=ct186RenderForYou;'))throw new Error('ct186 is not final active renderer alias');

          const c0=js.indexOf('function ct166SwapButton(key,count){');
          const c1=js.indexOf('\nfunction ct166RenderForYou(data){',c0);
          const s0=js.indexOf('function ct186Slot(label,x,key,count){');
          const s1=js.indexOf('\nfunction ct186RenderForYou(data){',s0);
          if(c0<0||c1<c0||s0<0||s1<s0)throw new Error('slot function extraction failed');
          const slotFns=js.slice(c0,c1)+"\n"+js.slice(s0,s1);
          const select=()=>({
            daily:{id:1},wm:{id:11},ws:{id:12},wa:{id:13},fm:{id:21},fs:{id:22},fa:{id:23},
            wmPool:[{id:11},{id:14}],wsPool:[{id:12},{id:15}],waPool:[{id:13},{id:16}]
          });
          const card=x=>`<article class="card discover-card"><button data-media="movie:${x.id}"><div class="poster"></div><div class="card-body"><b>${x.id}</b></div></button><div class="ct169-card-actions"></div></article>`;
          const render=new Function('esc','discoverCard158','ct186Select',`let ct186ForYouData=null;${slotFns}\n${active};return ct186RenderForYou;`)(String,card,select);
          const out=render({_ct186_fresh:{movie:[{id:21},{id:24}],series:[{id:22},{id:25}],anime:[{id:23},{id:26}]}});
          for(const expected of [
            'data-ct241-section="watchlist"','data-ct241-section="fresh"',
            'data-ct241-slot-key="watchlist:movie"','data-ct237-swap="watchlist:movie"',
            'data-ct241-slot-key="fresh:movie"','data-ct237-swap="fresh:movie"'
          ])if(!out.includes(expected))throw new Error('ACTIVE renderer output missing '+expected);
          if(out.indexOf('data-ct241-section="watchlist"')>out.indexOf('data-ct241-section="fresh"'))throw new Error('Watchlist/Fresh order corrupted');
          fs.writeFileSync('/tmp/ct99770-active-render-fragment.html',out);
          console.log('R242_ACTIVE_RENDERER_TEST_OK renderer=ct186 watchlist=watchlist:* fresh=fresh:*');
          NODE
          node --check /tmp/ct99770-prebuild.js

      - name: Browser hit-test from actual ct186 output
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          node - <<'NODE'
          const fs=require('fs');
          const fragment=fs.readFileSync('/tmp/ct99770-active-render-fragment.html','utf8');
          const r=fs.readFileSync('apps/android/runtime-r241-watchlist-owner-layout.js','utf8');
          const m=r.match(/style241\.textContent=`([\s\S]*?)`;/);if(!m)throw new Error('r241 CSS missing');
          const r241=m[1];
          const r237=`
          [data-discover] .foryou-grid:not(.ct166-daily-grid){display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;grid-auto-rows:1fr!important;gap:6px!important;width:100%!important;overflow:visible!important;align-items:stretch!important;padding:1px!important}
          [data-discover] .foryou-grid:not(.ct166-daily-grid)>.ct166-slot{display:grid!important;grid-template-rows:auto minmax(0,1fr)!important;height:100%!important;align-self:stretch!important}
          [data-discover] .foryou-grid:not(.ct166-daily-grid)>.ct166-slot>.discover-card{display:flex!important;flex-direction:column!important;width:100%!important;height:100%!important;overflow:hidden!important}
          [data-discover] .ct169-card-actions{min-height:38px!important;height:38px!important;max-height:38px!important;overflow:hidden!important}
          `;
          const html=`<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:12px;width:412px}.panel{padding:10px;margin:0 0 8px;border:1px solid #345}.panel-head{margin-bottom:7px}.ct166-slot-head{min-height:20px}.poster{width:100%;aspect-ratio:2/3;background:#345}.card-body{height:42px}.ct169-card-actions{display:grid;grid-template-columns:1fr auto;gap:5px;padding:0 6px 7px}${r237}${r241}</style><body><div data-page="discover"><div data-discover>${fragment}</div></div><pre id="result"></pre><script>addEventListener('load',()=>{const ws=document.querySelector('[data-ct241-section="watchlist"]'),fs=document.querySelector('[data-ct241-section="fresh"]'),wb=ws?.querySelector('[data-ct237-swap="watchlist:movie"]'),fb=fs?.querySelector('[data-ct237-swap="fresh:movie"]');if(!ws||!fs||!wb||!fb){document.getElementById('result').textContent='R242_HITTEST_FAIL missing-active-elements';return}const br=wb.getBoundingClientRect(),wr=ws.getBoundingClientRect(),fr=fs.getBoundingClientRect(),hit=document.elementFromPoint((br.left+br.right)/2,(br.top+br.bottom)/2),owner=hit?.closest?.('[data-ct237-swap]'),slot=owner?.closest?.('[data-ct241-slot-key]');const ok=owner===wb&&slot?.dataset?.ct241SlotKey==='watchlist:movie'&&br.top>=wr.top&&br.bottom<=wr.bottom&&wr.bottom<=fr.top+.5;document.getElementById('result').textContent=ok?'R242_HITTEST_OK active=ct186 owner=watchlist:movie':'R242_HITTEST_FAIL '+JSON.stringify({button:[br.top,br.bottom],watch:[wr.top,wr.bottom],fresh:[fr.top,fr.bottom],owner:owner?.dataset?.ct237Swap,slot:slot?.dataset?.ct241SlotKey})})<\/script>`;
          fs.writeFileSync('/tmp/ct242-hit.html',html);
          NODE
          timeout 20s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=412,915 --virtual-time-budget=1000 --dump-dom file:///tmp/ct242-hit.html > /tmp/ct242-hit-dom.txt
          grep -Fq 'R242_HITTEST_OK active=ct186 owner=watchlist:movie' /tmp/ct242-hit-dom.txt
          echo 'R242_BROWSER_HITTEST_OK actual-ct186-output-watchlist-contained'

      - name: Build Android APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate final Android APK
        run: |
          set -euo pipefail
          APK='apps/android/app/build/outputs/apk/debug/app-debug.apk'
          OUT='CineTracker-0.99.7.70.apk'
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          grep -Fq "versionName='0.99.7.70'" <<<"$BADGING"
          grep -Fq "versionCode='10040'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99770-index.html
          grep -Fq 'android-v0.99.7.70-r242-active-foryou-renderer' /tmp/ct99770-index.html
          grep -Fq 'window.__ctR242ActiveForYouRenderer=ct186RenderForYou' /tmp/ct99770-index.html
          grep -Fq 'data-ct241-slot-key=' /tmp/ct99770-index.html
          grep -Fq 'grid-auto-rows:auto!important' /tmp/ct99770-index.html
          grep -Fq 'native-webview-horizontal-no-manual-touch' /tmp/ct99770-index.html
          node - <<'NODE'
          const fs=require('fs'),h=fs.readFileSync('/tmp/ct99770-index.html','utf8');
          const marker='<script data-ct-android="r242-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);if(a<0||b<a)throw new Error('APK r242 JS missing');
          const js=h.slice(a+marker.length,b),s=js.indexOf('function ct186RenderForYou(data){'),e=js.indexOf('\nct166RenderForYou=ct186RenderForYou;renderForYou158=ct186RenderForYou;',s);if(s<0||e<s)throw new Error('APK active ct186 renderer missing');
          const fn=js.slice(s,e);for(const sec of ['daily','watchlist','fresh'])if(!fn.includes(`data-ct241-section="${sec}"`))throw new Error('APK active renderer lacks '+sec);
          console.log('APK_R242_ACTIVE_RENDERER_OK');
          NODE
          "$APKSIGNER" verify --print-certs "$OUT"
          stat -c '%s' "$OUT" | tee android-v099770-size.txt
          sha256sum "$OUT" | tee android-v099770-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.70
          path: |
            CineTracker-0.99.7.70.apk
            android-v099770-sha256.txt
            android-v099770-size.txt
          if-no-files-found: error
          retention-days: 14
