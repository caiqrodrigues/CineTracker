name: Build Android 0.99.7.30 — Discover Tabs + Native Carousels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'scripts/prepare-android-v099730.mjs'
      - 'scripts/test-android-v099730.mjs'
      - '.github/workflows/build-android-v099730.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099730-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099730:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.30
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r198-mobile-performance.js
          node --check apps/android/runtime-r202-discover-tabs-native-carousel.js
          node --check apps/web/runtime-r196-web.js
          node --check scripts/prepare-android-v099730.mjs
          node --check scripts/test-android-v099730.mjs
          node scripts/prepare-android-v099730.mjs
          node scripts/test-android-v099730.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r202-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r202 embedded JS missing');
          const js=h.slice(a+marker.length,b);
          for(const old of ['restore-route-render-and-discover-pan-x','discover-direct-tabs-manual-horizontal-scroll','pointer-capture-discover-tabs-horizontal-rails'])if(js.includes(old))throw new Error('old Discover runtime still embedded: '+old);
          fs.writeFileSync('/tmp/ct99730-prebuild.js',js);
          NODE
          node --check /tmp/ct99730-prebuild.js

      - name: Build Android 0.99.7.30 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate APK identity, Discover runtime, signing and digest
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.30-discover-tabs-native-carousels-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.30"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "10000"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99730-index.html
          for marker in \
            'android-v0.99.7.30-r202-discover-tabs-native-carousel' \
            'discover-direct-pointerup-native-horizontal-carousels' \
            'foryou-no-type-subfilters' \
            'pointerup-direct-render-no-legacy-click-dependency' \
            'native-overflow-x-foryou-and-generic-feeds' \
            'detail-watchlist-toggle' \
            'mobile-first-cache-swr-progressive-render' \
            'embedded-apk-never-reloads-from-web-release-json'; do
            grep -Fq "$marker" /tmp/ct99730-index.html
          done
          ! grep -Fq 'restore-route-render-and-discover-pan-x' /tmp/ct99730-index.html
          ! grep -Fq 'discover-direct-tabs-manual-horizontal-scroll' /tmp/ct99730-index.html
          ! grep -Fq 'pointer-capture-discover-tabs-horizontal-rails' /tmp/ct99730-index.html
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/ct99730-index.html','utf8');
          const marker='<script data-ct-android="r202-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('embedded r202 JS missing');
          fs.writeFileSync('/tmp/ct99730.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99730.js
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099730-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.30-discover-tabs-native-carousels-debug
          path: |
            cinetracker-android-0.99.7.30-discover-tabs-native-carousels-debug.apk
            android-v099730-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android 0.99.7.30 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES='Android-only fix. PRA VOCE no longer shows Todos/Filmes/Series. Discover subtab taps are handled directly on pointer-up instead of relying on the legacy click chain. PRA VOCE groups and normal Discover feeds use native overflow-x carousels so Filme/Serie/Anime and Novidades can be swiped horizontally. No Web production files or Web revision were changed.'
          gh release view android-v0.99.7.30 >/dev/null 2>&1 || gh release create android-v0.99.7.30 --title "CineTracker Android 0.99.7.30 — Discover Tabs + Native Carousels" --notes "$NOTES"
          gh release edit android-v0.99.7.30 --title "CineTracker Android 0.99.7.30 — Discover Tabs + Native Carousels" --notes "$NOTES"
          gh release upload android-v0.99.7.30 cinetracker-android-0.99.7.30-discover-tabs-native-carousels-debug.apk android-v099730-sha256.txt --clobber
