name: Build Android 0.99.7.53

on:
  workflow_dispatch:
  push:
    branches:
      - release/0.99.7.53-r202
    paths:
      - 'apps/android/runtime-r225-discover-inplace-swap.js'
      - 'apps/android/app/build.gradle'
      - 'scripts/prepare-android-v099753.mjs'
      - 'scripts/test-android-v099753.mjs'
      - '.github/workflows/build-android-v099753.yml'

permissions:
  contents: read

concurrency:
  group: cinetracker-android-v099753-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.53
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r225-discover-inplace-swap.js
          node --check scripts/prepare-android-v099753.mjs
          node --check scripts/test-android-v099753.mjs
          node scripts/prepare-android-v099753.mjs
          node scripts/test-android-v099753.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r225-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r225 embedded JS missing');
          fs.writeFileSync('/tmp/ct99753-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99753-prebuild.js

      - name: Build Android APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate Android APK
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="CineTracker-0.99.7.53.apk"
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.53"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "10023"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99753-index.html
          for marker in \
            'android-v0.99.7.49-r221-rewatch-favorites-sports' \
            'android-v0.99.7.50-r222-discover-compact-horizontal' \
            'android-v0.99.7.51-r223-top10-sports-search-final' \
            'android-v0.99.7.52-r224-discover-controller-watchlist' \
            'android-v0.99.7.53-r225-discover-inplace-swap' \
            'normal-tabs-update-content-in-place-top10-r217-only' \
            'trocar-replaces-own-slot-with-different-item' \
            'success-animation-immediate-next-recommendation' \
            'single-row-compact-auto-width-28px-pills' \
            'persistent-2x-3x-4x-no-disable' \
            'view-more-opens-movie-series-person' \
            'r217-library-behavior-no-r219-synthetic-fallback' \
            'data-ct225-swap'; do
            grep -Fq "$marker" /tmp/ct99753-index.html
          done
          ! grep -Fq 'ct219-manual-cover' /tmp/ct99753-index.html
          ! grep -Fq 'negative-id-resolve-or-local-detail' /tmp/ct99753-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          stat -c '%s' "$OUT" | tee android-v099753-size.txt
          sha256sum "$OUT" | tee android-v099753-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.53
          path: |
            CineTracker-0.99.7.53.apk
            android-v099753-sha256.txt
            android-v099753-size.txt
          if-no-files-found: error
          retention-days: 14
