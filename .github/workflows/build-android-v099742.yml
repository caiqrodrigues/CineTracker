name: Build Android 0.99.7.42 — Discover State Captions Density

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-099742-discover-state-captions-density
    paths:
      - 'apps/android/app/build.gradle'
      - 'apps/android/runtime-r214-discover-state-clean-captions-density.js'
      - 'scripts/prepare-android-v099742.mjs'
      - 'scripts/test-android-v099742.mjs'
      - '.github/workflows/build-android-v099742.yml'
      - 'scripts/prepare-android-v099741.mjs'
      - 'apps/android/runtime-r213-discover-core-profile-density.js'
      - 'scripts/prepare-android-v099736.mjs'
      - 'apps/android/runtime-r208-discover-sports-cleanup.js'

permissions:
  contents: read

concurrency:
  group: cinetracker-android-v099742-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099742:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.42
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r214-discover-state-clean-captions-density.js
          node --check scripts/prepare-android-v099742.mjs
          node --check scripts/test-android-v099742.mjs
          node scripts/prepare-android-v099742.mjs
          node scripts/test-android-v099742.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r214-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r214 embedded JS missing');
          fs.writeFileSync('/tmp/ct99742-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99742-prebuild.js

      - name: Build Android 0.99.7.42 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate APK identity, runtime, signing and digest
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.42-discover-state-captions-density-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.42"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "10012"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99742-index.html
          for marker in \
            'android-v0.99.7.42-r214-discover-state-clean-captions-density' \
            'discover-single-source-state-clean-captions-tighter-profile' \
            'selected-tab-is-render-state-and-fetch-state' \
            'window.ct214SelectDiscoverTab=selectTab214' \
            'single-state-route-click-fetch-active-tab' \
            'remove-explanatory-copy-keep-data-labels' \
            "const h=wide?'40px':'34px'" \
            'min-height:36px!important' \
            'single-minimal-item-search-no-date-no-summary' \
            'calc((100% - 16px)/3)' \
            'detail-watchlist-toggle'; do
            grep -Fq "$marker" /tmp/ct99742-index.html
          done
          ! grep -Fq 'if(window.ct213SelectDiscoverTab){void window.ct213SelectDiscoverTab' /tmp/ct99742-index.html
          ! grep -Fq 'r209-android-discover-profile-sports-layout' /tmp/ct99742-index.html
          ! grep -Fq 'r210-android-discover-profile-order' /tmp/ct99742-index.html
          ! grep -Fq 'r211-android-real-dom-roots' /tmp/ct99742-index.html
          ! grep -Fq 'r212-android-core-discover-profile' /tmp/ct99742-index.html
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/ct99742-index.html','utf8');
          const marker='<script data-ct-android="r214-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('embedded r214 JS missing');
          fs.writeFileSync('/tmp/ct99742.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99742.js
          "$APKSIGNER" verify --print-certs "$OUT"
          stat -c '%s' "$OUT" | tee android-v099742-size.txt
          sha256sum "$OUT" | tee android-v099742-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.42-discover-state-captions-density-debug
          path: |
            cinetracker-android-0.99.7.42-discover-state-captions-density-debug.apk
            android-v099742-sha256.txt
            android-v099742-size.txt
          if-no-files-found: error
          retention-days: 14
