name: Build Android

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/web/patch-v068-v097.js'
      - 'apps/web/patch-v073-v097-fix7.js'
      - 'scripts/test-auth-fix7-runtime.mjs'
      - 'scripts/build-web.mjs'
      - '.github/workflows/build-android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/web/patch-v068-v097.js'
      - 'apps/web/patch-v073-v097-fix7.js'
      - 'scripts/test-auth-fix7-runtime.mjs'
      - 'scripts/build-web.mjs'
      - 'docs/releases/0.0.97-FIX7.md'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark Android build pending
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"pending","context":"Android Build","description":"Building CineTracker Android 0.0.97 FIX 7"}'
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Restore dedicated CineTracker signing key
        uses: actions/cache@v4
        with: { path: ~/.cinetracker/cinetracker.keystore, key: cinetracker-signing-v2 }
      - name: Initialize dedicated signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate FIX 7 and force login-to-Home runtime stress test
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/patch-v068-v097.js
          node --check apps/web/patch-v073-v097-fix7.js
          node scripts/test-auth-fix7-runtime.mjs
          node scripts/build-web.mjs
          ! grep -q 'void bootstrap();' dist/index.html
          grep -q '__ctBaseBootstrapDeferred = bootstrap' dist/index.html
      - name: Build debug APK
        working-directory: apps/android
        shell: bash
        run: gradle assembleDebug --stacktrace
      - name: Verify embedded FIX 7 module
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/android/app/src/main/assets/ct89-v097-fix7.js
          node --check apps/android/app/src/main/assets/ct89-v097-fix7.js
          cmp apps/web/patch-v073-v097-fix7.js apps/android/app/src/main/assets/ct89-v097-fix7.js
          ! grep -q '"ct88-v097-fix6.js"' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
      - name: Prepare APK name
        shell: bash
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk cinetracker-android-0.0.97-FIX7-debug.apk
      - name: Verify package and version
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs cinetracker-android-0.0.97-FIX7-debug.apk
          PACKAGE="$($AAPT dump badging cinetracker-android-0.0.97-FIX7-debug.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging cinetracker-android-0.0.97-FIX7-debug.apk | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$($AAPT dump badging cinetracker-android-0.0.97-FIX7-debug.apk | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.0.97 FIX 7"
          test "$VERSION_CODE" = "977"
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.0.97-FIX7-debug
          path: cinetracker-android-0.0.97-FIX7-debug.apk
      - name: Publish Android 0.0.97 FIX 7 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: |
          set -euo pipefail
          gh release view android-v0.0.97-fix7 >/dev/null 2>&1 || gh release create android-v0.0.97-fix7 --title "CineTracker Android 0.0.97 FIX 7" --notes-file docs/releases/0.0.97-FIX7.md
          gh release upload android-v0.0.97-fix7 cinetracker-android-0.0.97-FIX7-debug.apk --clobber
      - name: Mark Android build success
        if: success()
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"Android Build","description":"0.0.97 FIX 7 published"}'
      - name: Mark Android build failure
        if: failure()
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"failure","context":"Android Build","description":"0.0.97 FIX 7 build failed"}'

# release-ready-trigger: android-0.0.97-fix7
