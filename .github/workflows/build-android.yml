name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write
  statuses: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark Android build pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"pending","context":"Android Build","description":"Building CineTracker Android 0.0.29"}'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch 0.0.27 base for 0.0.29
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java')
          s=p.read_text()
          s=s.replace('CineTrackerAndroid/0.0.27','CineTrackerAndroid/0.0.29')
          s=s.replace('apk=27','apk=29')
          s=s.replace('ctAndroid27','ctAndroid29').replace('ct27','ct29').replace('ct-android27','ct-android29')
          s=s.replace('build 0.0.27','build 0.0.29')
          s=s.replace("try{view='account';render();window.scrollTo(0,0);setTimeout(function(){if(window.ctAndroid29)window.ctAndroid29();},0);return true;}catch(e){}","")
          s=s.replace("document.querySelector('[data-view=account],[data-view=settings]')","document.querySelector('[data-view=settings]')")
          # Se a primeira ação ainda cair em Estatísticas, executa automaticamente o mesmo clique de Configurações uma segunda vez.
          old='webView.evaluateJavascript(js, null);\n    }\n\n    private void navigateView'
          new='webView.evaluateJavascript(js, value -> webView.postDelayed(() -> webView.evaluateJavascript(js, null), 90));\n    }\n\n    private void navigateView'
          if old not in s:
              raise SystemExit('openSettings patch target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Restore persistent Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cinetracker-debug-signing-v1
      - name: Create signing key on first use
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CineTracker Development,O=CineTracker,C=BR"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: apps/android
        run: gradle assembleDebug
      - name: Prepare APK name
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk cinetracker-android-0.0.29-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.0.29-debug
          path: cinetracker-android-0.0.29-debug.apk
      - name: Publish test APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android-v0.0.29 >/dev/null 2>&1 || gh release create android-v0.0.29 --title "CineTracker Android 0.0.29" --notes "Base 0.0.27 preservada. Corrige Configurações abrindo Estatísticas e mantém as correções de perfil/Home. Catálogo está sendo enriquecido no backend para preencher capas e títulos ausentes."
          gh release upload android-v0.0.29 cinetracker-android-0.0.29-debug.apk --clobber
      - name: Mark Android build success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"success","context":"Android Build","description":"CineTracker Android 0.0.29 APK built and published"}'
      - name: Mark Android build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"failure","context":"Android Build","description":"CineTracker Android 0.0.29 build failed"}'
