name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'
      - 'docs/releases/0.0.55.md'
      - 'VERSIONS.md'
      - 'PROJECT_STATE.md'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-signing-v7
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark Android build pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"pending","context":"Android Build","description":"Building 0.0.55 with frozen 0.0.49 UI"}'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore CineTracker v7 signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker53/cinetracker.keystore
          key: cinetracker-signing-v7-0.0.53-stable

      - name: Prepare v7 signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker53 ~/.android
          if [ ! -f ~/.cinetracker53/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker53/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android 0.0.53 Stable,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker53/cinetracker.keystore ~/.android/debug.keystore

      - name: Embed exact Web snapshot from Android 0.0.49 tag
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ct49web apps/android/app/src/main/assets/stable49
          mkdir -p /tmp/ct49web apps/android/app/src/main/assets/stable49
          git rev-parse --verify android-v0.0.49
          git archive android-v0.0.49 apps/web | tar -x -C /tmp/ct49web
          cp -a /tmp/ct49web/apps/web/. apps/android/app/src/main/assets/stable49/
          test -s apps/android/app/src/main/assets/stable49/index.html
          echo "Frozen Web SHA: $(git rev-parse android-v0.0.49)"
          echo "Frozen index SHA256: $(sha256sum apps/android/app/src/main/assets/stable49/index.html | awk '{print $1}')"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate stable Android modules and frozen base
        shell: bash
        run: |
          set -euo pipefail
          for f in ct41.js ct47.js ct48.js ct49.js ct54.js; do node --check "apps/android/app/src/main/assets/$f"; done
          grep -q "function render" apps/android/app/src/main/assets/stable49/index.html
          grep -q "hydrateMediaDetails" apps/android/app/src/main/assets/stable49/index.html

      - name: Build debug APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK name
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk cinetracker-android-0.0.55-debug.apk

      - name: Verify APK package and embedded stable UI
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          PACKAGE="$($AAPT dump badging cinetracker-android-0.0.55-debug.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          unzip -l cinetracker-android-0.0.55-debug.apk | grep -q 'assets/stable49/index.html'
          unzip -p cinetracker-android-0.0.55-debug.apk assets/stable49/index.html | grep -q 'hydrateMediaDetails'

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.0.55-debug
          path: cinetracker-android-0.0.55-debug.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view android-v0.0.55 >/dev/null 2>&1 || gh release create android-v0.0.55 --title "CineTracker Android 0.0.55 Frozen 49" --notes-file docs/releases/0.0.55.md
          gh release upload android-v0.0.55 cinetracker-android-0.0.55-debug.apk --clobber

      - name: Mark Android build success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"success","context":"Android Build","description":"0.0.55 published with frozen 0.0.49 UI"}'

      - name: Mark Android build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"failure","context":"Android Build","description":"0.0.55 frozen-base build failed"}'
