name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/web/**'
      - 'scripts/build-web.mjs'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write
  statuses: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark Android build pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"pending","context":"Android Build","description":"Building CineTracker Android 0.0.28"}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build embedded Web UI
        run: |
          node scripts/build-web.mjs
          rm -rf apps/android/app/src/main/assets
          mkdir -p apps/android/app/src/main/assets
          cp -R dist/. apps/android/app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore persistent Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cinetracker-debug-signing-v1
      - name: Create signing key on first use
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CineTracker Development,O=CineTracker,C=BR"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Prepare APK name
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk cinetracker-android-0.0.28-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.0.28-debug
          path: cinetracker-android-0.0.28-debug.apk
      - name: Publish test APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android-v0.0.28 >/dev/null 2>&1 || gh release create android-v0.0.28 --title "CineTracker Android 0.0.28" --notes "Build corrigida: Web UI embutida no APK via android_asset, sem dependência extra de WebKit/Vercel; Perfil centralizado; Configurações direta; capas via CDN do TMDB."
          gh release upload android-v0.0.28 cinetracker-android-0.0.28-debug.apk --clobber
      - name: Mark Android build success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"success","context":"Android Build","description":"CineTracker Android 0.0.28 APK built and published"}'
      - name: Mark Android build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"failure","context":"Android Build","description":"CineTracker Android 0.0.28 build failed"}'
