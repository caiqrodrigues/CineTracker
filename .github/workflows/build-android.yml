name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write
  statuses: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark Android build pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"pending","context":"Android Build","description":"Building CineTracker Android 0.0.31"}'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Wire persistent Android 0.0.31 runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java')
          s=p.read_text()
          s=s.replace('CineTrackerAndroid/0.0.27','CineTrackerAndroid/0.0.31')
          s=s.replace('apk=27','apk=31')
          s=s.replace('ctAndroid27','ctAndroid31').replace('ct27','ct31').replace('ct-android27','ct-android31')
          s=s.replace('build 0.0.27','build 0.0.31')
          s=s.replace('applyAndroidRuntime();\n                CookieManager.getInstance().flush();','applyAndroidRuntime();\n                applyCt31();\n                CookieManager.getInstance().flush();')
          s=s.replace('webView.postDelayed(this::applyAndroidRuntime, 150);','webView.postDelayed(() -> { applyAndroidRuntime(); applyCt31(); }, 150);')
          pattern=r'    private void openSettings\(\) \{.*?\n    \}\n\n    private void navigateView'
          repl='''    private void openSettings() {\n        String js = "(function(){if(window.ct31OpenSettings){return window.ct31OpenSettings();}var b=[].slice.call(document.querySelectorAll(\\\'button,a\\\')).find(function(x){return /^(configurações|configuracoes|config\\.)$/i.test((x.textContent||\\\'\\\').trim())});if(b){b.click();setTimeout(function(){b.click();},90);return true;}return false;})();";\n        webView.evaluateJavascript(js, null);\n    }\n\n    private void navigateView'''
          s,n=re.subn(pattern,repl,s,flags=re.S)
          if n!=1: raise SystemExit('openSettings method not replaced')
          marker='    @Override protected void onSaveInstanceState(Bundle outState)'
          method='''    private void applyCt31() {\n        try (java.io.InputStream in = getAssets().open("ct31.js")) {\n            java.io.ByteArrayOutputStream out = new java.io.ByteArrayOutputStream();\n            byte[] buf = new byte[8192];\n            int n;\n            while ((n = in.read(buf)) > 0) out.write(buf, 0, n);\n            webView.evaluateJavascript(out.toString("UTF-8"), null);\n        } catch (Exception ignored) {}\n    }\n\n'''
          if marker not in s: raise SystemExit('save-state marker not found')
          s=s.replace(marker,method+marker,1)
          p.write_text(s)
          PY
      - name: Restore persistent Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cinetracker-debug-signing-v1
      - name: Create signing key on first use
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CineTracker Development,O=CineTracker,C=BR"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: apps/android
        run: gradle assembleDebug
      - name: Prepare APK name
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk cinetracker-android-0.0.31-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.0.31-debug
          path: cinetracker-android-0.0.31-debug.apk
      - name: Publish test APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android-v0.0.31 >/dev/null 2>&1 || gh release create android-v0.0.31 --title "CineTracker Android 0.0.31" --notes "Correções Android persistentes: Configurações sem Stats intermediário; Perfil com Tempo de Tela e Histórico expansíveis; cache de consultas entre abas; hidratação global de nomes e capas com TMDB ID e fallback por título."
          gh release upload android-v0.0.31 cinetracker-android-0.0.31-debug.apk --clobber
      - name: Mark Android build success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"success","context":"Android Build","description":"CineTracker Android 0.0.31 APK built and published"}'
      - name: Mark Android build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"failure","context":"Android Build","description":"CineTracker Android 0.0.31 build failed"}'
