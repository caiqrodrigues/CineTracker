name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'VERSIONS.md'
      - 'PROJECT_STATE.md'
      - 'docs/**'

permissions:
  contents: write
  statuses: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark Android build pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"pending","context":"Android Build","description":"Building CineTracker Android 0.0.48"}'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore persistent Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cinetracker-debug-signing-v1
      - name: Require existing signing key
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Persistent CineTracker signing key is missing. Refusing to generate a new key because that would break in-place updates." | tee /tmp/android-build.log >&2
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: apps/android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee /tmp/android-build.log
      - name: Prepare APK name
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk cinetracker-android-0.0.48-debug.apk
      - name: Verify update compatibility with published 0.0.46
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/update-compat.log) 2>&1
          mkdir -p /tmp/ct-prev
          gh release download android-v0.0.46 -p 'cinetracker-android-0.0.46-debug.apk' -D /tmp/ct-prev
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          OLD_CERT="$($APKSIGNER verify --print-certs /tmp/ct-prev/cinetracker-android-0.0.46-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          NEW_CERT="$($APKSIGNER verify --print-certs cinetracker-android-0.0.48-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          OLD_PACKAGE="$($AAPT dump badging /tmp/ct-prev/cinetracker-android-0.0.46-debug.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          NEW_PACKAGE="$($AAPT dump badging cinetracker-android-0.0.48-debug.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          echo "0.0.46 signer: $OLD_CERT"
          echo "0.0.48 signer: $NEW_CERT"
          echo "0.0.46 package: $OLD_PACKAGE"
          echo "0.0.48 package: $NEW_PACKAGE"
          echo "Signing caches visible to repository:"
          gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" --jq '.actions_caches[] | select(.key=="cinetracker-debug-signing-v1") | [.id,.ref,.key,.created_at,.last_accessed_at] | @tsv' || true
          if [ -z "$OLD_CERT" ] || [ "$OLD_CERT" != "$NEW_CERT" ]; then
            echo "Signing certificate mismatch: refusing to publish an APK that cannot update the published 0.0.46." >&2
            exit 1
          fi
          if [ "$OLD_PACKAGE" != "com.cinetracker.app" ] || [ "$NEW_PACKAGE" != "com.cinetracker.app" ]; then
            echo "Package id mismatch: refusing to publish." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.0.48-debug
          path: cinetracker-android-0.0.48-debug.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android-v0.0.48 >/dev/null 2>&1 || gh release create android-v0.0.48 --title "CineTracker Android 0.0.48" --notes-file docs/releases/0.0.48.md
          gh release upload android-v0.0.48 cinetracker-android-0.0.48-debug.apk --clobber
      - name: Mark Android build success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"success","context":"Android Build","description":"CineTracker Android 0.0.48 APK built, signature-checked and published"}'
      - name: Save failure diagnostic
        if: failure()
        run: |
          mkdir -p ci-status
          {
            echo "# Android 0.0.48 - last build failure"
            echo
            echo '```text'
            if [ -f /tmp/android-build.log ]; then tail -n 120 /tmp/android-build.log; fi
            if [ -f /tmp/update-compat.log ]; then
              echo
              echo "--- update compatibility ---"
              cat /tmp/update-compat.log
            fi
            if [ ! -f /tmp/android-build.log ] && [ ! -f /tmp/update-compat.log ]; then echo "Build failed before diagnostics were produced."; fi
            echo '```'
          } > ci-status/android-0.0.48-last-failure.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-status/android-0.0.48-last-failure.md
          git commit -m "ci: record Android 0.0.48 build failure" || true
          git push || true
      - name: Mark Android build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"failure","context":"Android Build","description":"CineTracker Android 0.0.48 build/update compatibility check failed"}'
