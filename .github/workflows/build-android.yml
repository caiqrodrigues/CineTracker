name: Build Android

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/web/patch-v068-v097.js'
      - 'apps/web/patch-v074-hotfix1-version.js'
      - 'apps/web/service-worker.js'
      - 'scripts/test-auth-recovery-red.mjs'
      - 'scripts/prepare-android-hotfix2-web.mjs'
      - 'scripts/build-web.mjs'
      - 'scripts/verify.mjs'
      - '.github/workflows/build-android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/web/patch-v068-v097.js'
      - 'apps/web/patch-v074-hotfix1-version.js'
      - 'apps/web/service-worker.js'
      - 'scripts/test-auth-recovery-red.mjs'
      - 'scripts/prepare-android-hotfix2-web.mjs'
      - 'scripts/build-web.mjs'
      - 'scripts/verify.mjs'
      - 'docs/releases/0.0.97-HOTFIX2.md'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark Android build pending
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"pending","context":"Android Build","description":"Building CineTracker Android 0.0.97 HOTFIX 2"}'
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Restore dedicated CineTracker signing key
        uses: actions/cache@v4
        with: { path: ~/.cinetracker/cinetracker.keystore, key: cinetracker-signing-v2 }
      - name: Initialize dedicated signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and prepare HOTFIX 2 Web runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run verify
          npm run build
          node scripts/test-auth-recovery-red.mjs
          node scripts/prepare-android-hotfix2-web.mjs
          grep -q "window.__ctAuthRecovery = 'v97-base'" apps/android/app/src/main/assets/hotfix2/index.html
          grep -q "window.__ctAndroidBundle = 'hotfix2-inline'" apps/android/app/src/main/assets/hotfix2/index.html
          grep -q '0.0.97 HOTFIX 2' apps/android/app/src/main/assets/hotfix2/index.html
          grep -q 'data-ct-inline=' apps/android/app/src/main/assets/hotfix2/index.html
          ! grep -q '<script src="/' apps/android/app/src/main/assets/hotfix2/index.html
          ! grep -q 'auth-preboot-fix7.js' apps/android/app/src/main/assets/hotfix2/index.html
          ! grep -q 'patch-v073-v097-fix7.js' apps/android/app/src/main/assets/hotfix2/index.html
      - name: Validate HOTFIX 2 Android startup path
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'loadDataWithBaseURL' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          grep -q 'hotfix2/index.html' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          grep -q 'verifyStartupOrFallback' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          grep -q 'loadRemoteFallback' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          grep -q '&release=hotfix2' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! grep -q 'WebViewAssetLoader' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! grep -q 'appassets.androidplatform.net' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! grep -q 'restoreState(savedInstanceState)' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! grep -q 'LOAD_NO_CACHE' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! grep -q 'clearCache(true)' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! grep -q 'authrev=' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
      - name: Build debug APK
        working-directory: apps/android
        shell: bash
        run: gradle assembleDebug --stacktrace
      - name: Verify HOTFIX 2 runtime is embedded in APK
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | grep -q 'assets/hotfix2/index.html'
          unzip -p "$APK" assets/hotfix2/index.html | grep -q "window.__ctAuthRecovery = 'v97-base'"
          unzip -p "$APK" assets/hotfix2/index.html | grep -q "window.__ctAndroidBundle = 'hotfix2-inline'"
          unzip -p "$APK" assets/hotfix2/index.html | grep -q '0.0.97 HOTFIX 2'
          if unzip -p "$APK" assets/hotfix2/index.html | grep -q 'patch-v073-v097-fix7.js'; then exit 1; fi
      - name: Prepare APK name
        shell: bash
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk cinetracker-android-0.0.97-HOTFIX2-debug.apk
      - name: Verify package and version
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs cinetracker-android-0.0.97-HOTFIX2-debug.apk
          PACKAGE="$($AAPT dump badging cinetracker-android-0.0.97-HOTFIX2-debug.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging cinetracker-android-0.0.97-HOTFIX2-debug.apk | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$($AAPT dump badging cinetracker-android-0.0.97-HOTFIX2-debug.apk | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.0.97 HOTFIX 2"
          test "$VERSION_CODE" = "980"
          sha256sum cinetracker-android-0.0.97-HOTFIX2-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.0.97-HOTFIX2-debug
          path: cinetracker-android-0.0.97-HOTFIX2-debug.apk
      - name: Publish Android 0.0.97 HOTFIX 2 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: |
          set -euo pipefail
          gh release view android-v0.0.97-hotfix2 >/dev/null 2>&1 || gh release create android-v0.0.97-hotfix2 --title "CineTracker Android 0.0.97 HOTFIX 2" --notes-file docs/releases/0.0.97-HOTFIX2.md
          gh release edit android-v0.0.97-hotfix2 --title "CineTracker Android 0.0.97 HOTFIX 2" --notes-file docs/releases/0.0.97-HOTFIX2.md
          gh release upload android-v0.0.97-hotfix2 cinetracker-android-0.0.97-HOTFIX2-debug.apk --clobber
      - name: Mark Android build success
        if: success()
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"Android Build","description":"0.0.97 HOTFIX 2 published"}'
      - name: Mark Android build failure
        if: failure()
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"failure","context":"Android Build","description":"0.0.97 HOTFIX 2 build failed"}'

# release-ready-trigger: android-0.0.97-hotfix2-inline-web
