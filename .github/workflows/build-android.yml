name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'VERSIONS.md'
      - 'PROJECT_STATE.md'
      - 'docs/**'

permissions:
  contents: write
  statuses: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark Android build pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"pending","context":"Android Build","description":"Building CineTracker Android 0.0.46"}'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore persistent Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cinetracker-debug-signing-v1
      - name: Require existing signing key
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Persistent CineTracker signing key is missing. Refusing to generate a new key because that would break in-place updates." | tee /tmp/android-build.log >&2
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: apps/android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee /tmp/android-build.log
      - name: Prepare APK name
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk cinetracker-android-0.0.46-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.0.46-debug
          path: cinetracker-android-0.0.46-debug.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android-v0.0.46 >/dev/null 2>&1 || gh release create android-v0.0.46 --title "CineTracker Android 0.0.46" --notes-file docs/releases/0.0.46.md
          gh release upload android-v0.0.46 cinetracker-android-0.0.46-debug.apk --clobber
      - name: Mark Android build success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"success","context":"Android Build","description":"CineTracker Android 0.0.46 APK built and published"}'
      - name: Save failure diagnostic
        if: failure()
        run: |
          mkdir -p ci-status
          {
            echo "# Android 0.0.46 - last build failure"
            echo
            echo '```text'
            if [ -f /tmp/android-build.log ]; then tail -n 180 /tmp/android-build.log; else echo "Build failed before Gradle produced a log."; fi
            echo '```'
          } > ci-status/android-0.0.46-last-failure.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-status/android-0.0.46-last-failure.md
          git commit -m "ci: record Android 0.0.46 build failure" || true
          git push || true
      - name: Mark Android build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"failure","context":"Android Build","description":"CineTracker Android 0.0.46 build failed"}'
