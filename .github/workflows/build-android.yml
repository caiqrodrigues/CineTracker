name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'
      - 'docs/releases/0.0.53.md'
      - 'VERSIONS.md'
      - 'PROJECT_STATE.md'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-signing-v7
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark Android build pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"pending","context":"Android Build","description":"Building CineTracker Android 0.0.53"}'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore CineTracker v7 signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker53/cinetracker.keystore
          key: cinetracker-signing-v7-0.0.53-stable

      - name: Initialize v7 signing key once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker53 ~/.android
          if [ ! -f ~/.cinetracker53/cinetracker.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.cinetracker53/cinetracker.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CineTracker Android 0.0.53 Stable,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker53/cinetracker.keystore ~/.android/debug.keystore

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate Android JavaScript modules
        shell: bash
        run: |
          set -o pipefail
          for f in ct41.js ct47.js ct48.js ct49.js ct53.js; do
            node --check "apps/android/app/src/main/assets/$f"
          done 2>&1 | tee /tmp/node-check.log

      - name: Build debug APK
        working-directory: apps/android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee /tmp/android-build.log

      - name: Prepare APK name
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk cinetracker-android-0.0.53-debug.apk

      - name: Verify package and capture v7 signer
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/signing-check.log) 2>&1
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          INFO="$($APKSIGNER verify --print-certs cinetracker-android-0.0.53-debug.apk 2>&1)"
          printf '%s\n' "$INFO"
          CERT="$(printf '%s\n' "$INFO" | grep -i 'certificate SHA-256 digest' | head -1 | sed 's/.*digest:[[:space:]]*//')"
          PACKAGE="$($AAPT dump badging cinetracker-android-0.0.53-debug.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          test -n "$CERT"
          test "$PACKAGE" = "com.cinetracker.app"
          echo "$CERT" > /tmp/android-signing-baseline.sha256
          echo "0.0.53 v7 signer: $CERT"
          echo "Built package: $PACKAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.0.53-debug
          path: cinetracker-android-0.0.53-debug.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/release-publish.log) 2>&1
          gh release view android-v0.0.53 >/dev/null 2>&1 || gh release create android-v0.0.53 --title "CineTracker Android 0.0.53" --notes-file docs/releases/0.0.53.md
          gh release upload android-v0.0.53 cinetracker-android-0.0.53-debug.apk --clobber
          gh release view android-v0.0.53 --json url,tagName,name

      - name: Persist v7 signing baseline
        if: success()
        shell: bash
        run: |
          mkdir -p ci-status
          cp /tmp/android-signing-baseline.sha256 ci-status/android-signing-baseline.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-status/android-signing-baseline.sha256
          git commit -m "ci: set Android v7 signing baseline from 0.0.53" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Mark Android build success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"success","context":"Android Build","description":"CineTracker Android 0.0.53 published from restored 0.0.49 base"}'

      - name: Save failure diagnostic
        if: failure()
        run: |
          mkdir -p ci-status
          {
            echo "# Android 0.0.53 - last build failure"
            echo
            echo '```text'
            if [ -f /tmp/node-check.log ]; then echo '--- node check ---'; cat /tmp/node-check.log; fi
            if [ -f /tmp/android-build.log ]; then echo; echo '--- gradle ---'; tail -n 120 /tmp/android-build.log; fi
            if [ -f /tmp/signing-check.log ]; then echo; echo '--- signing check ---'; cat /tmp/signing-check.log; fi
            if [ -f /tmp/release-publish.log ]; then echo; echo '--- release publish ---'; cat /tmp/release-publish.log; fi
            echo '```'
          } > ci-status/android-0.0.53-last-failure.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-status/android-0.0.53-last-failure.md
          git commit -m "ci: record Android 0.0.53 build failure" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Mark Android build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"failure","context":"Android Build","description":"CineTracker Android 0.0.53 build/signing/release failed"}'
