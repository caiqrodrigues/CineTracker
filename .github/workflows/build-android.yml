name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write
  statuses: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark Android build pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"pending","context":"Android Build","description":"Building CineTracker Android 0.0.34"}'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Wire Android 0.0.34 runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java')
          s=p.read_text()
          s=s.replace('CineTrackerAndroid/0.0.27','CineTrackerAndroid/0.0.34')
          s=s.replace('apk=27','apk=34')
          s=s.replace('ctAndroid27','ctAndroid34').replace('ct27','ct34').replace('ct-android27','ct-android34')
          s=s.replace('build 0.0.27','build 0.0.34')
          s=s.replace("try{view='account';render();window.scrollTo(0,0);setTimeout(function(){if(window.ctAndroid34)window.ctAndroid34();},0);return true;}catch(e){}", "if(window.ct34OpenSettings){return window.ct34OpenSettings();}")
          s=s.replace("document.querySelector('[data-view=account],[data-view=settings]')", "document.querySelector('[data-view=settings]')")
          if 'applyCt33();' not in s:
              s=s.replace('applyAndroidRuntime();\n                CookieManager.getInstance().flush();','applyAndroidRuntime();\n                applyCt33();\n                applyCt34();\n                CookieManager.getInstance().flush();')
              s=s.replace('webView.postDelayed(this::applyAndroidRuntime, 150);','webView.postDelayed(() -> { applyAndroidRuntime(); applyCt33(); applyCt34(); }, 150);')
          else:
              s=s.replace('applyCt33();\n                CookieManager.getInstance().flush();','applyCt33();\n                applyCt34();\n                CookieManager.getInstance().flush();')
              s=s.replace('applyCt33(); }, 150);','applyCt33(); applyCt34(); }, 150);')
          marker='    @Override protected void onSaveInstanceState(Bundle outState)'
          if 'private void applyCt33()' not in s:
              method33='''    private void applyCt33() {\n        try (java.io.InputStream in = getAssets().open("ct33.js")) {\n            java.io.ByteArrayOutputStream out = new java.io.ByteArrayOutputStream();\n            byte[] buf = new byte[8192];\n            int read;\n            while ((read = in.read(buf)) != -1) out.write(buf, 0, read);\n            webView.evaluateJavascript(new String(out.toByteArray(), java.nio.charset.StandardCharsets.UTF_8), null);\n        } catch (Exception ignored) { }\n    }\n\n'''
              if marker not in s: raise SystemExit('MainActivity marker not found')
              s=s.replace(marker,method33+marker,1)
          if 'private void applyCt34()' not in s:
              method34='''    private void applyCt34() {\n        try (java.io.InputStream in = getAssets().open("ct34.js")) {\n            java.io.ByteArrayOutputStream out = new java.io.ByteArrayOutputStream();\n            byte[] buf = new byte[8192];\n            int read;\n            while ((read = in.read(buf)) != -1) out.write(buf, 0, read);\n            webView.evaluateJavascript(new String(out.toByteArray(), java.nio.charset.StandardCharsets.UTF_8), null);\n        } catch (Exception ignored) { }\n    }\n\n'''
              s=s.replace(marker,method34+marker,1)
          p.write_text(s)
          PY
      - name: Restore persistent Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cinetracker-debug-signing-v1
      - name: Create signing key on first use
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Development,O=CineTracker,C=BR"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Prepare APK name
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk cinetracker-android-0.0.34-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.0.34-debug
          path: cinetracker-android-0.0.34-debug.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android-v0.0.34 >/dev/null 2>&1 || gh release create android-v0.0.34 --title "CineTracker Android 0.0.34" --notes "Perfil: média diária com unidade. Assistir: modos Lista/Grade/Carrossel dentro do filtro. Configurações reorganizadas em Conta, Segurança, Dados e backup, Preferências e Aplicativo."
          gh release upload android-v0.0.34 cinetracker-android-0.0.34-debug.apk --clobber
      - name: Mark Android build success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"success","context":"Android Build","description":"CineTracker Android 0.0.34 APK built and published"}'
      - name: Mark Android build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d '{"state":"failure","context":"Android Build","description":"CineTracker Android 0.0.34 build failed"}'
