name: Release Android 1.0.21

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/runtime-r263-v1021-web-sync.js.gz'
      - 'apps/android/app/build.gradle'
      - 'scripts/prepare-android-v1021.mjs'
      - 'scripts/test-android-v1021.mjs'
      - '.github/workflows/release-android-v1021.yml'
      - 'CHANGELOG.md'
      - 'VERSIONS.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinetracker-android-1.0.21-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_1_0_21:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Freeze Web r541 and native Android shell
        shell: bash
        run: |
          set -euo pipefail
          FREEZE='43f5f0c5d87802fac80365c62388276c0b2d7255'
          git cat-file -e "$FREEZE^{commit}"
          git diff --exit-code "$FREEZE" HEAD -- apps/web
          test "$(git hash-object apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java)" = '641f8766951077947c57cf34959bac43b94e2648'
          test "$(git hash-object apps/android/app/src/main/res/layout/activity_main.xml)" = '30edbb633685c3a77ce114c92c4f07dfa07a3271'
          grep -Fq 'CineTrackerNative' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          grep -Fq 'onShowFileChooser' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          grep -Fq 'requestNotificationPermission' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          grep -Fq 'bindNativeNavigation' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java

      - name: Restore dedicated signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize dedicated signing key if cache is empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore

      - name: Prepare and validate exact Android 1.0.21 runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.21'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10063' apps/android/app/build.gradle
          node --check scripts/prepare-android-v1021.mjs
          node --check scripts/test-android-v1021.mjs
          node scripts/prepare-android-v1021.mjs
          node scripts/test-android-v1021.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r263-android-js">',a=h.indexOf(marker),b=a<0?-1:h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r263 embedded script missing');
          fs.writeFileSync('/tmp/ct-android-1021.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct-android-1021.js

      - name: Build Android APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate signed APK and embedded release
        shell: bash
        run: |
          set -euo pipefail
          APK='apps/android/app/build/outputs/apk/debug/app-debug.apk'
          OUT='CineTracker-Android-1.0.21.apk'
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          grep -Fq "versionName='1.0.21'" <<<"$BADGING"
          grep -Fq "versionCode='10063'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct1021-index.html
          grep -Fq 'name="ct-official-version" content="1.0.21"' /tmp/ct1021-index.html
          grep -Fq "window.__ctR263AndroidV1021='web-r541-parity+android-r262-preserved'" /tmp/ct1021-index.html
          grep -Fq "window.__ctR243Fix='watchlist-swap-uses-active-ct186-selected-pool'" /tmp/ct1021-index.html
          grep -Fq "window.__ctR226V120='final-dom-authority-no-legacy-listeners'" /tmp/ct1021-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-1.0.21-sha256.txt
          stat -c '%s' "$OUT" | tee android-1.0.21-size.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-1.0.21
          path: |
            CineTracker-Android-1.0.21.apk
            android-1.0.21-sha256.txt
            android-1.0.21-size.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android 1.0.21 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='android-v1.0.21'
          NOTES='Android 1.0.21 / versionCode 10063. Web frozen at r541 (43f5f0c5). Preserves the validated Android 1.0.20 native shell and Android-specific runtime while bringing Home entry behavior, F1/UFC/WWE special series, current recommendation filtering, Top 10 10+10, Profile 12-card summaries with Ver mais, daily undo and sports team/league drill-down.'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title 'CineTracker Android 1.0.21' --notes "$NOTES"
          gh release upload "$TAG" CineTracker-Android-1.0.21.apk android-1.0.21-sha256.txt android-1.0.21-size.txt --clobber
