name: Build Android 0.99.7.62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/runtime-r234-discover-final-swap-top10.js'
      - 'apps/android/app/build.gradle'
      - 'scripts/prepare-android-v099762.mjs'
      - 'scripts/test-android-v099762.mjs'
      - '.github/workflows/build-android-v099762.yml'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  validate_android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Install cached signing key
        run: |
          test -f ~/.cinetracker/cinetracker.keystore
          mkdir -p ~/.android
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare and test Android 0.99.7.62
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r234-discover-final-swap-top10.js
          node --check scripts/prepare-android-v099762.mjs
          node --check scripts/test-android-v099762.mjs
          node scripts/prepare-android-v099762.mjs
          node scripts/test-android-v099762.mjs
      - name: Build Android APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate Android APK
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="CineTracker-0.99.7.62.apk"
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          grep -Fq "versionName='0.99.7.62'" <<<"$BADGING"
          grep -Fq "versionCode='10032'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99762-index.html
          grep -Fq 'android-v0.99.7.62-r234-discover-final-swap-top10' /tmp/ct99762-index.html
          grep -Fq 'ct186-authoritative-full-foryou-repaint-private-event-authority' /tmp/ct99762-index.html
          grep -Fq 'native-webview-horizontal-overflow-no-manual-touch-pointer-controller' /tmp/ct99762-index.html
          grep -Fq 'data-ct234-swap' /tmp/ct99762-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          stat -c '%s' "$OUT" | tee android-v099762-size.txt
          sha256sum "$OUT" | tee android-v099762-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.62
          path: |
            CineTracker-0.99.7.62.apk
            android-v099762-sha256.txt
            android-v099762-size.txt
          if-no-files-found: error
          retention-days: 14
