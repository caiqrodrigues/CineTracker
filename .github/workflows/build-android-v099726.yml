name: Build Android 0.99.7.26 — Mobile Performance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'scripts/prepare-android-v099726.mjs'
      - 'scripts/test-android-v099726.mjs'
      - '.github/workflows/build-android-v099726.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099726-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099726:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.26
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r198-mobile-performance.js
          node --check scripts/prepare-android-v099726.mjs
          node --check scripts/test-android-v099726.mjs
          node scripts/prepare-android-v099726.mjs
          node scripts/test-android-v099726.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r198-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r198 embedded JS missing');
          fs.writeFileSync('/tmp/ct99726-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99726-prebuild.js
          grep -Fq 'final String routePath = JSONObject.quote(path);' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! sed -n '/if (host.equals("mycinetracker.vercel.app"))/,/if (host.endsWith("supabase.co"))/p' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java | grep -Fq 'loadBundledWeb();'

      - name: Build Android 0.99.7.26 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate APK identity, performance runtime, signing and digest
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.26-mobile-performance-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.26"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "9996"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99726-index.html
          for marker in \
            'android-v0.99.7.26-r198-mobile-performance' \
            'mobile-first-cache-swr-progressive-render' \
            'sequential-light-no-request-stampede' \
            'persistent-snapshot-tmdb-pages-capped-progressive-cards' \
            'persistent-arena-progressive-events-fast-favorite-modal' \
            'no-full-repaint-on-search-or-watched-toggle' \
            'embedded-apk-never-reloads-from-web-release-json' \
            'auth-success-mount-home-shell-before-fast-paint' \
            'asian-scripted-tv-excluded-from-foryou' \
            'ct-sports-sync-v4+ct-sports-search-v2'; do
            grep -Fq "$marker" /tmp/ct99726-index.html
          done
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/ct99726-index.html','utf8');
          const marker='<script data-ct-android="r198-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('embedded Android r198 JS missing');
          const js=h.slice(a+marker.length,b);
          if(js.includes('ct170SportsSearch.loading=true;paintSports();ct170SportsSearch.timer'))throw new Error('search repaint regression present');
          if(!js.includes('ct168SetWatchedButtons(eventId,next);'))throw new Error('optimistic watched state missing');
          fs.writeFileSync('/tmp/ct99726.js',js);
          NODE
          node --check /tmp/ct99726.js
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099726-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.26-mobile-performance-debug
          path: |
            cinetracker-android-0.99.7.26-mobile-performance-debug.apk
            android-v099726-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android 0.99.7.26 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES='Android 0.99.7.26 mantém a autenticação isolada e toda a paridade r190-r195, mas troca a estratégia de desempenho no WebView: Home cache-first com revalidação em segundo plano; preload r163 substituído por aquecimento leve e sequencial; Discover com snapshots persistentes, limite de páginas TMDB no mobile e menos cards materializados por vez; Esportes com snapshot persistente, renderização progressiva de eventos e modal de favoritos sem sincronização pesada a cada abertura; busca esportiva atualiza só o grid de resultados e preserva foco/teclado; marcar evento assistido é otimista e não repinta a página inteira.'
          gh release view android-v0.99.7.26 >/dev/null 2>&1 || gh release create android-v0.99.7.26 --title "CineTracker Android 0.99.7.26 — Mobile Performance" --notes "$NOTES"
          gh release edit android-v0.99.7.26 --title "CineTracker Android 0.99.7.26 — Mobile Performance" --notes "$NOTES"
          gh release upload android-v0.99.7.26 cinetracker-android-0.99.7.26-mobile-performance-debug.apk android-v099726-sha256.txt --clobber
