name: Build Android 0.99.7.26 — Mobile Performance

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  android_v099726:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Historical Android 0.99.7.26 validation
        run: |
          node --check apps/android/runtime-r198-mobile-performance.js
          node --check scripts/prepare-android-v099726.mjs
          node --check scripts/test-android-v099726.mjs
