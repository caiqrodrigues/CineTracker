name: Validate CineTracker 1.0.16 Final Authorities

on:
  push:
    branches:
      - fix/1.0.16-final-dom-watchlist-f1-modal
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Validate 1.0.16 source contract
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.16"' package.json
          grep -Fq '"version": "1.0.16"' apps/web/package.json
          grep -Fq 'build-r222.mjs' apps/web/package.json
          grep -Fq "versionName '1.0.16'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10058' apps/android/app/build.gradle
          node --check apps/web/runtime-r222-v116-final-dom-watchlist-f1-modal.js
          node --check apps/web/build-r222.mjs
          node --check scripts/prepare-android-v1016.mjs
          node --check scripts/test-v116-final-authorities-browser.mjs
          grep -Fq 'cinetracker_watchlist_candidates_v116' apps/web/runtime-r222-v116-final-dom-watchlist-f1-modal.js
          grep -Fq 'direct-auth-rpc-final-dom-no-old-filter-chain' apps/web/runtime-r222-v116-final-dom-watchlist-f1-modal.js
          grep -Fq 'ct165-favorite-modal-direct-f1-session-authority' apps/web/runtime-r222-v116-final-dom-watchlist-f1-modal.js

      - name: Prove exact final authorities in Chromium
        run: node scripts/test-v116-final-authorities-browser.mjs

      - name: Preserve 1.0.15 behavior tests
        run: node scripts/test-v115-watchlist-f1-browser.mjs

      - name: Verify live Formula 1 schedule still contains qualifying and race
        run: |
          set -euo pipefail
          U='https://pjmkxryboypluleuuupp.supabase.co/functions/v1/cinetracker-f1-v1'
          KEY='sb_publishable_UERbQXkZk4rnnu6Y8XJSgw_vcZd_V_Q'
          curl -fsS "$U" -H "apikey: $KEY" -H 'content-type: application/json' --data '{"season":2026}' -o /tmp/f1.json
          node - <<'NODE'
          const d=JSON.parse(require('fs').readFileSync('/tmp/f1.json','utf8'));
          const q=(d.races||[]).filter(r=>r.Qualifying?.date).length,r=(d.races||[]).filter(x=>x.date).length;
          if(q<20||r<20)throw new Error('F1 schedule incomplete');
          console.log('V116_F1_LIVE_OK races='+r+' qualifying='+q);
          NODE

      - name: Build Web 1.0.16
        run: npm run build

      - name: Inspect Web 1.0.16 bundle
        run: |
          set -euo pipefail
          B=apps/web/dist/app-v222.js
          test -f "$B"
          grep -Fq "window.__ctR222V116='final-dom-watchlist-direct-rpc-f1-favorite-modal'" "$B"
          grep -Fq 'cinetracker_watchlist_candidates_v116' "$B"
          grep -Fq 'ct165-favorite-modal-direct-f1-session-authority' "$B"
          grep -Fq "ct-web-1.0.16-r222" apps/web/dist/service-worker.js

      - name: Prepare Android 1.0.16
        run: node scripts/prepare-android-v1016.mjs

      - name: Inspect prepared Android runtime
        run: |
          set -euo pipefail
          I=apps/android/app/src/main/assets/hotfix5/index.html
          grep -Fq "const REVISION='r258-android-official-1.0.16';" "$I"
          grep -Fq 'window.__ctAndroidOfficialCode=10058' "$I"
          grep -Fq "window.__ctR222V116='final-dom-watchlist-direct-rpc-f1-favorite-modal'" "$I"
          grep -Fq 'cinetracker_watchlist_candidates_v116' "$I"
          node - <<'NODE'
          const fs=require('fs'),h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const m=h.match(/<script data-ct-android="r258-android-js">([\s\S]*?)<\/script>/);if(!m)throw new Error('r258 script missing');fs.writeFileSync('/tmp/r258.js',m[1]);
          NODE
          node --check /tmp/r258.js

      - name: Build Android 1.0.16 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Inspect exact APK payload
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          rm -rf /tmp/v116-apk && mkdir -p /tmp/v116-apk
          unzip -q "$APK" -d /tmp/v116-apk
          I=/tmp/v116-apk/assets/hotfix5/index.html
          grep -Fq "const REVISION='r258-android-official-1.0.16';" "$I"
          grep -Fq "window.__ctR222V116='final-dom-watchlist-direct-rpc-f1-favorite-modal'" "$I"
          grep -Fq 'cinetracker_watchlist_candidates_v116' "$I"
          sha256sum "$APK" | tee /tmp/v116-sha256.txt
          echo 'V116_APK_PAYLOAD_OK version=1.0.16 code=10058 runtime=r258'

      - uses: actions/upload-artifact@v4
        with:
          name: CineTracker-1.0.16-final-authorities
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            /tmp/v116-sha256.txt
          if-no-files-found: error
