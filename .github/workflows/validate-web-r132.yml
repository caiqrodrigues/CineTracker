name: Validate Web r132-r133

on:
  push:
    branches:
      - fix/web-r132-deeplink-pages
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Web r133
        run: npm run build
      - name: Verify Web r133
        run: npm run verify
      - name: Verify emitted runtime
        run: |
          set -euo pipefail
          grep -q 'ct-web-0.99.7-r131' dist/service-worker.js
          grep -q 'v132-url-router-fullscreen-details-profile-10-more' dist/patch-v132-v0997-deeplink-pages.js
          grep -q 'v132-single-runtime-nav-integrity' dist/patch-v132-v0997-deeplink-pages.js
          grep -q 'v133-primary-single-authority-home-discover-profile' dist/patch-v133-v0997-primary-authority.js
          grep -q '/patch-v132-v0997-deeplink-pages.js' dist/index.html
          grep -q '/patch-v133-v0997-primary-authority.js' dist/index.html
