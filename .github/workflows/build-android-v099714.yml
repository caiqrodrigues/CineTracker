name: Build Android 0.99.7.14 — Immersive Detail + Persistent Nav

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099714-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099714:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android 0.99.7.14 with frozen Web r179
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r178-stable-home.mjs
          node scripts/test-r179-target-card.mjs
          node scripts/prepare-android-v099714.mjs
          node scripts/test-android-v099714.mjs
      - name: Build Android 0.99.7.14 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate APK identity, persistent nav, immersive detail and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.14-r179-immersive-detail-nav-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          PACKAGE="$($AAPT dump badging "$OUT" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.99.7.14"
          test "$VERSION_CODE" = "9984"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99714-index.html
          python3 - <<'PY'
          from pathlib import Path
          h=Path('/tmp/ct99714-index.html').read_text()
          marker='<script data-ct-android="r179-js">'
          a=h.index(marker)+len(marker); b=h.index('</script>',a); js=h[a:b]
          assert 'const $$=(s,r=document)=>' in js
          assert js.count('const $=(s,r=document)=>') == 1
          for m in [
              'r179-home-target-card','home-target-card-by-media-id','history-duplicate-safe-next-episode-card',
              'android-v0.99.7.14-r179-immersive-detail-nav','persistent-five-tab-nav-immersive-poster-compact-where',
              'always-visible-five-tabs','poster-first-no-detail-header','compact-provider-icons','ct180EnsureBottomNav','ct180-detail-back'
          ]:
              assert m in h, m
          Path('/tmp/ct99714-embedded.js').write_text(js)
          PY
          node --check /tmp/ct99714-embedded.js
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099714-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.14-r179-immersive-detail-nav-debug
          path: |
            cinetracker-android-0.99.7.14-r179-immersive-detail-nav-debug.apk
            android-v099714-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish Android 0.99.7.14 release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Android 0.99.7.14 mantém integralmente a Web r179 e altera somente a composição do APK. A barra inferior com as 5 abas passa a ser fixa e sempre visível. Filmes e séries ganham detalhe imersivo com a capa ocupando o topo diretamente, sem o cabeçalho CineTracker/Detalhes e sem a busca nessa tela. Onde Assistir vira uma faixa compacta de ícones dos provedores. Toda a lógica de primeiro episódio pendente da r179 permanece intacta.'
          gh release view android-v0.99.7.14 >/dev/null 2>&1 || gh release create android-v0.99.7.14 --title "CineTracker Android 0.99.7.14 — Immersive Detail + Persistent Nav" --notes "$NOTES"
          gh release edit android-v0.99.7.14 --title "CineTracker Android 0.99.7.14 — Immersive Detail + Persistent Nav" --notes "$NOTES"
          gh release upload android-v0.99.7.14 cinetracker-android-0.99.7.14-r179-immersive-detail-nav-debug.apk android-v099714-sha256.txt --clobber
