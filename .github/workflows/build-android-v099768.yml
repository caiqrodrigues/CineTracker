name: Build Android 0.99.7.68

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/runtime-r240-watchlist-hit-route.js'
      - 'apps/android/app/build.gradle'
      - 'scripts/prepare-android-v099768.mjs'
      - '.github/workflows/build-android-v099768.yml'

permissions:
  contents: read

concurrency:
  group: cinetracker-android-v099768-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Install cached signing key
        run: |
          test -f ~/.cinetracker/cinetracker.keystore
          mkdir -p ~/.android
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate Watchlist visual hit routing
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r240-watchlist-hit-route.js
          node --check scripts/prepare-android-v099768.mjs
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          global.window=global;global.innerHeight=900;global.location={pathname:'/discover'};global.route=()=>'/discover';global.discoverState={tab:'foryou'};
          global.requestAnimationFrame=()=>0;global.rpc=async()=>[];
          const rect=(l,t,r,b)=>({left:l,top:t,right:r,bottom:b,width:r-l,height:b-t});
          const mkSlot=(l,label)=>({getBoundingClientRect:()=>rect(l,120,l+95,430),querySelector:(q)=>q.includes('ct166-slot-head')?{textContent:label}:null});
          const movie=mkSlot(0,'Filme'),series=mkSlot(100,'Série'),anime=mkSlot(200,'Anime');
          const button={textContent:'Trocar',dataset:{ct237Swap:'fresh:movie'},getBoundingClientRect:()=>rect(10,360,85,395),closest:(q)=>q.includes('ct166-slot')?movie:null};
          const title={textContent:'Da sua Watchlist'};
          const sec={getBoundingClientRect:()=>rect(0,100,300,450),querySelector:(q)=>q.includes('h1')?title:null,querySelectorAll:(q)=>q.includes('button')?[button]:[movie,series,anime],contains:(x)=>[button,movie,series,anime].includes(x)};
          global.document={querySelectorAll:(q)=>q==='section,.panel'?[sec]:[]};
          vm.runInThisContext(fs.readFileSync('apps/android/runtime-r240-watchlist-hit-route.js','utf8'));
          const hit=global.__ctR240WatchHit({clientX:45,clientY:375,target:button});
          if(!hit||hit.slot!==movie||hit.kind!=='movie'||hit.key!=='watchlist:movie')throw new Error('visual Watchlist hit did not override stale fresh:movie key');
          console.log('R240_VISUAL_HIT_OK stale=fresh:movie routed=watchlist:movie');
          NODE

      - name: Prepare Android 0.99.7.68
        run: |
          set -euo pipefail
          node scripts/prepare-android-v099768.mjs
          INDEX='apps/android/app/src/main/assets/hotfix5/index.html'
          grep -Fq "versionName '0.99.7.68'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10038' apps/android/app/build.gradle
          grep -Fq 'android-v0.99.7.68-r240-watchlist-hit-route' "$INDEX"
          grep -Fq 'first-handler-routes-watchlist-slot-by-section-and-column' "$INDEX"
          grep -Fq "window.__ctR240HandleWatchTap(e))return" "$INDEX"
          grep -Fq "title240(sec)==='da sua watchlist'" "$INDEX"
          grep -Fq "rpc('cinetracker_profile_media_dashboard_v0991',{})" "$INDEX"
          grep -Fq 'native-webview-horizontal-no-manual-touch' "$INDEX"
          grep -Fq 'touch-action:pan-x pan-y!important' "$INDEX"
          grep -Fq 'overflow-x:scroll!important' "$INDEX"
          ! grep -Fq 'android-v0.99.7.67-r239-watchlist-direct-dashboard' "$INDEX"
          ! grep -Fq 'data-ct239-watch-swap' "$INDEX"
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r240-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r240 embedded JS missing');const js=h.slice(a+marker.length,b);
          const fn=js.indexOf('function activateSwap237(e){'),hook=js.indexOf("window.__ctR240HandleWatchTap(e))return",fn),generic=js.indexOf("const b=e?.target?.closest?.(SWAP237)",fn);
          if(!(fn>=0&&hook>fn&&generic>hook))throw new Error('r240 hook is not ahead of r237 generic swap');
          if(!js.includes("window.addEventListener('pointerup',activateSwap237"))throw new Error('r237 physical pointer authority missing');
          if((js.match(/window\.__ctR240HandleWatchTap=function\(e\)/g)||[]).length!==1)throw new Error('r240 authority count is not one');
          fs.writeFileSync('/tmp/ct99768-prebuild.js',js);console.log('R240_HANDLER_ORDER_OK hook-before-generic');
          NODE
          node --check /tmp/ct99768-prebuild.js

      - name: Build Android APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate final Android APK
        run: |
          set -euo pipefail
          APK='apps/android/app/build/outputs/apk/debug/app-debug.apk'
          OUT='CineTracker-0.99.7.68.apk'
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          grep -Fq "versionName='0.99.7.68'" <<<"$BADGING"
          grep -Fq "versionCode='10038'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99768-index.html
          grep -Fq 'android-v0.99.7.68-r240-watchlist-hit-route' /tmp/ct99768-index.html
          grep -Fq 'first-handler-routes-watchlist-slot-by-section-and-column' /tmp/ct99768-index.html
          grep -Fq "window.__ctR240HandleWatchTap(e))return" /tmp/ct99768-index.html
          grep -Fq 'native-webview-horizontal-no-manual-touch' /tmp/ct99768-index.html
          ! grep -Fq 'android-v0.99.7.67-r239-watchlist-direct-dashboard' /tmp/ct99768-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          stat -c '%s' "$OUT" | tee android-v099768-size.txt
          sha256sum "$OUT" | tee android-v099768-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.68
          path: |
            CineTracker-0.99.7.68.apk
            android-v099768-sha256.txt
            android-v099768-size.txt
          if-no-files-found: error
          retention-days: 14
