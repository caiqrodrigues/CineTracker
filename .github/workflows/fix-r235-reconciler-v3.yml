name: Fix r235 reconciler v3

on:
  push:
    branches:
      - fix/1.0.27-r235-live-authority
    paths:
      - .github/workflows/fix-r235-reconciler-v3.yml

permissions:
  contents: write

jobs:
  patch-reconciler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1.0.27-r235-live-authority
      - name: Patch reconciler scheduler
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'apps/web/runtime-r235-v127-live-authority.js';
          let s = fs.readFileSync(p, 'utf8');
          const re = /requestAnimationFrame\(\(\) => \{\s*queued = false;\s*normalizeAll127\(\);\s*\}\);/;
          if (!re.test(s)) throw new Error('Expected rAF reconciler block not found');
          s = s.replace(re, 'setTimeout(() => {\n              queued = false;\n              normalizeAll127();\n            }, 0);');
          fs.writeFileSync(p, s);
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/runtime-r235-v127-live-authority.js
          git diff --cached --check
          git commit -m "fix(r235): reconcile async DOM changes outside animation frame"
          git push origin HEAD:fix/1.0.27-r235-live-authority
