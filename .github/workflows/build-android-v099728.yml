name: Build Android 0.99.7.28 — Discover Gesture + Watchlist Toggle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/web/runtime-r196-web.js'
      - 'scripts/prepare-android-v099728.mjs'
      - 'scripts/test-android-v099728.mjs'
      - '.github/workflows/build-android-v099728.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099728-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099728:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.28
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r196-web.js
          node --check apps/android/runtime-r200-discover-gesture-watchlist.js
          node --check scripts/prepare-android-v099728.mjs
          node --check scripts/test-android-v099728.mjs
          node scripts/prepare-android-v099728.mjs
          node scripts/test-android-v099728.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r200-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r200 embedded JS missing');
          const js=h.slice(a+marker.length,b);
          if(!js.includes("window.addEventListener('click'"))throw new Error('direct Discover click capture missing');
          if(!js.includes('g.rail.scrollLeft=g.left-dx'))throw new Error('manual horizontal gesture missing');
          if(!js.includes("toast('Removido da Watchlist.')"))throw new Error('Watchlist remove action missing');
          fs.writeFileSync('/tmp/ct99728-prebuild.js',js);
          NODE
          node --check /tmp/ct99728-prebuild.js
          grep -Fq 'final String routePath = JSONObject.quote(path);' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! sed -n '/if (host.equals("mycinetracker.vercel.app"))/,/if (host.endsWith("supabase.co"))/p' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java | grep -Fq 'loadBundledWeb();'

      - name: Build Android 0.99.7.28 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate APK identity, gesture runtime, Watchlist toggle, signing and digest
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.28-discover-gesture-watchlist-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.28"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "9998"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99728-index.html
          for marker in \
            'android-v0.99.7.28-r200-discover-gesture-watchlist' \
            'discover-direct-tabs-manual-horizontal-scroll' \
            'window-capture-direct-renderDiscover' \
            'touch-scrollLeft-horizontal-dominance' \
            'detail-watchlist-toggle' \
            'add-remove-alias-aware' \
            'state=in.(AddedToWatchlist,WatchLater)' \
            'Removido da Watchlist.' \
            'navigation-never-throttled' \
            'mobile-first-cache-swr-progressive-render' \
            'embedded-apk-never-reloads-from-web-release-json'; do
            grep -Fq "$marker" /tmp/ct99728-index.html
          done
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/ct99728-index.html','utf8');
          const marker='<script data-ct-android="r200-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('embedded Android r200 JS missing');
          const js=h.slice(a+marker.length,b);
          if(!js.includes('void Promise.resolve(renderDiscover(seq))'))throw new Error('direct subtab render missing');
          if(!js.includes('g.rail.scrollLeft=g.left-dx'))throw new Error('manual scrollLeft missing');
          if(!js.includes("{method:'DELETE'}"))throw new Error('Watchlist remove DELETE missing');
          if(!js.includes('matched_media_ids'))throw new Error('alias-aware removal missing');
          fs.writeFileSync('/tmp/ct99728.js',js);
          NODE
          node --check /tmp/ct99728.js
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099728-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.28-discover-gesture-watchlist-debug
          path: |
            cinetracker-android-0.99.7.28-discover-gesture-watchlist-debug.apk
            android-v099728-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android 0.99.7.28 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES='Android 0.99.7.28 preserva a autenticação isolada e o desempenho cache-first, mas substitui o gesto horizontal problemático do Descobrir por um mecanismo determinístico: o toque nas subabas é capturado no window antes do listener legado e chama renderDiscover diretamente; carrosséis e trilhos horizontais usam detecção de dominância horizontal e deslocamento manual de scrollLeft, preservando o scroll vertical. Também incorpora a Web r196: o botão ✓ Na Watchlist em detalhes fica clicável e remove AddedToWatchlist/WatchLater do mesmo título/TMDB, inclusive aliases importados, voltando para ＋ Watchlist.'
          gh release view android-v0.99.7.28 >/dev/null 2>&1 || gh release create android-v0.99.7.28 --title "CineTracker Android 0.99.7.28 — Discover Gesture + Watchlist Toggle" --notes "$NOTES"
          gh release edit android-v0.99.7.28 --title "CineTracker Android 0.99.7.28 — Discover Gesture + Watchlist Toggle" --notes "$NOTES"
          gh release upload android-v0.99.7.28 cinetracker-android-0.99.7.28-discover-gesture-watchlist-debug.apk android-v099728-sha256.txt --clobber
