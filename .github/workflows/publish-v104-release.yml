name: Publish CineTracker v1.0.4 Release

on:
  workflow_dispatch:
  push:
    branches: [release/1.0.4]
    paths:
      - '.github/workflows/publish-v104-release.yml'
      - 'apps/web/runtime-r208-v104-core.js'
      - 'apps/web/build-r208.mjs'
      - 'apps/web/package.json'
      - 'package.json'
      - 'scripts/prepare-android-v1004.mjs'
      - 'scripts/test-android-v1004.mjs'
      - 'scripts/test-v104-runtime.mjs'
      - 'apps/android/app/build.gradle'
      - 'supabase/migrations/20260907153000_v104_rewatch_counts.sql'
      - 'supabase/functions/cinetracker-f1-v1/index.ts'

permissions:
  contents: write
concurrency:
  group: cinetracker-publish-v104-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Install signing key
        run: |
          set -euo pipefail
          test -f ~/.cinetracker/cinetracker.keystore
          mkdir -p ~/.android
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - name: Install behavior-test runtime
        run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Run behavior-level 1.0.4 tests
        run: node scripts/test-v104-runtime.mjs
      - name: Build Web 1.0.4 from clean internal runtime
        run: node apps/web/build-r208.mjs
      - name: Validate Web internal runtime and assets
        run: |
          set -euo pipefail
          B='apps/web/dist/app-v208.js'
          test -f "$B"
          grep -Fq "const REVISION='r208-official-1.0.4'" "$B"
          grep -Fq "window.__ctR208='v104-authoritative-internal-runtime'" "$B"
          grep -Fq 'cinetracker_rewatch_counts_v104' "$B"
          grep -Fq 'ct104DecorateHistory' "$B"
          grep -Fq 'cinetracker_recommendation_memory_v101' "$B"
          grep -Fq 'cinetracker_recommendation_record_v101' "$B"
          grep -Fq 'cinetracker-f1-v1' "$B"
          grep -Fq 'ct104EnsureF1' "$B"
          grep -Fq 'app-v208.js' apps/web/dist/index.html
          grep -Fq "const VERSION='ct-web-1.0.4-r208'" apps/web/dist/service-worker.js
          grep -Fq '"version": "1.0.4"' apps/web/package.json
          echo 'WEB_1_0_4_ASSETS_VALIDATED'
      - name: Prepare Android 1.0.4 authoritative runtime
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.4'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10046' apps/android/app/build.gradle
          node scripts/prepare-android-v1004.mjs
          node scripts/test-android-v1004.mjs
      - name: Build APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate final APK runtime, version and signature
        run: |
          set -euo pipefail
          APK='apps/android/app/build/outputs/apk/debug/app-debug.apk'
          OUT='CineTracker-1.0.4.apk'
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          grep -Fq "versionName='1.0.4'" <<<"$BADGING"
          grep -Fq "versionCode='10046'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct104-index.html
          grep -Fq '<script data-ct-android="r246-android-js">' /tmp/ct104-index.html
          grep -Fq "const REVISION='r246-android-official-1.0.4'" /tmp/ct104-index.html
          grep -Fq "window.__ctR208='v104-authoritative-internal-runtime'" /tmp/ct104-index.html
          grep -Fq 'const CT104_ANDROID=true;' /tmp/ct104-index.html
          grep -Fq 'cinetracker_rewatch_counts_v104' /tmp/ct104-index.html
          grep -Fq 'ct104DecorateHistory' /tmp/ct104-index.html
          grep -Fq 'cinetracker_recommendation_memory_v101' /tmp/ct104-index.html
          grep -Fq 'cinetracker-f1-v1' /tmp/ct104-index.html
          grep -Fq 'ct104EnsureF1' /tmp/ct104-index.html
          grep -Fq -- '--ct104-card-w' /tmp/ct104-index.html
          grep -Fq 'watchlist-swap-uses-active-ct186-selected-pool' /tmp/ct104-index.html
          grep -Fq 'native-webview-horizontal-no-manual-touch' /tmp/ct104-index.html
          if grep -Fq "window.__ctR244='f1-hub-rewatch-functional-sports-cleanup-android'" /tmp/ct104-index.html; then exit 1; fi
          if grep -Fq "window.__ctR245='v103-rewatch-navigation-recommendations-f1-android'" /tmp/ct104-index.html; then exit 1; fi
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee CineTracker-1.0.4-SHA256.txt
          stat -c '%s' "$OUT" | tee CineTracker-1.0.4-size.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CineTracker-1.0.4
          path: |
            CineTracker-1.0.4.apk
            CineTracker-1.0.4-SHA256.txt
            CineTracker-1.0.4-size.txt
      - name: Publish GitHub Release v1.0.4
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          # CineTracker 1.0.4
          - Runtime Web/Android 1.0.4 executa dentro do escopo principal antes do boot, não em overlay externo
          - Reassistir no Histórico para filmes e episódios com 2x, 3x, 4x... e mesma fonte persistente dos detalhes/Perfil/tempo assistido
          - Contadores de reassistidas carregados pelo RPC cinetracker_rewatch_counts_v104
          - Navegação global troca de aba imediatamente e fecha detalhes sem exigir X
          - Pra você usa memória persistente: 100% novos não repetem, Trocar descarta, Watchlist respeita cooldown de 30 dias e categorias independentes
          - Android padroniza cards pelo tamanho do Descobrir com três cards visíveis, incluindo Perfil e listas reutilizadas
          - Sports remove somente o resumo/status antigo; Estatísticas do Perfil permanecem
          - F1 Hub autenticado via Supabase: próximo GP, calendário, pilotos, construtores, último GP, classificação, Sprint, pit stops e voltas
          - Preservados Watchlist r243 e Top 10 nativo Android
          EOF
          )
          if gh release view v1.0.4 >/dev/null 2>&1; then
            gh release upload v1.0.4 CineTracker-1.0.4.apk CineTracker-1.0.4-SHA256.txt CineTracker-1.0.4-size.txt --clobber
            gh release edit v1.0.4 --title 'CineTracker 1.0.4' --notes "$NOTES" --latest
          else
            gh release create v1.0.4 CineTracker-1.0.4.apk CineTracker-1.0.4-SHA256.txt CineTracker-1.0.4-size.txt --target "$GITHUB_SHA" --title 'CineTracker 1.0.4' --notes "$NOTES" --latest
          fi
      - name: Verify published release assets
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          gh release view v1.0.4 --json tagName,name,isDraft,isPrerelease,url,assets > /tmp/release.json
          grep -Fq 'CineTracker-1.0.4.apk' /tmp/release.json
          grep -Fq 'CineTracker-1.0.4-SHA256.txt' /tmp/release.json
          cat /tmp/release.json
