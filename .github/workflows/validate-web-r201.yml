name: Validate Web r202

on:
  workflow_dispatch:
  push:
    branches:
      - release/0.99.7.53-r202
      - main
    paths:
      - 'apps/web/runtime-r202-sports-single-filter.js'
      - 'apps/web/build-r202.mjs'
      - 'apps/web/test-r202.mjs'
      - 'apps/web/package.json'
      - '.github/workflows/validate-web-r201.yml'

permissions:
  contents: read

jobs:
  validate_web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build and test r202
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check runtime-r202-sports-single-filter.js
          node --check build-r202.mjs
          node --check test-r202.mjs
          npm run build
      - name: Validate assembled r202 markers
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v202.js
          grep -Fq 'r202-sports-single-filter' apps/web/dist/app-v202.js
          grep -Fq 'remove-standalone-duplicate-filter-events-up' apps/web/dist/app-v202.js
          grep -Fq 'ct200-sports-filter-button' apps/web/dist/app-v202.js
          grep -Fq 'ct202-events-up' apps/web/dist/app-v202.js
          grep -Fq 'panel.remove();' apps/web/dist/app-v202.js
          grep -Fq 'btn.remove();' apps/web/dist/app-v202.js
          grep -Fq '"revision":"r202-sports-single-filter"' apps/web/dist/release.json
          grep -Fq 'app-v202.js' apps/web/dist/index.html
          grep -Fq 'app-v202.css' apps/web/dist/index.html
