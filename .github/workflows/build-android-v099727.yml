name: Build Android 0.99.7.27 — Discover Touch Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'scripts/prepare-android-v099727.mjs'
      - 'scripts/test-android-v099727.mjs'
      - '.github/workflows/build-android-v099727.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099727-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099727:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.27
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r198-mobile-performance.js
          node --check apps/android/runtime-r199-discover-touch-fix.js
          node --check scripts/prepare-android-v099727.mjs
          node --check scripts/test-android-v099727.mjs
          node scripts/prepare-android-v099727.mjs
          node scripts/test-android-v099727.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r199-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r199 embedded JS missing');
          fs.writeFileSync('/tmp/ct99727-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99727-prebuild.js

      - name: Build Android 0.99.7.27 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate APK identity, Discover touch runtime, signing and digest
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.27-discover-touch-fix-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.27"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "9997"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99727-index.html
          for marker in \
            'android-v0.99.7.27-r199-discover-touch-fix' \
            'restore-route-render-and-discover-pan-x' \
            'navigation-never-throttled' \
            'subtabs-clickable-horizontal-native-pan' \
            'mobile-first-cache-swr-progressive-render' \
            'embedded-apk-never-reloads-from-web-release-json'; do
            grep -Fq "$marker" /tmp/ct99727-index.html
          done
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/ct99727-index.html','utf8');
          const marker='<script data-ct-android="r199-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('embedded Android r199 JS missing');
          const js=h.slice(a+marker.length,b);
          if(!js.includes("if(r==='discover')return renderDiscover(seq);"))throw new Error('Discover render dispatcher missing');
          if(!js.includes('scroll-snap-type:none!important'))throw new Error('Discover horizontal pan fix missing');
          fs.writeFileSync('/tmp/ct99727.js',js);
          NODE
          node --check /tmp/ct99727.js
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099727-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.27-discover-touch-fix-debug
          path: |
            cinetracker-android-0.99.7.27-discover-touch-fix-debug.apk
            android-v099727-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android 0.99.7.27 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES='Android 0.99.7.27 mantém o desempenho/cache-first da 0.99.7.26 e corrige a regressão de navegação: renderização de rota nunca mais é suprimida por throttle de foreground; subabas do Descobrir voltam a responder ao toque; o trilho horizontal usa pan-x nativo, sem scroll-snap/scroll suave disputando com o gesto; filtros horizontais recebem a mesma correção.'
          gh release view android-v0.99.7.27 >/dev/null 2>&1 || gh release create android-v0.99.7.27 --title "CineTracker Android 0.99.7.27 — Discover Touch Fix" --notes "$NOTES"
          gh release edit android-v0.99.7.27 --title "CineTracker Android 0.99.7.27 — Discover Touch Fix" --notes "$NOTES"
          gh release upload android-v0.99.7.27 cinetracker-android-0.99.7.27-discover-touch-fix-debug.apk android-v099727-sha256.txt --clobber
