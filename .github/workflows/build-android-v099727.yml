name: Build Android 0.99.7.27 — Discover Touch Fix

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099727-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099727:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Historical workflow frozen
        run: echo 'Android 0.99.7.27 is frozen; use the current Android release workflow.'
