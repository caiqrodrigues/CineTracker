name: Build Android 0.99.7.58

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/android/runtime-r230-discover-native-actions.js'
      - 'apps/android/app/build.gradle'
      - 'scripts/prepare-android-v099758.mjs'
      - 'scripts/test-android-v099758.mjs'
      - '.github/workflows/build-android-v099758.yml'

permissions:
  contents: read

concurrency:
  group: cinetracker-android-v099758-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.58
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r230-discover-native-actions.js
          node --check scripts/prepare-android-v099758.mjs
          node --check scripts/test-android-v099758.mjs
          node scripts/prepare-android-v099758.mjs
          node scripts/test-android-v099758.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r230-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r230 embedded JS missing');
          fs.writeFileSync('/tmp/ct99758-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99758-prebuild.js

      - name: Build Android APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate Android APK
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="CineTracker-0.99.7.58.apk"
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.58"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "10028"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99758-index.html
          for marker in \
            'android-v0.99.7.58-r230-discover-original-trocar-native-top10' \
            'restore-original-r166-click-authority-no-clone' \
            'native-webview-overflow-no-js-gesture' \
            'no-r224-r229-swap-hijack-no-r227-r229-top10-gesture' \
            "const sw=e.target.closest?.('[data-ct166-swap]');" \
            'data-ct166-swap-disabled-r230' \
            'r230 keeps original data-ct166-swap' \
            'r230 disables r227 Trocar ownership' \
            'r230 disables r228 Trocar cloning' \
            'r230 disables r229 Trocar cloning' \
            'r230 native horizontal overflow only' \
            'overflow-x:auto!important' \
            'touch-action:auto!important' \
            'optimistic-immediate-remove-next-card-background-sync' \
            'detail-seen-toggle-reversible-via-unmark-rpc' \
            'discover-filter-right-of-search' \
            'single-row-compact-auto-width-28px-pills' \
            'r217-library-behavior-no-r219-synthetic-fallback'; do
            grep -Fq "$marker" /tmp/ct99758-index.html
          done
          ! grep -Fq 'ct219-manual-cover' /tmp/ct99758-index.html
          ! grep -Fq 'negative-id-resolve-or-local-detail' /tmp/ct99758-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          stat -c '%s' "$OUT" | tee android-v099758-size.txt
          sha256sum "$OUT" | tee android-v099758-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.58
          path: |
            CineTracker-0.99.7.58.apk
            android-v099758-sha256.txt
            android-v099758-size.txt
          if-no-files-found: error
          retention-days: 14
