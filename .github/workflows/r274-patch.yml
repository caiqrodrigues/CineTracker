name: Patch r274 candidate
on:
  push:
    branches: ['fix/r274-home-timeout-history-metadata']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r274-home-timeout-history-metadata
      - name: Fix available episode expression
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/build-r274.mjs')
          s=p.read_text(encoding='utf-8')
          old="function ct274AvailableText(x){const n=Math.max(0,Number(x?.available_episodes??x?.history_missing_episodes??(Number(x?.released_episodes||0)-Number(x?.watched_episodes||0))||0));return n===1?'1 episódio disponível para ver':n+' episódios disponíveis para ver'}"
          new="function ct274AvailableText(x){const raw=x?.available_episodes??x?.history_missing_episodes??(Number(x?.released_episodes||0)-Number(x?.watched_episodes||0));const n=Math.max(0,Number(raw||0));return n===1?'1 episódio disponível para ver':n+' episódios disponíveis para ver'}"
          if old not in s:
              raise SystemExit('target expression not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'CineTracker Validation'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/web/build-r274.mjs
          git commit -m 'fix: correct r274 available episode expression'
          git push origin HEAD:fix/r274-home-timeout-history-metadata
