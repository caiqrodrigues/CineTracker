name: Verify v0.0.95 Login Baseline

on:
  push:
    branches: [recovery/v095-login-baseline]

permissions:
  contents: read

jobs:
  v095-login-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify untouched v0.0.95 project
        run: npm run verify
      - name: Build untouched v0.0.95 Web app
        run: npm run build
      - name: Run v0.0.95 login baseline suite
        run: node scripts/test-v095-login-baseline.mjs
      - name: Build original v0.0.95 Android APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Verify original v0.0.95 package and version
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          PACKAGE="$($AAPT dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging "$APK" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$($AAPT dump badging "$APK" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.0.95"
          test "$VERSION_CODE" = "95"
