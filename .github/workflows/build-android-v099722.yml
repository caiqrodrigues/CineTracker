name: Build Android 0.99.7.22 — r186 Strict Pra Voce + Realtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/web/runtime-r186-shared.js'
      - 'scripts/prepare-android-v099722.mjs'
      - 'scripts/test-android-v099722.mjs'
      - 'scripts/test-r186-foryou-strict.mjs'
      - '.github/workflows/build-android-v099722.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/web/runtime-r186-shared.js'
      - 'scripts/prepare-android-v099722.mjs'
      - 'scripts/test-android-v099722.mjs'
      - 'scripts/test-r186-foryou-strict.mjs'
      - '.github/workflows/build-android-v099722.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099722-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099722:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android 0.99.7.22
        run: |
          set -euo pipefail
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r181-season-toggle.mjs
          node scripts/test-r182-home-season-polish.mjs
          node scripts/test-r184-profile-gap.mjs
          node scripts/test-r185a-instant-cache.mjs
          node scripts/test-r185c-performance-polish.mjs
          node scripts/test-r186-foryou-strict.mjs
          node --check apps/web/runtime-r186-shared.js
          node --check scripts/prepare-android-v099722.mjs
          node --check scripts/test-android-v099722.mjs
          node scripts/prepare-android-v099722.mjs
          node scripts/test-android-v099722.mjs
      - name: Build Android 0.99.7.22 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate APK identity, r186 authority, Realtime and signing
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.22-r186-foryou-realtime-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.22"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "9992"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99722-index.html
          grep -Fq 'android-v0.99.7.22-r186-foryou-strict-realtime' /tmp/ct99722-index.html
          grep -Fq 'tmdb-gte-7.5-release-year-gt-1990' /tmp/ct99722-index.html
          grep -Fq 'block-pure-drama-18-and-any-documentary-99' /tmp/ct99722-index.html
          grep -Fq 'seven-slots-no-duplicate-media' /tmp/ct99722-index.html
          grep -Fq 'watch_history+media_overrides-postgres-changes' /tmp/ct99722-index.html
          grep -Fq 'home-entry-top-anchor' /tmp/ct99722-index.html
          grep -Fq 'geometry-only-no-layout-no-color' /tmp/ct99722-index.html
          ! grep -Fq "profile-discover-hot-route-reuse" /tmp/ct99722-index.html
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/ct99722-index.html','utf8');
          const marker='<script data-ct-android="r186-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('embedded r186 JS missing');
          fs.writeFileSync('/tmp/ct99722.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99722.js
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099722-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.22-r186-foryou-realtime-debug
          path: |
            cinetracker-android-0.99.7.22-r186-foryou-realtime-debug.apk
            android-v099722-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish Android 0.99.7.22 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES='Android 0.99.7.22 aplica a mesma autoridade r186 da Web no Pra Você: nota TMDB >= 7.5, somente 1991+, exclusão canônica de histórico, Watchlist restrita ao bloco próprio, documentários e Drama puro bloqueados, sete slots sem duplicação e fallback popular inédito por tipo. Também assina Supabase Realtime em watch_history e media_overrides para refletir alterações entre dispositivos e mantém as correções anteriores de Home, episódios, temporadas, cache e harmonização visual.'
          gh release view android-v0.99.7.22 >/dev/null 2>&1 || gh release create android-v0.99.7.22 --title "CineTracker Android 0.99.7.22 — r186 Strict Pra Você + Realtime" --notes "$NOTES"
          gh release edit android-v0.99.7.22 --title "CineTracker Android 0.99.7.22 — r186 Strict Pra Você + Realtime" --notes "$NOTES"
          gh release upload android-v0.99.7.22 cinetracker-android-0.99.7.22-r186-foryou-realtime-debug.apk android-v099722-sha256.txt --clobber
