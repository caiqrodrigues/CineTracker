name: Publish CineTracker v1.0.0 Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1-release.yml'

permissions:
  contents: write

concurrency:
  group: cinetracker-publish-v1-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Install signing key
        run: |
          set -euo pipefail
          test -f ~/.cinetracker/cinetracker.keystore
          mkdir -p ~/.android
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare official Android 1.0.0
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.0'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10042' apps/android/app/build.gradle
          node scripts/prepare-android-v1000.mjs
          node scripts/test-android-v1000.mjs

      - name: Build APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate and package release APK
        run: |
          set -euo pipefail
          APK='apps/android/app/build/outputs/apk/debug/app-debug.apk'
          OUT='CineTracker-1.0.0.apk'
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          grep -Fq "versionName='1.0.0'" <<<"$BADGING"
          grep -Fq "versionCode='10042'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct1000-index.html
          grep -Fq 'name="ct-official-version" content="1.0.0"' /tmp/ct1000-index.html
          grep -Fq 'CineTracker • v1.0.0 • ${REVISION}' /tmp/ct1000-index.html
          grep -Fq 'watchlist-swap-uses-active-ct186-selected-pool' /tmp/ct1000-index.html
          grep -Fq 'native-webview-horizontal-no-manual-touch' /tmp/ct1000-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee CineTracker-1.0.0-SHA256.txt
          stat -c '%s' "$OUT" | tee CineTracker-1.0.0-size.txt

      - name: Publish GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          # CineTracker 1.0.0

          Primeira versão oficial estável do CineTracker.

          - Web oficial: 1.0.0 / r204-official-1.0.0
          - Android oficial: 1.0.0 / versionCode 10042
          - Android preserva a base 0.99.7.71 validada fisicamente
          - Trocar em "Da sua Watchlist" usa o mesmo pool exibido pelo renderer ativo
          - Scroll horizontal do Top 10 permanece nativo e validado
          - APK validado por aapt, apksigner e testes de regressão antes da publicação

          O APK e o arquivo SHA-256 estão anexados nesta release.
          EOF
          )
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 CineTracker-1.0.0.apk CineTracker-1.0.0-SHA256.txt CineTracker-1.0.0-size.txt --clobber
            gh release edit v1.0.0 --title 'CineTracker 1.0.0' --notes "$NOTES" --latest
          else
            gh release create v1.0.0 CineTracker-1.0.0.apk CineTracker-1.0.0-SHA256.txt CineTracker-1.0.0-size.txt --target "$GITHUB_SHA" --title 'CineTracker 1.0.0' --notes "$NOTES" --latest
          fi

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.0.0 --json tagName,name,isDraft,isPrerelease,url,assets > /tmp/release.json
          grep -Fq 'CineTracker-1.0.0.apk' /tmp/release.json
          grep -Fq 'CineTracker-1.0.0-SHA256.txt' /tmp/release.json
          cat /tmp/release.json
