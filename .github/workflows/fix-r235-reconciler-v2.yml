name: Fix r235 reconciler v2

on:
  push:
    branches:
      - fix/1.0.27-r235-live-authority
    paths:
      - .github/workflows/fix-r235-reconciler-v2.yml

permissions:
  contents: write

jobs:
  patch-reconciler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1.0.27-r235-live-authority
      - name: Patch reconciler scheduler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/runtime-r235-v127-live-authority.js')
          s = p.read_text()
          old = '''window.requestAnimationFrame(() => {
              queued = false;
              normalizeAll127();
            });'''
          new = '''setTimeout(() => {
              queued = false;
              normalizeAll127();
            }, 0);'''
          if old not in s:
              raise SystemExit('Expected requestAnimationFrame reconciler block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/runtime-r235-v127-live-authority.js
          git diff --cached --check
          git commit -m "fix(r235): reconcile async DOM changes outside animation frame"
          git push origin HEAD:fix/1.0.27-r235-live-authority
