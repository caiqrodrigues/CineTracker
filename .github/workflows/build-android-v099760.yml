name: Build Android 0.99.7.60

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/android/runtime-r232-discover-device-fix.js'
      - 'apps/android/app/build.gradle'
      - 'scripts/prepare-android-v099760.mjs'
      - 'scripts/test-android-v099760.mjs'
      - '.github/workflows/build-android-v099760.yml'

permissions:
  contents: read

concurrency:
  group: cinetracker-android-v099760-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.60
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r232-discover-device-fix.js
          node --check scripts/prepare-android-v099760.mjs
          node --check scripts/test-android-v099760.mjs
          node scripts/prepare-android-v099760.mjs
          node scripts/test-android-v099760.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r232-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r232 embedded JS missing');
          fs.writeFileSync('/tmp/ct99760-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99760-prebuild.js

      - name: Build Android APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate Android APK
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="CineTracker-0.99.7.60.apk"
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.60"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "10030"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99760-index.html
          for marker in \
            'android-v0.99.7.60-r232-device-discover-fix' \
            'branch-from-r226-no-r227-r231' \
            'window-capture-private-button-calls-r226-slot-swap' \
            'native-webview-pan-provider-series-movies' \
            'window-capture-stop-legacy-start-no-prevent-default' \
            'three-equal-width-equal-height' \
            'data-ct232-swap' \
            'touch-action:pan-x pan-y!important' \
            'grid-template-columns:repeat(3,minmax(0,1fr))!important' \
            'grid-auto-rows:1fr!important' \
            'window.__ctR232SwapBase=swap226' \
            'optimistic-immediate-remove-next-card-background-sync' \
            'detail-seen-toggle-reversible-via-unmark-rpc' \
            'discover-filter-right-of-search' \
            'single-row-compact-auto-width-28px-pills' \
            'persistent-2x-3x-4x-no-disable' \
            'r217-library-behavior-no-r219-synthetic-fallback'; do
            grep -Fq "$marker" /tmp/ct99760-index.html
          done
          for rejected in \
            'android-v0.99.7.55-r227-discover-swap-top10-swipe' \
            'android-v0.99.7.56-r228-discover-swap-top10-gesture' \
            'android-v0.99.7.57-r229-discover-swap-top10-pointer' \
            'android-v0.99.7.58-r230-discover-original-trocar-native-top10' \
            'android-v0.99.7.59-r231-clean-discover-actions' \
            'ct219-manual-cover' \
            'negative-id-resolve-or-local-detail'; do
            ! grep -Fq "$rejected" /tmp/ct99760-index.html
          done
          "$APKSIGNER" verify --print-certs "$OUT"
          stat -c '%s' "$OUT" | tee android-v099760-size.txt
          sha256sum "$OUT" | tee android-v099760-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.60
          path: |
            CineTracker-0.99.7.60.apk
            android-v099760-sha256.txt
            android-v099760-size.txt
          if-no-files-found: error
          retention-days: 14
