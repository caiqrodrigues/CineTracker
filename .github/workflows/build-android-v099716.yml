name: Build Android 0.99.7.16 — r180 Discover/Profile Parity

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099716-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099716:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android 0.99.7.16 with Web r180
        run: |
          node scripts/test-r179-target-card.mjs
          node scripts/test-r180-discover-profile.mjs
          node scripts/prepare-android-v099716.mjs
          node scripts/test-android-v099716.mjs
      - name: Build Android 0.99.7.16 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate APK identity and r180 runtime
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.16-r180-discover-profile-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test "$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)" = "0.99.7.16"
          test "$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)" = "9986"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99716-index.html
          grep -Fq 'android-v0.99.7.16-r180-discover-profile' /tmp/ct99716-index.html
          grep -Fq 'r180-discover-profile-parity' /tmp/ct99716-index.html
          grep -Fq 'all-tabs-scroll-strict-business-rules' /tmp/ct99716-index.html
          grep -Fq 'native-pan-x-all-subtabs-strict-rules' /tmp/ct99716-index.html
          grep -Fq 'collapsible-wide-stats-mobile' /tmp/ct99716-index.html
          grep -Fq 'data-ct-r180-stats-toggle' /tmp/ct99716-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099716-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.16-r180-discover-profile-debug
          path: |
            cinetracker-android-0.99.7.16-r180-discover-profile-debug.apk
            android-v099716-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish Android 0.99.7.16 release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES='Android 0.99.7.16 embute a Web r180. Descobrir passa a ter todas as nove subabas acessíveis por swipe e setas, regras estritas de datas/exclusões restauradas e Perfil com Estatísticas recolhíveis, Tempo total de tela e Tempo total em Watchlist em cards de largura dupla.'
          gh release view android-v0.99.7.16 >/dev/null 2>&1 || gh release create android-v0.99.7.16 --title "CineTracker Android 0.99.7.16 — r180 Discover/Profile Parity" --notes "$NOTES"
          gh release edit android-v0.99.7.16 --title "CineTracker Android 0.99.7.16 — r180 Discover/Profile Parity" --notes "$NOTES"
          gh release upload android-v0.99.7.16 cinetracker-android-0.99.7.16-r180-discover-profile-debug.apk android-v099716-sha256.txt --clobber
