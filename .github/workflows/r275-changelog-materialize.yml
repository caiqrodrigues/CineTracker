name: Materialize r275 changelog

on:
  push:
    branches:
      - fix/r275-history-rewatch-episode-dedupe

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r275-history-rewatch-episode-dedupe
      - name: Update changelog
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '## 1.0.66 — 2026-09-14 — Web r275' CHANGELOG.md; then exit 0; fi
          head -n 4 CHANGELOG.md > CHANGELOG.new
          cat .r275-changelog-entry.md >> CHANGELOG.new
          tail -n +5 CHANGELOG.md >> CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
      - name: Commit changelog
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet CHANGELOG.md; then exit 0; fi
          git config user.name 'CineTracker Validation'
          git config user.email 'actions@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'docs: add Web 1.0.66 r275 changelog'
          git push origin HEAD:fix/r275-history-rewatch-episode-dedupe
