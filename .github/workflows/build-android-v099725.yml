name: Build Android 0.99.7.25 — Auth Runtime Isolation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'scripts/prepare-android-v099725.mjs'
      - 'scripts/test-android-v099725.mjs'
      - '.github/workflows/build-android-v099725.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099725-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099725:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.25
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r197-auth-isolation.js
          node --check scripts/prepare-android-v099725.mjs
          node --check scripts/test-android-v099725.mjs
          node scripts/prepare-android-v099725.mjs
          node scripts/test-android-v099725.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r197-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r197 embedded JS missing');
          fs.writeFileSync('/tmp/ct99725-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99725-prebuild.js
          grep -Fq 'final String routePath = JSONObject.quote(path);' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! sed -n '/if (host.equals("mycinetracker.vercel.app"))/,/if (host.endsWith("supabase.co"))/p' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java | grep -Fq 'loadBundledWeb();'

      - name: Build Android 0.99.7.25 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate APK identity, embedded isolation, signing and digest
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.25-auth-runtime-isolation-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.25"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "9995"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99725-index.html
          for marker in \
            'android-v0.99.7.25-r197-auth-runtime-isolation' \
            'embedded-apk-never-reloads-from-web-release-json' \
            'unregister-web-service-workers' \
            'checkRelease161=async function(){return false};' \
            'auth-success-mount-home-shell-before-fast-paint' \
            'r190-r195-mobile-equivalents' \
            'asian-scripted-tv-excluded-from-foryou' \
            'ct-sports-sync-v4+ct-sports-search-v2'; do
            grep -Fq "$marker" /tmp/ct99725-index.html
          done
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/ct99725-index.html','utf8');
          const marker='<script data-ct-android="r197-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('embedded Android r197 JS missing');
          fs.writeFileSync('/tmp/ct99725.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99725.js
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099725-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.25-auth-runtime-isolation-debug
          path: |
            cinetracker-android-0.99.7.25-auth-runtime-isolation-debug.apk
            android-v099725-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android 0.99.7.25 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES='Android 0.99.7.25 preserva a paridade r190-r195 e corrige a causa comprovada do loop na tela de login: o runtime embarcado não obedece mais ao release.json nem ao Service Worker da Web. O verificador Web r161 é desativado no APK, registros de Service Worker são removidos e qualquer navegação main-frame para mycinetracker.vercel.app é mantida dentro do runtime atual em vez de recarregar o HTML embarcado. A sessão autenticada também é espelhada para a bridge nativa.'
          gh release view android-v0.99.7.25 >/dev/null 2>&1 || gh release create android-v0.99.7.25 --title "CineTracker Android 0.99.7.25 — Auth Runtime Isolation" --notes "$NOTES"
          gh release edit android-v0.99.7.25 --title "CineTracker Android 0.99.7.25 — Auth Runtime Isolation" --notes "$NOTES"
          gh release upload android-v0.99.7.25 cinetracker-android-0.99.7.25-auth-runtime-isolation-debug.apk android-v099725-sha256.txt --clobber
