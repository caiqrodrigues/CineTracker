name: Build Android 0.99.7.25 — Auth Runtime Isolation

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099725-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099725:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Historical workflow
        run: |
          echo 'Android 0.99.7.25 is frozen. Use the tagged release android-v0.99.7.25 for its original validated artifact.'
