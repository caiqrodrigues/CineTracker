name: Build Android 0.99.7.12 — r178 Stable Home DOM

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099712-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099712:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Historical 0.99.7.12 rebuild only
        run: |
          echo '0.99.7.12 is archived. Current Android release is built by the latest workflow.'
