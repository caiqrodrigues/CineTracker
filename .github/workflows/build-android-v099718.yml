name: Build Android 0.99.7.18 — r182 Home/Season Polish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099718-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099718:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android 0.99.7.18 with Web r182
        run: |
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r181-season-toggle.mjs
          node scripts/test-r182-home-season-polish.mjs
          node scripts/prepare-android-v099718.mjs
          node scripts/test-android-v099718.mjs
      - name: Build Android 0.99.7.18 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate APK identity and r182 runtime
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.18-r182-home-season-polish-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test "$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)" = "0.99.7.18"
          test "$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)" = "9988"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99718-index.html
          grep -Fq 'android-v0.99.7.18-r182-home-season-polish' /tmp/ct99718-index.html
          grep -Fq 'r182-home-season-polish' /tmp/ct99718-index.html
          grep -Fq 'remove-noninteractive-circle-badge-keep-row-navigation' /tmp/ct99718-index.html
          grep -Fq 'compact-inline-season-toggle-no-giant-button' /tmp/ct99718-index.html
          grep -Fq 'data-ct181-season-toggle' /tmp/ct99718-index.html
          grep -Fq 'cinetracker_unmark_episode_v1' /tmp/ct99718-index.html
          grep -Fq 'ct176PrimeWithWatched' /tmp/ct99718-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099718-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.18-r182-home-season-polish-debug
          path: |
            cinetracker-android-0.99.7.18-r182-home-season-polish-debug.apk
            android-v099718-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish Android 0.99.7.18 release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES='Android 0.99.7.18 embute a Web r182. Remove o círculo grande e sem ação própria da Home, mantendo o card inteiro como navegação e o botão azul como ação explícita de marcar episódio. O controle de temporada inteira agora é compacto e integrado ao card/drawer, sem o botão gigante, preservando toda a lógica r181 de marcar/desmarcar e confirmação de temporadas anteriores.'
          gh release view android-v0.99.7.18 >/dev/null 2>&1 || gh release create android-v0.99.7.18 --title "CineTracker Android 0.99.7.18 — Home/Season Polish" --notes "$NOTES"
          gh release edit android-v0.99.7.18 --title "CineTracker Android 0.99.7.18 — Home/Season Polish" --notes "$NOTES"
          gh release upload android-v0.99.7.18 cinetracker-android-0.99.7.18-r182-home-season-polish-debug.apk android-v099718-sha256.txt --clobber
