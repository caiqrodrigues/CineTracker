name: Build Android 0.99.7.19 — r184 Episode Gap Prompt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/web/runtime-r184-shared.js'
      - 'apps/web/r184-shared.css'
      - 'scripts/prepare-android-v099719.mjs'
      - 'scripts/test-android-v099719.mjs'
      - 'scripts/test-r184-profile-gap.mjs'
      - '.github/workflows/build-android-v099719.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/web/runtime-r184-shared.js'
      - 'apps/web/r184-shared.css'
      - 'scripts/prepare-android-v099719.mjs'
      - 'scripts/test-android-v099719.mjs'
      - 'scripts/test-r184-profile-gap.mjs'
      - '.github/workflows/build-android-v099719.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099719-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099719:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android 0.99.7.19 with r184 shared gap prompt
        run: |
          set -euo pipefail
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r181-season-toggle.mjs
          node scripts/test-r182-home-season-polish.mjs
          node scripts/test-r184-profile-gap.mjs
          node --check scripts/prepare-android-v099719.mjs
          node --check scripts/test-android-v099719.mjs
          node scripts/prepare-android-v099719.mjs
          node scripts/test-android-v099719.mjs
      - name: Build Android 0.99.7.19 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate APK identity, runtime and signing
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.19-r184-gap-prompt-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.19"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "9989"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99719-index.html
          grep -Fq 'android-v0.99.7.19-r184-gap-prompt' /tmp/ct99719-index.html
          grep -Fq 'r184-episode-gap-prompt' /tmp/ct99719-index.html
          grep -Fq 'Pular e marcar só' /tmp/ct99719-index.html
          grep -Fq 'Marcar anteriores +' /tmp/ct99719-index.html
          grep -Fq 'all-released-episodes-before-target-across-seasons' /tmp/ct99719-index.html
          grep -Fq 'compact-inline-season-toggle-no-giant-button' /tmp/ct99719-index.html
          ! grep -Fq "web-clean-headers-profile-reflow" /tmp/ct99719-index.html
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/ct99719-index.html','utf8');
          const marker='<script data-ct-android="r184-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('embedded r184 JS missing');
          fs.writeFileSync('/tmp/ct99719.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99719.js
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099719-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.19-r184-gap-prompt-debug
          path: |
            cinetracker-android-0.99.7.19-r184-gap-prompt-debug.apk
            android-v099719-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish Android 0.99.7.19 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES='Android 0.99.7.19 preserva a composição mobile r182 e acrescenta o prompt r184 ao marcar manualmente um episódio com lacunas anteriores. O CineTracker identifica episódios já lançados que ficaram para trás e oferece Pular e marcar só o episódio escolhido ou Marcar anteriores + o episódio escolhido. A autoridade do próximo episódio continua sendo a primeira lacuna lançada não assistida da r176.'
          gh release view android-v0.99.7.19 >/dev/null 2>&1 || gh release create android-v0.99.7.19 --title "CineTracker Android 0.99.7.19 — Episode Gap Prompt" --notes "$NOTES"
          gh release edit android-v0.99.7.19 --title "CineTracker Android 0.99.7.19 — Episode Gap Prompt" --notes "$NOTES"
          gh release upload android-v0.99.7.19 cinetracker-android-0.99.7.19-r184-gap-prompt-debug.apk android-v099719-sha256.txt --clobber
