name: Verify HOTFIX9 Android Stability

on:
  push:
    branches: [recovery/v095-core-hotfix9-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android_stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore dedicated CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize dedicated signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and prove stable Web runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node scripts/test-auth-recovery-red.mjs
          npm install --no-save --no-package-lock playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node scripts/test-real-browser-p0.mjs
          node scripts/test-real-browser-stability-hotfix9.mjs
          grep -q 'patch-v067-v095.js' dist/index.html
          grep -q '0.0.97 HOTFIX 9' dist/patch-v074-hotfix1-version.js
          grep -q 'ct-web-0.0.97-hotfix9-stability' dist/service-worker.js
          ! grep -q 'patch-v068-v097.js' dist/index.html
          ! grep -q 'patch-v068-v097-observer-guard.js' dist/index.html
      - name: Prepare and prove exact embedded Android runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-android-hotfix2-web.mjs
          node scripts/test-android-inline-hotfix6.mjs
          CINETRACKER_TEST_ROOT=apps/android/app/src/main/assets/hotfix5 node scripts/test-real-browser-stability-hotfix9.mjs
          grep -q "window.__ctAndroidBundle = 'hotfix9-v95-core-inline-authoritative'" apps/android/app/src/main/assets/hotfix5/index.html
          grep -q 'data-ct-inline="patch-v067-v095.js"' apps/android/app/src/main/assets/hotfix5/index.html
          grep -q '0.0.97 HOTFIX 9' apps/android/app/src/main/assets/hotfix5/index.html
          ! grep -q 'patch-v068-v097.js' apps/android/app/src/main/assets/hotfix5/index.html
          ! grep -q '__ct97Loaded' apps/android/app/src/main/assets/hotfix5/index.html
          ! grep -q '<script src="/' apps/android/app/src/main/assets/hotfix5/index.html
      - name: Build debug HOTFIX9 validation APK
        working-directory: apps/android
        shell: bash
        run: gradle assembleDebug --stacktrace
      - name: Verify APK identity, signature and embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          unzip -l "$APK" | grep -q 'assets/hotfix5/index.html'
          unzip -p "$APK" assets/hotfix5/index.html | grep -q "window.__ctAndroidBundle = 'hotfix9-v95-core-inline-authoritative'"
          unzip -p "$APK" assets/hotfix5/index.html | grep -q 'data-ct-inline="patch-v067-v095.js"'
          if unzip -p "$APK" assets/hotfix5/index.html | grep -q 'patch-v068-v097.js'; then exit 1; fi
          if unzip -p "$APK" assets/hotfix5/index.html | grep -q '__ct97Loaded'; then exit 1; fi
          "$APKSIGNER" verify --print-certs "$APK"
          PACKAGE="$($AAPT dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging "$APK" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$($AAPT dump badging "$APK" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.0.97 HOTFIX 9"
          test "$VERSION_CODE" = "987"
      - name: Upload HOTFIX9 validation APK
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-0.0.97-hotfix9-stability-validation
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
