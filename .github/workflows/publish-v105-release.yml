name: Publish CineTracker v1.0.5 Release
on:
  workflow_dispatch:
  push:
    branches: [release/1.0.5-final2]
    paths:
      - '.github/workflows/publish-v105-release.yml'
      - 'apps/web/runtime-r209-v105-fixes.js'
      - 'apps/web/build-r209.mjs'
      - 'apps/web/package.json'
      - 'package.json'
      - 'scripts/prepare-android-v1005.mjs'
      - 'scripts/test-android-v1005.mjs'
      - 'scripts/test-v105-runtime.mjs'
      - 'scripts/validate-web-v105.mjs'
      - 'apps/android/app/build.gradle'
      - 'supabase/functions/cinetracker-f1-v1/index.ts'
permissions:
  contents: write
concurrency:
  group: cinetracker-publish-v105-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Install signing key
        run: |
          set -euo pipefail
          test -f ~/.cinetracker/cinetracker.keystore
          mkdir -p ~/.android
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - name: Validate 1.0.5 runtime source
        run: node scripts/test-v105-runtime.mjs
      - name: Validate F1 proxy source
        run: |
          set -euo pipefail
          F='supabase/functions/cinetracker-f1-v1/index.ts'
          grep -Fq 'api.jolpi.ca/ergast/f1' "$F"
          grep -Fq 'driverstandings' "$F"
          grep -Fq 'constructorstandings' "$F"
          grep -Fq 'pitstops' "$F"
          grep -Fq 'laps' "$F"
          ! grep -Fq '.json`' "$F"
      - name: Build Web 1.0.5
        run: node apps/web/build-r209.mjs
      - name: Validate Web 1.0.5
        run: node scripts/validate-web-v105.mjs
      - name: Prepare Android 1.0.5
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.5'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10047' apps/android/app/build.gradle
          node scripts/prepare-android-v1005.mjs
          node scripts/test-android-v1005.mjs
      - name: Build APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate final APK
        run: |
          set -euo pipefail
          APK='apps/android/app/build/outputs/apk/debug/app-debug.apk'
          OUT='CineTracker-1.0.5.apk'
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          grep -Fq "versionName='1.0.5'" <<<"$BADGING"
          grep -Fq "versionCode='10047'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct105-index.html
          grep -Fq '<script data-ct-android="r247-android-js">' /tmp/ct105-index.html
          grep -Fq "const REVISION='r247-android-official-1.0.5'" /tmp/ct105-index.html
          grep -Fq "window.__ctR209='v105-video-corrections'" /tmp/ct105-index.html
          grep -Fq 'data-ct105-rewatch-movie' /tmp/ct105-index.html
          grep -Fq 'data-ct105-rewatch-episode' /tmp/ct105-index.html
          grep -Fq 'data-ct105-history-rewatch' /tmp/ct105-index.html
          grep -Fq 'ct104PaintF1=async function' /tmp/ct105-index.html
          grep -Fq -- '--ct104-card-w' /tmp/ct105-index.html
          grep -Fq 'watchlist-swap-uses-active-ct186-selected-pool' /tmp/ct105-index.html
          grep -Fq 'native-webview-horizontal-no-manual-touch' /tmp/ct105-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee CineTracker-1.0.5-SHA256.txt
          stat -c '%s' "$OUT" | tee CineTracker-1.0.5-size.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CineTracker-1.0.5
          path: |
            CineTracker-1.0.5.apk
            CineTracker-1.0.5-SHA256.txt
            CineTracker-1.0.5-size.txt
      - name: Publish GitHub Release v1.0.5
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          # CineTracker 1.0.5
          - Preserva a geometria de cards aprovada na 1.0.4
          - Cria de forma explícita os controles visíveis de Reassistir em filmes, episódios e Histórico
          - Recarrega contadores persistentes 2x, 3x, 4x após cada reassistida
          - Corrige memória do Pra você para não remover o próprio card recém-exibido na mesma sessão
          - Corrige F1 Hub com Edge Function v2 e endpoints atuais da Jolpica sem .json
          - Mantém Estatísticas no Perfil e remove apenas o resumo antigo de Sports
          - Mantém Watchlist r243 e Top 10 nativo
          EOF
          )
          if gh release view v1.0.5 >/dev/null 2>&1; then
            gh release upload v1.0.5 CineTracker-1.0.5.apk CineTracker-1.0.5-SHA256.txt CineTracker-1.0.5-size.txt --clobber
            gh release edit v1.0.5 --title 'CineTracker 1.0.5' --notes "$NOTES" --latest
          else
            gh release create v1.0.5 CineTracker-1.0.5.apk CineTracker-1.0.5-SHA256.txt CineTracker-1.0.5-size.txt --target "$GITHUB_SHA" --title 'CineTracker 1.0.5' --notes "$NOTES" --latest
          fi
      - name: Verify published assets
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          gh release view v1.0.5 --json tagName,name,isDraft,isPrerelease,url,assets > /tmp/release.json
          grep -Fq 'CineTracker-1.0.5.apk' /tmp/release.json
          grep -Fq 'CineTracker-1.0.5-SHA256.txt' /tmp/release.json
          cat /tmp/release.json
