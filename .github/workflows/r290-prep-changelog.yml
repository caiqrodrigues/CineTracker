name: Prepare r290 changelog

on:
  push:
    branches:
      - fix/web-r290-universal-media-card-lock

permissions:
  contents: write

jobs:
  prepend_changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-r290-universal-media-card-lock
      - name: Prepend r290 changelog
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          old=p.read_text(encoding='utf-8')
          marker='## 1.0.81 — 2026-09-15 — Web r290'
          if marker not in old:
              header='# Changelog\n\n'
              if old.startswith(header):
                  old=old[len(header):]
              section='''# Changelog

## 1.0.81 — 2026-09-15 — Web r290

### Cards de mídia / padrão Indicação do Dia
- Todos os cards poster-based de filmes, séries e animes passam a compartilhar a geometria exata da Indicação do Dia: pôster 2:3 de 176×264 px no desktop e 154×231 px no mobile.
- O container do card, a área clicável e o bloco de texto ficam dimensionalmente travados. Títulos usam no máximo duas linhas; ano, gêneros/tipo e nota ficam em uma linha truncada.
- A normalização compartilhada também cobre cards criados depois do primeiro paint, sem alterar o Android.

### Descobrir
- `Da sua Watchlist` e `100% Novos` mantêm Filme, Série e Anime em três cards verticais do tamanho padrão, sem esticar por largura disponível ou por quantidade de texto.
- `Top 10`, `Em alta`, `Populares`, `Novidades`, `Lançamentos`, `Mais Aguardados`, `Mais bem avaliados` e `Calendário` passam a usar exclusivamente o card vertical uniforme.
- O Top 10 deixa de recorrer ao renderer legado de faixa/banner e recebe o mesmo card vertical dos demais trilhos.
- `Ver mais` pode expandir para grid, mas cada célula mantém exatamente a mesma largura do card da Indicação do Dia.

### Build / validação
- Web atualizada para `1.0.81 / r290-official-1.0.81`; Android permanece `1.0.20 / versionCode 10062`.
- Chromium valida 420 px e 1200 px, as nove sub-abas do Descobrir, card genérico fora do Descobrir, Top 10 sem banner, pôster 2:3, container travado, título `line-clamp-2` e metadados em uma linha.
- Bundle final exato e identidade da release são exigidos antes da promoção para `main`.

'''
              p.write_text(section+old,encoding='utf-8')
          PY
      - name: Commit changelog preparation
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: prepare r290 changelog"
          git push origin HEAD:fix/web-r290-universal-media-card-lock
