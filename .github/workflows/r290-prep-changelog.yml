name: Finalize r290 to main

on:
  push:
    branches:
      - fix/web-r290-universal-media-card-lock

permissions:
  contents: write

jobs:
  finalize_r290:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build clean final tree from validated r290
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/r290-finalize-helper.cjs /tmp/r290-finalize-helper.cjs
          git fetch origin main
          git checkout --detach origin/main
          git checkout 7f9d5d92903a3c79b380515a5fc4cdb7d691d00d -- \
            .github/workflows/verify.yml \
            README.md \
            package.json \
            apps/web/package.json \
            apps/web/runtime-r290-universal-media-card-lock.js \
            apps/web/build-r290.mjs \
            apps/web/build-r290-official.mjs \
            apps/web/test-r290.mjs \
            apps/web/test-r290-browser.mjs \
            scripts/test-r290-exact-bundle-browser.mjs
          node /tmp/r290-finalize-helper.cjs
          grep -Fq '"version": "1.0.81"' package.json
          grep -Fq '"version": "1.0.81"' apps/web/package.json
          grep -Fq '## 1.0.81 — 2026-09-15 — Web r290' CHANGELOG.md
          git status --short
      - name: Commit exact release and push main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Caique Rodrigues"
          git config user.email "73994301+caiqrodrigues@users.noreply.github.com"
          git add \
            .github/workflows/verify.yml \
            README.md CHANGELOG.md package.json \
            apps/web/package.json \
            apps/web/runtime-r290-universal-media-card-lock.js \
            apps/web/build-r290.mjs \
            apps/web/build-r290-official.mjs \
            apps/web/test-r290.mjs \
            apps/web/test-r290-browser.mjs \
            scripts/test-r290-exact-bundle-browser.mjs
          git commit -m "style: lock and standardize card dimensions across all discover sections"
          git push origin HEAD:main
