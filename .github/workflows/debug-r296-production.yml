name: Debug r296 production alias

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose_r296_production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install browser probe dependency
        working-directory: apps/web
        run: npm install --no-package-lock --ignore-scripts
      - name: Capture public production runtime errors
        working-directory: apps/web
        run: |
          cat > /tmp/r296-probe.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-gpu','--disable-background-networking']});
          const page=await browser.newPage();
          const pageErrors=[]; const consoleErrors=[]; const failed=[];
          page.on('pageerror',e=>pageErrors.push(String(e.stack||e.message||e)));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          page.on('requestfailed',r=>failed.push(`${r.url()} :: ${r.failure()?.errorText||'failed'}`));
          const url=`https://mycinetracker.vercel.app/?ct=${Date.now()}`;
          const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(8000);
          console.log('HTTP',res?.status());
          console.log('PAGE_ERRORS',JSON.stringify(pageErrors,null,2));
          console.log('CONSOLE_ERRORS',JSON.stringify(consoleErrors,null,2));
          console.log('REQUEST_FAILED',JSON.stringify(failed,null,2));
          console.log('APP_HTML',JSON.stringify(await page.locator('#app').innerHTML().catch(()=>null)));
          console.log('MARKERS',await page.evaluate(()=>({r296:window.__ctR296||null,web:window.__ctWebBuild||null,official:window.__ctOfficialVersion||null})));
          await browser.close();
          NODE
          node /tmp/r296-probe.mjs
