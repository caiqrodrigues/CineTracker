name: Release Android 1.0.54

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/runtime-r296-v1054-wwe-home-stability.js'
      - 'scripts/prepare-android-v1054.mjs'
      - 'scripts/test-android-v1054.mjs'
      - 'apps/android/app/build.gradle'
      - 'scripts/prepare-android-v1054.mjs'
      - 'scripts/test-android-v1054.mjs'
      - '.github/workflows/release-android-v1054.yml'
      - 'CHANGELOG.md'
      - 'VERSIONS.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinetracker-android-1.0.54-r296-verified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_1_0_53:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify Android-only source changes
        shell: bash
        run: |
          set -euo pipefail
          FREEZE='43f5f0c5d87802fac80365c62388276c0b2d7255'
          git cat-file -e "$FREEZE^{commit}"
          git diff --exit-code HEAD^ HEAD -- apps/web
          test "$(git hash-object apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java)" = '641f8766951077947c57cf34959bac43b94e2648'
          test "$(git hash-object apps/android/app/src/main/res/layout/activity_main.xml)" = '30edbb633685c3a77ce114c92c4f07dfa07a3271'
          grep -Fq 'CineTrackerNative' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          grep -Fq 'onShowFileChooser' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          grep -Fq 'requestNotificationPermission' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          grep -Fq 'bindNativeNavigation' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java

      - name: Restore dedicated signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize dedicated signing key if cache is empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore

      - name: Prepare and validate exact Android 1.0.54 runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.54'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10096' apps/android/app/build.gradle
          node --check scripts/prepare-android-v1054.mjs
          node --check scripts/test-android-v1054.mjs
          node scripts/prepare-android-v1054.mjs
          node scripts/test-android-v1054.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r296-android-js">',a=h.indexOf(marker),b=a<0?-1:h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r296 embedded script missing');
          fs.writeFileSync('/tmp/ct-android-1052.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct-android-1052.js

      - name: Build Android APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate signed APK and embedded release
        shell: bash
        run: |
          set -euxo pipefail
          APK='apps/android/app/build/outputs/apk/debug/app-debug.apk'
          OUT='CineTracker-Android-1.0.54.apk'
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          grep -Fq "versionName='1.0.54'" <<<"$BADGING"
          grep -Fq "versionCode='10096'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct1054-index.html
          grep -Fq 'name="ct-official-version" content="1.0.54"' /tmp/ct1054-index.html
          grep -Fq 'ct293-single-seven-slot-owner' /tmp/ct1054-index.html
          grep -Fq 'authenticated-v525-seven-slots' /tmp/ct1054-index.html
          grep -Fq 'function ct295Protect()' /tmp/ct1054-index.html
          grep -Fq 'window.__ctR296WweHome' /tmp/ct1054-index.html
          grep -Fq "window.__ctR243Fix='watchlist-swap-uses-active-ct186-selected-pool'" /tmp/ct1054-index.html
          grep -Fq "window.__ctR226V120='final-dom-authority-no-legacy-listeners'" /tmp/ct1054-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-1.0.54-sha256.txt
          stat -c '%s' "$OUT" | tee android-1.0.54-size.txt

      - name: Build side-by-side Android TESTE APK (no existing-app replacement)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('apps/android/app/build.gradle')
          src=gradle.read_text()
          old="applicationId 'com.cinetracker.app'"
          assert src.count(old)==1, 'Original applicationId unexpectedly changed'
          assert "versionName '1.0.54'" in src
          gradle.write_text(src.replace(old,"applicationId 'com.cinetracker.app.teste54'").replace("versionName '1.0.54'","versionName '1.0.54-teste'"))
          manifest=Path('apps/android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          assert text.count('android:name=".MainActivity"')==1
          assert text.count('android:label="CineTracker"')==1
          manifest.write_text(text.replace('android:name=".MainActivity"','android:name="com.cinetracker.app.MainActivity"').replace('android:label="CineTracker"','android:label="CineTracker TESTE 1.0.54"'))
          PY
          (cd apps/android && gradle assembleDebug --stacktrace)
          TESTAPK='CineTracker-Android-1.0.54-TESTE.apk'
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "$TESTAPK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$TESTAPK")"
          grep -Fq "package: name='com.cinetracker.app.teste54'" <<<"$BADGING"
          grep -Fq "versionName='1.0.54-teste'" <<<"$BADGING"
          grep -Fq 'application-label:' <<<"$BADGING"
          unzip -p "$TESTAPK" assets/hotfix5/index.html > /tmp/ct1054-preview.html
          grep -Fq "window.__ctR289DiscoverV1047=" /tmp/ct1054-preview.html
          "$APKSIGNER" verify --print-certs "$TESTAPK"
          sha256sum "$TESTAPK" | tee android-1.0.54-teste-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-1.0.54
          path: |
            CineTracker-Android-1.0.54.apk
            CineTracker-Android-1.0.54-TESTE.apk
            android-1.0.54-teste-sha256.txt
            android-1.0.54-sha256.txt
            android-1.0.54-size.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android 1.0.54 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='android-v1.0.54'
          NOTES='Android 1.0.54/r296: all seven authenticated Pra Voce slots must be ready before ownership; keep real Raw/SmackDown Home nodes during async repaints and invalidate on watched action. Web unchanged. Separate TESTE54 APK.'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title 'CineTracker Android 1.0.54' --notes "$NOTES"
          gh release upload "$TAG" CineTracker-Android-1.0.54.apk CineTracker-Android-1.0.54-TESTE.apk android-1.0.54-teste-sha256.txt android-1.0.54-sha256.txt android-1.0.54-size.txt --clobber
