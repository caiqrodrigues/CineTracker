name: Build Android 0.99.7.20 — r185A Instant Cache

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/web/runtime-r185a-shared.js'
      - 'apps/web/r185a-shared.css'
      - 'scripts/prepare-android-v099720.mjs'
      - 'scripts/test-android-v099720.mjs'
      - 'scripts/test-r185a-instant-cache.mjs'
      - '.github/workflows/build-android-v099720.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/web/runtime-r185a-shared.js'
      - 'apps/web/r185a-shared.css'
      - 'scripts/prepare-android-v099720.mjs'
      - 'scripts/test-android-v099720.mjs'
      - 'scripts/test-r185a-instant-cache.mjs'
      - '.github/workflows/build-android-v099720.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099720-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099720:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android 0.99.7.20 with r185A
        run: |
          set -euo pipefail
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r181-season-toggle.mjs
          node scripts/test-r182-home-season-polish.mjs
          node scripts/test-r184-profile-gap.mjs
          node scripts/test-r185a-instant-cache.mjs
          node --check scripts/prepare-android-v099720.mjs
          node --check scripts/test-android-v099720.mjs
          node scripts/prepare-android-v099720.mjs
          node scripts/test-android-v099720.mjs
      - name: Build Android 0.99.7.20 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate APK identity, r185A runtime and signing
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.20-r185a-instant-cache-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.20"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "9990"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99720-index.html
          grep -Fq 'android-v0.99.7.20-r185a-instant-cache' /tmp/ct99720-index.html
          grep -Fq 'instant-visual-cache-safe-revalidate' /tmp/ct99720-index.html
          grep -Fq 'cache-never-writes-never-decides-business-state' /tmp/ct99720-index.html
          grep -Fq 'old-render-path-remains-authority' /tmp/ct99720-index.html
          grep -Fq 'Pular e marcar só' /tmp/ct99720-index.html
          ! grep -Fq "web-clean-headers-profile-reflow" /tmp/ct99720-index.html
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/ct99720-index.html','utf8');
          const marker='<script data-ct-android="r185a-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('embedded r185A JS missing');
          fs.writeFileSync('/tmp/ct99720.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99720.js
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099720-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.20-r185a-instant-cache-debug
          path: |
            cinetracker-android-0.99.7.20-r185a-instant-cache-debug.apk
            android-v099720-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish Android 0.99.7.20 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES='Android 0.99.7.20 inicia a r185A Instant Cache. Home, Perfil, Descobrir e Esportes podem restaurar imediatamente o último conteúdo visual válido enquanto as mesmas autoridades atuais sincronizam em segundo plano. O cache nunca escreve no banco nem decide estado de episódio/watchlist/favoritos. Durante conteúdo stale, ações de mutação ficam temporariamente protegidas até a resposta nova. Se não existir cache, o fluxo antigo de loading continua como fallback.'
          gh release view android-v0.99.7.20 >/dev/null 2>&1 || gh release create android-v0.99.7.20 --title "CineTracker Android 0.99.7.20 — r185A Instant Cache" --notes "$NOTES"
          gh release edit android-v0.99.7.20 --title "CineTracker Android 0.99.7.20 — r185A Instant Cache" --notes "$NOTES"
          gh release upload android-v0.99.7.20 cinetracker-android-0.99.7.20-r185a-instant-cache-debug.apk android-v099720-sha256.txt --clobber
