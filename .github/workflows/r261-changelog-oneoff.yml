name: r261 changelog oneoff
on:
  push:
    branches: ['fix/r261-video-ground-truth-series-discover-detail']
permissions:
  contents: write
jobs:
  prepend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r261-video-ground-truth-series-discover-detail
      - name: Prepend r261 changelog without truncating history
        shell: bash
        env:
          R261_SECTION_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8')
          marker='## 1.0.52 — 2026-09-12 — Web r261'
          if marker not in s:
              section=base64.b64decode(os.environ['R261_SECTION_B64']).decode('utf-8')
              needle='\n\n## 1.0.51 — 2026-09-12 — Web r260'
              if needle not in s: raise SystemExit('r260 changelog anchor missing')
              p.write_text(s.replace(needle,'\n\n'+section+needle,1),encoding='utf-8')
          PY
          if git diff --quiet -- CHANGELOG.md; then exit 0; fi
          git config user.name 'Caique Rodrigues'
          git config user.email '73994301+caiqrodrigues@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'docs: prepend Web 1.0.52 r261 changelog'
          git push origin HEAD:fix/r261-video-ground-truth-series-discover-detail
