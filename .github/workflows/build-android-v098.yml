name: Build Android 0.0.98

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci-status/android-v098-trigger.txt'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v098-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v098:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark Android 0.0.98 build pending
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"pending","context":"Android 0.0.98","description":"Building CineTracker Android 0.0.98"}'
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore dedicated CineTracker signing key
        uses: actions/cache@v4
        with: { path: ~/.cinetracker/cinetracker.keystore, key: cinetracker-signing-v2 }
      - name: Initialize dedicated signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify Web 0.0.98 runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node scripts/test-hotfix13-bingers-semantics.mjs
          node scripts/test-auth-recovery-red.mjs
          node scripts/test-hotfix10-native-bridge.mjs
          grep -q '__ct98Loaded' dist/patch-v089-v098.js
          grep -q 'CineTracker • v0.0.98' dist/patch-v089-v098.js
          grep -q 'ct-backup-user' dist/patch-v089-v098.js
          grep -q 'cinetracker_profile_history_media' dist/patch-v089-v098.js
      - name: Prepare exact embedded Android 0.0.98 runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-android-hotfix2-web.mjs
          node scripts/test-android-inline-hotfix6.mjs
          grep -q "window.__ctAndroidBundle = 'v0.0.98-profile-history-backup-discover-v95-core-inline-authoritative'" apps/android/app/src/main/assets/hotfix5/index.html
          grep -q '__ct98Loaded' apps/android/app/src/main/assets/hotfix5/index.html
          grep -q 'CineTracker • v0.0.98' apps/android/app/src/main/assets/hotfix5/index.html
      - name: Build debug Android 0.0.98 APK
        working-directory: apps/android
        shell: bash
        run: gradle assembleDebug --stacktrace
      - name: Verify Android 0.0.98 APK identity and embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.0.98-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          unzip -l "$OUT" | grep -q 'assets/hotfix5/index.html'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q "window.__ctAndroidBundle = 'v0.0.98-profile-history-backup-discover-v95-core-inline-authoritative'"
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q '__ct98Loaded'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'CineTracker • v0.0.98'
          PACKAGE="$($AAPT dump badging "$OUT" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.0.98"
          test "$VERSION_CODE" = "996"
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee v098-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.0.98-debug
          path: |
            cinetracker-android-0.0.98-debug.apk
            v098-sha256.txt
          if-no-files-found: error
      - name: Publish Android 0.0.98 release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: |
          set -euo pipefail
          gh release view android-v0.0.98 >/dev/null 2>&1 || gh release create android-v0.0.98 --title "CineTracker Android 0.0.98" --notes-file docs/releases/0.0.98.md
          gh release edit android-v0.0.98 --title "CineTracker Android 0.0.98" --notes-file docs/releases/0.0.98.md
          gh release upload android-v0.0.98 cinetracker-android-0.0.98-debug.apk v098-sha256.txt --clobber
      - name: Mark Android 0.0.98 build success
        if: success()
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"Android 0.0.98","description":"0.0.98 build and release published"}'
      - name: Mark Android 0.0.98 build failure
        if: failure()
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"failure","context":"Android 0.0.98","description":"0.0.98 build failed"}'
