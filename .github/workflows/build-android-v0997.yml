name: Build Android 0.99.7.2 R3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android/0997-ui-polish-r3
    paths:
      - 'ci-status/android-v0997-trigger.txt'

permissions:
  contents: write

concurrency:
  group: cinetracker-android-v09972-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v09972:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify current Web 0.99.7 runtime
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          grep -q 'ct-web-0.99.7-r131' dist/service-worker.js
          grep -q 'v131-rich-movie-discover-six-tabs' dist/patch-v131-v0997-rich-movie-discover.js
          grep -q 'v131b-legacy-person-credit-open' dist/patch-v131b-v0997-person-credit-bridge.js
          grep -q 'v132-url-router-fullscreen-details-profile-10-more' dist/patch-v132-v0997-deeplink-pages.js
          grep -q 'v132-single-runtime-nav-integrity' dist/patch-v132-v0997-deeplink-pages.js
          grep -q 'v133-primary-single-authority-home-discover-profile' dist/patch-v133-v0997-primary-authority.js
          grep -q "\['new','Novidades'\]" dist/patch-v131-v0997-rich-movie-discover.js
          grep -q "\['anticipated','Mais Aguardados'\]" dist/patch-v131-v0997-rich-movie-discover.js
          grep -q 'v126-video3124-surgical-recovery' dist/patch-v126-v0997-video3124-recovery.js
          grep -q 'v128-settings-minimal-import-export-only' dist/patch-v128-v0997-settings-minimal-transfer.js
          grep -q 'v129-settings-real-metadata-refresh-only' dist/patch-v129-v0997-settings-real-metadata-refresh.js
          grep -q 'v130-nav-footer-stability-only' dist/patch-v130-v0997-nav-footer-stability.js
      - name: Prepare Android 0.99.7.2 R3 runtime
        run: |
          set -euo pipefail
          node scripts/prepare-android-v0997.mjs
          node scripts/test-android-v0997.mjs
      - name: Build Android 0.99.7.2 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate APK identity, runtime and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.2-r3-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          PACKAGE="$($AAPT dump badging "$OUT" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.99.7.2"
          test "$VERSION_CODE" = "9972"
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'android-v0.99.7.2-ui-polish-r3'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'v09972-android-ui-polish-r3'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'v131-rich-movie-discover-six-tabs'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'v131b-legacy-person-credit-open'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'v132-url-router-fullscreen-details-profile-10-more'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'v132-single-runtime-nav-integrity'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'v133-primary-single-authority-home-discover-profile'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'Novidades'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'Mais Aguardados'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'ct131-movie-hero'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'ct-android-cast-more'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'ct-android-actors-more'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'ct-android-action-grid'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'watch_history?select=watched_at,item_type'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q '__ctAndroid9972RepairDaily'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q "w.onclick=()=>void toggleWatchlist118(ctx,w)"
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q "m.onclick=()=>void markMovie118(ctx,m)"
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'v126-video3124-surgical-recovery'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'v128-settings-minimal-import-export-only'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'v129-settings-real-metadata-refresh-only'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'v130-nav-footer-stability-only'
          ! unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'priority=visible-posters'
          ! unzip -p "$OUT" assets/hotfix5/index.html | grep -q "if(t==='profile')return renderProfile99()"
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v09972-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.2-r3-debug
          path: |
            cinetracker-android-0.99.7.2-r3-debug.apk
            android-v09972-sha256.txt
          if-no-files-found: error
      - name: Publish Android 0.99.7.2 R3 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Android 0.99.7.2 R3 sobre o Web oficial 0.99.7 r133. Inclui deep links/hash, detalhes em tela cheia, temporadas fechadas, autoridade final de Home/Descobrir/Perfil, elenco e filmografia 10 + Ver mais, favoritos expandidos e reparos de classificação/histórico/watchlist.'
          gh release view android-v0.99.7.2 >/dev/null 2>&1 || gh release create android-v0.99.7.2 --title "CineTracker Android 0.99.7.2 R3" --notes "$NOTES"
          gh release edit android-v0.99.7.2 --title "CineTracker Android 0.99.7.2 R3" --notes "$NOTES"
          gh release upload android-v0.99.7.2 cinetracker-android-0.99.7.2-r3-debug.apk android-v09972-sha256.txt --clobber
