name: Build Android 0.99.7

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/web-android-0.99.7-ux
    paths:
      - 'ci-status/android-v0997-trigger.txt'

permissions:
  contents: write

concurrency:
  group: cinetracker-android-v0997-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Build verified Web 0.99.7 runtime
        run: |
          set -euo pipefail
          npm run build
          grep -q 'patch-v118-v0997-authoritative.js' dist/index.html
          grep -q 'ct-web-0.99.7' dist/service-worker.js
          grep -q 'v118-single-authority-profile-discover-detail' dist/patch-v118-v0997-authoritative.js
          ! grep -q 'patch-v116-v0996-authoritative.js' dist/index.html
          ! grep -q 'patch-v117-v0996-final.js' dist/index.html
          node scripts/test-web-v0997-authoritative.mjs
      - name: Prepare exact embedded Android 0.99.7 runtime
        run: |
          set -euo pipefail
          node scripts/prepare-android-v0997.mjs
          node scripts/test-android-v0997.mjs
      - name: Build Android 0.99.7 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate APK identity, runtime and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          PACKAGE="$($AAPT dump badging "$OUT" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.99.7"
          test "$VERSION_CODE" = "9970"
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'android-v0.99.7-single-authority'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'v118-single-authority-profile-discover-detail'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'cinetracker_profile_payload_v0997'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'Populares'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'Lista'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'Carrossel'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'Grade'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'Avaliações dos episódios por temporada'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'favorite_actors'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'priority=visible-posters'
          ! unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'data-ct-inline="patch-v117-v0996-final.js"'
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v0997-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7-debug
          path: |
            cinetracker-android-0.99.7-debug.apk
            android-v0997-sha256.txt
          if-no-files-found: error
      - name: Publish Android 0.99.7 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Android 0.99.7: mesma autoridade única da Web; Perfil com atividade por fuso local, atores favoritos funcionais, gráficos de avaliação das temporadas fora dos accordions e com rolagem horizontal, Descobrir compacto com filtros Todos/Séries/Filmes e Lista/Carrossel/Grade, aba Populares, exclusões estritas e enriquecimento progressivo de capas visíveis.'
          gh release view android-v0.99.7 >/dev/null 2>&1 || gh release create android-v0.99.7 --title "CineTracker Android 0.99.7" --notes "$NOTES"
          gh release edit android-v0.99.7 --title "CineTracker Android 0.99.7" --notes "$NOTES"
          gh release upload android-v0.99.7 cinetracker-android-0.99.7-debug.apk android-v0997-sha256.txt --clobber
