name: Build Android 0.99.7.35 — Profile Sports Nav

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-099735-profile-sports-nav
    paths:
      - 'apps/android/app/build.gradle'
      - 'apps/android/runtime-r207-profile-sports-nav.js'
      - 'scripts/prepare-android-v099735.mjs'
      - 'scripts/test-android-v099735.mjs'
      - '.github/workflows/build-android-v099735.yml'
      - 'scripts/prepare-android-v099734.mjs'
      - 'apps/android/runtime-r206-discover-core-events.js'
      - 'apps/web/runtime-r196-web.js'

permissions:
  contents: read

concurrency:
  group: cinetracker-android-v099735-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099735:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.35
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r207-profile-sports-nav.js
          node --check scripts/prepare-android-v099735.mjs
          node --check scripts/test-android-v099735.mjs
          node scripts/prepare-android-v099735.mjs
          node scripts/test-android-v099735.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r207-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r207 embedded JS missing');
          fs.writeFileSync('/tmp/ct99735-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99735-prebuild.js

      - name: Build Android 0.99.7.35 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate APK identity, runtime, signing and digest
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.35-profile-sports-nav-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.35"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "10005"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99735-index.html
          for marker in \
            'android-v0.99.7.35-r207-profile-sports-nav' \
            'profile-first-tap-shell-compact-sports-tools' \
            'profile-first-before-sports' \
            'compact-mobile-search-panel' \
            'disabled-no-render-suppression' \
            'discover-core-events-three-cards' \
            'core-document-click-no-android-capture' \
            'calc((100% - 16px)/3)' \
            'detail-watchlist-toggle' \
            'embedded-apk-never-reloads-from-web-release-json'; do
            grep -Fq "$marker" /tmp/ct99735-index.html
          done
          ! grep -Fq 'discover-state-aware-foreground-throttle' /tmp/ct99735-index.html
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/ct99735-index.html','utf8');
          const marker='<script data-ct-android="r207-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('embedded r207 JS missing');
          fs.writeFileSync('/tmp/ct99735.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99735.js
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099735-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.35-profile-sports-nav-debug
          path: |
            cinetracker-android-0.99.7.35-profile-sports-nav-debug.apk
            android-v099735-sha256.txt
          if-no-files-found: error
          retention-days: 14
