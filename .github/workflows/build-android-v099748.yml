name: Build Android 0.99.7.48

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-099748-top10-authority-horizontal-discover
    paths:
      - 'apps/android/runtime-r220-top10-authority-horizontal-discover.js'
      - 'apps/android/app/build.gradle'
      - 'scripts/prepare-android-v099748.mjs'
      - 'scripts/test-android-v099748.mjs'
      - '.github/workflows/build-android-v099748.yml'

permissions:
  contents: read

concurrency:
  group: cinetracker-android-v099748-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.48
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r220-top10-authority-horizontal-discover.js
          node --check scripts/prepare-android-v099748.mjs
          node --check scripts/test-android-v099748.mjs
          node scripts/prepare-android-v099748.mjs
          node scripts/test-android-v099748.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r220-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r220 embedded JS missing');
          fs.writeFileSync('/tmp/ct99748-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99748-prebuild.js

      - name: Build Android APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate Android APK
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.48-top10-horizontal-library-media-debug.apk"
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.48"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "10018"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99748-index.html
          for marker in \
            'android-v0.99.7.48-r220-top10-authority-horizontal-discover' \
            'r214-selector-ticket-r217-authoritative-render' \
            'r217-library-behavior-no-r219-synthetic-fallback' \
            'display:flex!important;flex:1 1 auto!important;flex-wrap:nowrap!important' \
            'overflow-x:auto!important' \
            'synchronous-own-shell-tokenized-provider-flow' \
            'remove-cinetracker-person-header-direct-photo-bio' \
            'whole-season-one-screen-swipe-season-only'; do
            grep -Fq "$marker" /tmp/ct99748-index.html
          done
          ! grep -Fq 'ct219-manual-cover' /tmp/ct99748-index.html
          ! grep -Fq 'negative-id-resolve-or-local-detail' /tmp/ct99748-index.html
          ! grep -Fq "tab==='top10'&&typeof window.ctR217RenderTop10==='function'?window.ctR217RenderTop10()" /tmp/ct99748-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          stat -c '%s' "$OUT" | tee android-v099748-size.txt
          sha256sum "$OUT" | tee android-v099748-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.48
          path: |
            cinetracker-android-0.99.7.48-top10-horizontal-library-media-debug.apk
            android-v099748-sha256.txt
            android-v099748-size.txt
          if-no-files-found: error
          retention-days: 14
