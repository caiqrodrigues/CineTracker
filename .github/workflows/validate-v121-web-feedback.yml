name: Validate CineTracker 1.0.21 Web Feedback
on:
  push:
    branches: [fix/1.0.21-stable-web-authority]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate source contract
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.21"' package.json
          grep -Fq '"version": "1.0.21"' apps/web/package.json
          grep -Fq 'build-r227.mjs' apps/web/package.json
          node --check apps/web/runtime-r227-v121-stable-web-authority.js
          node --check apps/web/build-r227.mjs
          node --check scripts/test-v121-web-feedback-browser.mjs
          grep -Fq 'jwt-refresh-retry-dashboard-fallback' apps/web/runtime-r227-v121-stable-web-authority.js
          grep -Fq 'no-premature-empty-final-settle' apps/web/runtime-r227-v121-stable-web-authority.js
          grep -Fq 'direct-grid-children-canonical-actions' apps/web/runtime-r227-v121-stable-web-authority.js
          grep -Fq 'icon-only-stable-after-legacy-toggle' apps/web/runtime-r227-v121-stable-web-authority.js
      - name: Reproduce Web feedback failures in Chromium
        run: node scripts/test-v121-web-feedback-browser.mjs
      - name: Preserve Pra Voce affinity
        run: node scripts/test-v118-foryou-affinity-profile-browser.mjs
      - name: Preserve Watchlist/F1 authority
        run: node scripts/test-v116-final-authorities-browser.mjs
      - name: Build Web 1.0.21
        run: npm run build
      - name: Inspect Web bundle
        run: |
          set -euo pipefail
          B=apps/web/dist/app-v227.js
          test -f "$B"
          grep -Fq "const REVISION='r227-official-1.0.21';" "$B"
          grep -Fq "window.__ctR227V121='stable-web-authority-auth-refresh-no-premature-empty'" "$B"
          grep -Fq "ct-web-1.0.21-r227" apps/web/dist/service-worker.js
          grep -Fq 'jwt-refresh-retry-dashboard-fallback' "$B"
          grep -Fq 'direct-grid-children-canonical-actions' "$B"
