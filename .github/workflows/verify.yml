name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build exact CineTracker Web r165 artifact used by Vercel
        working-directory: apps/web
        run: npm run build
      - name: Assert single r165 authority and restored requested behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v165.js
          test "$(grep -o '<script' apps/web/dist/index.html | wc -l)" -eq 1
          ! grep -Eq 'patch-v[0-9]|hotfix' apps/web/dist/index.html
          test "$(find apps/web/dist -maxdepth 1 -type f -name 'patch-v*.js' | wc -l)" -eq 0
          test ! -f apps/web/dist/app-v162.js
          test ! -f apps/web/dist/app-v163.js
          test ! -f apps/web/dist/app-v164.js
          grep -Fq "single-clean-runtime" apps/web/dist/app-v165.js
          grep -Fq "r165-r163-restored-favorites" apps/web/dist/app-v165.js
          grep -Fq "history_missing_episodes" apps/web/dist/app-v165.js
          grep -Fq "is_caught_up" apps/web/dist/app-v165.js
          grep -Fq "home+history+stats" apps/web/dist/app-v165.js
          grep -Fq "Da sua Watchlist" apps/web/dist/app-v165.js
          grep -Fq "watchlist_movie" apps/web/dist/app-v165.js
          grep -Fq "watchlist_series" apps/web/dist/app-v165.js
          grep -Fq "watchlist_anime" apps/web/dist/app-v165.js
          grep -Fq "data-home-mark-episode" apps/web/dist/app-v165.js
          grep -Fq "Minha Watchlist" apps/web/dist/app-v165.js
          grep -Fq "ESPN + TheSportsDB" apps/web/dist/app-v165.js
          grep -Fq "home+discover+profile+sports" apps/web/dist/app-v165.js
          grep -Fq "extended-date-range" apps/web/dist/app-v165.js
          grep -Fq "Buscar time, jogo ou competição" apps/web/dist/app-v165.js
          grep -Fq "data-sports-date" apps/web/dist/app-v165.js
          grep -Fq "section-more" apps/web/dist/app-v165.js
          grep -Fq "cinetracker_sport_favorite_events_v2" apps/web/dist/app-v165.js
          grep -Fq "data-ct165-open-favorite" apps/web/dist/app-v165.js
          grep -Fq "Ver eventos" apps/web/dist/app-v165.js
          grep -Fq '"revision":"r165-r163-restored-favorites"' apps/web/dist/release.json
          grep -Fq '"outputDirectory": "dist"' apps/web/vercel.json
      - name: Upload exact r165 web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-web-r165-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  android_0997_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.3 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.3'" apps/android/app/build.gradle
          grep -q 'versionCode 9973' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.3-r151-library-sync' scripts/prepare-android-v09973.mjs
          grep -q 'window.__ct0997R151Loaded' scripts/prepare-android-v09973.mjs
          grep -q 'cinetracker:app-foreground' scripts/test-android-v09973.mjs
          grep -q 'android:id="@+id/nav_history"' apps/android/app/src/main/res/layout/activity_main.xml
          grep -q 'android:visibility="gone"' apps/android/app/src/main/res/layout/activity_main.xml
          node --check scripts/prepare-android-v09973.mjs
          node --check scripts/test-android-v09973.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Production domain serves r165
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r165-r163-restored-favorites"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v165.js?ct=$(date +%s%N)" || true)"
              if grep -Fq "const REVISION='r165-r163-restored-favorites';" <<<"$JS" && grep -Fq "home+discover+profile+sports" <<<"$JS" && grep -Fq "cinetracker_sport_favorite_events_v2" <<<"$JS"; then
                echo 'PRODUCTION_R165_OK restored-r163+favorite-events'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production domain did not serve r165-r163-restored-favorites in time.' >&2
          exit 1
