name: Verify Web 1.0.176 r385 Home and Pra Voce Only
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r385:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and scoped regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check runtime-r385-home-foryou-owner.js
          node --check build-r385.mjs
          node --check test-r385-browser.mjs
          node build-r385-official.mjs
          CT_R385_SKIP_BUILD=1 node test-r385.mjs
          CT_R385_SKIP_BUILD=1 node test-r385-browser.mjs
          node --check dist/app-v385.js
          grep -Fq 'ct-web-1.0.176-r385' dist/service-worker.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r385, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.176"' <<<"$BODY" && grep -Fq '"revision": "r385-official-1.0.176"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v385.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR385Marker='home-independent-series-history-movies+foryou-v385-strict+actions-final'" <<<"$JS" && grep -Fq 'app-v385.js' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
