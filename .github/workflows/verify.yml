name: Verify Web 1.0.199 r408 Home + Pra Voce
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r408:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and scoped regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check runtime-r408-home-discover-owner.js
          node --check build-r408.mjs
          node --check build-r408-official.mjs
          node --check test-r408.mjs
          node --check test-r408-browser.mjs
          node build-r408-official.mjs
          node test-r408.mjs
          node test-r408-browser.mjs
          node --check dist/app-v408.js
          grep -Fq "window.__ctR408Marker='home-semantic-one-shot+movie-direct-loader+foryou-self-heal-actions'" dist/app-v408.js
          grep -Fq "cinetracker_home_movies_v405" dist/app-v408.js
          grep -Fq "cinetracker_discover_foryou_v396" dist/app-v408.js
          grep -Fq "scheduleOwnerCheck" dist/app-v408.js
          grep -Fq "baseLoadMovies" dist/app-v408.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r408, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.199"' <<<"$BODY" && grep -Fq '"revision": "r408-official-1.0.199"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v408.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR408Marker='home-semantic-one-shot+movie-direct-loader+foryou-self-heal-actions'" <<<"$JS" && grep -Fq 'cinetracker_home_movies_v405' <<<"$JS" && grep -Fq 'app-v408.js' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
