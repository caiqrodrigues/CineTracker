name: Verify Web 1.0.44 r253 Single Authority Live Data

on:
  push:
    branches: [main, 'fix/r253-single-authority-live-data']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_44_r253:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax r253 release chain
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.44"' package.json
          grep -Fq '"version": "1.0.44"' apps/web/package.json
          node --check apps/web/runtime-r253-single-authority-live-data.js
          node --check apps/web/build-r253.mjs
          node --check apps/web/build-r253-official.mjs
          node --check apps/web/test-r253.mjs
          node --check apps/web/test-r253-algorithms.mjs
          node --check apps/web/test-r253-browser.mjs
          node --check scripts/test-r253-exact-bundle-browser.mjs
      - name: Build official r253
        working-directory: apps/web
        run: node build-r253-official.mjs
      - name: Static authority regression r253
        working-directory: apps/web
        run: node test-r253.mjs
      - name: Logic regressions r253
        working-directory: apps/web
        run: node test-r253-algorithms.mjs
      - name: Chromium single-authority behavior r253
        working-directory: apps/web
        run: node test-r253-browser.mjs
      - name: Exact final bundle boot r253
        run: node scripts/test-r253-exact-bundle-browser.mjs
      - name: Final bundle identity r253
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v253.js
          grep -Fq "window.__ctWebBuild='1.0.44';window.__ctOfficialVersion='1.0.44';" dist/app-v253.js
          grep -Fq "const REVISION='r253-official-1.0.44';" dist/app-v253.js
          grep -Fq "window.__ctR253='single-authority-live-data'" dist/app-v253.js
          grep -Fq "window.__ctR253Home='live-payload-native-ui-no-age-only-dust'" dist/app-v253.js
          grep -Fq "window.__ctR253Discover='single-renderer-nine-tabs-generation-safe'" dist/app-v253.js
          grep -Fq "window.__ctR253Sports='single-renderer-four-tabs-canonical-history'" dist/app-v253.js
          grep -Fq "window.__ctR253Profile='approved-layout-live-data-patch'" dist/app-v253.js
          grep -Fq 'window.__ctR253LegacyR239ObserverDisabled=true' dist/app-v253.js
          grep -Fq 'window.__ctR253R252QueueClassifierDisabled=true' dist/app-v253.js
          grep -Fq 'window.__ctR253R252PaintClassifierDisabled=true' dist/app-v253.js
          grep -Fq 'cinetracker_home_live_v0997_r3' dist/app-v253.js
          grep -Fq 'cinetracker_sports_payload_v1' dist/app-v253.js
          grep -Fq 'cinetracker_sport_mark_watched_v1' dist/app-v253.js
          grep -Fq 'cinetracker_profile_payload_v0997_r2' dist/app-v253.js
          grep -Fq 'cinetracker_sport_stats_v1' dist/app-v253.js
          grep -Fq 'shown_recommendations' dist/app-v253.js
          ! grep -Fq "new MutationObserver(queue239).observe(q('#app')" dist/app-v253.js
          ! grep -Fq "window.__ctR251='video-ground-truth-direct-renderers'" dist/app-v253.js
          ! grep -Fq 'cinetracker_sports_events_v0997' dist/app-v253.js
          grep -Fq 'app-v253.js' dist/index.html
          grep -Fq 'app-v253.css' dist/index.html
          grep -Fq '"version": "1.0.44"' dist/release.json
          grep -Fq '"revision": "r253-official-1.0.44"' dist/release.json
          grep -Fq '.ct248-f1hub' dist/app-v253.css
          grep -Fq 'overflow-x:clip!important' dist/app-v253.css

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_44_r253]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.44 r253
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.44"' <<<"$BODY" && grep -Fq '"revision": "r253-official-1.0.44"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v253.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v253.css?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR253='single-authority-live-data'" <<<"$JS" && grep -Fq "window.__ctR253Sports='single-renderer-four-tabs-canonical-history'" <<<"$JS" && grep -Fq "window.__ctR253Discover='single-renderer-nine-tabs-generation-safe'" <<<"$JS" && grep -Fq 'cinetracker_sports_payload_v1' <<<"$JS" && grep -Fq 'cinetracker_home_live_v0997_r3' <<<"$JS" && ! grep -Fq "new MutationObserver(queue239).observe(q('#app')" <<<"$JS" && ! grep -Fq 'cinetracker_sports_events_v0997' <<<"$JS" && grep -Fq '.ct248-f1hub' <<<"$CSS" && grep -Fq 'app-v253.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
