name: Verify Web 1.0.29

on:
  push:
    branches: [main, 'fix/1.0.29-r237-real-ui-authority']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_29:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax r237
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.29"' apps/web/package.json
          node --check apps/web/runtime-r237-real-ui-authority.js
          node --check apps/web/build-r237.mjs
          node --check apps/web/test-r237.mjs
          node --check scripts/test-r237-real-ui-browser.mjs
      - name: Build r237
        working-directory: apps/web
        run: node build-r237.mjs
      - name: Static invariants r237
        working-directory: apps/web
        run: node test-r237.mjs
      - name: Final bundle identity r237
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v237.js
          grep -Fq "window.__ctWebBuild='1.0.29';window.__ctOfficialVersion='1.0.29';" dist/app-v237.js
          grep -Fq "const REVISION='r237-official-1.0.29';" dist/app-v237.js
          grep -Fq "window.__ctR237='real-ui-single-finalizer'" dist/app-v237.js
          grep -Fq '"version": "1.0.29"' dist/release.json
          grep -Fq '"revision": "r237-official-1.0.29"' dist/release.json
      - name: Chromium r237 real UI and Profile order
        run: node scripts/test-r237-real-ui-browser.mjs

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_29]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Official production serves 1.0.29 r237
        run: |
          set -euo pipefail
          for i in $(seq 1 150); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.29"' <<<"$BODY" && grep -Fq '"revision": "r237-official-1.0.29"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v237.js?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR237='real-ui-single-finalizer'" <<<"$JS" && grep -Fq "window.__ctR237Profile='exact-requested-stat-order'" <<<"$JS"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1