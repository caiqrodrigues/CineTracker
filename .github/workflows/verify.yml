name: Verify Web 1.0.188 r397 Home + Pra Voce
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r397:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and scoped regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check runtime-r388-home-foryou-final.js
          node --check runtime-r396-discover-foryou-fast.js
          node --check runtime-r397-home-discover-recovery.js
          node --check build-r397.mjs
          node --check test-r397.mjs
          node --check test-r397-browser.mjs
          node build-r397-official.mjs
          CT_R397_SKIP_BUILD=1 node test-r397.mjs
          CT_R397_SKIP_BUILD=1 node test-r397-browser.mjs
          node --check dist/app-v397.js
          grep -Fq "window.__ctR397Marker='home-entry+movies-render+recurring-sports+foryou-entrypoint-recovery'" dist/app-v397.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r397, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.188"' <<<"$BODY" && grep -Fq '"revision": "r397-official-1.0.188"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v397.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR397Marker='home-entry+movies-render+recurring-sports+foryou-entrypoint-recovery'" <<<"$JS" && grep -Fq 'app-v397.js' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
