name: Verify

on:
  push:
    branches: [main, recovery/v095-core-hotfix9-stability]
  pull_request:

permissions:
  contents: read

jobs:
  web_stability:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify source invariants
        run: npm run verify
      - name: Build HOTFIX9 stability Web runtime
        run: npm run build
      - name: Execute auth recovery runtime suite
        run: node scripts/test-auth-recovery-red.mjs
      - name: Execute startup and navigation stability in real Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node scripts/test-real-browser-p0.mjs
          node scripts/test-real-browser-stability-hotfix9.mjs
      - name: Assert HOTFIX9 shipped runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -q "window.__ctAuthRecovery = 'v97-hotfix6-startup'" dist/index.html
          grep -q "window.__ctP0SessionReset = 'hotfix7-once'" dist/index.html
          grep -q 'cinetracker_p0_session_reset_hotfix7' dist/index.html
          grep -q 'patch-v067-v095.js' dist/index.html
          grep -q 'const media = \[' dist/index.html
          grep -q 'void bootstrap();' dist/index.html
          grep -q 'ctFetchWithTimeout' dist/index.html
          grep -q 'ctLooksLikeJwt' dist/index.html
          ! grep -q 'patch-v068-v097.js' dist/index.html
          ! grep -q 'patch-v068-v097-observer-guard.js' dist/index.html
          ! grep -q 'auth-preboot-fix7.js' dist/index.html
          ! grep -q 'patch-v073-v097-fix7.js' dist/index.html
