name: Verify Web 1.0.65 r274 Home Timeout History Metadata

on:
  push:
    branches: [main, 'fix/r274-home-timeout-history-metadata']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_65_r274:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r274
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.65"' package.json
          grep -Fq '"version": "1.0.65"' apps/web/package.json
          grep -Fq 'build-r274-official.mjs' apps/web/package.json
          grep -Fq '## 1.0.65 — 2026-09-14 — Web r274' CHANGELOG.md
          grep -Fq 'Web 1.0.65 / r274' README.md
          test -f apps/web/build-r274.mjs
          test -f apps/web/build-r274-official.mjs
          test -f apps/web/test-r274.mjs
          test -f apps/web/test-r274-browser.mjs
          test -f scripts/test-r274-exact-bundle-browser.mjs
          test -f supabase/migrations/20260914172954_r274_home_payload_timeout_history_metadata.sql
          test -f supabase/migrations/20260914173231_r274_history_rewatch_rpc.sql
      - name: Syntax r274 release chain
        run: |
          set -euo pipefail
          node --check apps/web/build-r274.mjs
          node --check apps/web/build-r274-official.mjs
          node --check apps/web/test-r274.mjs
          node --check apps/web/test-r274-browser.mjs
          node --check scripts/test-r274-exact-bundle-browser.mjs
      - name: Build official r274
        working-directory: apps/web
        run: node build-r274-official.mjs
      - name: Static and migration regressions r274
        working-directory: apps/web
        run: node test-r274.mjs
      - name: Chromium Home history metadata actions r274
        working-directory: apps/web
        run: node test-r274-browser.mjs
      - name: Exact final bundle boot r274
        run: node scripts/test-r274-exact-bundle-browser.mjs
      - name: Final bundle identity r274
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v274.js
          grep -Fq "window.__ctWebBuild='1.0.65';window.__ctOfficialVersion='1.0.65';" dist/app-v274.js
          grep -Fq "const REVISION='r274-official-1.0.65';" dist/app-v274.js
          grep -Fq "window.__ctR274='home-r6-fast+ascending-history+rich-meta+rewatch'" dist/app-v274.js
          grep -Fq "rpc('cinetracker_profile_home_payload_v0997_r6'" dist/app-v274.js
          grep -Fq 'p_history_limit:20,p_series_limit:120,p_movie_limit:120' dist/app-v274.js
          grep -Fq "rpc('cinetracker_rewatch_history_v1'" dist/app-v274.js
          grep -Fq 'paintHome=ct274PaintHome;renderHome=ct274RenderHome;' dist/app-v274.js
          grep -Fq 'app-v274.js' dist/index.html
          grep -Fq 'app-v274.css' dist/index.html
          grep -Fq '"version": "1.0.65"' dist/release.json
          grep -Fq '"revision": "r274-official-1.0.65"' dist/release.json
          grep -Fq '"home_payload_source": "cinetracker_profile_home_payload_v0997_r6"' dist/release.json
          grep -Fq '"home_history_limit": 20' dist/release.json
          grep -Fq '"home_history_order": "oldest-top-newest-bottom"' dist/release.json
          grep -Fq '"home_rewatch": true' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.65-r274';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_65_r274]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.65 r274
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.65"' <<<"$BODY" && grep -Fq '"revision": "r274-official-1.0.65"' <<<"$BODY" && grep -Fq '"home_payload_source": "cinetracker_profile_home_payload_v0997_r6"' <<<"$BODY" && grep -Fq '"home_history_order": "oldest-top-newest-bottom"' <<<"$BODY" && grep -Fq '"home_rewatch": true' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v274.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR274='home-r6-fast+ascending-history+rich-meta+rewatch'" <<<"$JS" && grep -Fq "rpc('cinetracker_profile_home_payload_v0997_r6'" <<<"$JS" && grep -Fq "rpc('cinetracker_rewatch_history_v1'" <<<"$JS" && grep -Fq 'app-v274.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
