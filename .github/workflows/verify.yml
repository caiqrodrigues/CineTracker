name: Verify Web 1.0.109 r318 Discover Only

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_109_r318:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r318
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.109"' package.json
          grep -Fq '"version": "1.0.109"' apps/web/package.json
          grep -Fq 'build-r318-official.mjs' apps/web/package.json
          test -f apps/web/build-r318.mjs
          test -f apps/web/build-r318-official.mjs
          test -f apps/web/runtime-r318-discover-final.js
          test -f apps/web/test-r318.mjs
          test -f apps/web/test-r318-browser.mjs
      - name: Syntax r318 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r318-discover-final.js
          node --check apps/web/build-r318.mjs
          node --check apps/web/build-r318-official.mjs
          node --check apps/web/test-r318.mjs
          node --check apps/web/test-r318-browser.mjs
      - name: Regression suite through r318
        working-directory: apps/web
        run: npm run verify
      - name: Final bundle identity r318
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r318-official.mjs
          node --check dist/app-v318.js
          CT_R318_SKIP_BUILD=1 node test-r318.mjs
          test -f dist/app-v318.js
          test -f dist/app-v318.css
          grep -Fq 'app-v318.js' dist/index.html
          grep -Fq 'app-v318.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.109'
            && r.revision==='r318-official-1.0.109'
            && r.discover_tabs===9
            && r.discover_foryou_filters==='all+movies+series+anime'
            && r.discover_top10==='providers+series+movies+strict-personal-exclusion'
            && r.discover_public_exclusion==='seen+watchlist+progress+up-to-date+alias-before-markup'
            && r.discover_calendar==='watchlist-exception-preserved'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_109_r318, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.109 r318
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.109"' <<<"$BODY" \
              && grep -Fq '"revision": "r318-official-1.0.109"' <<<"$BODY" \
              && grep -Fq '"discover_foryou_filters": "all+movies+series+anime"' <<<"$BODY" \
              && grep -Fq '"discover_top10": "providers+series+movies+strict-personal-exclusion"' <<<"$BODY" \
              && grep -Fq '"discover_public_exclusion": "seen+watchlist+progress+up-to-date+alias-before-markup"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v318.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR318='discover-foryou-filters+strict-all-public+strict-top10'" <<<"$JS" \
                && grep -Fq 'data-ct318-fy-kind' <<<"$JS" \
                && grep -Fq 'app-v318.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=7500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
