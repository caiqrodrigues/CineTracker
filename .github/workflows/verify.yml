name: Verify Web 1.0.55 r264 Home Watched Discover Sports Detail Scroll

on:
  push:
    branches: [main, 'fix/r264-home-watched-discover-sports-detail-scroll']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_55_r264:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r264
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.55"' package.json
          grep -Fq '"version": "1.0.55"' apps/web/package.json
          test -f apps/web/runtime-r264-home-watched-discover-sports-detail-scroll.js
          test -f apps/web/build-r264.mjs
          test -f apps/web/build-r264-official.mjs
          test -f apps/web/test-r264.mjs
          test -f apps/web/test-r264-algorithms.mjs
          test -f apps/web/test-r264-browser.mjs
          test -f scripts/test-r264-exact-bundle-browser.mjs
      - name: Syntax r264 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r264-home-watched-discover-sports-detail-scroll.js
          node --check apps/web/build-r264.mjs
          node --check apps/web/build-r264-official.mjs
          node --check apps/web/test-r264.mjs
          node --check apps/web/test-r264-algorithms.mjs
          node --check apps/web/test-r264-browser.mjs
          node --check scripts/test-r264-exact-bundle-browser.mjs
      - name: Build official r264
        working-directory: apps/web
        run: node build-r264-official.mjs
      - name: Static authority regression r264
        working-directory: apps/web
        run: node test-r264.mjs
      - name: Logic regressions r264
        working-directory: apps/web
        run: node test-r264-algorithms.mjs
      - name: Chromium video regressions mobile r264
        working-directory: apps/web
        run: node test-r264-browser.mjs
      - name: Exact final bundle boot r264
        run: node scripts/test-r264-exact-bundle-browser.mjs
      - name: Final bundle identity r264
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v264.js
          grep -Fq "window.__ctWebBuild='1.0.55';window.__ctOfficialVersion='1.0.55';" dist/app-v264.js
          grep -Fq "const REVISION='r264-official-1.0.55';" dist/app-v264.js
          grep -Fq "window.__ctR264='home-watched-stable-discover-single-sports-order-detail-rails'" dist/app-v264.js
          grep -Fq "window.__ctR264Home='stable-tab+side-watched-episode-movie+canonical-mark-watch'" dist/app-v264.js
          grep -Fq "window.__ctR264Discover='single-nine-tabs+canonical-exclusions+local-rails+top10-streaming'" dist/app-v264.js
          grep -Fq "window.__ctR264Sports='f1-first-synchronous-order+watched-panel-persistent'" dist/app-v264.js
          grep -Fq "window.__ctR264Detail='generic-season-episode-chart-related-similar-cast-local-x'" dist/app-v264.js
          grep -Fq 'cinetracker_mark_watch_v0994' dist/app-v264.js
          grep -Fq 'cinetracker_profile_media_dashboard_v0991' dist/app-v264.js
          grep -Fq 'cinetracker_watchlist_full_v119' dist/app-v264.js
          grep -Fq 'window.__ctR263EnhanceF1Watch=enhanceF1Watch263' dist/app-v264.js
          grep -Fq '.ct264-home-action-row' dist/app-v264.css
          grep -Fq '.ct264-local-x' dist/app-v264.css
          grep -Fq 'app-v264.js' dist/index.html
          grep -Fq 'app-v264.css' dist/index.html
          ! grep -Fq 'app-v263.js' dist/index.html
          grep -Fq '"version": "1.0.55"' dist/release.json
          grep -Fq '"revision": "r264-official-1.0.55"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.55-r264';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_55_r264]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.55 r264
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.55"' <<<"$BODY" && grep -Fq '"revision": "r264-official-1.0.55"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v264.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v264.css?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR264='home-watched-stable-discover-single-sports-order-detail-rails'" <<<"$JS" && grep -Fq "window.__ctR264Home='stable-tab+side-watched-episode-movie+canonical-mark-watch'" <<<"$JS" && grep -Fq "window.__ctR264Discover='single-nine-tabs+canonical-exclusions+local-rails+top10-streaming'" <<<"$JS" && grep -Fq "window.__ctR264Sports='f1-first-synchronous-order+watched-panel-persistent'" <<<"$JS" && grep -Fq '.ct264-home-action-row' <<<"$CSS" && grep -Fq '.ct264-local-x' <<<"$CSS" && grep -Fq 'app-v264.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
