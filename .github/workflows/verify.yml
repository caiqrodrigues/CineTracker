name: Verify Web 1.0.116 r325 Home Episode Sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_116_r325:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r325
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.116"' package.json
          grep -Fq '"version": "1.0.116"' apps/web/package.json
          grep -Fq 'build-r325-official.mjs' apps/web/package.json
          test -f apps/web/build-r325.mjs
          test -f apps/web/build-r325-official.mjs
          test -f apps/web/runtime-r325-home-episode-sync.js
          test -f apps/web/test-r325.mjs
          test -f apps/web/test-r325-browser.mjs
          test -f supabase/migrations/20260921020500_r325_home_history_episode_sync.sql
          test -f supabase/functions/ct-refresh-tv-state-user/index.ts
      - name: Syntax r325 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r325-home-episode-sync.js
          node --check apps/web/build-r325.mjs
          node --check apps/web/build-r325-official.mjs
          node --check apps/web/test-r325.mjs
          node --check apps/web/test-r325-browser.mjs
          grep -Fq "next&&next<=today()" supabase/functions/ct-refresh-tv-state-user/index.ts
          grep -Fq "6*60*60*1000" supabase/functions/ct-refresh-tv-state-user/index.ts
      - name: Focused r325 browser gate
        working-directory: apps/web
        run: npm run test:r325:browser
      - name: Regression suite through r325
        working-directory: apps/web
        run: npm run verify
      - name: Final bundle identity r325
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r325-official.mjs
          node --check dist/app-v325.js
          CT_R325_SKIP_BUILD=1 node test-r325.mjs
          grep -Fq 'app-v325.js' dist/index.html
          grep -Fq 'app-v325.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.116'
            && r.revision==='r325-official-1.0.116'
            && r.home_history_authority==='cinetracker_home_history_v324'
            && r.home_series_watch_state==='cinetracker_home_series_watch_state_v2'
            && r.home_episode_metadata_refresh==='ct-refresh-tv-state-user'
            && r.home_episode_live_reconcile==='tmdb-show+season-current-date'
            && r.discover_filter_authority==='cinetracker_discover_filter_v324'
            && r.discover_foryou_actions==='watchlist+seen+swap-single-row-compact'
            && r.profile_watchlist_counts==='rpc-exact-series+movie-counts'
            && r.web_version_ui==='1.0.116+r325-official-1.0.116'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_116_r325, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.116 r325
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.116"' <<<"$BODY" \
              && grep -Fq '"revision": "r325-official-1.0.116"' <<<"$BODY" \
              && grep -Fq '"home_history_authority": "cinetracker_home_history_v324"' <<<"$BODY" \
              && grep -Fq '"home_series_watch_state": "cinetracker_home_series_watch_state_v2"' <<<"$BODY" \
              && grep -Fq '"home_episode_metadata_refresh": "ct-refresh-tv-state-user"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v325.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR325Marker='home-history-authority+watch-state-v2+live-tv-refresh+new-episode'" <<<"$JS" \
                && grep -Fq 'cinetracker_home_series_watch_state_v2' <<<"$JS" \
                && grep -Fq 'ct-refresh-tv-state-user' <<<"$JS" \
                && grep -Fq 'cinetracker_discover_filter_v324' <<<"$JS" \
                && grep -Fq 'app-v325.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=8000 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" \
                  && grep -Fq 'v1.0.116' <<<"$DOM" \
                  && grep -Fq 'r325-official-1.0.116' <<<"$DOM" \
                  && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
