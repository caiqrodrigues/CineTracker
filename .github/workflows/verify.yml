name: Verify Web 0.3.32 r505
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web_r505:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and Home Movies Watchlist/sticky-tabs gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v505.js
          grep -Fq "window.__ctR505Marker='home-movies-nonempty-retry+sticky-home-tabs+r504-pointer-preserved'" apps/web/dist/app-v505.js
          grep -Fq 'ct497-boot' apps/web/dist/index.html
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r505, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r505 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
            if grep -Fq '"version": "0.3.32"' <<<"$BODY" && grep -Fq '"revision": "r505-official-0.3.32"' <<<"$BODY" && grep -Fq 'app-v505.js?ct=r505-official-0.3.32' <<<"$HTML"; then exit 0; fi
            if [ "$i" -eq 240 ]; then exit 1; fi
            sleep 5
          done
