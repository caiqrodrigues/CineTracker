name: Verify Web 0.3.56 r529
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web_r529:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r529 scoped behavior gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v529.js
          grep -Fq "window.__ctR529Marker='home-normal-flow+main-anchor+single-f1-ufc-wwe-opener'" apps/web/dist/app-v529.js
          grep -Fq "window.__ctR513SeriesScreenMarker='r520-three-special-series-full-screen-owner'" apps/web/dist/app-v529.js
          ! grep -Fq "window.__ctR524SpecialOpenMarker='direct-special-card-owner-no-route-gate'" apps/web/dist/app-v529.js
          ! grep -Fq "window.__ctR527Marker='home-v527-live-status+movies-real-renderer+discover-10x10-audited+special-pointerdown+f1-gp-detail'" apps/web/dist/app-v529.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r529, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r529 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "0.3.56"' <<<"$BODY" && grep -Fq '"revision": "r529-official-0.3.56"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v529.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR529Marker='home-normal-flow+main-anchor+single-f1-ufc-wwe-opener'" <<<"$JS" && grep -Fq 'app-v529.js' <<<"$HTML"; then exit 0; fi
            fi
            [ "$i" -eq 240 ] && exit 1
            sleep 5
          done
