name: Verify Web 1.0.60 r269 Home History + Inline Watch

on:
  push:
    branches: [main, 'fix/r269-home-history-inline-watch']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_60_r269:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r269
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.60"' package.json
          grep -Fq '"version": "1.0.60"' apps/web/package.json
          grep -Fq 'build-r269-official.mjs' apps/web/package.json
          test -f apps/web/build-r269.mjs
          test -f apps/web/build-r269-official.mjs
          test -f apps/web/test-r269.mjs
          test -f apps/web/test-r269-browser.mjs
          test -f scripts/test-r269-exact-bundle-browser.mjs
      - name: Syntax r269 release chain
        run: |
          set -euo pipefail
          node --check apps/web/build-r269.mjs
          node --check apps/web/build-r269-official.mjs
          node --check apps/web/test-r269.mjs
          node --check apps/web/test-r269-browser.mjs
          node --check scripts/test-r269-exact-bundle-browser.mjs
      - name: Build official r269
        working-directory: apps/web
        run: node build-r269-official.mjs
      - name: Static regressions r269
        working-directory: apps/web
        run: node test-r269.mjs
      - name: Chromium video regressions r269
        working-directory: apps/web
        run: node test-r269-browser.mjs
      - name: Exact final bundle boot r269
        run: node scripts/test-r269-exact-bundle-browser.mjs
      - name: Final bundle identity r269
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v269.js
          grep -Fq "window.__ctWebBuild='1.0.60';window.__ctOfficialVersion='1.0.60';" dist/app-v269.js
          grep -Fq "const REVISION='r269-official-1.0.60';" dist/app-v269.js
          grep -Fq "window.__ctR269='video-history-r3+series-watch-inline'" dist/app-v269.js
          grep -Fq "rpc('cinetracker_home_live_v0997_r3'" dist/app-v269.js
          grep -Fq 'function ct269RepairSeriesWatch()' dist/app-v269.js
          grep -Fq 'function ct269PaintHistory()' dist/app-v269.js
          grep -Fq "window.__ctR267Discover='atomic-tabs+recursive-personal-exclusions'" dist/app-v269.js
          grep -Fq "window.__ctR267Detail='r169-rich-producer-local-x'" dist/app-v269.js
          grep -Fq "window.__ctR267Sports='r266-stable-preserved'" dist/app-v269.js
          grep -Fq 'app-v269.js' dist/index.html
          grep -Fq 'app-v269.css' dist/index.html
          ! grep -Fq 'app-v268.js' dist/index.html
          grep -Fq '"version": "1.0.60"' dist/release.json
          grep -Fq '"revision": "r269-official-1.0.60"' dist/release.json
          grep -Fq '"home_history_restored": true' dist/release.json
          grep -Fq '"home_series_watch_inline": true' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.60-r269';" dist/service-worker.js
          ! grep -Eq 'ct26[5-9]AfterF1Paint' dist/app-v269.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_60_r269]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.60 r269
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.60"' <<<"$BODY" && grep -Fq '"revision": "r269-official-1.0.60"' <<<"$BODY" && grep -Fq '"home_history_restored": true' <<<"$BODY" && grep -Fq '"home_series_watch_inline": true' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v269.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR269='video-history-r3+series-watch-inline'" <<<"$JS" && grep -Fq "rpc('cinetracker_home_live_v0997_r3'" <<<"$JS" && grep -Fq 'function ct269RepairSeriesWatch()' <<<"$JS" && grep -Fq "window.__ctR267Sports='r266-stable-preserved'" <<<"$JS" && ! grep -Eq 'ct26[5-9]AfterF1Paint' <<<"$JS" && grep -Fq 'app-v269.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
