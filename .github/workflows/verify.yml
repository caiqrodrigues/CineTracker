name: Verify Web 1.0.266 r476
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r476:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r476 Home Discover Profile regression gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v476.js
          grep -Fq "window.__ctR476Marker='home-visible-card-watchlist+foryou-v476-strict-smart+profile-12-header-more-full'" apps/web/dist/app-v476.js
          grep -Fq 'window.__ctCoreR471=Object.freeze' apps/web/dist/app-v476.js
          grep -Fq 'homeMovieCard:item=>mediaCard' apps/web/dist/app-v476.js
          grep -Fq 'ct424HomeGate='''retired-r476'''' apps/web/dist/app-v476.js
          grep -Fq 'cinetracker_home_series_v452' apps/web/dist/app-v476.js
          grep -Fq 'cinetracker_home_movies_v405' apps/web/dist/app-v476.js
          grep -Fq 'cinetracker_home_history_v391' apps/web/dist/app-v476.js
          grep -Fq 'cinetracker_discover_fresh_v476' apps/web/dist/app-v476.js
          grep -Fq 'cinetracker_discover_watch_smart_v476' apps/web/dist/app-v476.js
          grep -Fq 'cinetracker_profile_lists_v476' apps/web/dist/app-v476.js
          grep -Fq 'data-ct476-header-more' apps/web/dist/app-v476.js
          grep -Fq 'const LIMIT=12' apps/web/dist/app-v476.js
          grep -Fq 'cinetracker_activity_items_by_day_v426' apps/web/dist/app-v476.js
          ! grep -Fq 'while(true)' apps/web/runtime-r476-final.js
          ! grep -Fq 'setInterval(' apps/web/runtime-r476-final.js
          ! grep -Fq 'window.location.reload(' apps/web/runtime-r476-final.js
          ! grep -Fq 'router.refresh(' apps/web/runtime-r476-final.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r476, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r476 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.266"' <<<"$BODY" && grep -Fq '"revision": "r476-official-1.0.266"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v476.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR476Marker='home-visible-card-watchlist+foryou-v476-strict-smart+profile-12-header-more-full'" <<<"$JS" && grep -Fq 'app-v476.js' <<<"$HTML"; then exit 0; fi
            fi
            if [ "$i" -eq 240 ]; then exit 1; fi
            sleep 5
          done
