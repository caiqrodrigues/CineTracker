name: Verify Web 1.0.32

on:
  push:
    branches: [main, 'fix/1.0.32-r240-user-video-semantics']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_32:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax r240
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.32"' apps/web/package.json
          node --check apps/web/runtime-r240-sports-four-tabs.js
          node --check apps/web/runtime-r240-user-video-semantics.js
          node --check apps/web/build-r240.mjs
          node --check apps/web/test-r240.mjs
          node --check scripts/test-r240-sports-four-tabs-browser.mjs
          node --check scripts/test-r240-user-video-semantics-browser.mjs
      - name: Build r240
        working-directory: apps/web
        run: node build-r240.mjs
      - name: Static invariants r240
        working-directory: apps/web
        run: node test-r240.mjs
      - name: Final bundle identity r240
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v240.js
          grep -Fq "window.__ctWebBuild='1.0.32';window.__ctOfficialVersion='1.0.32';" dist/app-v240.js
          grep -Fq "const REVISION='r240-official-1.0.32';" dist/app-v240.js
          grep -Fq "window.__ctR240='sports-four-data-authority'" dist/app-v240.js
          grep -Fq "window.__ctR240Semantic='user-video-semantic-authority'" dist/app-v240.js
          grep -Fq "window.__ctR240Home='follow-first-history-hidden'" dist/app-v240.js
          grep -Fq "window.__ctR240Discover='canonical-exclusions-atomic-switch'" dist/app-v240.js
          grep -Fq "window.__ctR240SportsSearch='search-focus-caret-stable'" dist/app-v240.js
          grep -Fq '"version": "1.0.32"' dist/release.json
          grep -Fq '"revision": "r240-official-1.0.32"' dist/release.json
      - name: Chromium r240 sports data authority
        run: node scripts/test-r240-sports-four-tabs-browser.mjs
      - name: Chromium r240 user-video semantics
        run: node scripts/test-r240-user-video-semantics-browser.mjs

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_32]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Official production serves 1.0.32 r240
        run: |
          set -euo pipefail
          for i in $(seq 1 150); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.32"' <<<"$BODY" && grep -Fq '"revision": "r240-official-1.0.32"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v240.js?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR240='sports-four-data-authority'" <<<"$JS" && grep -Fq "window.__ctR240Semantic='user-video-semantic-authority'" <<<"$JS"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1