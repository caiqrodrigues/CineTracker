name: Verify Web 1.0.81 r290 Universal Media Card Lock

on:
  push:
    branches: [main, 'fix/web-r290-universal-media-card-lock']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_81_r290:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r290
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.81"' package.json
          grep -Fq '"version": "1.0.81"' apps/web/package.json
          grep -Fq 'build-r290-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r290-universal-media-card-lock.js
          test -f apps/web/build-r290.mjs
          test -f apps/web/build-r290-official.mjs
          test -f apps/web/test-r290.mjs
          test -f apps/web/test-r290-browser.mjs
          test -f scripts/test-r290-exact-bundle-browser.mjs
      - name: Syntax r290 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r290-universal-media-card-lock.js
          node --check apps/web/build-r290.mjs
          node --check apps/web/build-r290-official.mjs
          node --check apps/web/test-r290.mjs
          node --check apps/web/test-r290-browser.mjs
          node --check scripts/test-r290-exact-bundle-browser.mjs
      - name: Build official r290
        working-directory: apps/web
        run: node build-r290-official.mjs
      - name: Static regressions r290
        working-directory: apps/web
        run: node test-r290.mjs
      - name: Chromium inherited r285 regressions
        working-directory: apps/web
        run: node test-r285-browser.mjs
      - name: Chromium inherited r286 related interactions
        working-directory: apps/web
        run: node test-r286-browser.mjs
      - name: Chromium inherited r287 Home liveness and Continue
        working-directory: apps/web
        run: node test-r287-browser.mjs
      - name: Chromium inherited r288 Discover Android parity
        working-directory: apps/web
        run: node test-r288-browser.mjs
      - name: Chromium inherited r289 Discover geometry
        working-directory: apps/web
        run: node test-r289-browser.mjs
      - name: Chromium r290 all media cards and every Discover section
        working-directory: apps/web
        run: node test-r290-browser.mjs
      - name: Exact final bundle boot r290
        run: node scripts/test-r290-exact-bundle-browser.mjs
      - name: Final bundle identity r290
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v290.js
          grep -Fq "window.__ctWebBuild='1.0.81';window.__ctOfficialVersion='1.0.81';" dist/app-v290.js
          grep -Fq "const REVISION='r290-official-1.0.81';" dist/app-v290.js
          grep -Fq "window.__ctR288='discover-android-parity-web-only'" dist/app-v290.js
          grep -Fq "window.__ctR289='discover-standard-card-size'" dist/app-v290.js
          grep -Fq "window.__ctR290='universal-media-card-lock'" dist/app-v290.js
          grep -Fq "window.__ctR290Cards='indication-of-day-exact-154x231-mobile-176x264-desktop'" dist/app-v290.js
          grep -Fq -- '--ct-media-card-w:176px' dist/app-v290.js
          grep -Fq -- '--ct-media-poster-h:264px' dist/app-v290.js
          grep -Fq -- '--ct-media-card-w:154px' dist/app-v290.js
          grep -Fq -- '--ct-media-poster-h:231px' dist/app-v290.js
          grep -Fq 'window.ct171TopCard=standardTopCard' dist/app-v290.js
          grep -Fq -- '-webkit-line-clamp:2!important' dist/app-v290.js
          grep -Fq 'app-v290.js' dist/index.html
          grep -Fq 'app-v290.css' dist/index.html
          grep -Fq '"media_card_reference": "indicacao-do-dia"' dist/release.json
          grep -Fq '"discover_cards": "all-nine-tabs-vertical-uniform"' dist/release.json
          grep -Fq '"discover_top10": "vertical-standard-card-no-banner-fallback"' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.81-r290';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_81_r290]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.81 r290
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.81"' <<<"$BODY" && grep -Fq '"revision": "r290-official-1.0.81"' <<<"$BODY" && grep -Fq '"media_card_reference": "indicacao-do-dia"' <<<"$BODY" && grep -Fq '"discover_cards": "all-nine-tabs-vertical-uniform"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v290.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR290='universal-media-card-lock'" <<<"$JS" && grep -Fq -- '--ct-media-card-w:176px' <<<"$JS" && grep -Fq 'app-v290.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
