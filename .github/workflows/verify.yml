name: Verify Web 1.0.99 r308 Discover F1 Profile Truth

on:
  push:
    branches: [main, 'fix/r308-discover-f1-profile-truth']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_99_r308:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r308
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.99"' package.json
          grep -Fq '"version": "1.0.99"' apps/web/package.json
          grep -Fq 'build-r308-official.mjs' apps/web/package.json
          test -f apps/web/build-r308.mjs
          test -f apps/web/build-r308-official.mjs
          test -f apps/web/runtime-r308-discover-f1-profile.js
          test -f apps/web/test-r308.mjs
          test -f apps/web/test-r308-browser.mjs
      - name: Syntax r308 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r308-discover-f1-profile.js
          node --check apps/web/build-r308.mjs
          node --check apps/web/build-r308-official.mjs
          node --check apps/web/test-r308.mjs
          node --check apps/web/test-r308-browser.mjs
      - name: Regression suite through r308 including Chromium interactions
        working-directory: apps/web
        run: npm run verify
      - name: Final bundle identity r308
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r308-official.mjs
          node --check dist/app-v308.js
          CT_R308_SKIP_BUILD=1 node test-r308.mjs
          test -f dist/app-v308.js
          test -f dist/app-v308.css
          grep -Fq 'app-v308.js' dist/index.html
          grep -Fq 'app-v308.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.99'
            && r.revision==='r308-official-1.0.99'
            && r.discover_foryou_exact_3_plus_3===true
            && r.discover_daily_swap===true
            && r.discover_exclusions==='trending+popular+new+anticipated+top => seen+watchlist'
            && r.f1_drivers_tab===false
            && r.f1_teams_tab===false
            && r.f1_calendar_data_event_id===true
            && r.profile_semantic_first_paint===true
            && r.profile_watchlist_open_signal===false
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_99_r308, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.99 r308
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.99"' <<<"$BODY"               && grep -Fq '"revision": "r308-official-1.0.99"' <<<"$BODY"               && grep -Fq '"discover_foryou_exact_3_plus_3": true' <<<"$BODY"               && grep -Fq '"f1_teams_tab": false' <<<"$BODY"               && grep -Fq '"f1_calendar_data_event_id": true' <<<"$BODY"               && grep -Fq '"profile_semantic_first_paint": true' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v308.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR308='discover-exact-3+3+personal-filter+f1-four-tabs+calendar-click+profile-first-paint'" <<<"$JS"                 && grep -Fq "const F1_TABS255=[['overview','Visão geral'],['calendar','Calendário'],['standings','Classificações'],['circuits','Circuitos']];" <<<"$JS"                 && grep -Fq 'data-event-id' <<<"$JS"                 && grep -Fq 'app-v308.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=6500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
