name: Verify Web 1.0.169 r378 Regression Rollback
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r378:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check runtime-r378-regression-rollback.js
          node --check build-r378.mjs
          node --check test-r378-browser.mjs
          node build-r378-official.mjs
          CT_R378_SKIP_BUILD=1 node test-r378.mjs
          CT_R378_SKIP_BUILD=1 node test-r378-browser.mjs
          node --check dist/app-v378.js
          grep -Fq "rpc('cinetracker_home_payload_v359',{p_today:" dist/app-v378.js
          ! grep -Fq "rpc('cinetracker_home_payload_v334',{p_today:" dist/app-v378.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r378, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.169"' <<<"$BODY" && grep -Fq '"revision": "r378-official-1.0.169"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v378.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR378Marker='home-v359-cache-first+semantic-anchor+foryou-isolated-dom-owner'" <<<"$JS" && grep -Fq 'app-v378.js' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
