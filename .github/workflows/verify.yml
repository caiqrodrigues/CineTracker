name: Verify Web 1.0.67 r276 History Viewport Episode Card Parity

on:
  push:
    branches: [main, 'fix/r276-history-above-viewport-card-parity']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_67_r276:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r276
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.67"' package.json
          grep -Fq '"version": "1.0.67"' apps/web/package.json
          grep -Fq 'build-r276-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r276-home-history-card-parity.js
          test -f apps/web/build-r276.mjs
          test -f apps/web/build-r276-official.mjs
          test -f apps/web/test-r276.mjs
          test -f apps/web/test-r276-browser.mjs
          test -f scripts/test-r276-exact-bundle-browser.mjs
      - name: Syntax r276 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r276-home-history-card-parity.js
          node --check apps/web/build-r276.mjs
          node --check apps/web/build-r276-official.mjs
          node --check apps/web/test-r276.mjs
          node --check apps/web/test-r276-browser.mjs
          node --check scripts/test-r276-exact-bundle-browser.mjs
      - name: Build official r276
        working-directory: apps/web
        run: node build-r276-official.mjs
      - name: Static regressions r276
        working-directory: apps/web
        run: node test-r276.mjs
      - name: Chromium History viewport and episode card parity r276
        working-directory: apps/web
        run: node test-r276-browser.mjs
      - name: Exact final bundle boot r276
        run: node scripts/test-r276-exact-bundle-browser.mjs
      - name: Final bundle identity r276
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v276.js
          grep -Fq "window.__ctWebBuild='1.0.67';window.__ctOfficialVersion='1.0.67';" dist/app-v276.js
          grep -Fq "const REVISION='r276-official-1.0.67';" dist/app-v276.js
          grep -Fq "window.__ctR275='collapsible-history+rewatch-multiplier+fresh-next+strict-dedupe'" dist/app-v276.js
          grep -Fq "window.__ctR276='history-above-initial-viewport+episode-card-parity'" dist/app-v276.js
          grep -Fq "window.__ctR276History='rendered-above-continue+no-toggle+initial-anchor'" dist/app-v276.js
          grep -Fq "window.__ctR276Series='continue+dust+up-to-date-shared-episode-meta'" dist/app-v276.js
          grep -Fq 'ct275HistorySection=ct276HistorySection;' dist/app-v276.js
          grep -Fq 'ct275SeriesSection=ct276SeriesSection;' dist/app-v276.js
          grep -Fq 'app-v276.js' dist/index.html
          grep -Fq 'app-v276.css' dist/index.html
          grep -Fq '"version": "1.0.67"' dist/release.json
          grep -Fq '"revision": "r276-official-1.0.67"' dist/release.json
          grep -Fq '"home_history_mode": "above-initial-viewport"' dist/release.json
          grep -Fq '"home_history_toggle": false' dist/release.json
          grep -Fq '"home_history_initial_anchor": "continue"' dist/release.json
          grep -Fq '"home_up_to_date_last_watched_meta": true' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.67-r276';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_67_r276]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.67 r276
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.67"' <<<"$BODY" && grep -Fq '"revision": "r276-official-1.0.67"' <<<"$BODY" && grep -Fq '"home_history_mode": "above-initial-viewport"' <<<"$BODY" && grep -Fq '"home_history_toggle": false' <<<"$BODY" && grep -Fq '"home_up_to_date_last_watched_meta": true' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v276.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR276='history-above-initial-viewport+episode-card-parity'" <<<"$JS" && grep -Fq 'ct275HistorySection=ct276HistorySection;' <<<"$JS" && grep -Fq 'ct275SeriesSection=ct276SeriesSection;' <<<"$JS" && grep -Fq 'app-v276.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
