name: Verify Web 1.0.186 r395 Discover Pra Voce
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r395:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and scoped regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check runtime-r388-home-foryou-final.js
          node --check runtime-r395-discover-foryou-owner.js
          node --check build-r395.mjs
          node --check test-r395.mjs
          node --check test-r395-browser.mjs
          node build-r395-official.mjs
          CT_R395_SKIP_BUILD=1 node test-r395.mjs
          CT_R395_SKIP_BUILD=1 node test-r395-browser.mjs
          node --check dist/app-v395.js
          grep -Fq "window.__ctR395Marker='discover-foryou-r388-single-route-owner+legacy-v333-bypass'" dist/app-v395.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r395, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.186"' <<<"$BODY" && grep -Fq '"revision": "r395-official-1.0.186"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v395.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR395Marker='discover-foryou-r388-single-route-owner+legacy-v333-bypass'" <<<"$JS" && grep -Fq 'app-v395.js' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
