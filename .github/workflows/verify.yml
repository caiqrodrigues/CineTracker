name: Verify Web 1.0.108 r317 Watchlist Click

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_108_r317:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r317
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.108"' package.json
          grep -Fq '"version": "1.0.108"' apps/web/package.json
          grep -Fq 'build-r317-official.mjs' apps/web/package.json
          test -f apps/web/build-r317.mjs
          test -f apps/web/build-r317-official.mjs
          test -f apps/web/runtime-r317-profile-watchlist-click.js
          test -f apps/web/test-r317.mjs
          test -f apps/web/test-r317-browser.mjs
      - name: Syntax r317 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r317-profile-watchlist-click.js
          node --check apps/web/build-r317.mjs
          node --check apps/web/build-r317-official.mjs
          node --check apps/web/test-r317.mjs
          node --check apps/web/test-r317-browser.mjs
      - name: Regression suite through r317
        working-directory: apps/web
        run: npm run verify
      - name: Final bundle identity r317
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r317-official.mjs
          node --check dist/app-v317.js
          CT_R317_SKIP_BUILD=1 node test-r317.mjs
          test -f dist/app-v317.js
          test -f dist/app-v317.css
          grep -Fq 'app-v317.js' dist/index.html
          grep -Fq 'app-v317.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.108'
            && r.revision==='r317-official-1.0.108'
            && r.profile_stats_order==='r317-exact-ten-singular-plural-aliases'
            && r.profile_watchlist_stats==='clickable-by-label-first-capture'
            && r.profile_watchlist_source==='cinetracker_watchlist_full_v119'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_108_r317, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.108 r317
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.108"' <<<"$BODY" \
              && grep -Fq '"revision": "r317-official-1.0.108"' <<<"$BODY" \
              && grep -Fq '"profile_watchlist_stats": "clickable-by-label-first-capture"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v317.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR317='profile-watchlist-hard-click+exact-order-singular-alias'" <<<"$JS" \
                && grep -Fq 'tempo de filme em watchlist' <<<"$JS" \
                && grep -Fq 'app-v317.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=7500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
