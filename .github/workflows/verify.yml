name: Verify Web 1.0.232 r441 Descobrir Pra Voce
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r441:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r441 regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check build-r441.mjs
          node --check build-r441-official.mjs
          node --check test-r441.mjs
          node build-r441-official.mjs
          node --check dist/app-v441.js
          grep -Fq "window.__ctR431" dist/app-v441.js
          grep -Fq "window.__ctR309" dist/app-v441.js
          grep -Fq "data-ct309-swap" dist/app-v441.js
          ! grep -Fq "CineTracker Web 1.0.186 r395" dist/app-v441.js
          ! grep -Fq "CineTracker Web 1.0.197 r406" dist/app-v441.js
          ! grep -Fq "CineTracker Web 1.0.201 r410" dist/app-v441.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r441, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.232"' <<<"$BODY" && grep -Fq '"revision": "r441-official-1.0.232"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v441.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR431" <<<"$JS" && grep -Fq 'data-ct309-swap' <<<"$JS" && grep -Fq 'app-v441.js' <<<"$HTML" && ! grep -Fq 'CineTracker Web 1.0.186 r395' <<<"$JS" && ! grep -Fq 'CineTracker Web 1.0.197 r406' <<<"$JS" && ! grep -Fq 'CineTracker Web 1.0.201 r410' <<<"$JS"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
