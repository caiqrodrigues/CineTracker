name: Verify Web 1.0.128 r337 Search Home ForYou

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_128_r337:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Version identity r337
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.128"' package.json
          grep -Fq '"version": "1.0.128"' apps/web/package.json
          grep -Fq 'build-r337-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r337-search-home-foryou.js
          test -f apps/web/build-r337.mjs
          test -f apps/web/build-r337-official.mjs
          test -f apps/web/test-r337.mjs
          test -f apps/web/test-r337-browser.mjs
          test -f supabase/migrations/20260923030000_r337_episode_catalog_search.sql
      - name: Syntax r337
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r337-search-home-foryou.js
          node --check apps/web/build-r337.mjs
          node --check apps/web/build-r337-official.mjs
          node --check apps/web/test-r337.mjs
          node --check apps/web/test-r337-browser.mjs
      - name: Current static regression lineage
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run test:r330
          npm run test:r331
          npm run test:r332
          npm run test:r333
          npm run test:r334
          npm run test:r335
          npm run test:r336
      - name: Focused r337 static and browser gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run test:r337
          npm run test:r337:browser
      - name: Final bundle identity r337
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r337-official.mjs
          node --check dist/app-v337.js
          CT_R337_SKIP_BUILD=1 node test-r337.mjs
          grep -Fq 'app-v337.js' dist/index.html
          grep -Fq 'app-v337.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.128'
            && r.revision==='r337-official-1.0.128'
            && r.search_global==='movies+series+actors+episodes'
            && r.search_episode_local==='cinetracker_episode_search_v337'
            && r.home_navigation==='r337-desired-tab-authority+multi-settle+user-scroll-cancel'
            && r.discover_foryou_swap==='same-bucket+same-kind-only'
            && r.discover_foryou_actions==='optimistic-immediate-replacement'
            && r.discover_foryou_layout==='readable-single-row-actions-no-wrap'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_128_r337, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.128 r337
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.128"' <<<"$BODY"               && grep -Fq '"revision": "r337-official-1.0.128"' <<<"$BODY"               && grep -Fq '"search_episode_local": "cinetracker_episode_search_v337"' <<<"$BODY"               && grep -Fq '"discover_foryou_layout": "readable-single-row-actions-no-wrap"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v337.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR337Marker='episode-catalog-search+home-desired-tab-settle+foryou-readable-same-kind-actions'" <<<"$JS"                 && grep -Fq 'cinetracker_episode_search_v337' <<<"$JS"                 && grep -Fq 'Buscar filmes, séries, episódios e atores' <<<"$JS"                 && grep -Fq 'app-v337.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=8000 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM"                   && grep -Fq 'v1.0.128' <<<"$DOM"                   && grep -Fq 'r337-official-1.0.128' <<<"$DOM"                   && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
