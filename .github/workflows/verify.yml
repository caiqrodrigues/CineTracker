name: Verify Web 1.0.69 r278 Effective TMDB Fixed Home Tabs

on:
  push:
    branches: [main, 'fix/r278-effective-tmdb-sticky-home-tabs']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_69_r278:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r278
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.69"' package.json
          grep -Fq '"version": "1.0.69"' apps/web/package.json
          grep -Fq 'build-r278-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r278-effective-tmdb-sticky-home-tabs.js
          test -f apps/web/build-r278.mjs
          test -f apps/web/build-r278-official.mjs
          test -f apps/web/test-r278.mjs
          test -f apps/web/test-r278-browser.mjs
          test -f scripts/test-r278-exact-bundle-browser.mjs
      - name: Syntax r278 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r278-effective-tmdb-sticky-home-tabs.js
          node --check apps/web/build-r278.mjs
          node --check apps/web/build-r278-official.mjs
          node --check apps/web/test-r278.mjs
          node --check apps/web/test-r278-browser.mjs
          node --check scripts/test-r278-exact-bundle-browser.mjs
      - name: Build official r278
        working-directory: apps/web
        run: node build-r278-official.mjs
      - name: Static regressions r278
        working-directory: apps/web
        run: node test-r278.mjs
      - name: Chromium effective TMDB action and fixed Home tabs r278
        working-directory: apps/web
        run: node test-r278-browser.mjs
      - name: Exact final bundle boot r278
        run: node scripts/test-r278-exact-bundle-browser.mjs
      - name: Final bundle identity r278
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v278.js
          grep -Fq "window.__ctWebBuild='1.0.69';window.__ctOfficialVersion='1.0.69';" dist/app-v278.js
          grep -Fq "const REVISION='r278-official-1.0.69';" dist/app-v278.js
          grep -Fq "window.__ctR277='watch-action-host+fixed-sidebar'" dist/app-v278.js
          grep -Fq "window.__ctR278='effective-tmdb-watch-action+fixed-home-tabs'" dist/app-v278.js
          grep -Fq "window.__ctR278Tabs='series-movies-fixed-top'" dist/app-v278.js
          grep -Fq 'ct274EpisodeWatchAction=ct278EpisodeWatchAction;' dist/app-v278.js
          grep -Fq 'ct274EpisodeAttrs=ct278EpisodeAttrs;' dist/app-v278.js
          grep -Fq 'app-v278.js' dist/index.html
          grep -Fq 'app-v278.css' dist/index.html
          grep -Fq '"version": "1.0.69"' dist/release.json
          grep -Fq '"revision": "r278-official-1.0.69"' dist/release.json
          grep -Fq '"home_watch_action_tmdb_source": "effective"' dist/release.json
          grep -Fq '"home_watch_action_data_media_fallback": true' dist/release.json
          grep -Fq '"home_tabs_fixed": true' dist/release.json
          grep -Fq '"home_tabs_mode": "fixed-top"' dist/release.json
          grep -Fq '"sidebar_fixed": true' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.69-r278';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_69_r278]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.69 r278
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.69"' <<<"$BODY" && grep -Fq '"revision": "r278-official-1.0.69"' <<<"$BODY" && grep -Fq '"home_watch_action_tmdb_source": "effective"' <<<"$BODY" && grep -Fq '"home_watch_action_data_media_fallback": true' <<<"$BODY" && grep -Fq '"home_tabs_fixed": true' <<<"$BODY" && grep -Fq '"home_tabs_mode": "fixed-top"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v278.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v278.css?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR278='effective-tmdb-watch-action+fixed-home-tabs'" <<<"$JS" && grep -Fq '[data-home] .home-tabs{position:fixed!important' <<<"$CSS" && grep -Fq 'app-v278.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
