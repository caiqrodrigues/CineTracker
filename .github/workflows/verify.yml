name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_r196:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate Web source chain through r196
        run: |
          set -euo pipefail
          for f in \
            apps/web/runtime-r179.js apps/web/runtime-r180.js apps/web/runtime-r181.js apps/web/runtime-r182.js \
            apps/web/runtime-r183.js apps/web/runtime-r184-shared.js apps/web/runtime-r184-web.js \
            apps/web/runtime-r185a-shared.js apps/web/runtime-r185b-web.js apps/web/runtime-r185c-shared.js \
            apps/web/runtime-r185c-web.js apps/web/runtime-r186-shared.js apps/web/runtime-r190-web.js \
            apps/web/runtime-r190b-web.js apps/web/runtime-r191-web.js apps/web/runtime-r192-web.js \
            apps/web/runtime-r193-web.js apps/web/runtime-r193-guard.js apps/web/runtime-r194-web.js \
            apps/web/runtime-r194-fast-context.js apps/web/runtime-r195-web.js apps/web/runtime-r196-web.js; do
            node --check "$f"
          done
          node --check apps/web/build-r186.mjs
          grep -Fq "window.__ctR186='foryou-strict-quality-year-history-realtime';" apps/web/runtime-r186-shared.js
          grep -Fq 'tmdb-gte-7.5-release-year-gt-1990' apps/web/runtime-r186-shared.js
          grep -Fq 'watch_history+media_overrides-postgres-changes' apps/web/runtime-r186-shared.js
          grep -Fq "window.__ctR196Web='detail-watchlist-toggle';" apps/web/runtime-r196-web.js
          grep -Fq 'state=in.(AddedToWatchlist,WatchLater)' apps/web/runtime-r196-web.js
          grep -Fq "{method:'DELETE'}" apps/web/runtime-r196-web.js
          grep -Fq 'matched_media_ids' apps/web/runtime-r196-web.js
          grep -Fq "toast('Removido da Watchlist.')" apps/web/runtime-r196-web.js
          grep -Fq "b.disabled=false" apps/web/runtime-r196-web.js
          node scripts/test-r180-discover-profile.mjs
          node scripts/test-r184-profile-gap.mjs
          node scripts/test-r185c-performance-polish.mjs
      - name: Build Web r196
        working-directory: apps/web
        run: npm run build
      - name: Assert assembled Web r196 artifact
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v196.js
          grep -Fq "r196-watchlist-toggle" apps/web/dist/app-v196.js
          grep -Fq "detail-watchlist-toggle" apps/web/dist/app-v196.js
          grep -Fq "add-remove-alias-aware" apps/web/dist/app-v196.js
          grep -Fq 'state=in.(AddedToWatchlist,WatchLater)' apps/web/dist/app-v196.js
          grep -Fq "{method:'DELETE'}" apps/web/dist/app-v196.js
          grep -Fq "Removido da Watchlist." apps/web/dist/app-v196.js
          grep -Fq "asian-scripted-tv-excluded-from-foryou" apps/web/dist/app-v196.js
          grep -Fq "favorites-strongest-seen-history-affinity" apps/web/dist/app-v196.js
          grep -Fq '"revision":"r196-watchlist-toggle"' apps/web/dist/release.json
          grep -Fq 'app-v196.js' apps/web/dist/index.html
          grep -Fq 'app-v196.css' apps/web/dist/index.html
          test ! -f apps/web/dist/app-v185c.js

  android_099732:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate Android 0.99.7.32 source and assembled runtime
        run: |
          set -euo pipefail
          grep -Fq "versionName '0.99.7.32'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10002' apps/android/app/build.gradle
          node --check apps/android/runtime-r198-mobile-performance.js
          node --check apps/android/runtime-r204-discover-three-cards-touchstart-tabs.js
          node --check scripts/prepare-android-v099732.mjs
          node --check scripts/test-android-v099732.mjs
          node scripts/prepare-android-v099732.mjs
          node scripts/test-android-v099732.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r204-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r204 embedded runtime missing');
          const js=h.slice(a+marker.length,b);
          for(const m of ['discover-three-cards-touchstart-tabs','foryou-no-type-subfilters','touchstart-capture-immediate-no-synthetic-click','native-horizontal-three-cards-per-viewport','calc((100% - 16px)/3)','activateDiscover204','detail-watchlist-toggle'])if(!js.includes(m))throw new Error('missing '+m);
          for(const old of ['restore-route-render-and-discover-pan-x','discover-direct-tabs-manual-horizontal-scroll','pointer-capture-discover-tabs-horizontal-rails','discover-direct-pointerup-native-horizontal-carousels','discover-compact-foryou-reliable-touch-tabs'])if(js.includes(old))throw new Error('old Discover runtime embedded: '+old);
          fs.writeFileSync('/tmp/ct99732-verify.js',js);
          NODE
          node --check /tmp/ct99732-verify.js

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r196]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Production Web serves r196
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r196-watchlist-toggle"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v196.js?ct=$(date +%s%N)" || true)"
              if grep -Fq "detail-watchlist-toggle" <<<"$JS" \
                && grep -Fq "add-remove-alias-aware" <<<"$JS" \
                && grep -Fq 'state=in.(AddedToWatchlist,WatchLater)' <<<"$JS" \
                && grep -Fq "Removido da Watchlist." <<<"$JS"; then
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1
