name: Verify Web 1.0.265 r475
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r475:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r475 regression gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v475.js
          grep -Fq "window.__ctR475Marker='profile-v475-12+13th+watchlist-paged+daily-v475'" apps/web/dist/app-v475.js
          grep -Fq 'cinetracker_profile_list_v475' apps/web/dist/app-v475.js
          grep -Fq 'cinetracker_activity_items_by_day_v475' apps/web/dist/app-v475.js
          grep -Fq 'cinetracker_home_series_v452' apps/web/dist/app-v475.js
          grep -Fq 'cinetracker_home_movies_v405' apps/web/dist/app-v475.js
          grep -Fq 'cinetracker_home_history_v391' apps/web/dist/app-v475.js
          grep -Fq 'cinetracker_discover_watch_unseen_v421' apps/web/dist/app-v475.js
          grep -Fq 'cinetracker_discover_fresh_v421' apps/web/dist/app-v475.js
          grep -Fq 'function gateHomeSeries424(){return false}' apps/web/dist/app-v475.js
          grep -Fq 'function normalizeProfileLists424(){return false}' apps/web/dist/app-v475.js
          ! grep -Fq 'for(const delay of [0,300,900])' apps/web/dist/app-v475.js
          for f in apps/web/runtime-r399-startup-stability.js apps/web/runtime-r464-discover-foryou.js apps/web/runtime-r475-profile-owner.js; do
            ! grep -Fq "window.location.reload(" "$f"
            ! grep -Fq "router.refresh(" "$f"
            ! grep -Fq "new MutationObserver" "$f"
            ! grep -Fq "setInterval(" "$f"
            ! grep -Fq "while(true)" "$f"
          done
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r475, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r475 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.265"' <<<"$BODY" && grep -Fq '"revision": "r475-official-1.0.265"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v475.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR475Marker='profile-v475-12+13th+watchlist-paged+daily-v475'" <<<"$JS" && grep -Fq 'cinetracker_profile_list_v475' <<<"$JS" && grep -Fq 'app-v475.js' <<<"$HTML"; then exit 0; fi
            fi
            if [ "$i" -eq 240 ]; then exit 1; fi
            sleep 5
          done
