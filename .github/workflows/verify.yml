name: Verify Web 1.0.113 r322 Discover Indexed Filter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_113_r322:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r322
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.113"' package.json
          grep -Fq '"version": "1.0.113"' apps/web/package.json
          grep -Fq 'build-r322-official.mjs' apps/web/package.json
          test -f apps/web/build-r322.mjs
          test -f apps/web/build-r322-official.mjs
          test -f apps/web/test-r322.mjs
          test -f apps/web/test-r322-browser.mjs
          test -f supabase/migrations/20260920164500_r322_discover_filter_indexed.sql
      - name: Syntax r322 release chain
        run: |
          set -euo pipefail
          node --check apps/web/build-r322.mjs
          node --check apps/web/build-r322-official.mjs
          node --check apps/web/test-r322.mjs
          node --check apps/web/test-r322-browser.mjs
      - name: Regression suite through r322
        working-directory: apps/web
        run: npm run verify
      - name: Final bundle identity r322
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r322-official.mjs
          node --check dist/app-v322.js
          CT_R322_SKIP_BUILD=1 node test-r322.mjs
          grep -Fq 'app-v322.js' dist/index.html
          grep -Fq 'app-v322.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.113'
            && r.revision==='r322-official-1.0.113'
            && r.scope==='discover-only-indexed-filter-performance-and-rules'
            && r.discover_filter_authority==='cinetracker_discover_filter_v322'
            && r.discover_filter_match==='indexed-logical-tmdb-key'
            && r.discover_top10_source==='ct171TopRows-session-cache'
            && r.profile_changes==='none-r322'
            && r.sports_changes==='none-r322'
            && r.f1_changes==='none-r322'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_113_r322, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.113 r322
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.113"' <<<"$BODY" \
              && grep -Fq '"revision": "r322-official-1.0.113"' <<<"$BODY" \
              && grep -Fq '"discover_filter_authority": "cinetracker_discover_filter_v322"' <<<"$BODY" \
              && grep -Fq '"discover_top10_source": "ct171TopRows-session-cache"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v322.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR322='discover-indexed-user-filter+fast-top10'" <<<"$JS" \
                && grep -Fq 'cinetracker_discover_filter_v322' <<<"$JS" \
                && ! grep -Fq "rpc('cinetracker_discover_filter_v320'" <<<"$JS" \
                && grep -Fq 'app-v322.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=7500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
