name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax check r170 source runtime
        run: |
          node --check apps/web/runtime-r169.js
          node --check apps/web/runtime-r170.js
          node --check apps/web/build-r170.mjs
      - name: Build exact CineTracker Web r170 artifact used by Vercel
        working-directory: apps/web
        run: npm run build
      - name: Assert single r170 authority and requested fixes
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v170.js
          test "$(grep -o '<script' apps/web/dist/index.html | wc -l)" -eq 1
          ! grep -Eq 'patch-v[0-9]|hotfix' apps/web/dist/index.html
          test "$(find apps/web/dist -maxdepth 1 -type f -name 'patch-v*.js' | wc -l)" -eq 0
          for old in 162 163 164 165 166 167 168 169; do test ! -f "apps/web/dist/app-v${old}.js"; done
          grep -Fq "single-clean-runtime" apps/web/dist/app-v170.js
          grep -Fq "r170-reliability-actions-search" apps/web/dist/app-v170.js
          grep -Fq "rpc-coalescing-timeout-retry-no-home-preload-stampede" apps/web/dist/app-v170.js
          grep -Fq "media-kind-required-fixed" apps/web/dist/app-v170.js
          grep -Fq "biography-split-filmography-favorite" apps/web/dist/app-v170.js
          grep -Fq "functional-full-library-overlays" apps/web/dist/app-v170.js
          grep -Fq "mixed-movie-tv-rich-metadata" apps/web/dist/app-v170.js
          grep -Fq "media-liked-toggle" apps/web/dist/app-v170.js
          grep -Fq "global-entity-search" apps/web/dist/app-v170.js
          grep -Fq "ct170Inflight" apps/web/dist/app-v170.js
          grep -Fq "attempt<3" apps/web/dist/app-v170.js
          grep -Fq "media_kind:kind" apps/web/dist/app-v170.js
          grep -Fq "Adicionar ator aos favoritos" apps/web/dist/app-v170.js
          grep -Fq "<h2>Filmes</h2>" apps/web/dist/app-v170.js
          grep -Fq "<h2>Séries</h2>" apps/web/dist/app-v170.js
          grep -Fq "Títulos Relacionados" apps/web/dist/app-v170.js
          grep -Fq "Filmes + Séries" apps/web/dist/app-v170.js
          grep -Fq "Class. " apps/web/dist/app-v170.js
          grep -Fq "TMDB " apps/web/dist/app-v170.js
          grep -Fq "data-ct170-detail-favorite" apps/web/dist/app-v170.js
          grep -Fq "data-ct170-person-favorite" apps/web/dist/app-v170.js
          grep -Fq "ct170OpenProfileMore" apps/web/dist/app-v170.js
          grep -Fq "ct-sports-search" apps/web/dist/app-v170.js
          grep -Fq "ct169-home-skeleton" apps/web/dist/app-v170.js
          grep -Fq "drawer-plus-futuristic-rating-carousel" apps/web/dist/app-v170.js
          grep -Fq '"revision":"r170-reliability-actions-search"' apps/web/dist/release.json
          grep -Fq '"outputDirectory": "dist"' apps/web/vercel.json
          grep -Fq "cinetracker_media_kind_guard_v1" supabase/migrations/20260831233000_r170_media_kind_guard_and_hot_indexes.sql
          grep -Fq "idx_watch_history_profile_item_media_r170" supabase/migrations/20260831233000_r170_media_kind_guard_and_hot_indexes.sql
          grep -Fq "API_SPORTS_KEY" supabase/functions/ct-sports-search/index.ts
          grep -Fq "searchteams.php" supabase/functions/ct-sports-search/index.ts
      - name: Upload exact r170 web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-web-r170-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  android_0997_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.3 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.3'" apps/android/app/build.gradle
          grep -q 'versionCode 9973' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.3-r151-library-sync' scripts/prepare-android-v09973.mjs
          grep -q 'window.__ct0997R151Loaded' scripts/prepare-android-v09973.mjs
          grep -q 'cinetracker:app-foreground' scripts/test-android-v09973.mjs
          grep -q 'android:id="@+id/nav_history"' apps/android/app/src/main/res/layout/activity_main.xml
          grep -q 'android:visibility="gone"' apps/android/app/src/main/res/layout/activity_main.xml
          node --check scripts/prepare-android-v09973.mjs
          node --check scripts/test-android-v09973.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Production domain serves r170
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r170-reliability-actions-search"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v170.js?ct=$(date +%s%N)" || true)"
              if grep -Fq "const REVISION='r170-reliability-actions-search';" <<<"$JS" && grep -Fq "media-kind-required-fixed" <<<"$JS" && grep -Fq "mixed-movie-tv-rich-metadata" <<<"$JS" && grep -Fq "global-entity-search" <<<"$JS"; then
                echo 'PRODUCTION_R170_OK reliability+watchlist+person+related+sports-search'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production domain did not serve r170-reliability-actions-search in time.' >&2
          exit 1
