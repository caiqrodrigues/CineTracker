name: Verify Web 1.0.33 r242 Home

on:
  push:
    branches: [main, 'fix/r242-home-safe']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_33_home:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax r242
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.33"' apps/web/package.json
          node --check apps/web/runtime-r242-home-safe-additive.js
          node --check apps/web/build-r242.mjs
          node --check apps/web/test-r242.mjs
          node --check scripts/test-r239-video-ground-truth-browser.mjs
          node --check scripts/test-r242-home-final-bundle-browser.mjs
      - name: Build r242
        working-directory: apps/web
        run: node build-r242.mjs
      - name: Static invariants r242
        working-directory: apps/web
        run: node test-r242.mjs
      - name: Final bundle identity r242
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v242.js
          grep -Fq "window.__ctWebBuild='1.0.33';window.__ctOfficialVersion='1.0.33';" dist/app-v242.js
          grep -Fq "const REVISION='r242-official-1.0.33';" dist/app-v242.js
          grep -Fq "window.__ctR239='production-video-ground-truth'" dist/app-v242.js
          grep -Fq "window.__ctR242HomeAdditive='preview-first-movie-metadata'" dist/app-v242.js
          grep -Fq "window.__ctR242Safety='no-renderer-override'" dist/app-v242.js
          grep -Fq "cinetracker_home_preview_v1" dist/app-v242.js
          grep -Fq 'app-v242.js' dist/index.html
          grep -Fq '"version": "1.0.33"' dist/release.json
          grep -Fq '"revision": "r242-official-1.0.33"' dist/release.json
      - name: Chromium r239 regression ground truth
        run: node scripts/test-r239-video-ground-truth-browser.mjs
      - name: Chromium r242 exact final bundle Home
        run: node --experimental-websocket scripts/test-r242-home-final-bundle-browser.mjs

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_33_home]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Official production serves 1.0.33 r242
        run: |
          set -euo pipefail
          for i in $(seq 1 150); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.33"' <<<"$BODY" && grep -Fq '"revision": "r242-official-1.0.33"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v242.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR242HomeAdditive='preview-first-movie-metadata'" <<<"$JS" && grep -Fq "window.__ctR242Safety='no-renderer-override'" <<<"$JS" && grep -Fq 'app-v242.js' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
