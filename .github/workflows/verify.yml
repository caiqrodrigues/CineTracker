name: Verify Web 1.0.61 r270 Real Home History + Watch

on:
  push:
    branches: [main, 'fix/r270-home-history-real-dom']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_61_r270:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r270
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.61"' package.json
          grep -Fq '"version": "1.0.61"' apps/web/package.json
          grep -Fq 'build-r270-official.mjs' apps/web/package.json
          test -f apps/web/build-r270.mjs
          test -f apps/web/build-r270-official.mjs
          test -f apps/web/test-r270.mjs
          test -f apps/web/test-r270-browser.mjs
          test -f scripts/test-r270-exact-bundle-browser.mjs
      - name: Syntax r270 release chain
        run: |
          set -euo pipefail
          node --check apps/web/build-r270.mjs
          node --check apps/web/build-r270-official.mjs
          node --check apps/web/test-r270.mjs
          node --check apps/web/test-r270-browser.mjs
          node --check scripts/test-r270-exact-bundle-browser.mjs
      - name: Build official r270
        working-directory: apps/web
        run: node build-r270-official.mjs
      - name: Static regressions r270
        working-directory: apps/web
        run: node test-r270.mjs
      - name: Chromium latest-video regressions r270
        working-directory: apps/web
        run: node test-r270-browser.mjs
      - name: Exact final bundle boot r270
        run: node scripts/test-r270-exact-bundle-browser.mjs
      - name: Final bundle identity r270
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v270.js
          grep -Fq "window.__ctWebBuild='1.0.61';window.__ctOfficialVersion='1.0.61';" dist/app-v270.js
          grep -Fq "const REVISION='r270-official-1.0.61';" dist/app-v270.js
          grep -Fq "window.__ctR270='real-r5-history+dom-order-watch-host'" dist/app-v270.js
          grep -Fq "window.__ctR270Home='r5-watch-history+direct-child-right-check'" dist/app-v270.js
          grep -Fq "window.__ctR269='video-history-r5+series-watch-inline'" dist/app-v270.js
          ! grep -Fq "window.__ctR269='video-history-r3+series-watch-inline'" dist/app-v270.js
          grep -Fq "const p=await rpc('cinetracker_profile_home_payload_v0997_r5'" dist/app-v270.js
          grep -Fq 'function ct270RowForAction(action,view)' dist/app-v270.js
          grep -Fq 'function ct270HardenWatch(row,action)' dist/app-v270.js
          grep -Fq "const props={position:'absolute',right:'10px'" dist/app-v270.js
          grep -Fq "window.__ctR267Discover='atomic-tabs+recursive-personal-exclusions'" dist/app-v270.js
          grep -Fq "window.__ctR267Detail='r169-rich-producer-local-x'" dist/app-v270.js
          grep -Fq "window.__ctR267Sports='r266-stable-preserved'" dist/app-v270.js
          grep -Fq '[data-home-view="series"] .media-row.ct270-watch-host>.ct270-inline-watch-action{position:absolute!important;right:10px!important' dist/app-v270.css
          grep -Fq 'app-v270.js' dist/index.html
          grep -Fq 'app-v270.css' dist/index.html
          ! grep -Fq 'app-v269.js' dist/index.html
          grep -Fq '"version": "1.0.61"' dist/release.json
          grep -Fq '"revision": "r270-official-1.0.61"' dist/release.json
          grep -Fq '"home_history_source": "cinetracker_profile_home_payload_v0997_r5"' dist/release.json
          grep -Fq '"home_history_restored": true' dist/release.json
          grep -Fq '"home_series_watch_direct_child": true' dist/release.json
          grep -Fq '"home_series_watch_inline_right": true' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.61-r270';" dist/service-worker.js
          ! grep -Fq 'ct270AfterF1Paint' dist/app-v270.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_61_r270]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.61 r270
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.61"' <<<"$BODY" && grep -Fq '"revision": "r270-official-1.0.61"' <<<"$BODY" && grep -Fq '"home_history_source": "cinetracker_profile_home_payload_v0997_r5"' <<<"$BODY" && grep -Fq '"home_series_watch_direct_child": true' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v270.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR270='real-r5-history+dom-order-watch-host'" <<<"$JS" && grep -Fq "window.__ctR269='video-history-r5+series-watch-inline'" <<<"$JS" && grep -Fq "const p=await rpc('cinetracker_profile_home_payload_v0997_r5'" <<<"$JS" && grep -Fq 'function ct270RowForAction(action,view)' <<<"$JS" && grep -Fq "window.__ctR267Sports='r266-stable-preserved'" <<<"$JS" && grep -Fq 'app-v270.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
