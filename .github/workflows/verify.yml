name: Verify Web 1.0.170 r379 Home Fresh Profile
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r379:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check runtime-r379-home-fresh-profile.js
          node --check build-r379.mjs
          node --check test-r379-browser.mjs
          node build-r379-official.mjs
          CT_R379_SKIP_BUILD=1 node test-r379.mjs
          CT_R379_SKIP_BUILD=1 node test-r379-browser.mjs
          grep -Fq 'app-v379.js' dist/index.html
          grep -Fq 'ct-web-1.0.170-r379' dist/service-worker.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r379, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.170"' <<<"$BODY" && grep -Fq '"revision": "r379-official-1.0.170"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v379.js?ct=$CT" || true)"
              if grep -Fq "window.__ctR379Marker='home-stable-no-late-recompose+visible-meta-fast+fresh-v322-strict+profile-fast-cache'" <<<"$JS"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
