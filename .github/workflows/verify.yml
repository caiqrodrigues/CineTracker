name: Verify Web 1.0.72 r281 Watch Click Isolation

on:
  push:
    branches: [main, 'fix/r281-watch-click-isolation']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_72_r281:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r281
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.72"' package.json
          grep -Fq '"version": "1.0.72"' apps/web/package.json
          grep -Fq 'build-r281-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r281-watch-click-isolation.js
          test -f apps/web/build-r281.mjs
          test -f apps/web/build-r281-official.mjs
          test -f apps/web/test-r281.mjs
          test -f apps/web/test-r281-browser.mjs
          test -f scripts/test-r281-exact-bundle-browser.mjs
      - name: Syntax r281 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r281-watch-click-isolation.js
          node --check apps/web/build-r281.mjs
          node --check apps/web/build-r281-official.mjs
          node --check apps/web/test-r281.mjs
          node --check apps/web/test-r281-browser.mjs
          node --check scripts/test-r281-exact-bundle-browser.mjs
      - name: Build official r281
        working-directory: apps/web
        run: node build-r281-official.mjs
      - name: Static regressions r281
        working-directory: apps/web
        run: node test-r281.mjs
      - name: Chromium Lioness watched-click isolation r281
        working-directory: apps/web
        run: node test-r281-browser.mjs
      - name: Exact final bundle boot r281
        run: node scripts/test-r281-exact-bundle-browser.mjs
      - name: Final bundle identity r281
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v281.js
          grep -Fq "window.__ctWebBuild='1.0.72';window.__ctOfficialVersion='1.0.72';" dist/app-v281.js
          grep -Fq "const REVISION='r281-official-1.0.72';" dist/app-v281.js
          grep -Fq "window.__ctR280='minimal-watch-check+green-active'" dist/app-v281.js
          grep -Fq "window.__ctR281='watch-click-isolation+single-owner-refresh'" dist/app-v281.js
          grep -Fq "window.__ctR281Watch='window-capture+no-card-navigation+no-data-changed-broadcast'" dist/app-v281.js
          grep -Fq "window.addEventListener('click',ct281CaptureWatchClick,true);" dist/app-v281.js
          grep -Fq 'ct279MarkWatched=ct281MarkWatched;' dist/app-v281.js
          grep -Fq 'app-v281.js' dist/index.html
          grep -Fq 'app-v281.css' dist/index.html
          grep -Fq '"version": "1.0.72"' dist/release.json
          grep -Fq '"revision": "r281-official-1.0.72"' dist/release.json
          grep -Fq '"home_watch_click_owner": "window-capture-r281"' dist/release.json
          grep -Fq '"home_watch_card_navigation_blocked": true' dist/release.json
          grep -Fq '"home_watch_refresh": "canonical-r6-single-owner"' dist/release.json
          grep -Fq '"home_watch_data_changed_broadcast": false' dist/release.json
          grep -Fq '"home_watch_layout": "inline-right-all-producers"' dist/release.json
          grep -Fq '"home_watch_stability": "single-producer"' dist/release.json
          grep -Fq '"home_tabs_fixed": true' dist/release.json
          grep -Fq '"sidebar_fixed": true' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.72-r281';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_72_r281]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.72 r281
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.72"' <<<"$BODY" && grep -Fq '"revision": "r281-official-1.0.72"' <<<"$BODY" && grep -Fq '"home_watch_click_owner": "window-capture-r281"' <<<"$BODY" && grep -Fq '"home_watch_card_navigation_blocked": true' <<<"$BODY" && grep -Fq '"home_watch_data_changed_broadcast": false' <<<"$BODY" && grep -Fq '"home_watch_stability": "single-producer"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v281.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v281.css?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR281='watch-click-isolation+single-owner-refresh'" <<<"$JS" && grep -Fq '[data-home] .media-row.ct279-watch-host' <<<"$CSS" && grep -Fq 'app-v281.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
