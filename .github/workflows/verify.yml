name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_r201:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate Web r201 source chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r199-rewatch-favorites-sports.js
          node --check apps/web/runtime-r200-sports-search-cleanup.js
          node --check apps/web/runtime-r201-sports-discover-filter.js
          node --check apps/web/build-r201.mjs
          node --check apps/web/test-r201.mjs
          grep -Fq "window.__ctR199Rewatch='persistent-2x-3x-4x-no-disable';" apps/web/runtime-r199-rewatch-favorites-sports.js
          grep -Fq "window.__ctR199Favorites='view-more-opens-movie-series-person';" apps/web/runtime-r199-rewatch-favorites-sports.js
          grep -Fq "window.__ctR201Sports='remove-summary-time-empty-bars-profile-stats-only';" apps/web/runtime-r201-sports-discover-filter.js
          grep -Fq "window.__ctR201Discover='filter-trigger-right-of-global-search';" apps/web/runtime-r201-sports-discover-filter.js
      - name: Build Web r201
        working-directory: apps/web
        run: npm run build
      - name: Assert assembled Web r201 artifact
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v201.js
          grep -Fq 'r201-sports-discover-filter' apps/web/dist/app-v201.js
          grep -Fq 'persistent-2x-3x-4x-no-disable' apps/web/dist/app-v201.js
          grep -Fq 'view-more-opens-movie-series-person' apps/web/dist/app-v201.js
          grep -Fq 'remove-summary-time-empty-bars-profile-stats-only' apps/web/dist/app-v201.js
          grep -Fq 'filter-trigger-right-of-global-search' apps/web/dist/app-v201.js
          grep -Fq '.sports-summary-r159' apps/web/dist/app-v201.js
          grep -Fq '[data-sports-time-banner]' apps/web/dist/app-v201.js
          grep -Fq 'ct201-discover-filter-button' apps/web/dist/app-v201.js
          grep -Fq '"revision":"r201-sports-discover-filter"' apps/web/dist/release.json
          grep -Fq 'app-v201.js' apps/web/dist/index.html
          test ! -f apps/web/dist/app-v200.js

  android_099752:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate Android 0.99.7.52 source and assembled runtime
        run: |
          set -euo pipefail
          grep -Fq "versionName '0.99.7.52'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10022' apps/android/app/build.gradle
          node --check apps/android/runtime-r224-discover-controller-watchlist.js
          node --check scripts/prepare-android-v099752.mjs
          node --check scripts/test-android-v099752.mjs
          node scripts/prepare-android-v099752.mjs
          node scripts/test-android-v099752.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r224-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r224 embedded runtime missing');
          const js=h.slice(a+marker.length,b);
          for(const m of ['one-controller-all-nine-tabs-r217-top10-no-stale-paint','foryou-trocar-immediate-in-place','success-animation-immediate-next-recommendation','single-row-compact-auto-width-28px-pills','persistent-2x-3x-4x-no-disable','view-more-opens-movie-series-person','r217-library-behavior-no-r219-synthetic-fallback'])if(!js.includes(m))throw new Error('missing '+m);
          for(const old of ['ct219-manual-cover','negative-id-resolve-or-local-detail','ctR219FindManualMedia'])if(js.includes(old))throw new Error('rejected .47 runtime embedded: '+old);
          fs.writeFileSync('/tmp/ct99752-verify.js',js);
          NODE
          node --check /tmp/ct99752-verify.js

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r201]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Production Web serves r201
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r201-sports-discover-filter"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v201.js?ct=$(date +%s%N)" || true)"
              if grep -Fq 'remove-summary-time-empty-bars-profile-stats-only' <<<"$JS" \
                && grep -Fq 'filter-trigger-right-of-global-search' <<<"$JS" \
                && grep -Fq 'ct201-discover-filter-button' <<<"$JS" \
                && grep -Fq 'persistent-2x-3x-4x-no-disable' <<<"$JS" \
                && grep -Fq 'view-more-opens-movie-series-person' <<<"$JS"; then
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1
