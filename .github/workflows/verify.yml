name: Verify Web 1.0.203 r412 Strict Recommendations
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r412:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and strict recommendation regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check build-r412.mjs
          node --check build-r412-official.mjs
          node --check test-r412.mjs
          node --check runtime-r412-global-recommendation-eligibility.js
          node build-r412-official.mjs
          CT_R412_SKIP_BUILD=1 node test-r412.mjs
          node --check dist/app-v412.js
          grep -Fq "window.__ctR412Marker='strict-40min-youtube-web-novela+server-v412+7-swap-repair'" dist/app-v412.js
          grep -Fq 'cinetracker_discover_watch_unseen_v412' dist/app-v412.js
          grep -Fq 'cinetracker_discover_fresh_v412' dist/app-v412.js
          grep -Fq 'cinetracker_home_series_v412' dist/app-v412.js
          grep -Fq 'data-ct411-action="swap"' dist/app-v412.js
          grep -Fq 'const MIN_RUNTIME=40' dist/app-v412.js
          ! grep -Fq "window.location.reload(" runtime-r412-global-recommendation-eligibility.js
          ! grep -Fq "router.refresh(" runtime-r412-global-recommendation-eligibility.js
          ! grep -Fq "while(true)" runtime-r412-global-recommendation-eligibility.js
          ! grep -Fq "new MutationObserver" runtime-r412-global-recommendation-eligibility.js
          ! grep -Fq "setInterval(" runtime-r412-global-recommendation-eligibility.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r412, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.203"' <<<"$BODY" && grep -Fq '"revision": "r412-official-1.0.203"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v412.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR412Marker='strict-40min-youtube-web-novela+server-v412+7-swap-repair'" <<<"$JS" \
                && grep -Fq 'cinetracker_discover_fresh_v412' <<<"$JS" \
                && grep -Fq 'data-ct411-action="swap"' <<<"$JS" \
                && grep -Fq 'app-v412.js' <<<"$HTML"; then
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1
