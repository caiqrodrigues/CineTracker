name: Verify Web 0.3.21 r494
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web_r494:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r494 clean-boot regression gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v494.js
          ! grep -Fq 'data-ct479-preboot' apps/web/dist/index.html
          ! grep -Fq 'data-ct461-preboot' apps/web/dist/index.html
          ! grep -Fq 'Carregando Home' apps/web/dist/index.html
          grep -Fq "window.__ctR494Marker='clean-current-ui+local-first-auth+no-gold-preboot+dead-runtime-strip'" apps/web/dist/app-v494.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r494, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r494 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/home?ct=$CT" || true)"
            if grep -Fq '"version": "0.3.21"' <<<"$BODY" && grep -Fq '"revision": "r494-official-0.3.21"' <<<"$BODY" \
              && grep -Fq 'app-v494.js?ct=r494-official-0.3.21' <<<"$HTML" \
              && ! grep -Fq 'data-ct479-preboot' <<<"$HTML" \
              && ! grep -Fq 'Carregando Home' <<<"$HTML"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v494.js?ct=$CT" || true)"
              if grep -Fq "window.__ctR494Marker='clean-current-ui+local-first-auth+no-gold-preboot+dead-runtime-strip'" <<<"$JS"; then exit 0; fi
            fi
            if [ "$i" -eq 240 ]; then exit 1; fi
            sleep 5
          done
