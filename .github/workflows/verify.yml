name: Verify Web 1.0.179 r388 Home and Pra Voce
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r388:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and scoped regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check runtime-r388-home-foryou-final.js
          node --check build-r388.mjs
          node --check test-r388-browser.mjs
          node build-r388-official.mjs
          CT_R388_SKIP_BUILD=1 node test-r388.mjs
          CT_R388_SKIP_BUILD=1 node test-r388-browser.mjs
          node --check dist/app-v388.js
          grep -Fq "window.__ctR388Marker='home-series-first-complete+movies-all-1381+foryou-direct-strict-no-empty-actions'" dist/app-v388.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r388, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.179"' <<<"$BODY" && grep -Fq '"revision": "r388-official-1.0.179"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v388.js?ct=$CT" || true)"
              if grep -Fq "window.__ctR388Marker='home-series-first-complete+movies-all-1381+foryou-direct-strict-no-empty-actions'" <<<"$JS"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
