name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax check r174 source runtime
        run: |
          node --check apps/web/runtime-r169.js
          node --check apps/web/runtime-r170.js
          node --check apps/web/runtime-r171.js
          node --check apps/web/runtime-r172.js
          node --check apps/web/runtime-r173.js
          node --check apps/web/runtime-r174.js
          node --check apps/web/build-r174.mjs
      - name: Build exact CineTracker Web r174 artifact used by Vercel
        working-directory: apps/web
        run: npm run build
      - name: Assert r174 instant optimistic authority
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v174.js
          test "$(grep -o '<script' apps/web/dist/index.html | wc -l)" -eq 1
          grep -Fq "r174-instant-optimistic-motion" apps/web/dist/app-v174.js
          grep -Fq "optimistic-instant-motion-episode-toggle" apps/web/dist/app-v174.js
          grep -Fq "ui-first-db-second-flip-reflow" apps/web/dist/app-v174.js
          grep -Fq "cinetracker_unmark_episode_v1" apps/web/dist/app-v174.js
          grep -Fq "data-ct174-unmark-episode" apps/web/dist/app-v174.js
          grep -Fq "ct174-flash" apps/web/dist/app-v174.css
          grep -Fq "ct174-watch-toggle" apps/web/dist/app-v174.css
          grep -Fq "ct173-detail-window" apps/web/dist/app-v174.js
          grep -Fq "only-10-canonical-services-no-plan-or-channel-duplicates" apps/web/dist/app-v174.js
          grep -Fq '"revision":"r174-instant-optimistic-motion"' apps/web/dist/release.json
          test ! -f apps/web/dist/app-v173.js
      - name: Upload exact r174 web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-web-r174-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  android_09978_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.8 r174 instant identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.8'" apps/android/app/build.gradle
          grep -q 'versionCode 9978' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.8-r174-instant-motion' scripts/prepare-android-v09978.mjs
          grep -q 'web-r174-instant-functional-parity' scripts/prepare-android-v09978.mjs
          grep -q 'cinetracker_unmark_episode_v1' scripts/prepare-android-v09978.mjs
          node --check scripts/prepare-android-v09978.mjs
          node --check scripts/test-android-v09978.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Production domain serves r174
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 70); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r174-instant-optimistic-motion"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v174.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v174.css?ct=$(date +%s%N)" || true)"
              if grep -Fq "const REVISION='r174-instant-optimistic-motion';" <<<"$JS" && grep -Fq "optimistic-instant-motion-episode-toggle" <<<"$JS" && grep -Fq "ct174-flash" <<<"$CSS"; then
                echo 'PRODUCTION_R174_OK instant-optimistic-motion'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production domain did not serve r174-instant-optimistic-motion in time.' >&2
          exit 1
