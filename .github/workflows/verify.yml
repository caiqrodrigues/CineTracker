name: Verify Web 1.0.195 r404 Home + Pra Voce
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r404:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and scoped regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check runtime-r404-home-discover-final.js
          node --check build-r404.mjs
          node --check build-r404-official.mjs
          node --check test-r404.mjs
          node --check test-r404-browser.mjs
          node build-r404-official.mjs
          CT_R404_SKIP_BUILD=1 node test-r404.mjs
          CT_R404_SKIP_BUILD=1 node test-r404-browser.mjs
          node --check dist/app-v404.js
          grep -Fq "window.__ctR404Marker='home-counts-authority+movies+live-foryou-owner+no-freeze'" dist/app-v404.js
          grep -Fq "r404 retired r403 runtime" dist/app-v404.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r404, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.195"' <<<"$BODY" && grep -Fq '"revision": "r404-official-1.0.195"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v404.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR404Marker='home-counts-authority+movies+live-foryou-owner+no-freeze'" <<<"$JS" && grep -Fq 'app-v404.js' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
