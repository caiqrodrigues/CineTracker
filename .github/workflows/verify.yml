name: Verify Web 1.0.182 r391 Home and Pra Voce
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r391:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and scoped regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check runtime-r388-home-foryou-final.js
          node --check runtime-r391-home-foryou-authority.js
          node --check build-r391.mjs
          node --check test-r391.mjs
          node --check test-r391-browser.mjs
          node build-r391-official.mjs
          CT_R391_SKIP_BUILD=1 node test-r391.mjs
          CT_R391_SKIP_BUILD=1 node test-r391-browser.mjs
          node --check dist/app-v391.js
          grep -Fq "window.__ctR391Marker='home-first-paint-authority+history-fast+foryou-strict-fast'" dist/app-v391.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r391, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.182"' <<<"$BODY" && grep -Fq '"revision": "r391-official-1.0.182"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v391.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR391Marker='home-first-paint-authority+history-fast+foryou-strict-fast'" <<<"$JS" && grep -Fq 'app-v391.js' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
