name: Verify Web 1.0.194 r403 Home + Pra Voce
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r403:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and scoped regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check runtime-r403-home-discover-stable.js
          node --check build-r403.mjs
          node --check build-r403-official.mjs
          node --check test-r403.mjs
          node --check test-r403-browser.mjs
          node build-r403-official.mjs
          CT_R403_SKIP_BUILD=1 node test-r403.mjs
          CT_R403_SKIP_BUILD=1 node test-r403-browser.mjs
          node --check dist/app-v403.js
          grep -Fq "window.__ctR403Marker='home-counts-authority+movies+live-foryou-owner+no-freeze'" dist/app-v403.js
          grep -Fq "r403 retired r402 runtime" dist/app-v403.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r403, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.194"' <<<"$BODY" && grep -Fq '"revision": "r403-official-1.0.194"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v403.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR403Marker='home-counts-authority+movies+live-foryou-owner+no-freeze'" <<<"$JS" && grep -Fq 'app-v403.js' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
