name: Verify Web 1.0.136 r345 Pra Voce Back Filters

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_136_r345:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Version identity r345
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.136"' package.json
          grep -Fq '"version": "1.0.136"' apps/web/package.json
          grep -Fq 'build-r345-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r345-foryou-back-filters.js
          test -f apps/web/build-r345.mjs
          test -f apps/web/build-r345-official.mjs
          test -f apps/web/test-r345.mjs
          test -f apps/web/test-r345-browser.mjs
          test -f supabase/migrations/20260923030000_r337_episode_catalog_search.sql
      - name: Syntax r345
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r345-foryou-back-filters.js
          node --check apps/web/build-r345.mjs
          node --check apps/web/build-r345-official.mjs
          node --check apps/web/test-r345.mjs
          node --check apps/web/test-r345-browser.mjs
      - name: Current regression lineage
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run test:r330
          npm run test:r331
          npm run test:r332
          npm run test:r333
          npm run test:r334
          npm run test:r335
          npm run test:r336
          npm run test:r337
          npm run test:r337:browser
          npm run test:r338
          npm run test:r338:browser
          npm run test:r339
          npm run test:r339:browser
          npm run test:r340
          npm run test:r340:browser
          npm run test:r341
          npm run test:r342
          npm run test:r342:browser
          npm run test:r343
          npm run test:r343:browser
          npm run test:r344
          npm run test:r344:browser
      - name: Focused r345 Pra Voce buttons + back icon + filters removed browser gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run test:r345
          npm run test:r345:browser
      - name: Final bundle identity r345
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r345-official.mjs
          node --check dist/app-v345.js
          CT_R345_SKIP_BUILD=1 node test-r345.mjs
          grep -Fq 'app-v345.js' dist/index.html
          grep -Fq 'app-v345.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.136'
            && r.revision==='r345-official-1.0.136'
            && r.search_global==='movies+series+actors+episodes'
            && r.search_episode_local==='cinetracker_episode_search_v337'
            && r.home_navigation==='r337-desired-tab-authority+multi-settle+user-scroll-cancel'
            && r.discover_foryou_swap==='same-bucket+same-kind-only'
            && r.sports_startup==='every-open-warm+force-provider-sync+auth-retry+refresh-payload'
            && r.discover_foryou_owner==='r336-only-no-legacy-late-dom-repaint'
            && r.discover_foryou_genres==='exactly-one-primary-genre'
            && r.discover_foryou_actions==='normal-flow-grid-2-or-3+swap-always-present'
            && r.discover_foryou_geometry==='r342-excluded-from-ct336-actions'
            && r.discover_foryou_filters==='removed-ui+forced-all'
            && r.navigation_back==='icon-only-left-of-search-no-text-button'
            && r.discover_header==='back-and-search-same-row-no-vacuum'
            && r.discover_top10_geometry==='desktop-ten-equal-columns-visible-in-viewport'
            && r.home_startup==='fresh-payload+history+live-reconcile+metadata-hydrate-before-reveal'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_136_r345, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.136 r345
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.136"' <<<"$BODY" \
              && grep -Fq '"revision": "r345-official-1.0.136"' <<<"$BODY" \
              && grep -Fq '"search_episode_local": "cinetracker_episode_search_v337"' <<<"$BODY" \
              && grep -Fq '"sports_startup": "every-open-warm+force-provider-sync+auth-retry+refresh-payload"' <<<"$BODY" \
              && grep -Fq '"discover_foryou_filters": "removed-ui+forced-all"' <<<"$BODY" \
              && grep -Fq '"navigation_back": "icon-only-left-of-search-no-text-button"' <<<"$BODY" \
              && grep -Fq '"discover_top10_geometry": "desktop-ten-equal-columns-visible-in-viewport"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v345.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR345Marker='foryou-grid-actions+icon-back-in-search-row+filters-removed'" <<<"$JS" \
                && grep -Fq 'normalizeForYou345' <<<"$JS" \
                && grep -Fq 'cinetracker_episode_search_v337' <<<"$JS" \
                && grep -Fq 'app-v345.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=8000 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" \
                  && grep -Fq 'v1.0.136' <<<"$DOM" \
                  && grep -Fq 'r345-official-1.0.136' <<<"$DOM" \
                  && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
