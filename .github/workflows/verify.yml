name: Verify Web 1.0.86 r295 Discover Single Owner Fast Tabs

on:
  push:
    branches: [main, 'fix/web-r295-discover-single-owner-fast-tabs']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_86_r295:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r295
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.86"' package.json
          grep -Fq '"version": "1.0.86"' apps/web/package.json
          grep -Fq 'build-r295-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r295-discover-single-owner-fast-tabs.js
          test -f apps/web/build-r295.mjs
          test -f apps/web/build-r295-official.mjs
          test -f apps/web/test-r295.mjs
          test -f apps/web/test-r295-browser.mjs
      - name: Syntax r295 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r295-discover-single-owner-fast-tabs.js
          node --check apps/web/build-r295.mjs
          node --check apps/web/build-r295-official.mjs
          node --check apps/web/test-r295.mjs
          node --check apps/web/test-r295-browser.mjs
      - name: Build official r295
        working-directory: apps/web
        run: node build-r295-official.mjs
      - name: Static regressions r295
        working-directory: apps/web
        run: node test-r295.mjs
      - name: Chromium inherited r286 related interactions
        working-directory: apps/web
        run: node test-r286-browser.mjs
      - name: Chromium inherited r291 actions favorites scroll
        working-directory: apps/web
        run: node test-r291-browser.mjs
      - name: Chromium inherited r293 Pra Você authority
        working-directory: apps/web
        run: node test-r293-browser.mjs
      - name: Chromium inherited r294 density and Top 10
        working-directory: apps/web
        run: node test-r294-browser.mjs
      - name: Chromium r295 stable tabs and cache-first switching
        working-directory: apps/web
        run: node test-r295-browser.mjs
      - name: Final bundle identity r295
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v295.js
          grep -Fq "window.__ctWebBuild='1.0.86';window.__ctOfficialVersion='1.0.86';" dist/app-v295.js
          grep -Fq "const REVISION='r295-official-1.0.86';" dist/app-v295.js
          grep -Fq "window.__ctR294='discover-density-scroll-order-top10-ten-up'" dist/app-v295.js
          grep -Fq "window.__ctR295='discover-single-owner-fast-tabs-no-releases'" dist/app-v295.js
          grep -Fq "window.__ctR295Renderer='single-owner-stable-shell-no-mid-session-rebuild'" dist/app-v295.js
          grep -Fq "window.__ctR295Switch='cache-first-no-loading-reset'" dist/app-v295.js
          ! grep -Fq "['releases','Lançamentos']" dist/app-v295.js
          ! grep -Fq "observer.observe(document.documentElement,{subtree:true,childList:true});" dist/app-v295.js
          ! grep -Fq "setTimeout(()=>void refresh(true),180" dist/app-v295.js
          grep -Fq 'app-v295.js' dist/index.html
          grep -Fq 'app-v295.css' dist/index.html
          grep -Fq '"discover_tabs": "foryou-top10-trending-popular-new-anticipated-top-calendar"' dist/release.json
          grep -Fq '"discover_releases_tab": "removed-at-source"' dist/release.json
          grep -Fq '"discover_renderer": "single-owner-stable-shell"' dist/release.json
          grep -Fq '"discover_switching": "cache-first-no-loading-reset"' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.86-r295';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_86_r295]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.86 r295
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.86"' <<<"$BODY" && grep -Fq '"revision": "r295-official-1.0.86"' <<<"$BODY" && grep -Fq '"discover_releases_tab": "removed-at-source"' <<<"$BODY" && grep -Fq '"discover_renderer": "single-owner-stable-shell"' <<<"$BODY" && grep -Fq '"discover_switching": "cache-first-no-loading-reset"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v295.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR295='discover-single-owner-fast-tabs-no-releases'" <<<"$JS" && ! grep -Fq "['releases','Lançamentos']" <<<"$JS" && grep -Fq 'app-v295.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
