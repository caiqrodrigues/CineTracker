name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build exact CineTracker Web r168 artifact used by Vercel
        working-directory: apps/web
        run: npm run build
      - name: Assert single r168 authority and requested fixes
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v168.js
          test "$(grep -o '<script' apps/web/dist/index.html | wc -l)" -eq 1
          ! grep -Eq 'patch-v[0-9]|hotfix' apps/web/dist/index.html
          test "$(find apps/web/dist -maxdepth 1 -type f -name 'patch-v*.js' | wc -l)" -eq 0
          test ! -f apps/web/dist/app-v162.js
          test ! -f apps/web/dist/app-v163.js
          test ! -f apps/web/dist/app-v164.js
          test ! -f apps/web/dist/app-v165.js
          test ! -f apps/web/dist/app-v166.js
          test ! -f apps/web/dist/app-v167.js
          grep -Fq "single-clean-runtime" apps/web/dist/app-v168.js
          grep -Fq "r168-profile-discover-sports-watched" apps/web/dist/app-v168.js
          grep -Fq "profile-resilient-discover-auth-sports-watched" apps/web/dist/app-v168.js
          grep -Fq "quick-first-no-red-timeout" apps/web/dist/app-v168.js
          grep -Fq "tmdb-auth-retry-no-empty-cache" apps/web/dist/app-v168.js
          grep -Fq "all-event-lists" apps/web/dist/app-v168.js
          grep -Fq "paced-no-db-storm" apps/web/dist/app-v168.js
          grep -Fq "TMDB 401" apps/web/dist/app-v168.js
          grep -Fq "ct168RefreshSession" apps/web/dist/app-v168.js
          grep -Fq "cinetracker_profile_quick_stats_v1" apps/web/dist/app-v168.js
          grep -Fq "ct168RefreshFullProfile" apps/web/dist/app-v168.js
          grep -Fq "cinetracker_sport_mark_watched_v1" apps/web/dist/app-v168.js
          grep -Fq "data-sport-watched" apps/web/dist/app-v168.js
          grep -Fq "Marcar como assistido" apps/web/dist/app-v168.js
          grep -Fq "ct166FavoriteBody=function" apps/web/dist/app-v168.js
          grep -Fq "no-string-appendChild" apps/web/dist/app-v168.js
          grep -Fq "two-rows-five-cards" apps/web/dist/app-v168.js
          grep -Fq "instant-main-history-hidden" apps/web/dist/app-v168.js
          grep -Fq "force-current-day-and-favorite-round" apps/web/dist/app-v168.js
          grep -Fq "Tempo total de tela" apps/web/dist/app-v168.js
          grep -Fq "Tempo em Séries" apps/web/dist/app-v168.js
          grep -Fq "Tempo em Filmes" apps/web/dist/app-v168.js
          grep -Fq "Tempo de série em Watchlist" apps/web/dist/app-v168.js
          grep -Fq "Tempo de filme em Watchlist" apps/web/dist/app-v168.js
          grep -Fq "Tempo total em Watchlist" apps/web/dist/app-v168.js
          grep -Fq "ct-reconcile-library-user" apps/web/dist/app-v168.js
          grep -Fq '"revision":"r168-profile-discover-sports-watched"' apps/web/dist/release.json
          grep -Fq '"outputDirectory": "dist"' apps/web/vercel.json
          grep -Fq "idx_media_logical_key_v0997" supabase/migrations/20260831211500_r168_profile_dashboard_logical_key_index.sql
          grep -Fq "cinetracker_profile_quick_stats_v1" supabase/migrations/20260831212500_r168_profile_quick_stats.sql
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('apps/web/dist/app-v168.js','utf8');
          const labels=[
            'Episódios','Filmes','Séries Watchlist','Filmes Watchlist','Tempo total de tela',
            'Tempo em Séries','Tempo em Filmes','Tempo de série em Watchlist','Tempo de filme em Watchlist','Tempo total em Watchlist'
          ];
          let at=-1;
          for(const label of labels){const next=js.indexOf("['"+label+"'",at+1);if(next<=at)throw new Error('Profile stat order missing: '+label);at=next;}
          if(!js.includes("ct163Decorate=function(){\n  if(route()!=='profile')return;"))throw new Error('Discover legacy decorator was not disabled');
          if(!js.includes("ct163PreloadAll=async function()"))throw new Error('paced preload override missing');
          NODE
      - name: Upload exact r168 web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-web-r168-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  android_0997_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.3 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.3'" apps/android/app/build.gradle
          grep -q 'versionCode 9973' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.3-r151-library-sync' scripts/prepare-android-v09973.mjs
          grep -q 'window.__ct0997R151Loaded' scripts/prepare-android-v09973.mjs
          grep -q 'cinetracker:app-foreground' scripts/test-android-v09973.mjs
          grep -q 'android:id="@+id/nav_history"' apps/android/app/src/main/res/layout/activity_main.xml
          grep -q 'android:visibility="gone"' apps/android/app/src/main/res/layout/activity_main.xml
          node --check scripts/prepare-android-v09973.mjs
          node --check scripts/test-android-v09973.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Production domain serves r168
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r168-profile-discover-sports-watched"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v168.js?ct=$(date +%s%N)" || true)"
              if grep -Fq "const REVISION='r168-profile-discover-sports-watched';" <<<"$JS" && grep -Fq "quick-first-no-red-timeout" <<<"$JS" && grep -Fq "tmdb-auth-retry-no-empty-cache" <<<"$JS" && grep -Fq "all-event-lists" <<<"$JS" && grep -Fq "paced-no-db-storm" <<<"$JS"; then
                echo 'PRODUCTION_R168_OK profile+discover+sports-watched'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production domain did not serve r168-profile-discover-sports-watched in time.' >&2
          exit 1
