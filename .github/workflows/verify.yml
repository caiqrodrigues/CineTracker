name: Verify Web 1.0.159 r368 Random Swap and Sports No Refresh
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_1_0_159_r368:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Source identity and syntax
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.159"' package.json
          grep -Fq '"version": "1.0.159"' apps/web/package.json
          node --check apps/web/runtime-r368-random-sports-no-refresh.js
          node --check apps/web/build-r368.mjs
          node --check apps/web/test-r368.mjs
          node --check apps/web/test-r368-browser.mjs
      - name: Build and regression tests
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r368-official.mjs
          CT_R368_SKIP_BUILD=1 node test-r368.mjs
          CT_R368_SKIP_BUILD=1 node test-r368-browser.mjs
          node --check dist/app-v368.js
          grep -Fq 'app-v368.js' dist/index.html
          grep -Fq 'ct-web-1.0.159-r368' dist/service-worker.js
  android_current_source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_159_r368, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.159"' <<<"$BODY" && grep -Fq '"revision": "r368-official-1.0.159"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v368.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR368Marker='foryou-swap-lock+session-no-repeat+random-tmdb-pages+sports-optimistic-no-refresh'" <<<"$JS" && grep -Fq 'app-v368.js' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
