name: Verify Web 1.0.122 r331 Home Discover Stabilization

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_122_r331:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Version identity r331
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.122"' package.json
          grep -Fq '"version": "1.0.122"' apps/web/package.json
          grep -Fq 'build-r331-official.mjs' apps/web/package.json
          test -f apps/web/build-r331.mjs
          test -f apps/web/build-r331-official.mjs
          test -f apps/web/runtime-r331-home-discover-stable.js
          test -f apps/web/test-r331.mjs
          test -f apps/web/test-r331-browser.mjs
      - name: Syntax r331 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r331-home-discover-stable.js
          node --check apps/web/build-r331.mjs
          node --check apps/web/build-r331-official.mjs
          node --check apps/web/test-r331.mjs
          node --check apps/web/test-r331-browser.mjs
      - name: Focused r331 browser gate
        working-directory: apps/web
        run: node test-r331-browser.mjs
      - name: Stable regression suite through r326 plus r331
        working-directory: apps/web
        run: npm run verify
      - name: Final bundle identity r331
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r331-official.mjs
          node --check dist/app-v331.js
          CT_R331_SKIP_BUILD=1 node test-r331.mjs
          grep -Fq 'app-v331.js' dist/index.html
          grep -Fq 'app-v331.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.122'
            && r.revision==='r331-official-1.0.122'
            && r.base==='r326-last-green'
            && r.home_history_behavior==='natural-page-above-initial-viewport-oldest-top-newest-nearest-anchor'
            && r.discover_filter_authority==='cinetracker_discover_filter_v327'
            && r.discover_foryou_filter_ui==='always-visible-todos+filmes+series+animes'
            && r.discover_foryou_actions==='owned-watchlist+seen+swap-flex-one-row-25px'
            && r.home_episode_live_reconcile==='recently-watched-first+latest-release-new-badge'
            && r.profile_watchlist_counts==='r324-preserved-exact'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_122_r331, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.122 r331
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.122"' <<<"$BODY" \
              && grep -Fq '"revision": "r331-official-1.0.122"' <<<"$BODY" \
              && grep -Fq '"discover_filter_authority": "cinetracker_discover_filter_v327"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v331.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR331Marker='home-history-above-viewport+foryou-owned-actions-filters+discover-v327'" <<<"$JS" \
                && grep -Fq 'cinetracker_discover_filter_v327' <<<"$JS" \
                && grep -Fq 'data-ct331-fy-kind' <<<"$JS" \
                && grep -Fq 'app-v331.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=8000 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
