name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate frozen Web r179
        run: |
          node --check apps/web/runtime-r179.js
          node --check apps/web/build-r179.mjs
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r178-stable-home.mjs
          node scripts/test-r179-target-card.mjs
      - name: Build frozen Web r179
        working-directory: apps/web
        run: npm run build
      - name: Assert Web r179
        run: |
          grep -Fq "r179-home-target-card" apps/web/dist/app-v179.js
          grep -Fq "home-target-card-by-media-id" apps/web/dist/app-v179.js
          grep -Fq '"revision":"r179-home-target-card"' apps/web/dist/release.json

  android_099715_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.15
        run: |
          grep -q "versionName '0.99.7.15'" apps/android/app/build.gradle
          grep -q 'versionCode 9985' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.15-r179-fast-clean-tabs' scripts/prepare-android-v099715.mjs
          grep -q 'cache-first-view-snapshots-background-refresh' scripts/prepare-android-v099715.mjs
          grep -q 'no-redundant-route-header' scripts/prepare-android-v099715.mjs
          grep -q 'safe-inside-poster-no-transform' scripts/prepare-android-v099715.mjs
          node --check scripts/prepare-android-v099715.mjs
          node --check scripts/test-android-v099715.mjs
          node scripts/test-android-v099715.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    steps:
      - name: Production Web remains r179
        run: |
          for i in $(seq 1 60); do BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"; if grep -Fq '"revision":"r179-home-target-card"' <<<"$BODY"; then exit 0; fi; sleep 5; done; exit 1
