name: Verify Web 1.0.132 r341 Discover Poster Lock

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_132_r341:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Version identity r341
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.132"' package.json
          grep -Fq '"version": "1.0.132"' apps/web/package.json
          grep -Fq 'build-r341-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r341-discover-poster-lock.js
          test -f apps/web/build-r341.mjs
          test -f apps/web/build-r341-official.mjs
          test -f apps/web/test-r341.mjs
          test -f apps/web/test-r341-browser.mjs
          test -f supabase/migrations/20260923030000_r337_episode_catalog_search.sql
      - name: Syntax r341
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r341-discover-poster-lock.js
          node --check apps/web/build-r341.mjs
          node --check apps/web/build-r341-official.mjs
          node --check apps/web/test-r341.mjs
          node --check apps/web/test-r341-browser.mjs
      - name: Current regression lineage
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run test:r330
          npm run test:r331
          npm run test:r332
          npm run test:r333
          npm run test:r334
          npm run test:r335
          npm run test:r336
          npm run test:r337
          npm run test:r337:browser
          npm run test:r338
          npm run test:r338:browser
          npm run test:r339
          npm run test:r339:browser
          npm run test:r340
          npm run test:r340:browser
      - name: Focused r341 static + desktop/mobile browser gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run test:r341
          npm run test:r341:browser
      - name: Final bundle identity r341
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r341-official.mjs
          node --check dist/app-v341.js
          CT_R341_SKIP_BUILD=1 node test-r341.mjs
          grep -Fq 'app-v341.js' dist/index.html
          grep -Fq 'app-v341.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.132'
            && r.revision==='r341-official-1.0.132'
            && r.search_global==='movies+series+actors+episodes'
            && r.search_episode_local==='cinetracker_episode_search_v337'
            && r.home_navigation==='r337-desired-tab-authority+multi-settle+user-scroll-cancel'
            && r.discover_foryou_swap==='same-bucket+same-kind-only'
            && r.discover_foryou_actions==='optimistic-immediate-replacement'
            && r.sports_startup==='every-open-warm+force-provider-sync+auth-retry+refresh-payload'
            && r.discover_all_tabs_actions==='rendered-poster-width+explicit-equal-pixel-buttons+late-settle+resize-observer'
            && r.discover_action_authority==='r341-poster-rect-only'
            && r.discover_action_conflicts==='r338+r339-method-layout-wrappers-retired'
            && r.discover_action_validation==='desktop-1680x900+mobile-412x915'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_132_r341, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.132 r341
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.132"' <<<"$BODY" \
              && grep -Fq '"revision": "r341-official-1.0.132"' <<<"$BODY" \
              && grep -Fq '"search_episode_local": "cinetracker_episode_search_v337"' <<<"$BODY" \
              && grep -Fq '"sports_startup": "every-open-warm+force-provider-sync+auth-retry+refresh-payload"' <<<"$BODY" \
              && grep -Fq '"discover_action_authority": "r341-poster-rect-only"' <<<"$BODY" \
              && grep -Fq '"discover_action_validation": "desktop-1680x900+mobile-412x915"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v341.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR341Marker='discover-poster-lock+explicit-button-pixels+legacy-layout-writers-retired'" <<<"$JS" \
                && grep -Fq 'geometry341' <<<"$JS" \
                && grep -Fq 'cinetracker_episode_search_v337' <<<"$JS" \
                && grep -Fq 'app-v341.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=8000 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" \
                  && grep -Fq 'v1.0.132' <<<"$DOM" \
                  && grep -Fq 'r341-official-1.0.132' <<<"$DOM" \
                  && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
