name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build clean CineTracker Web 0.99.7 r159
        run: npm run build
      - name: Assert single Web authority and sports watched time
        shell: bash
        run: |
          set -euo pipefail
          node --check dist/app-v159.js
          node scripts/test-web-v159-sports-watch.mjs
          test "$(grep -o '<script' dist/index.html | wc -l)" -eq 1
          ! grep -Eq 'patch-v[0-9]|hotfix' dist/index.html
          test "$(find dist -maxdepth 1 -type f -name 'patch-v*.js' | wc -l)" -eq 0
          test ! -f dist/app-v158.js
          grep -q "single-clean-runtime" dist/app-v159.js
          grep -q "data-home-mark-episode" dist/app-v159.js
          grep -q "Indicação do dia" dist/app-v159.js
          grep -q "Minha Watchlist" dist/app-v159.js
          grep -q "data-add-favorite" dist/app-v159.js
          grep -q "🏆 Esportes" dist/app-v159.js
          grep -q "cinetracker_sport_mark_watched_v1" dist/app-v159.js
          grep -q "cinetracker_sport_stats_v1" dist/app-v159.js
          grep -q "data-sport-watch" dist/app-v159.js
          grep -q "Tempo em esportes" dist/app-v159.js
          grep -q "Histórico assistido" dist/app-v159.js
          grep -q "ct-sports-sync" dist/app-v159.js
          grep -q "ct-web-0.99.7-r159-sports-watch" dist/service-worker.js
          grep -q "user_sport_watch_history" supabase/migrations/20260831122500_sports_watch_history_stats_v1.sql

  android_0997_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.3 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.3'" apps/android/app/build.gradle
          grep -q 'versionCode 9973' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.3-r151-library-sync' scripts/prepare-android-v09973.mjs
          grep -q 'window.__ct0997R151Loaded' scripts/prepare-android-v09973.mjs
          grep -q 'cinetracker:app-foreground' scripts/test-android-v09973.mjs
          grep -q 'android:id="@+id/nav_history"' apps/android/app/src/main/res/layout/activity_main.xml
          grep -q 'android:visibility="gone"' apps/android/app/src/main/res/layout/activity_main.xml
          node --check scripts/prepare-android-v09973.mjs
          node --check scripts/test-android-v09973.mjs
