name: Verify Web 1.0.269 r479
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r479:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r479 Home Discover Profile Sports regression gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v479.js
          grep -Fq "window.__ctR479Marker='home-visible-preboot+discover-v479-strict-memory+profile-v479-history-only+sports-professional-only'" apps/web/dist/app-v479.js
          grep -Fq 'cinetracker_discover_fresh_v479' apps/web/dist/app-v479.js
          grep -Fq 'cinetracker_discover_watch_smart_v479' apps/web/dist/app-v479.js
          grep -Fq 'cinetracker_record_recommendations_v479' apps/web/dist/app-v479.js
          grep -Fq 'cinetracker_profile_lists_v479' apps/web/dist/app-v479.js
          grep -Fq 'cinetracker_sports_payload_v479' apps/web/dist/app-v479.js
          grep -Fq 'cinetracker_f1_watch_sync_v462' apps/web/dist/app-v479.js
          grep -Fq 'data-ct479-preboot' apps/web/dist/index.html
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r479, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r479 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.269"' <<<"$BODY" && grep -Fq '"revision": "r479-official-1.0.269"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v479.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR479Marker='home-visible-preboot+discover-v479-strict-memory+profile-v479-history-only+sports-professional-only'" <<<"$JS" && grep -Fq 'app-v479.js' <<<"$HTML" && grep -Fq 'data-ct479-preboot' <<<"$HTML"; then exit 0; fi
            fi
            if [ "$i" -eq 240 ]; then exit 1; fi
            sleep 5
          done
