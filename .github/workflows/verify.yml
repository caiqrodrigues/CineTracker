name: Verify Web 1.0.45 r254 Video Ground Truth

on:
  push:
    branches: [main, 'fix/r254-video-ground-truth-home-discover-sports-scroll']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_45_r254:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax r254 release chain
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.45"' package.json
          grep -Fq '"version": "1.0.45"' apps/web/package.json
          node --check apps/web/runtime-r254-video-ground-truth.js
          node --check apps/web/build-r254.mjs
          node --check apps/web/build-r254-official.mjs
          node --check apps/web/test-r254.mjs
          node --check apps/web/test-r254-algorithms.mjs
          node --check apps/web/test-r254-browser.mjs
          node --check scripts/test-r254-exact-bundle-browser.mjs
      - name: Build official r254
        working-directory: apps/web
        run: node build-r254-official.mjs
      - name: Static authority regression r254
        working-directory: apps/web
        run: node test-r254.mjs
      - name: Logic regressions r254
        working-directory: apps/web
        run: node test-r254-algorithms.mjs
      - name: Chromium video-ground-truth behavior r254
        working-directory: apps/web
        run: node test-r254-browser.mjs
      - name: Exact final bundle boot r254
        run: node scripts/test-r254-exact-bundle-browser.mjs
      - name: Final bundle identity r254
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v254.js
          grep -Fq "window.__ctWebBuild='1.0.45';window.__ctOfficialVersion='1.0.45';" dist/app-v254.js
          grep -Fq "const REVISION='r254-official-1.0.45';" dist/app-v254.js
          grep -Fq "window.__ctR254='video-ground-truth-home-discover-sports-scroll'" dist/app-v254.js
          grep -Fq "window.__ctR254Home='live-aired-frontier-nonlegacy+legacy-last-aired-only'" dist/app-v254.js
          grep -Fq "window.__ctR254Discover='atomic-tabs-cached-exclusions-time-bounded'" dist/app-v254.js
          grep -Fq "window.__ctR254Sports='inner-root-four-tabs-canonical-history'" dist/app-v254.js
          grep -Fq "window.__ctR254Horizontal='dynamic-local-rails-no-page-x'" dist/app-v254.js
          grep -Fq 'window.__ctR254LegacyR239ObserverDisabled=true' dist/app-v254.js
          grep -Fq 'window.__ctR254LegacyR247ObserverDisabled=true' dist/app-v254.js
          grep -Fq 'window.__ctR254R252QueueClassifierDisabled=true' dist/app-v254.js
          grep -Fq 'window.__ctR254R252PaintClassifierDisabled=true' dist/app-v254.js
          grep -Fq 'last_episode_to_air' dist/app-v254.js
          grep -Fq 'cinetracker_home_live_v0997_r3' dist/app-v254.js
          grep -Fq 'cinetracker_sports_payload_v1' dist/app-v254.js
          grep -Fq 'cinetracker_sport_mark_watched_v1' dist/app-v254.js
          grep -Fq 'cinetracker_profile_payload_v0997_r2' dist/app-v254.js
          grep -Fq 'cinetracker_sport_stats_v1' dist/app-v254.js
          ! grep -Fq "window.__ctR253='single-authority-live-data'" dist/app-v254.js
          ! grep -Fq "new MutationObserver(queue239).observe(q('#app')" dist/app-v254.js
          ! grep -Fq "new MutationObserver(()=>queue247(false,35)).observe(q('#app')" dist/app-v254.js
          ! grep -Fq 'cinetracker_sports_events_v0997' dist/app-v254.js
          grep -Fq 'app-v254.js' dist/index.html
          grep -Fq 'app-v254.css' dist/index.html
          grep -Fq '"version": "1.0.45"' dist/release.json
          grep -Fq '"revision": "r254-official-1.0.45"' dist/release.json
          grep -Fq '.ct254-xrail' dist/app-v254.css
          grep -Fq '[data-ct254-sports]>.ct248-f1hub' dist/app-v254.css
          grep -Fq 'overflow-x:clip!important' dist/app-v254.css

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_45_r254]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.45 r254
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.45"' <<<"$BODY" && grep -Fq '"revision": "r254-official-1.0.45"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v254.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v254.css?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR254='video-ground-truth-home-discover-sports-scroll'" <<<"$JS" && grep -Fq "window.__ctR254Sports='inner-root-four-tabs-canonical-history'" <<<"$JS" && grep -Fq "window.__ctR254Discover='atomic-tabs-cached-exclusions-time-bounded'" <<<"$JS" && grep -Fq 'last_episode_to_air' <<<"$JS" && grep -Fq 'cinetracker_sports_payload_v1' <<<"$JS" && ! grep -Fq "window.__ctR253='single-authority-live-data'" <<<"$JS" && ! grep -Fq 'cinetracker_sports_events_v0997' <<<"$JS" && grep -Fq '.ct254-xrail' <<<"$CSS" && grep -Fq '[data-ct254-sports]>.ct248-f1hub' <<<"$CSS" && grep -Fq 'app-v254.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
