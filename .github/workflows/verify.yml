name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build clean CineTracker Web 0.99.7 r160
        run: npm run build
      - name: Assert single Web authority, recent sports and Home history order
        shell: bash
        run: |
          set -euo pipefail
          node --check dist/app-v160.js
          node scripts/test-web-v160-sports-recent-home-history.mjs
          test "$(grep -o '<script' dist/index.html | wc -l)" -eq 1
          ! grep -Eq 'patch-v[0-9]|hotfix' dist/index.html
          test "$(find dist -maxdepth 1 -type f -name 'patch-v*.js' | wc -l)" -eq 0
          test ! -f dist/app-v158.js
          test ! -f dist/app-v159.js
          grep -Fq "single-clean-runtime" dist/app-v160.js
          grep -Fq "data-home-mark-episode" dist/app-v160.js
          grep -Fq "history_episodes=[...episodes].reverse()" dist/app-v160.js
          grep -Fq "history_movies=[...movies].reverse()" dist/app-v160.js
          grep -Fq "Indicação do dia" dist/app-v160.js
          grep -Fq "Minha Watchlist" dist/app-v160.js
          grep -Fq "🏆 Esportes" dist/app-v160.js
          grep -Fq "data-sport-watch" dist/app-v160.js
          grep -Fq "Últimos 7 dias" dist/app-v160.js
          grep -Fq "Tempo esportivo assistido" dist/app-v160.js
          grep -Fq "date_from:shiftDays(-7),date_to:shiftDays(-1)" dist/app-v160.js
          grep -Fq "ct-web-0.99.7-r160-sports-recent-history-order" dist/service-worker.js

  android_0997_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.3 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.3'" apps/android/app/build.gradle
          grep -q 'versionCode 9973' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.3-r151-library-sync' scripts/prepare-android-v09973.mjs
          grep -q 'window.__ct0997R151Loaded' scripts/prepare-android-v09973.mjs
          grep -q 'cinetracker:app-foreground' scripts/test-android-v09973.mjs
          grep -q 'android:id="@+id/nav_history"' apps/android/app/src/main/res/layout/activity_main.xml
          grep -q 'android:visibility="gone"' apps/android/app/src/main/res/layout/activity_main.xml
          node --check scripts/prepare-android-v09973.mjs
          node --check scripts/test-android-v09973.mjs
