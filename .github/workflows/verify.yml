name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax check r175 source runtime
        run: |
          node --check apps/web/runtime-r169.js
          node --check apps/web/runtime-r170.js
          node --check apps/web/runtime-r171.js
          node --check apps/web/runtime-r172.js
          node --check apps/web/runtime-r173.js
          node --check apps/web/runtime-r174.js
          node --check apps/web/runtime-r175.js
          node --check apps/web/build-r175.mjs
      - name: Build exact CineTracker Web r175 artifact used by Vercel
        working-directory: apps/web
        run: npm run build
      - name: Assert r175 Bingers handoff authority
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v175.js
          test "$(grep -o '<script' apps/web/dist/index.html | wc -l)" -eq 1
          grep -Fq "r175-bingers-next-episode" apps/web/dist/app-v175.js
          grep -Fq "bingers-next-episode-instant-handoff" apps/web/dist/app-v175.js
          grep -Fq "current-next-successor-prewarmed-name-score-date" apps/web/dist/app-v175.js
          grep -Fq "optimistic-instant-motion-episode-toggle" apps/web/dist/app-v175.js
          grep -Fq "cinetracker_unmark_episode_v1" apps/web/dist/app-v175.js
          grep -Fq "data-ct174-unmark-episode" apps/web/dist/app-v175.js
          grep -Fq "ct174-flash" apps/web/dist/app-v175.css
          grep -Fq "ct175-next-episode" apps/web/dist/app-v175.css
          grep -Fq "ct173-detail-window" apps/web/dist/app-v175.js
          grep -Fq '"revision":"r175-bingers-next-episode"' apps/web/dist/release.json
          test ! -f apps/web/dist/app-v174.js
      - name: Upload exact r175 web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-web-r175-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  android_09979_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.9 r175 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.9'" apps/android/app/build.gradle
          grep -q 'versionCode 9979' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.9-r175-bingers-handoff' scripts/prepare-android-v09979.mjs
          grep -q 'web-r175-instant-functional-parity' scripts/prepare-android-v09979.mjs
          grep -q 'bingers-next-episode-instant-handoff' scripts/prepare-android-v09979.mjs
          node --check scripts/prepare-android-v09979.mjs
          node --check scripts/test-android-v09979.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Production domain serves r175
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 70); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r175-bingers-next-episode"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v175.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v175.css?ct=$(date +%s%N)" || true)"
              if grep -Fq "const REVISION='r175-bingers-next-episode';" <<<"$JS" && grep -Fq "bingers-next-episode-instant-handoff" <<<"$JS" && grep -Fq "ct175-next-episode" <<<"$CSS"; then
                echo 'PRODUCTION_R175_OK bingers-next-handoff'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production domain did not serve r175-bingers-next-episode in time.' >&2
          exit 1
