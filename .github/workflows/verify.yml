name: Verify Web 1.0.48 r257 Sequence Discover Scroll F1

on:
  push:
    branches: [main, 'fix/r257-sequence-scroll-discover-f1-grid']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_48_r257:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r257
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.48"' package.json
          grep -Fq '"version": "1.0.48"' apps/web/package.json
      - name: Syntax r257 runtime
        run: node --check apps/web/runtime-r257-sequence-scroll-discover-f1-grid.js
      - name: Syntax r257 builders
        run: |
          node --check apps/web/build-r257.mjs
          node --check apps/web/build-r257-official.mjs
      - name: Syntax r257 tests
        run: |
          node --check apps/web/test-r257.mjs
          node --check apps/web/test-r257-algorithms.mjs
          node --check apps/web/test-r257-browser.mjs
          node --check scripts/test-r257-exact-bundle-browser.mjs
      - name: Build official r257
        working-directory: apps/web
        run: node build-r257-official.mjs
      - name: Static authority regression r257
        working-directory: apps/web
        run: node test-r257.mjs
      - name: Logic regressions r257
        working-directory: apps/web
        run: node test-r257-algorithms.mjs
      - name: Chromium user-video behavior r257
        working-directory: apps/web
        run: node test-r257-browser.mjs
      - name: Exact final bundle boot r257
        run: node scripts/test-r257-exact-bundle-browser.mjs
      - name: Final bundle identity r257
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v257.js
          grep -Fq "window.__ctWebBuild='1.0.48';window.__ctOfficialVersion='1.0.48';" dist/app-v257.js
          grep -Fq "const REVISION='r257-official-1.0.48';" dist/app-v257.js
          grep -Fq "window.__ctR257='exact-sequence-discover-personal-exclusions-horizontal-drag-f1-grid'" dist/app-v257.js
          grep -Fq "window.__ctR257Home='exact-watched-set+next-aired-after-frontier+historic-holes-ignored'" dist/app-v257.js
          grep -Fq "window.__ctR257Discover='fail-closed-personal-state+complete-public-pools+poster-cards'" dist/app-v257.js
          grep -Fq "window.__ctR257Horizontal='persistent-rails+pointer-drag+discover-tabs-details-cast'" dist/app-v257.js
          grep -Fq "window.__ctR257F1='weekend-sessions+next-qualifying-grid+previous-start-finish-grid'" dist/app-v257.js
          grep -Fq 'cinetracker_series_episode_state_v1' dist/app-v257.js
          grep -Fq 'cinetracker_profile_media_dashboard_v0991' dist/app-v257.js
          grep -Fq 'cinetracker_watchlist_full_v119' dist/app-v257.js
          grep -Fq 'scrollLeft=st.left-dx' dist/app-v257.js
          grep -Fq 'QualifyingResults' dist/app-v257.js
          grep -Fq 'Grid de largada do próximo GP' dist/app-v257.js
          grep -Fq 'Grid de largada → resultado' dist/app-v257.js
          grep -Fq 'app-v257.js' dist/index.html
          grep -Fq 'app-v257.css' dist/index.html
          grep -Fq '"version": "1.0.48"' dist/release.json
          grep -Fq '"revision": "r257-official-1.0.48"' dist/release.json
          grep -Fq '.ct257-discover-tabs' dist/app-v257.css
          grep -Fq 'touch-action:pan-y!important' dist/app-v257.css
          grep -Fq '.ct257-f1-grid' dist/app-v257.css
          grep -Fq 'overflow-x:clip!important' dist/app-v257.css

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_48_r257]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.48 r257
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.48"' <<<"$BODY" && grep -Fq '"revision": "r257-official-1.0.48"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v257.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v257.css?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR257='exact-sequence-discover-personal-exclusions-horizontal-drag-f1-grid'" <<<"$JS" && grep -Fq "window.__ctR257Home='exact-watched-set+next-aired-after-frontier+historic-holes-ignored'" <<<"$JS" && grep -Fq "window.__ctR257Discover='fail-closed-personal-state+complete-public-pools+poster-cards'" <<<"$JS" && grep -Fq 'cinetracker_series_episode_state_v1' <<<"$JS" && grep -Fq 'QualifyingResults' <<<"$JS" && grep -Fq '.ct257-f1-grid' <<<"$CSS" && grep -Fq 'touch-action:pan-y!important' <<<"$CSS" && grep -Fq 'app-v257.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
