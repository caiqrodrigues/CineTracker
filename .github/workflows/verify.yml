name: Verify Web 1.0.111 r320 Discover History Parity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_111_r320:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r320
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.111"' package.json
          grep -Fq '"version": "1.0.111"' apps/web/package.json
          grep -Fq 'build-r320-official.mjs' apps/web/package.json
          test -f apps/web/build-r320.mjs
          test -f apps/web/build-r320-official.mjs
          test -f apps/web/runtime-r320-discover-profile-history.js
          test -f apps/web/test-r320.mjs
          test -f apps/web/test-r320-browser.mjs
          test -f supabase/migrations/20260920110500_r320_discover_exact_filter_profile_home_history.sql
      - name: Syntax r320 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r320-discover-profile-history.js
          node --check apps/web/build-r320.mjs
          node --check apps/web/build-r320-official.mjs
          node --check apps/web/test-r320.mjs
          node --check apps/web/test-r320-browser.mjs
      - name: Regression suite through r320
        working-directory: apps/web
        run: npm run verify
      - name: Final bundle identity r320
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r320-official.mjs
          node --check dist/app-v320.js
          CT_R320_SKIP_BUILD=1 node test-r320.mjs
          grep -Fq 'app-v320.js' dist/index.html
          grep -Fq 'app-v320.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.111'
            && r.revision==='r320-official-1.0.111'
            && r.discover_filter_authority==='cinetracker_discover_filter_v320'
            && r.discover_validation==='each-rendered-candidate-before-visible'
            && r.profile_activity_source==='watch_history-same-as-home'
            && r.profile_activity_days_rpc==='cinetracker_activity_by_day_v320'
            && r.profile_activity_items_rpc==='cinetracker_activity_items_by_day_v320'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_111_r320, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.111 r320
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.111"' <<<"$BODY" \
              && grep -Fq '"revision": "r320-official-1.0.111"' <<<"$BODY" \
              && grep -Fq '"discover_filter_authority": "cinetracker_discover_filter_v320"' <<<"$BODY" \
              && grep -Fq '"profile_activity_source": "watch_history-same-as-home"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v320.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR320='discover-exact-candidate-filter+profile-home-history-parity'" <<<"$JS" \
                && grep -Fq 'cinetracker_discover_filter_v320' <<<"$JS" \
                && grep -Fq 'cinetracker_activity_items_by_day_v320' <<<"$JS" \
                && grep -Fq 'app-v320.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=7500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
