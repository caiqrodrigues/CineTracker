name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0994:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build and verify CineTracker Web 0.99.4
        run: npm run build
      - name: Preserve Bingers semantics and authentication
        run: |
          node scripts/test-hotfix13-bingers-semantics.mjs
          node scripts/test-auth-recovery-red.mjs
          node scripts/test-hotfix10-native-bridge.mjs
      - name: Assert Web 0.99.4 runtime invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"version": "0.99.4"' package.json
          grep -q 'ct-web-0.99.4' dist/service-worker.js
          for f in patch-v092-v0991.js patch-v093-v0992.js patch-v094-v0992-compat.js patch-v095-v0992-fix.js patch-v096-v0992-unfreeze.js patch-v099-v0994-web.js patch-v101-v0994-nav-pre.js patch-v103-v0994-session-gate.js patch-v104-v0994-authority.js patch-v105-v0994-preload-layout.js patch-v106-v0994-refactor.js patch-v107-v0994-data-ui-fix.js patch-v108-v0994-pwa-resilience.js patch-v109-v0994-settings-web.js patch-v110-v0994-episode-check.js patch-v111-v0994-global-search.js patch-v112-v0994-warm-boot.js patch-v113-v0994-fluidity.js patch-v114-v0994-universal-detail.js; do grep -q "$f" dist/index.html; done
          test "$(grep -o 'patch-v112-v0994-warm-boot.js' dist/index.html | wc -l)" -eq 1
          test "$(grep -o 'patch-v113-v0994-fluidity.js' dist/index.html | wc -l)" -eq 1
          test "$(grep -o 'patch-v114-v0994-universal-detail.js' dist/index.html | wc -l)" -eq 1
          ! grep -q 'patch-v097-v0993-nav-pre.js' dist/index.html
          ! grep -q 'patch-v098-v0993-web.js' dist/index.html
          grep -q 'cinetracker_profile_home_payload_v0994' dist/patch-v099-v0994-web.js
          grep -q 'web-0.99.4-auth-required-nonblocking-preload' dist/patch-v103-v0994-session-gate.js
          grep -q 'void preloadRoute994(target);' dist/patch-v103-v0994-session-gate.js
          ! grep -q '  await preloadRoute994(target);' dist/patch-v103-v0994-session-gate.js
          grep -q 'v104-single-renderer' dist/patch-v104-v0994-authority.js
          grep -q 'v105-preload-desktop-frame' dist/patch-v105-v0994-preload-layout.js
          grep -q 'v106-visual-rules' dist/patch-v106-v0994-refactor.js
          grep -q 'v107-history-settings-cache' dist/patch-v107-v0994-data-ui-fix.js
          grep -q 'v108-web-pwa-home-resilience' dist/patch-v108-v0994-pwa-resilience.js
          grep -q 'v109-browser-settings-complete' dist/patch-v109-v0994-settings-web.js
          grep -q 'v110-canonical-episode-check' dist/patch-v110-v0994-episode-check.js
          grep -q 'v111-home-discover-global-search' dist/patch-v111-v0994-global-search.js
          grep -q 'v113-cache-first-fast-boot' dist/patch-v112-v0994-warm-boot.js
          grep -q 'v114-cache-first-posters-stable-enrichment' dist/patch-v113-v0994-fluidity.js
          grep -q 'v114-universal-media-person-detail' dist/patch-v114-v0994-universal-detail.js
          grep -q 'v114-persistent-hot-route-cache' dist/patch-v092-v0991.js
          grep -q 'ct0994_profile_snapshot_v4' dist/patch-v092-v0991.js
          grep -q 'ct0994_discover_snapshot_v4' dist/patch-v092-v0991.js
          grep -q 'ct-enrich-media-user?limit=80&priority=home' dist/patch-v113-v0994-fluidity.js
          ! grep -q 'cinetracker_profile_activity_v0994' dist/patch-v113-v0994-fluidity.js
          grep -q 'centerTimeline113' dist/patch-v113-v0994-fluidity.js
          grep -q 'for(let i=-10;i<=3;i++)' dist/patch-v092-v0991.js
          grep -q "x.item_type==='episode'" dist/patch-v092-v0991.js
          grep -q 'Filme lançado após 1990 · nota TMDB 8,0 ou maior · nunca visto' dist/patch-v092-v0991.js
          grep -q 'Da sua Watchlist' dist/patch-v092-v0991.js
          grep -q '100% novos' dist/patch-v092-v0991.js
          grep -q 'Promise.allSettled' dist/patch-v092-v0991.js
          grep -q 'source_tmdb_id' dist/patch-v092-v0991.js
          grep -q 'data-ct114-rewatch' dist/patch-v114-v0994-universal-detail.js
          grep -q 'combined_credits' dist/patch-v114-v0994-universal-detail.js
          grep -q 'polyline' dist/patch-v114-v0994-universal-detail.js
          grep -q 'vp.dataset.ct994Anchored' dist/patch-v099-v0994-web.js
          grep -q '/search/multi' dist/patch-v111-v0994-global-search.js
          grep -q 'cinetracker_mark_episode_v0994' dist/patch-v110-v0994-episode-check.js
          grep -q 'cinetracker_discovery_exclusions_v0994' dist/patch-v092-v0991.js
          grep -q 'order=watched_at.desc&limit=5000' dist/patch-v092-v0991.js
          grep -q 'next_episode_to_air' dist/patch-v092-v0991.js
          grep -q 'Gerenciamento de Dados' dist/patch-v106-v0994-refactor.js
          grep -q 'fix2-idempotent-dom-mutation-guard' dist/patch-v096-v0992-unfreeze.js
          grep -q 'v_state:='"'"'Completed'"'"'' supabase/migrations/20260827222500_v0994_episode_check_state_sync.sql
          grep -q '862551' supabase/migrations/20260827225500_v0994_correct_me_time_catalog_identity.sql
          grep -q 'metadata_ready' supabase/migrations/20260828011300_v0994_home_bucket_requires_reliable_episode_catalog.sql
          grep -q 'not b.metadata_ready and b.is_in_progress' supabase/migrations/20260828011300_v0994_home_bucket_requires_reliable_episode_catalog.sql
          grep -q 'Toda atualização' docs/DEVELOPMENT_RULES.md

  android_0994_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.4 publication identity and bundle builder
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.4'" apps/android/app/build.gradle
          grep -q 'versionCode 9940' apps/android/app/build.gradle
          grep -q 'android-v0.99.4-fluid-preload' scripts/prepare-android-v0994.mjs
          grep -q "const version = '0.99.4'" scripts/prepare-android-v0994.mjs
          grep -q 'patch-v113-v0994-fluidity.js' scripts/prepare-android-v0994.mjs
          grep -q 'v113-cache-first-fast-boot' scripts/prepare-android-v0994.mjs
          grep -q 'v114-persistent-hot-route-cache' scripts/prepare-android-v0994.mjs
          grep -q 'v114-cache-first-posters-catalog' scripts/prepare-android-v0994.mjs
          grep -q 'ct0994_profile_snapshot_v4' scripts/prepare-android-v0994.mjs
          grep -q 'ct0994_discover_snapshot_v4' scripts/prepare-android-v0994.mjs
          grep -q 'void preloadRoute994(target);' scripts/prepare-android-v0994.mjs
          grep -q 'window.ct15Navigate = navigate994' scripts/prepare-android-v0994.mjs
          grep -q 'android:id="@+id/nav_history"' apps/android/app/src/main/res/layout/activity_main.xml
          grep -q 'android:visibility="gone"' apps/android/app/src/main/res/layout/activity_main.xml
          node --check scripts/prepare-android-v0994.mjs
          node --check scripts/test-android-v0994.mjs
