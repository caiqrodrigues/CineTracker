name: Verify Web 1.0.137 r346 Layout Rollback Discover Clean

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_137_r346:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Version identity r346
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.137"' package.json
          grep -Fq '"version": "1.0.137"' apps/web/package.json
          grep -Fq 'build-r346-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r346-layout-rollback-discover-clean.js
          test -f apps/web/build-r346.mjs
          test -f apps/web/build-r346-official.mjs
          test -f apps/web/test-r346.mjs
          test -f apps/web/test-r346-browser.mjs
          test -f supabase/migrations/20260923030000_r337_episode_catalog_search.sql
      - name: Syntax r346
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r346-layout-rollback-discover-clean.js
          node --check apps/web/build-r346.mjs
          node --check apps/web/build-r346-official.mjs
          node --check apps/web/test-r346.mjs
          node --check apps/web/test-r346-browser.mjs
      - name: Current regression lineage
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run test:r330
          npm run test:r331
          npm run test:r332
          npm run test:r333
          npm run test:r334
          npm run test:r335
          npm run test:r336
          npm run test:r337
          npm run test:r337:browser
          npm run test:r338
          npm run test:r338:browser
          npm run test:r339
          npm run test:r339:browser
          npm run test:r340
          npm run test:r340:browser
          npm run test:r341
          npm run test:r342
          npm run test:r342:browser
          npm run test:r343
          npm run test:r343:browser
          npm run test:r344
          npm run test:r344:browser
          npm run test:r345
          npm run test:r345:browser
      - name: Focused r346 full-width layout rollback + source-clean filters gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run test:r346
          npm run test:r346:browser
      - name: Final bundle identity r346
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r346-official.mjs
          node --check dist/app-v346.js
          CT_R346_SKIP_BUILD=1 node test-r346.mjs
          grep -Fq 'app-v346.js' dist/index.html
          grep -Fq 'app-v346.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.137'
            && r.revision==='r346-official-1.0.137'
            && r.search_global==='movies+series+actors+episodes'
            && r.search_episode_local==='cinetracker_episode_search_v337'
            && r.home_navigation==='r337-desired-tab-authority+multi-settle+user-scroll-cancel'
            && r.discover_foryou_swap==='same-bucket+same-kind-only'
            && r.sports_startup==='every-open-warm+force-provider-sync+auth-retry+refresh-payload'
            && r.discover_foryou_owner==='r336-only-no-legacy-late-dom-repaint'
            && r.discover_foryou_genres==='exactly-one-primary-genre'
            && r.page_layout==='content-normal-flow-restored'
            && r.navigation_back==='dedicated-search-row-icon-only'
            && r.discover_filters==='r318+r336-source-removed'
            && r.discover_foryou_filters==='removed-at-renderer+forced-all'
            && r.discover_foryou_actions==='r345-poster-width-stable-grid-preserved'
            && r.discover_top10_geometry==='desktop-ten-equal-columns-visible-in-viewport'
            && r.home_startup==='fresh-payload+history+live-reconcile+metadata-hydrate-before-reveal'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_137_r346, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.137 r346
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.137"' <<<"$BODY" \
              && grep -Fq '"revision": "r346-official-1.0.137"' <<<"$BODY" \
              && grep -Fq '"search_episode_local": "cinetracker_episode_search_v337"' <<<"$BODY" \
              && grep -Fq '"sports_startup": "every-open-warm+force-provider-sync+auth-retry+refresh-payload"' <<<"$BODY" \
              && grep -Fq '"page_layout": "content-normal-flow-restored"' <<<"$BODY" \
              && grep -Fq '"navigation_back": "dedicated-search-row-icon-only"' <<<"$BODY" \
              && grep -Fq '"discover_filters": "r318+r336-source-removed"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v346.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR346Marker='restore-content-layout+dedicated-search-row+filters-source-removed'" <<<"$JS" \
                && grep -Fq 'restoreContent346' <<<"$JS" \
                && grep -Fq 'cinetracker_episode_search_v337' <<<"$JS" \
                && grep -Fq 'app-v346.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=8000 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" \
                  && grep -Fq 'v1.0.137' <<<"$DOM" \
                  && grep -Fq 'r346-official-1.0.137' <<<"$DOM" \
                  && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
