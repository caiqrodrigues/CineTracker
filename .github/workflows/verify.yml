name: Verify Web 1.0.217 r426 Profile History Pra Voce F1
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r426:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r426 regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check build-r426.mjs
          node --check build-r426-official.mjs
          node --check test-r426.mjs
          node --check runtime-r426-profile-history-foryou-f1.js
          node build-r426-official.mjs
          CT_R426_SKIP_BUILD=1 node test-r426.mjs
          node --check dist/app-v426.js
          grep -Fq "window.__ctR426" dist/app-v426.js
          grep -Fq 'cinetracker_activity_items_by_day_v426' dist/app-v426.js
          grep -Fq 'cinetracker_unmark_history_item_v426' dist/app-v426.js
          grep -Fq 'cinetracker_unmark_sport_history_v426' dist/app-v426.js
          grep -Fq 'cinetracker_f1_progress_v426' dist/app-v426.js
          ! grep -Fq "window.location.reload(" runtime-r426-profile-history-foryou-f1.js
          ! grep -Fq "router.refresh(" runtime-r426-profile-history-foryou-f1.js
          ! grep -Fq "while(true)" runtime-r426-profile-history-foryou-f1.js
          ! grep -Fq "new MutationObserver" runtime-r426-profile-history-foryou-f1.js
          ! grep -Fq "setInterval(" runtime-r426-profile-history-foryou-f1.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r426, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.217"' <<<"$BODY" && grep -Fq '"revision": "r426-official-1.0.217"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v426.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR426" <<<"$JS" && grep -Fq 'cinetracker_activity_items_by_day_v426' <<<"$JS" && grep -Fq 'app-v426.js' <<<"$HTML"; then
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1
