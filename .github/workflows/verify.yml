name: Verify Web 1.0.97 r306 Canonical Fixes

on:
  push:
    branches: [main, 'fix/r306-final-canonical']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_97_r306:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r306
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.97"' package.json
          grep -Fq '"version": "1.0.97"' apps/web/package.json
          grep -Fq 'build-r306-official.mjs' apps/web/package.json
          test -f apps/web/build-r306.mjs
          test -f apps/web/build-r306-official.mjs
          test -f apps/web/runtime-r306-final.js
          test -f apps/web/test-r306.mjs
          test -f apps/web/test-r306-browser.mjs
      - name: Syntax r306 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r306-final.js
          node --check apps/web/build-r306.mjs
          node --check apps/web/build-r306-official.mjs
          node --check apps/web/test-r306.mjs
          node --check apps/web/test-r306-browser.mjs
          ! grep -Fq 'MutationObserver' apps/web/runtime-r306-final.js
          ! grep -Fq 'setInterval(' apps/web/runtime-r306-final.js
          ! grep -Fq 'setTimeout(' apps/web/runtime-r306-final.js
          ! grep -Fq "['drivers','Pilotos']" apps/web/runtime-r306-final.js
      - name: Regression suite r306 including Chromium interactions
        working-directory: apps/web
        run: npm run verify
      - name: Final bundle identity r306
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r306-official.mjs
          node --check dist/app-v306.js
          grep -Fq "window.__ctWebBuild='1.0.97';window.__ctOfficialVersion='1.0.97';" dist/app-v306.js
          grep -Fq "const REVISION='r306-official-1.0.97';" dist/app-v306.js
          grep -Fq 'window.__ctR306={' dist/app-v306.js
          ! grep -Fq "window.__ctR305Final='canonical-first-paint+overlay-hit-actions+provider-sync+stable-profile'" dist/app-v306.js
          grep -Fq 'Grid de Largada' dist/app-v306.js
          grep -Fq 'Resultado de Chegada' dist/app-v306.js
          grep -Fq 'ct306-sports-sync' dist/app-v306.js
          grep -Fq 'stableProfile306' dist/app-v306.js
          grep -Fq 'app-v306.js' dist/index.html
          grep -Fq 'app-v306.css' dist/index.html
          grep -Fq '"version": "1.0.97"' dist/release.json
          grep -Fq '"revision": "r306-official-1.0.97"' dist/release.json
          grep -Fq '"related_titles_open": true' dist/release.json
          grep -Fq '"related_watchlist_action": true' dist/release.json
          grep -Fq '"related_seen_action": true' dist/release.json
          grep -Fq '"actors_open": true' dist/release.json
          grep -Fq '"main_modal_watchlist_seen": true' dist/release.json
          grep -Fq '"top10_viewport_compact": true' dist/release.json
          grep -Fq '"f1_drivers_tab": false' dist/release.json
          grep -Fq '"f1_calendar_interactive": true' dist/release.json
          grep -Fq '"f1_grid_start": true' dist/release.json
          grep -Fq '"f1_finish_result": true' dist/release.json
          grep -Fq '"sports_menu_below_f1": true' dist/release.json
          grep -Fq '"sports_refresh_in_header": true' dist/release.json
          grep -Fq '"sports_provider_resync": true' dist/release.json
          grep -Fq '"profile_layout_switching": false' dist/release.json
          grep -Fq '"profile_watchlist_open_signal": false' dist/release.json
          grep -Fq '"profile_actor_cards_uniform": true' dist/release.json
          grep -Fq '"profile_actor_scroll_local": true' dist/release.json
          grep -Fq '"r299_delayed_profile_rewrite": false' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.97-r306';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_97_r306, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.97 r306
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.97"' <<<"$BODY" && grep -Fq '"revision": "r306-official-1.0.97"' <<<"$BODY" && grep -Fq '"related_titles_open": true' <<<"$BODY" && grep -Fq '"actors_open": true' <<<"$BODY" && grep -Fq '"f1_drivers_tab": false' <<<"$BODY" && grep -Fq '"f1_grid_start": true' <<<"$BODY" && grep -Fq '"f1_finish_result": true' <<<"$BODY" && grep -Fq '"sports_refresh_in_header": true' <<<"$BODY" && grep -Fq '"profile_layout_switching": false' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v306.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq 'window.__ctR306={' <<<"$JS" && ! grep -Fq "window.__ctR305Final='canonical-first-paint+overlay-hit-actions+provider-sync+stable-profile'" <<<"$JS" && grep -Fq 'Grid de Largada' <<<"$JS" && grep -Fq 'Resultado de Chegada' <<<"$JS" && grep -Fq 'ct306-sports-sync' <<<"$JS" && grep -Fq 'app-v306.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=6500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
