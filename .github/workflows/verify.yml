name: Verify Web 1.0.66 r275 Home History Rewatch Episode Dedupe

on:
  push:
    branches: [main, 'fix/r275-history-rewatch-episode-dedupe']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_66_r275:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r275
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.66"' package.json
          grep -Fq '"version": "1.0.66"' apps/web/package.json
          grep -Fq 'build-r275-official.mjs' apps/web/package.json
          grep -Fq '## 1.0.66 — 2026-09-14 — Web r275' CHANGELOG.md
          grep -Fq 'Web 1.0.66 / r275' README.md
          test -f apps/web/runtime-r275-history-rewatch-episode-dedupe.js
          test -f apps/web/build-r275.mjs
          test -f apps/web/build-r275-official.mjs
          test -f apps/web/test-r275.mjs
          test -f apps/web/test-r275-browser.mjs
          test -f scripts/test-r275-exact-bundle-browser.mjs
          test -f supabase/migrations/20260914181206_r275_series_watch_state_for_home.sql
      - name: Syntax r275 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r275-history-rewatch-episode-dedupe.js
          node --check apps/web/build-r275.mjs
          node --check apps/web/build-r275-official.mjs
          node --check apps/web/test-r275.mjs
          node --check apps/web/test-r275-browser.mjs
          node --check scripts/test-r275-exact-bundle-browser.mjs
      - name: Build official r275
        working-directory: apps/web
        run: node build-r275-official.mjs
      - name: Static and migration regressions r275
        working-directory: apps/web
        run: node test-r275.mjs
      - name: Chromium Lioness Reacher History regression r275
        working-directory: apps/web
        run: node test-r275-browser.mjs
      - name: Exact final bundle boot r275
        run: node scripts/test-r275-exact-bundle-browser.mjs
      - name: Final bundle identity r275
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v275.js
          grep -Fq "window.__ctWebBuild='1.0.66';window.__ctOfficialVersion='1.0.66';" dist/app-v275.js
          grep -Fq "const REVISION='r275-official-1.0.66';" dist/app-v275.js
          grep -Fq "window.__ctR275='collapsible-history+rewatch-multiplier+fresh-next+strict-dedupe'" dist/app-v275.js
          grep -Fq "window.__ctR275History='collapsed-above-continue'" dist/app-v275.js
          grep -Fq "window.__ctR275Series='fresh-tmdb-first-unseen+effective-tmdb-dedupe'" dist/app-v275.js
          grep -Fq "rpc('cinetracker_home_series_watch_state_v1'" dist/app-v275.js
          grep -Fq 'data-ct275-history-toggle' dist/app-v275.js
          grep -Fq 'ct275-plays-badge' dist/app-v275.js
          grep -Fq 'paintHome=ct275PaintHome;renderHome=ct275RenderHome;' dist/app-v275.js
          grep -Fq 'app-v275.js' dist/index.html
          grep -Fq 'app-v275.css' dist/index.html
          grep -Fq '"version": "1.0.66"' dist/release.json
          grep -Fq '"revision": "r275-official-1.0.66"' dist/release.json
          grep -Fq '"home_history_collapsible": true' dist/release.json
          grep -Fq '"home_history_default_collapsed": true' dist/release.json
          grep -Fq '"home_history_position": "above-continue"' dist/release.json
          grep -Fq '"home_rewatch_multiplier": true' dist/release.json
          grep -Fq '"home_strict_dedupe": "effective-tmdb"' dist/release.json
          grep -Fq '"home_fresh_episode_reconciliation": true' dist/release.json
          grep -Fq '"home_up_to_date_next_episode": true' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.66-r275';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_66_r275]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.66 r275
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.66"' <<<"$BODY" && grep -Fq '"revision": "r275-official-1.0.66"' <<<"$BODY" && grep -Fq '"home_history_collapsible": true' <<<"$BODY" && grep -Fq '"home_strict_dedupe": "effective-tmdb"' <<<"$BODY" && grep -Fq '"home_fresh_episode_reconciliation": true' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v275.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR275='collapsible-history+rewatch-multiplier+fresh-next+strict-dedupe'" <<<"$JS" && grep -Fq "rpc('cinetracker_home_series_watch_state_v1'" <<<"$JS" && grep -Fq 'data-ct275-history-toggle' <<<"$JS" && grep -Fq 'app-v275.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
