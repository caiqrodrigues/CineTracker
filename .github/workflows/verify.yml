name: Verify Web 1.0.27

on:
  push:
    branches: [main, 'fix/1.0.27-r235-live-authority']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_27:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax r235
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.27"' apps/web/package.json
          node --check apps/web/runtime-r235-v127-live-authority.js
          node --check apps/web/build-r235.mjs
          node --check apps/web/test-r235.mjs
          node --check scripts/test-v127-live-authority-browser.mjs
      - name: Build r235
        working-directory: apps/web
        run: node build-r235.mjs
      - name: Static invariants r235
        working-directory: apps/web
        run: node test-r235.mjs
      - name: Final bundle identity r235
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v235.js
          grep -Fq "window.__ctWebBuild='1.0.27';window.__ctOfficialVersion='1.0.27';" dist/app-v235.js
          grep -Fq "const REVISION='r235-official-1.0.27';" dist/app-v235.js
          grep -Fq "window.__ctR235V127='single-live-dom-authority'" dist/app-v235.js
          grep -Fq '"version": "1.0.27"' dist/release.json
          grep -Fq '"revision": "r235-official-1.0.27"' dist/release.json
      - name: Chromium Discover live behavior
        env: { CT_ASSERT: discover }
        run: node scripts/test-v127-live-authority-browser.mjs
      - name: Chromium Sports live behavior
        env: { CT_ASSERT: sports }
        run: node scripts/test-v127-live-authority-browser.mjs
      - name: Chromium Watchlist 1358+564 behavior
        env: { CT_ASSERT: watchlist }
        run: node scripts/test-v127-live-authority-browser.mjs
      - name: Chromium Home aired-unwatched behavior
        env: { CT_ASSERT: home }
        run: node scripts/test-v127-live-authority-browser.mjs

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_27]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Official production serves 1.0.27 r235
        run: |
          set -euo pipefail
          for i in $(seq 1 150); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.27"' <<<"$BODY" && grep -Fq '"revision": "r235-official-1.0.27"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v235.js?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR235V127='single-live-dom-authority'" <<<"$JS" && grep -Fq "new MutationObserver(queue127)" <<<"$JS"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1