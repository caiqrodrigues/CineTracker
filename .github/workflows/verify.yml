name: Verify Web 1.0.121 r330 Home Speed Discover Final

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_121_r330:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r330
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.121"' package.json
          grep -Fq '"version": "1.0.121"' apps/web/package.json
          grep -Fq 'build-r330-official.mjs' apps/web/package.json
          test -f apps/web/build-r330.mjs
          test -f apps/web/build-r330-official.mjs
          test -f apps/web/runtime-r330-home-discover-speed.js
          test -f apps/web/test-r330.mjs
          test -f apps/web/test-r330-browser.mjs
      - name: Syntax r330 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r330-home-discover-speed.js
          node --check apps/web/build-r330.mjs
          node --check apps/web/build-r330-official.mjs
          node --check apps/web/test-r330.mjs
          node --check apps/web/test-r330-browser.mjs
      - name: Focused browser gate r330
        working-directory: apps/web
        run: npm run test:r330:browser
      - name: Preserve current regressions
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run test:r324
          npm run test:r324:browser
          npm run test:r325
          npm run test:r325:browser
          npm run test:r326
          npm run test:r326:browser
          npm run test:r327
          npm run test:r327:browser
          npm run test:r328
          npm run test:r328:browser
          npm run test:r329
          npm run test:r329:browser
      - name: Final bundle identity r330
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r330-official.mjs
          node --check dist/app-v330.js
          CT_R330_SKIP_BUILD=1 node test-r330.mjs
          grep -Fq 'app-v330.js' dist/index.html
          grep -Fq 'app-v330.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.121'
            && r.revision==='r330-official-1.0.121'
            && r.home_initial_render==='db-payload-first-before-live-series-reconcile'
            && r.home_reconcile==='background-idle+route-and-sequence-guard'
            && r.home_history_behavior==='r328-preserved-above-initial-viewport-newest-nearest-content'
            && r.discover_filter_authority==='cinetracker_discover_filter_v326'
            && r.discover_foryou_actions==='three-equal-compact-buttons-one-row'
            && r.discover_top10==='progressive-fill-ten+v326-final-audit'
            && r.discover_top10_heading==='provider-pills-only-no-duplicate-provider-name'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_121_r330, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.121 r330
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.121"' <<<"$BODY" \
              && grep -Fq '"revision": "r330-official-1.0.121"' <<<"$BODY" \
              && grep -Fq '"home_initial_render": "db-payload-first-before-live-series-reconcile"' <<<"$BODY" \
              && grep -Fq '"discover_top10_heading": "provider-pills-only-no-duplicate-provider-name"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v330.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR330Marker='home-immediate-paint+cancel-stale-reconcile+discover-buttons-grid+top10-up-no-provider-duplicate'" <<<"$JS" \
                && grep -Fq 'window.__ctR330HomeFirstPaintAt=Date.now()' <<<"$JS" \
                && grep -Fq 'cinetracker_discover_filter_v326' <<<"$JS" \
                && grep -Fq 'app-v330.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --window-size=390,844 --virtual-time-budget=8000 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && grep -Fq 'v1.0.121' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
