name: Verify Web 1.0.162 r371 Home Movies Tab Persistence
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_1_0_162_r371:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Syntax and identity
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.162"' package.json
          grep -Fq '"version": "1.0.162"' apps/web/package.json
          node --check apps/web/runtime-r371-home-tab-owner.js
          node --check apps/web/build-r371.mjs
          node --check apps/web/test-r371.mjs
          node --check apps/web/test-r371-browser.mjs
      - name: Build and Home tab persistence validation
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r371-official.mjs
          CT_R371_SKIP_BUILD=1 node test-r371.mjs
          CT_R371_SKIP_BUILD=1 node test-r371-browser.mjs
          node --check dist/app-v371.js
          grep -Fq 'app-v371.js' dist/index.html
          grep -Fq 'ct-web-1.0.162-r371' dist/service-worker.js
          grep -Fq "window.__ctR371Marker='home-tab-user-only+repaint-preserved+async-generation-cancel'" dist/app-v371.js
  android_current_source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_162_r371, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.162"' <<<"$BODY" && grep -Fq '"revision": "r371-official-1.0.162"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v371.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR371Marker='home-tab-user-only+repaint-preserved+async-generation-cancel'" <<<"$JS" && grep -Fq 'app-v371.js' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
