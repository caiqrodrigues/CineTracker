name: Verify Web 1.0.213 r422 F1 Dual Sync
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r422:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r422 regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check build-r422.mjs
          node --check build-r422-official.mjs
          node --check test-r422.mjs
          node --check runtime-r422-f1-dual-sync.js
          node build-r422-official.mjs
          CT_R422_SKIP_BUILD=1 node test-r422.mjs
          node --check dist/app-v422.js
          grep -Fq "window.__ctR422Marker='f1-series-865+sport-history-dual-sync+series-sports-f1hub-three-way'" dist/app-v422.js
          grep -Fq 'cinetracker_f1_watch_sync_v422' dist/app-v422.js
          grep -Fq "String(path)==='rpc/cinetracker_sports_watch_set_v296'" dist/app-v422.js
          grep -Fq 'ct285Mark=markSeriesF1422' dist/app-v422.js
          grep -Fq 'window.__ctR421.toggleF1=toggleF1Hub422' dist/app-v422.js
          grep -Fq 'cinetracker_sport_stats_v421' dist/app-v422.js
          ! grep -Fq "window.location.reload(" runtime-r422-f1-dual-sync.js
          ! grep -Fq "router.refresh(" runtime-r422-f1-dual-sync.js
          ! grep -Fq "while(true)" runtime-r422-f1-dual-sync.js
          ! grep -Fq "new MutationObserver" runtime-r422-f1-dual-sync.js
          ! grep -Fq "setInterval(" runtime-r422-f1-dual-sync.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r422, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.213"' <<<"$BODY" && grep -Fq '"revision": "r422-official-1.0.213"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v422.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR422Marker='f1-series-865+sport-history-dual-sync+series-sports-f1hub-three-way'" <<<"$JS" \
                && grep -Fq 'cinetracker_f1_watch_sync_v422' <<<"$JS" \
                && grep -Fq 'app-v422.js' <<<"$HTML"; then
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1
