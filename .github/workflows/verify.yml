name: Verify

on:
  push:
    branches: [main, recovery-auth-v97-redtest]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify preserved CineTracker features and recovery invariants
        run: npm run verify
      - name: Build recovered Web app
        run: npm run build
      - name: Execute auth recovery runtime suite
        run: node scripts/test-auth-recovery-red.mjs
      - name: Assert recovered production HTML
        shell: bash
        run: |
          set -euo pipefail
          grep -q "window.__ctAuthRecovery = 'v97-base'" dist/index.html
          grep -q 'void bootstrap();' dist/index.html
          grep -q 'ctFetchWithTimeout' dist/index.html
          ! grep -q 'auth-preboot-fix7.js' dist/index.html
          ! grep -q 'patch-v073-v097-fix7.js' dist/index.html

  android97recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore dedicated CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize dedicated signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate recovery Android source
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/patch-v068-v097.js
          grep -q 'WebSettings.LOAD_DEFAULT' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! grep -q 'LOAD_NO_CACHE' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! grep -q 'clearCache(true)' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! grep -q 'ct89-v097-fix7.js' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! grep -q 'authrev=' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! grep -q 'saveAuthSession' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
      - name: Build debug recovery APK
        working-directory: apps/android
        shell: bash
        run: gradle assembleDebug --stacktrace
      - name: Verify package and recovery version
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"
          PACKAGE="$($AAPT dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging "$APK" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$($AAPT dump badging "$APK" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.0.97 RECOVERY"
          test "$VERSION_CODE" = "978"
      - name: Upload recovery APK for device test
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-0.0.97-recovery-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
