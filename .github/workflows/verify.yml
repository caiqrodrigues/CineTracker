name: Verify Web 1.0.254 r464
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r464:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r464 regression gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v464.js
          grep -Fq "window.__ctR464Marker='discover-foryou-visible-owner-v421'" apps/web/dist/app-v464.js
          ! grep -Fq "window.location.reload(" apps/web/runtime-r464-discover-foryou.js
          ! grep -Fq "router.refresh(" apps/web/runtime-r464-discover-foryou.js
          ! grep -Fq "new MutationObserver" apps/web/runtime-r464-discover-foryou.js
          ! grep -Fq "setInterval(" apps/web/runtime-r464-discover-foryou.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r464, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r464 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.254"' <<<"$BODY" && grep -Fq '"revision": "r464-official-1.0.254"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v464.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR464Marker='discover-foryou-visible-owner-v421'" <<<"$JS" && grep -Fq 'app-v464.js' <<<"$HTML"; then exit 0; fi
            fi
            if [ "$i" -eq 240 ]; then exit 1; fi
            sleep 5
          done
