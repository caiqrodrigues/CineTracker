name: Verify Web 1.0.200 r409 Home + Pra Voce
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r409:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and scoped regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check build-r409.mjs
          node --check build-r409-official.mjs
          node --check test-r409.mjs
          node --check test-r409-browser.mjs
          node build-r409-official.mjs
          CT_R409_SKIP_BUILD=1 node test-r409.mjs
          CT_R409_SKIP_BUILD=1 node test-r409-browser.mjs
          node --check dist/app-v409.js
          grep -Fq "window.__ctR409Marker='instant-episode-history-next+foryou-primary-fallback-complete-actions'" dist/app-v409.js
          grep -Fq "cinetracker_home_movies_v405" dist/app-v409.js
          grep -Fq "cinetracker_home_series_v406" dist/app-v409.js
          grep -Fq "cinetracker_home_history_v324" dist/app-v409.js
          grep -Fq "cinetracker_discover_foryou_v396" dist/app-v409.js
          grep -Fq "data-ct409-action" dist/app-v409.js
          grep -Fq "↻ Trocar" dist/app-v409.js
          ! grep -Fq "window.location.reload(" apps/web/runtime-r409-part*.txt
          ! grep -Fq "router.refresh(" apps/web/runtime-r409-part*.txt
          ! grep -Fq "while(true)" apps/web/runtime-r409-part*.txt
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r409, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.200"' <<<"$BODY" && grep -Fq '"revision": "r409-official-1.0.200"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v409.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR409Marker='instant-episode-history-next+foryou-primary-fallback-complete-actions'" <<<"$JS" \
                && grep -Fq 'cinetracker_home_movies_v405' <<<"$JS" \
                && grep -Fq 'data-ct409-action' <<<"$JS" \
                && grep -Fq 'app-v409.js' <<<"$HTML"; then
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1
