name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax check r169 source runtime
        run: |
          node --check apps/web/runtime-r169.js
          node --check apps/web/build-r169.mjs
      - name: Build exact CineTracker Web r169 artifact used by Vercel
        working-directory: apps/web
        run: npm run build
      - name: Assert single r169 authority and requested features
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v169.js
          test "$(grep -o '<script' apps/web/dist/index.html | wc -l)" -eq 1
          ! grep -Eq 'patch-v[0-9]|hotfix' apps/web/dist/index.html
          test "$(find apps/web/dist -maxdepth 1 -type f -name 'patch-v*.js' | wc -l)" -eq 0
          for old in 162 163 164 165 166 167 168; do test ! -f "apps/web/dist/app-v${old}.js"; done
          grep -Fq "single-clean-runtime" apps/web/dist/app-v169.js
          grep -Fq "r169-detail-nav-discover-activity" apps/web/dist/app-v169.js
          grep -Fq "detail-related-season-drawer-nav-fast-discover-activity" apps/web/dist/app-v169.js
          grep -Fq "rich-movie-series-no-community" apps/web/dist/app-v169.js
          grep -Fq "after-cast-watchlist-seen-excluded" apps/web/dist/app-v169.js
          grep -Fq "drawer-plus-futuristic-rating-carousel" apps/web/dist/app-v169.js
          grep -Fq "global-previous-page" apps/web/dist/app-v169.js
          grep -Fq "instant-snapshot-preload" apps/web/dist/app-v169.js
          grep -Fq "watchlist-fallback-compact-actions" apps/web/dist/app-v169.js
          grep -Fq "assistido-por-dia-episodes-movies-sports-15d" apps/web/dist/app-v169.js
          grep -Fq "polished-search-filter" apps/web/dist/app-v169.js
          grep -Fq "Filmes Relacionados" apps/web/dist/app-v169.js
          grep -Fq "Séries Relacionadas" apps/web/dist/app-v169.js
          grep -Fq "data-ct169-related-watch" apps/web/dist/app-v169.js
          grep -Fq "data-ct169-related-seen" apps/web/dist/app-v169.js
          grep -Fq "Melhores e piores por temporada" apps/web/dist/app-v169.js
          grep -Fq "Melhor · E" apps/web/dist/app-v169.js
          grep -Fq "Pior · E" apps/web/dist/app-v169.js
          grep -Fq "data-ct169-drawer-season" apps/web/dist/app-v169.js
          grep -Fq "data-ct169-mark-episode" apps/web/dist/app-v169.js
          grep -Fq "Assistido por dia" apps/web/dist/app-v169.js
          grep -Fq "cinetracker_activity_by_day_v1" apps/web/dist/app-v169.js
          grep -Fq "p_days:15" apps/web/dist/app-v169.js
          grep -Fq "data-ct169-back" apps/web/dist/app-v169.js
          grep -Fq "ct169Snapshot" apps/web/dist/app-v169.js
          grep -Fq "FILTRO RÁPIDO" apps/web/dist/app-v169.js
          grep -Fq "ct169-card-actions" apps/web/dist/app-v169.js
          grep -Fq "ct166WatchlistPools=function" apps/web/dist/app-v169.js
          grep -Fq "profile-resilient-discover-auth-sports-watched" apps/web/dist/app-v169.js
          grep -Fq "cinetracker_sport_mark_watched_v1" apps/web/dist/app-v169.js
          grep -Fq "ct169-home-skeleton" apps/web/dist/app-v169.js
          grep -Fq '"revision":"r169-detail-nav-discover-activity"' apps/web/dist/release.json
          grep -Fq '"outputDirectory": "dist"' apps/web/vercel.json
          grep -Fq "cinetracker_activity_by_day_v1" supabase/migrations/20260831223600_r169_activity_by_day.sql
          grep -Fq "user_sport_watch_history" supabase/migrations/20260831223600_r169_activity_by_day.sql
          grep -Fq "watch_history" supabase/migrations/20260831223600_r169_activity_by_day.sql
          grep -Fq "generate_series" supabase/migrations/20260831223600_r169_activity_by_day.sql
          ! grep -Fq "Sentimento da Comunidade" apps/web/runtime-r169.js
      - name: Upload exact r169 web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-web-r169-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  android_0997_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.3 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.3'" apps/android/app/build.gradle
          grep -q 'versionCode 9973' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.3-r151-library-sync' scripts/prepare-android-v09973.mjs
          grep -q 'window.__ct0997R151Loaded' scripts/prepare-android-v09973.mjs
          grep -q 'cinetracker:app-foreground' scripts/test-android-v09973.mjs
          grep -q 'android:id="@+id/nav_history"' apps/android/app/src/main/res/layout/activity_main.xml
          grep -q 'android:visibility="gone"' apps/android/app/src/main/res/layout/activity_main.xml
          node --check scripts/prepare-android-v09973.mjs
          node --check scripts/test-android-v09973.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Production domain serves r169
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r169-detail-nav-discover-activity"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v169.js?ct=$(date +%s%N)" || true)"
              if grep -Fq "const REVISION='r169-detail-nav-discover-activity';" <<<"$JS" && grep -Fq "drawer-plus-futuristic-rating-carousel" <<<"$JS" && grep -Fq "global-previous-page" <<<"$JS" && grep -Fq "assistido-por-dia-episodes-movies-sports-15d" <<<"$JS"; then
                echo 'PRODUCTION_R169_OK rich-detail+back+discover+activity'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production domain did not serve r169-detail-nav-discover-activity in time.' >&2
          exit 1
