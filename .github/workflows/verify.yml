name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax check r173 source runtime
        run: |
          node --check apps/web/runtime-r169.js
          node --check apps/web/runtime-r170.js
          node --check apps/web/runtime-r171.js
          node --check apps/web/runtime-r172.js
          node --check apps/web/runtime-r173.js
          node --check apps/web/build-r173.mjs
      - name: Build exact CineTracker Web r173 artifact used by Vercel
        working-directory: apps/web
        run: npm run build
      - name: Assert single r173 authority and requested fixes
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v173.js
          test "$(grep -o '<script' apps/web/dist/index.html | wc -l)" -eq 1
          ! grep -Eq 'patch-v[0-9]|hotfix' apps/web/dist/index.html
          test "$(find apps/web/dist -maxdepth 1 -type f -name 'patch-v*.js' | wc -l)" -eq 0
          for old in 162 163 164 165 166 167 168 169 170 171 172; do test ! -f "apps/web/dist/app-v${old}.js"; done
          grep -Fq "single-clean-runtime" apps/web/dist/app-v173.js
          grep -Fq "r173-detail-left-window" apps/web/dist/app-v173.js
          grep -Fq "detail-left-windowed-hero" apps/web/dist/app-v173.js
          grep -Fq "poster-title-meta-synopsis-actions-left-window" apps/web/dist/app-v173.js
          grep -Fq "ct173-detail-window" apps/web/dist/app-v173.js
          grep -Fq "window.__ctR172='home-episode-meta-logical-seen-canonical-streamings-detail-frame'" apps/web/dist/app-v173.js
          grep -Fq "cinetracker_home_live_v0997_r4" apps/web/dist/app-v173.js
          grep -Fq "cinetracker_series_episode_state_v1" apps/web/dist/app-v173.js
          grep -Fq "only-10-canonical-services-no-plan-or-channel-duplicates" apps/web/dist/app-v173.js
          grep -Fq "Produção:" apps/web/dist/app-v173.js
          grep -Fq '"revision":"r173-detail-left-window"' apps/web/dist/release.json
          grep -Fq '"outputDirectory": "dist"' apps/web/vercel.json
          grep -Fq ".ct169-detail-hero.ct173-detail-window" apps/web/dist/app-v173.css
          grep -Fq "margin:18px auto 30px 0" apps/web/dist/app-v173.css
          grep -Fq "border:1px solid #315b72" apps/web/dist/app-v173.css
      - name: Upload exact r173 web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-web-r173-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  android_09976_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.6 r173 mobile-frame identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.6'" apps/android/app/build.gradle
          grep -q 'versionCode 9976' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.6-r173-mobile-frame' scripts/prepare-android-v09976.mjs
          grep -q 'phone-framed-carousels-scroll-snap' scripts/prepare-android-v09976.mjs
          grep -q 'scroll-snap-type:x proximity' scripts/prepare-android-v09976.mjs
          grep -q 'overflow-x:auto' scripts/prepare-android-v09976.mjs
          grep -q 'node --check' .github/workflows/build-android-v09976.yml
          grep -q 'android:id="@+id/android_bottom_nav"' apps/android/app/src/main/res/layout/activity_main.xml
          grep -q 'android:visibility="gone"' apps/android/app/src/main/res/layout/activity_main.xml
          node --check scripts/prepare-android-v09975.mjs
          node --check scripts/prepare-android-v09976.mjs
          node --check scripts/test-android-v09976.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Production domain serves frozen r173
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r173-detail-left-window"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v173.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v173.css?ct=$(date +%s%N)" || true)"
              if grep -Fq "const REVISION='r173-detail-left-window';" <<<"$JS" && grep -Fq "detail-left-windowed-hero" <<<"$JS" && grep -Fq ".ct169-detail-hero.ct173-detail-window" <<<"$CSS"; then
                echo 'PRODUCTION_R173_FROZEN_OK detail-left-window'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production domain did not serve frozen r173-detail-left-window in time.' >&2
          exit 1
