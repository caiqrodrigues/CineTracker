name: Verify Web 1.0.263 r473
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r473:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r473 runtime-owner regression gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v473.js
          grep -Fq "window.__ctR472Marker='home-r388-r399+foryou-r464+profile-12-separate-more+stadium-v296'" apps/web/dist/app-v473.js
          grep -Fq 'window.__ctCoreR471=Object.freeze' apps/web/dist/app-v473.js
          grep -Fq 'cinetracker_home_series_v452' apps/web/dist/app-v473.js
          grep -Fq 'cinetracker_home_movies_v405' apps/web/dist/app-v473.js
          grep -Fq 'cinetracker_home_history_v391' apps/web/dist/app-v473.js
          grep -Fq 'cinetracker_sports_stadium_summary_v296' apps/web/dist/app-v473.js
          ! grep -Fq "if(n==='home')setTimeout(enterSeries461,0);" apps/web/dist/app-v473.js
          ! grep -Fq "if(n==='discover')setTimeout(()=>{if(fyActive461())enterFY461()},0);" apps/web/dist/app-v473.js
          ! grep -Fq "if(n==='profile')setTimeout(scheduleProfile461,0);" apps/web/dist/app-v473.js
          for f in apps/web/runtime-r399-startup-stability.js apps/web/runtime-r464-discover-foryou.js apps/web/runtime-r472-owner-recovery.js; do
            ! grep -Fq "window.location.reload(" "$f"
            ! grep -Fq "router.refresh(" "$f"
            ! grep -Fq "new MutationObserver" "$f"
            ! grep -Fq "setInterval(" "$f"
            ! grep -Fq "while(true)" "$f"
          done
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r473, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r473 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.263"' <<<"$BODY" && grep -Fq '"revision": "r473-official-1.0.263"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v473.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR472Marker='home-r388-r399+foryou-r464+profile-12-separate-more+stadium-v296'" <<<"$JS" && grep -Fq 'app-v473.js' <<<"$HTML"; then exit 0; fi
            fi
            if [ "$i" -eq 240 ]; then exit 1; fi
            sleep 5
          done
