name: Verify Web 0.3.49 r522
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r522:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r522 Home/special-series gate
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r522-sports-only.js
          node --check apps/web/runtime-r522-special-open.js
          npm run build
          npm run verify
          node --check apps/web/dist/app-v522.js
          grep -Fq "window.__ctR522Marker='home-r518-restored+three-special-open+sports-preserved'" apps/web/dist/app-v522.js
          grep -Fq "window.__ctR522SpecialOpenMarker='pointerup-owner-f1-ufc-wwe'" apps/web/dist/app-v522.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r522, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r522 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "0.3.49"' <<<"$BODY" && grep -Fq '"revision": "r522-official-0.3.49"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v522.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR522Marker='home-r518-restored+three-special-open+sports-preserved'" <<<"$JS" && grep -Fq 'app-v522.js' <<<"$HTML"; then exit 0; fi
            fi
            [ "$i" -eq 240 ] && exit 1
            sleep 5
          done
