name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0998:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build and verify CineTracker Web 0.99.8
        run: npm run build
      - name: Preserve Bingers semantics and authentication
        run: |
          node scripts/test-hotfix13-bingers-semantics.mjs
          node scripts/test-auth-recovery-red.mjs
          node scripts/test-hotfix10-native-bridge.mjs
      - name: Assert Web 0.99.8 final runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"version": "0.99.8"' package.json
          grep -q 'ct-web-0.99.8-r1' dist/service-worker.js
          test "$(grep -o 'patch-v118-v0997-authoritative.js' dist/index.html | wc -l)" -eq 1
          test "$(grep -o 'patch-v125-v0998-query-state.js' dist/index.html | wc -l)" -eq 1
          test "$(grep -o 'patch-v126-v0998-keepalive-tabs.js' dist/index.html | wc -l)" -eq 1
          for old in patch-v111-v0994-global-search.js patch-v114-v0994-universal-detail.js patch-v115-v0995-favorites-profile-discover.js patch-v116-v0996-authoritative.js patch-v117-v0996-final.js; do ! grep -q "$old" dist/index.html; done
          grep -q 'v118-single-authority-profile-discover-detail' dist/patch-v118-v0997-authoritative.js
          grep -q 'cinetracker_profile_payload_v0997' dist/patch-v118-v0997-authoritative.js
          grep -q 'resolvedOptions().timeZone' dist/patch-v118-v0997-authoritative.js
          grep -q 'Atores Favoritos' dist/patch-v118-v0997-authoritative.js
          grep -q 'data-ct118-person-heart' dist/patch-v118-v0997-authoritative.js
          grep -q 'data-ct118-person-fav' dist/patch-v118-v0997-authoritative.js
          grep -q 'Avaliações dos episódios por temporada' dist/patch-v118-v0997-authoritative.js
          grep -q 'ct118-season-ratings-strip' dist/patch-v118-v0997-authoritative.js
          grep -q 'vote_count' dist/patch-v118-v0997-authoritative.js
          grep -q 'Populares' dist/patch-v118-v0997-authoritative.js
          grep -q 'Todos' dist/patch-v118-v0997-authoritative.js
          grep -q 'Lista' dist/patch-v118-v0997-authoritative.js
          grep -q 'Carrossel' dist/patch-v118-v0997-authoritative.js
          grep -q 'Grade' dist/patch-v118-v0997-authoritative.js
          grep -q 'repeat(auto-fill,minmax(128px,152px))' dist/patch-v118-v0997-authoritative.js
          grep -q 'cinetracker_discovery_exclusions_v0994' dist/patch-v118-v0997-authoritative.js
          grep -q 'Da sua Watchlist' dist/patch-v118-v0997-authoritative.js
          grep -q '100% novos' dist/patch-v118-v0997-authoritative.js
          grep -q 'next_episode_to_air' dist/patch-v118-v0997-authoritative.js
          grep -q 'priority=visible-posters' dist/patch-v118-v0997-authoritative.js
          grep -q 'ct111-global-search' dist/patch-v118-v0997-authoritative.js
          grep -q 'v125-query-state-stale-while-revalidate' dist/patch-v125-v0998-query-state.js
          grep -q 'const STALE_TIME=7\*60\*1000' dist/patch-v125-v0998-query-state.js
          grep -q 'Promise.all' dist/patch-v125-v0998-query-state.js
          grep -q 'v126-main-tabs-dom-keepalive' dist/patch-v126-v0998-keepalive-tabs.js
          grep -q 'ct0998-keepalive-bin' dist/patch-v126-v0998-keepalive-tabs.js
          grep -q '150ms' dist/patch-v126-v0998-keepalive-tabs.js
          grep -q 'cinetracker_profile_payload_v0997' supabase/migrations/20260828112000_v0997_profile_payload_local_activity.sql
          grep -q 'timezone(tz.name,wh.watched_at)' supabase/migrations/20260828112000_v0997_profile_payload_local_activity.sql
          grep -q 'requested_media_ids' supabase/functions/ct-enrich-media-user/index.ts
          grep -q "priority==='visible-posters'" supabase/functions/ct-enrich-media-user/index.ts
          node scripts/test-web-v0997-authoritative.mjs
          node scripts/test-web-v0998-prefetch-keepalive.mjs

  android_0997_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7 identity and exact Web bundle builder
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7'" apps/android/app/build.gradle
          grep -q 'versionCode 9970' apps/android/app/build.gradle
          grep -q 'android-v0.99.7-single-authority' scripts/prepare-android-v0997.mjs
          grep -q "const version='0.99.7'" scripts/prepare-android-v0997.mjs
          grep -q 'patch-v118-v0997-authoritative.js' scripts/prepare-android-v0997.mjs
          grep -q 'v118-single-authority-profile-discover-detail' scripts/prepare-android-v0997.mjs
          grep -q 'cinetracker_profile_payload_v0997' scripts/prepare-android-v0997.mjs
          grep -q 'window.__ct0997WarmAll' scripts/prepare-android-v0997.mjs
          grep -q 'void preloadRoute994(target);' scripts/prepare-android-v0997.mjs
          grep -q 'window.ct15Navigate=navigate997' scripts/prepare-android-v0997.mjs
          grep -q 'android:id="@+id/nav_history"' apps/android/app/src/main/res/layout/activity_main.xml
          grep -q 'android:visibility="gone"' apps/android/app/src/main/res/layout/activity_main.xml
          node --check scripts/prepare-android-v0997.mjs
          node --check scripts/test-android-v0997.mjs
