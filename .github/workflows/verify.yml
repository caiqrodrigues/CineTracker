name: Verify Web 1.0.259 r469
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r469:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r469 regression gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v469.js
          grep -Fq "window.__ctR469Marker='direct-ctSession-sbRpc-owner-hooks+profile-dedupe'" apps/web/dist/app-v469.js
          for f in apps/web/runtime-r469-direct-current-runtime.js; do
            ! grep -Fq "window.location.reload(" "$f"
            ! grep -Fq "router.refresh(" "$f"
            ! grep -Fq "new MutationObserver" "$f"
            ! grep -Fq "setInterval(" "$f"
            ! grep -Fq "while(true)" "$f"
          done
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r469, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r469 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.259"' <<<"$BODY" && grep -Fq '"revision": "r469-official-1.0.259"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v469.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR469Marker='direct-ctSession-sbRpc-owner-hooks+profile-dedupe'" <<<"$JS" && grep -Fq 'app-v469.js' <<<"$HTML"; then exit 0; fi
            fi
            if [ "$i" -eq 240 ]; then exit 1; fi
            sleep 5
          done
