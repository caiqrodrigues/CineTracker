name: Verify Web 1.0.208 r417 Home ForYou Profile F1
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r417:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r417 regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check build-r417.mjs
          node --check build-r417-official.mjs
          node --check test-r417.mjs
          node --check runtime-r417-home-foryou-profile-f1.js
          node build-r417-official.mjs
          CT_R417_SKIP_BUILD=1 node test-r417.mjs
          node --check dist/app-v417.js
          grep -Fq "window.__ctR417Marker='final-home-series-anchor+visible-7-swap+profile-sports-rpc+f1-media-865-series'" dist/app-v417.js
          grep -Fq "window.__ctR416Marker='profile-persistent-first-paint+foryou-r411-final-owner+f1-series-optimistic-watch'" dist/app-v417.js
          grep -Fq 'cinetracker_discover_watch_unseen_v413' dist/app-v417.js
          grep -Fq 'cinetracker_discover_fresh_v413' dist/app-v417.js
          grep -Fq 'cinetracker_home_series_v413' dist/app-v417.js
          grep -Fq 'REALITY_GENRE_ID=10764' dist/app-v417.js
          grep -Fq 'data-ct417-swap' dist/app-v417.js
          grep -Fq '↻ Trocar' dist/app-v417.js
          grep -Fq "rpc('cinetracker_sport_stats_v1'" dist/app-v417.js
          grep -Fq "rpc('cinetracker_mark_watch_v0994'" dist/app-v417.js
          grep -Fq 'const F1_MEDIA_ID=865' dist/app-v417.js
          ! grep -Fq "window.location.reload(" runtime-r417-home-foryou-profile-f1.js
          ! grep -Fq "router.refresh(" runtime-r417-home-foryou-profile-f1.js
          ! grep -Fq "while(true)" runtime-r417-home-foryou-profile-f1.js
          ! grep -Fq "new MutationObserver" runtime-r417-home-foryou-profile-f1.js
          ! grep -Fq "setInterval(" runtime-r417-home-foryou-profile-f1.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r417, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.208"' <<<"$BODY" && grep -Fq '"revision": "r417-official-1.0.208"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v417.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR417Marker='final-home-series-anchor+visible-7-swap+profile-sports-rpc+f1-media-865-series'" <<<"$JS" \
                && grep -Fq "window.__ctR416Marker='profile-persistent-first-paint+foryou-r411-final-owner+f1-series-optimistic-watch'" <<<"$JS" \
                && grep -Fq 'cinetracker_sport_stats_v1' <<<"$JS" \
                && grep -Fq 'data-ct417-swap' <<<"$JS" \
                && grep -Fq 'const F1_MEDIA_ID=865' <<<"$JS" \
                && grep -Fq 'app-v417.js' <<<"$HTML"; then
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1
