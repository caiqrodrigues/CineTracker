name: Verify Web 1.0.63 r272 Canonical Home Producer

on:
  push:
    branches: [main, 'fix/r272-home-canonical-renderer']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_63_r272:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r272
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.63"' package.json
          grep -Fq '"version": "1.0.63"' apps/web/package.json
          grep -Fq 'build-r272-official.mjs' apps/web/package.json
          test -f apps/web/build-r272.mjs
          test -f apps/web/build-r272-official.mjs
          test -f apps/web/test-r272.mjs
          test -f apps/web/test-r272-browser.mjs
          test -f scripts/test-r272-exact-bundle-browser.mjs
      - name: Syntax r272 release chain
        run: |
          set -euo pipefail
          node --check apps/web/build-r272.mjs
          node --check apps/web/build-r272-official.mjs
          node --check apps/web/test-r272.mjs
          node --check apps/web/test-r272-browser.mjs
          node --check scripts/test-r272-exact-bundle-browser.mjs
      - name: Build official r272
        working-directory: apps/web
        run: node build-r272-official.mjs
      - name: Static regressions r272
        working-directory: apps/web
        run: node test-r272.mjs
      - name: Chromium Home producer regression r272
        working-directory: apps/web
        run: node test-r272-browser.mjs
      - name: Exact final bundle boot r272
        run: node scripts/test-r272-exact-bundle-browser.mjs
      - name: Final bundle identity r272
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v272.js
          grep -Fq "window.__ctWebBuild='1.0.63';window.__ctOfficialVersion='1.0.63';" dist/app-v272.js
          grep -Fq "const REVISION='r272-official-1.0.63';" dist/app-v272.js
          grep -Fq "window.__ctR272='canonical-home-producer+r5-history+direct-watch'" dist/app-v272.js
          grep -Fq 'function ct272HistoryReady(p,histE,histM)' dist/app-v272.js
          grep -Fq 'data-ct272-history="episodes"' dist/app-v272.js
          grep -Fq 'data-ct272-history="movies"' dist/app-v272.js
          grep -Fq "homeCache=await rpc('cinetracker_profile_home_payload_v0997_r5'" dist/app-v272.js
          ! grep -Fq "homeCache=await rpc('cinetracker_home_live_v0997_r3'" dist/app-v272.js
          ! grep -Fq 'if(ct269PaintHomeBase)paintHome=function' dist/app-v272.js
          ! grep -Fq 'if(ct270PaintHomeBase)paintHome=function' dist/app-v272.js
          ! grep -Fq 'new MutationObserver(ct270Schedule).observe' dist/app-v272.js
          grep -Fq "window.__ctR267Discover='atomic-tabs+recursive-personal-exclusions'" dist/app-v272.js
          grep -Fq "window.__ctR267Detail='r169-rich-producer-local-x'" dist/app-v272.js
          grep -Fq "window.__ctR267Sports='r266-stable-preserved'" dist/app-v272.js
          grep -Fq 'app-v272.js' dist/index.html
          grep -Fq 'app-v272.css' dist/index.html
          grep -Fq '"version": "1.0.63"' dist/release.json
          grep -Fq '"revision": "r272-official-1.0.63"' dist/release.json
          grep -Fq '"home_history_in_producer": true' dist/release.json
          grep -Fq '"home_history_first": true' dist/release.json
          grep -Fq '"home_mark_watched_refresh": "r5"' dist/release.json
          grep -Fq '"home_post_render_repair": false' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.63-r272';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_63_r272]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.63 r272
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.63"' <<<"$BODY" && grep -Fq '"revision": "r272-official-1.0.63"' <<<"$BODY" && grep -Fq '"home_history_in_producer": true' <<<"$BODY" && grep -Fq '"home_mark_watched_refresh": "r5"' <<<"$BODY" && grep -Fq '"home_post_render_repair": false' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v272.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR272='canonical-home-producer+r5-history+direct-watch'" <<<"$JS" && grep -Fq 'data-ct272-history="episodes"' <<<"$JS" && grep -Fq "homeCache=await rpc('cinetracker_profile_home_payload_v0997_r5'" <<<"$JS" && ! grep -Fq "homeCache=await rpc('cinetracker_home_live_v0997_r3'" <<<"$JS" && grep -Fq 'app-v272.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
