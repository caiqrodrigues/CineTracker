name: Verify Web 1.0.75 r284 Stable Home Imported Series

on:
  push:
    branches: [main, 'fix/r284-home-stable-imported-series-detail']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_75_r284:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r284
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.75"' package.json
          grep -Fq '"version": "1.0.75"' apps/web/package.json
          grep -Fq 'build-r284-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r284-stable-imported-detail.js
          test -f apps/web/build-r284.mjs
          test -f apps/web/build-r284-official.mjs
          test -f apps/web/test-r284.mjs
          test -f apps/web/test-r284-browser.mjs
          test -f scripts/test-r284-exact-bundle-browser.mjs
      - name: Syntax r284 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r284-stable-imported-detail.js
          node --check apps/web/build-r284.mjs
          node --check apps/web/build-r284-official.mjs
          node --check apps/web/test-r284.mjs
          node --check apps/web/test-r284-browser.mjs
          node --check scripts/test-r284-exact-bundle-browser.mjs
      - name: Build official r284
        working-directory: apps/web
        run: node build-r284-official.mjs
      - name: Static regressions r284
        working-directory: apps/web
        run: node test-r284.mjs
      - name: Chromium stable Home and imported series r284
        working-directory: apps/web
        run: node test-r284-browser.mjs
      - name: Exact final bundle boot r284
        run: node scripts/test-r284-exact-bundle-browser.mjs
      - name: Final bundle identity r284
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v284.js
          grep -Fq "window.__ctWebBuild='1.0.75';window.__ctOfficialVersion='1.0.75';" dist/app-v284.js
          grep -Fq "const REVISION='r284-official-1.0.75';" dist/app-v284.js
          grep -Fq "window.__ctR283='history-action-isolation+fresh-availability+legacy-frontier-next'" dist/app-v284.js
          grep -Fq "window.__ctR284='stable-home-episodes+imported-covers+episode-watch+f1-season-switch'" dist/app-v284.js
          grep -Fq 'app-v284.js' dist/index.html
          grep -Fq 'app-v284.css' dist/index.html
          grep -Fq '"home_episode_stale_flash_blocked": true' dist/release.json
          grep -Fq '"imported_series_episode_watch_actions": true' dist/release.json
          grep -Fq '"formula_1_season_switch": true' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.75-r284';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_75_r284]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.75 r284
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.75"' <<<"$BODY" && grep -Fq '"revision": "r284-official-1.0.75"' <<<"$BODY" && grep -Fq '"home_episode_stale_flash_blocked": true' <<<"$BODY" && grep -Fq '"formula_1_season_switch": true' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v284.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR284='stable-home-episodes+imported-covers+episode-watch+f1-season-switch'" <<<"$JS" && grep -Fq 'app-v284.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
