name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax check r172 source runtime
        run: |
          node --check apps/web/runtime-r169.js
          node --check apps/web/runtime-r170.js
          node --check apps/web/runtime-r171.js
          node --check apps/web/runtime-r172.js
          node --check apps/web/build-r172.mjs
      - name: Build exact CineTracker Web r172 artifact used by Vercel
        working-directory: apps/web
        run: npm run build
      - name: Assert single r172 authority and requested fixes
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v172.js
          test "$(grep -o '<script' apps/web/dist/index.html | wc -l)" -eq 1
          ! grep -Eq 'patch-v[0-9]|hotfix' apps/web/dist/index.html
          test "$(find apps/web/dist -maxdepth 1 -type f -name 'patch-v*.js' | wc -l)" -eq 0
          for old in 162 163 164 165 166 167 168 169 170 171; do test ! -f "apps/web/dist/app-v${old}.js"; done
          grep -Fq "single-clean-runtime" apps/web/dist/app-v172.js
          grep -Fq "r172-home-episode-streaming-clean" apps/web/dist/app-v172.js
          grep -Fq "home-episode-meta-logical-seen-canonical-streamings-detail-frame" apps/web/dist/app-v172.js
          grep -Fq "episode-name-rating-release-without-removing-existing-meta" apps/web/dist/app-v172.js
          grep -Fq "no-global-card-badge-logical-series-episode-checks" apps/web/dist/app-v172.js
          grep -Fq "only-10-canonical-services-no-plan-or-channel-duplicates" apps/web/dist/app-v172.js
          grep -Fq "cinetracker_home_live_v0997_r4" apps/web/dist/app-v172.js
          grep -Fq "data-ct172-home-episode" apps/web/dist/app-v172.js
          grep -Fq "cinetracker_series_episode_state_v1" apps/web/dist/app-v172.js
          grep -Fq "ct171Observer.disconnect" apps/web/dist/app-v172.js
          grep -Fq "netflix standard with ads" apps/web/dist/app-v172.js
          grep -Fq "amazon channel" apps/web/dist/app-v172.js
          grep -Fq "HBO Max" apps/web/dist/app-v172.js
          grep -Fq "Amazon Prime Video" apps/web/dist/app-v172.js
          grep -Fq "Apple TV+" apps/web/dist/app-v172.js
          grep -Fq "Crunchyroll" apps/web/dist/app-v172.js
          grep -Fq "ct171ProviderGroup=function" apps/web/dist/app-v172.js
          grep -Fq "payload?.results?.BR||{}" apps/web/dist/app-v172.js
          grep -Fq "window.__ctR171='top10-streaming-seen-rewatch-where-country-activity'" apps/web/dist/app-v172.js
          grep -Fq "data-ct171-rewatch-episode" apps/web/dist/app-v172.js
          grep -Fq "Produção:" apps/web/dist/app-v172.js
          grep -Fq '"revision":"r172-home-episode-streaming-clean"' apps/web/dist/release.json
          grep -Fq '"outputDirectory": "dist"' apps/web/vercel.json
          grep -Fq "cinetracker_home_live_v0997_r4" supabase/migrations/20260831235900_r172_logical_series_episode_state_and_home_episode_meta.sql
          grep -Fq "cinetracker_series_episode_state_v1" supabase/migrations/20260831235900_r172_logical_series_episode_state_and_home_episode_meta.sql
          grep -Fq "cinetracker_effective_tmdb_id" supabase/migrations/20260831235900_r172_logical_series_episode_state_and_home_episode_meta.sql
      - name: Upload exact r172 web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-web-r172-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  android_0997_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.3 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.3'" apps/android/app/build.gradle
          grep -q 'versionCode 9973' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.3-r151-library-sync' scripts/prepare-android-v09973.mjs
          grep -q 'window.__ct0997R151Loaded' scripts/prepare-android-v09973.mjs
          grep -q 'cinetracker:app-foreground' scripts/test-android-v09973.mjs
          grep -q 'android:id="@+id/nav_history"' apps/android/app/src/main/res/layout/activity_main.xml
          grep -q 'android:visibility="gone"' apps/android/app/src/main/res/layout/activity_main.xml
          node --check scripts/prepare-android-v09973.mjs
          node --check scripts/test-android-v09973.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Production domain serves r172
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r172-home-episode-streaming-clean"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v172.js?ct=$(date +%s%N)" || true)"
              if grep -Fq "const REVISION='r172-home-episode-streaming-clean';" <<<"$JS" && grep -Fq "episode-name-rating-release-without-removing-existing-meta" <<<"$JS" && grep -Fq "no-global-card-badge-logical-series-episode-checks" <<<"$JS" && grep -Fq "only-10-canonical-services-no-plan-or-channel-duplicates" <<<"$JS"; then
                echo 'PRODUCTION_R172_OK home-episode+logical-seen+canonical-streamings+detail-frame'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production domain did not serve r172-home-episode-streaming-clean in time.' >&2
          exit 1
