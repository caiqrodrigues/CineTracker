name: Verify Web 1.0.123 r332 Home Discover Final

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_123_r332:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r332
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.123"' package.json
          grep -Fq '"version": "1.0.123"' apps/web/package.json
          grep -Fq 'build-r332-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r332-home-discover-final.js
          test -f apps/web/build-r332.mjs
          test -f apps/web/build-r332-official.mjs
          test -f apps/web/test-r332.mjs
          test -f apps/web/test-r332-browser.mjs
      - name: Syntax r332 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r332-home-discover-final.js
          node --check apps/web/build-r332.mjs
          node --check apps/web/build-r332-official.mjs
          node --check apps/web/test-r332.mjs
          node --check apps/web/test-r332-browser.mjs
      - name: Focused browser gate r332
        working-directory: apps/web
        run: npm run test:r332:browser
      - name: Preserve current regressions
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run test:r330
          npm run test:r330:browser
          npm run test:r331
          npm run test:r331:browser
      - name: Final bundle identity r332
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r332-official.mjs
          node --check dist/app-v332.js
          CT_R332_SKIP_BUILD=1 node test-r332.mjs
          grep -Fq 'app-v332.js' dist/index.html
          grep -Fq 'app-v332.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.123'
            && r.revision==='r332-official-1.0.123'
            && r.home_history_behavior==='normal-flow-above-anchor+zero-history-sliver-at-entry+newest-nearest-anchor'
            && r.home_episode_pointer==='never-before-last-watched+background-current-tmdb-reconcile'
            && r.discover_filter_authority==='cinetracker_discover_filter_v326'
            && r.discover_foryou_owner==='r329-after-final-v326-audit-only'
            && r.discover_foryou_actions==='watchlist+seen+swap-three-compact-one-row'
            && r.discover_public_source_cache==='preserved-across-personal-data-changes+dedup-concurrent'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_123_r332, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.123 r332
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.123"' <<<"$BODY" \
              && grep -Fq '"revision": "r332-official-1.0.123"' <<<"$BODY" \
              && grep -Fq '"discover_foryou_owner": "r329-after-final-v326-audit-only"' <<<"$BODY" \
              && grep -Fq '"home_episode_pointer": "never-before-last-watched+background-current-tmdb-reconcile"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v332.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR332Marker='home-anchor-settle+foryou-final-owner+discover-cache-safe+episode-pointer-repair'" <<<"$JS" \
                && grep -Fq "window.__ctR329.paintForYou()" <<<"$JS" \
                && grep -Fq 'app-v332.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless=new --no-sandbox --disable-gpu --disable-background-networking --window-size=390,844 --virtual-time-budget=9000 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && grep -Fq 'v1.0.123' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
