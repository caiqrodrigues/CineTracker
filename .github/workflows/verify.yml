name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax check r173 source runtime
        run: |
          node --check apps/web/runtime-r169.js
          node --check apps/web/runtime-r170.js
          node --check apps/web/runtime-r171.js
          node --check apps/web/runtime-r172.js
          node --check apps/web/runtime-r173.js
          node --check apps/web/build-r173.mjs
      - name: Build exact CineTracker Web r173 artifact used by Vercel
        working-directory: apps/web
        run: npm run build
      - name: Assert single r173 authority and left Onde Assistir window
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v173.js
          test "$(grep -o '<script' apps/web/dist/index.html | wc -l)" -eq 1
          ! grep -Eq 'patch-v[0-9]|hotfix' apps/web/dist/index.html
          test "$(find apps/web/dist -maxdepth 1 -type f -name 'patch-v*.js' | wc -l)" -eq 0
          for old in 162 163 164 165 166 167 168 169 170 171 172; do test ! -f "apps/web/dist/app-v${old}.js"; done
          grep -Fq "single-clean-runtime" apps/web/dist/app-v173.js
          grep -Fq "r173-watch-left-window" apps/web/dist/app-v173.js
          grep -Fq "watch-providers-left-window" apps/web/dist/app-v173.js
          grep -Fq "left-rail-under-poster-windowed" apps/web/dist/app-v173.js
          grep -Fq "hero.appendChild(watch)" apps/web/dist/app-v173.js
          grep -Fq "ct173-watch-window" apps/web/dist/app-v173.js
          grep -Fq "grid-template-areas" apps/web/dist/app-v173.css
          grep -Fq '"revision":"r173-watch-left-window"' apps/web/dist/release.json
          grep -Fq '"outputDirectory": "dist"' apps/web/vercel.json
          grep -Fq "window.__ctR172='home-episode-meta-logical-seen-canonical-streamings-detail-frame'" apps/web/dist/app-v173.js
          grep -Fq "only-10-canonical-services-no-plan-or-channel-duplicates" apps/web/dist/app-v173.js
      - name: Upload exact r173 web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-web-r173-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  android_0997_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.3 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.3'" apps/android/app/build.gradle
          grep -q 'versionCode 9973' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.3-r151-library-sync' scripts/prepare-android-v09973.mjs
          grep -q 'window.__ct0997R151Loaded' scripts/prepare-android-v09973.mjs
          grep -q 'cinetracker:app-foreground' scripts/test-android-v09973.mjs
          grep -q 'android:id="@+id/nav_history"' apps/android/app/src/main/res/layout/activity_main.xml
          grep -q 'android:visibility="gone"' apps/android/app/src/main/res/layout/activity_main.xml
          node --check scripts/prepare-android-v09973.mjs
          node --check scripts/test-android-v09973.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Production domain serves r173
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r173-watch-left-window"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v173.js?ct=$(date +%s%N)" || true)"
              if grep -Fq "const REVISION='r173-watch-left-window';" <<<"$JS" && grep -Fq "left-rail-under-poster-windowed" <<<"$JS"; then
                echo 'PRODUCTION_R173_OK watch-left-window'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production domain did not serve r173-watch-left-window in time.' >&2
          exit 1
