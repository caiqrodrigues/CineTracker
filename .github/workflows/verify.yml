name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate r179-r186 regressions
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r179.js
          node --check apps/web/runtime-r180.js
          node --check apps/web/runtime-r181.js
          node --check apps/web/runtime-r182.js
          node --check apps/web/runtime-r183.js
          node --check apps/web/runtime-r184-shared.js
          node --check apps/web/runtime-r184-web.js
          node --check apps/web/runtime-r185a-shared.js
          node --check apps/web/runtime-r185b-web.js
          node --check apps/web/runtime-r185c-shared.js
          node --check apps/web/runtime-r185c-web.js
          node --check apps/web/runtime-r186-shared.js
          node --check apps/web/build-r186.mjs
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r178-stable-home.mjs
          node scripts/test-r179-target-card.mjs
          node scripts/test-r180-discover-profile.mjs
          node scripts/test-r181-season-toggle.mjs
          node scripts/test-r182-home-season-polish.mjs
          node scripts/test-r183-web-clean-profile.mjs
          node scripts/test-r184-profile-gap.mjs
          node scripts/test-r185a-instant-cache.mjs
          node scripts/test-r185b-web-prefetch.mjs
          node scripts/test-r185c-performance-polish.mjs
          node scripts/test-r186-foryou-strict.mjs
      - name: Build Web r186
        working-directory: apps/web
        run: npm run build
      - name: Assert Web r186 artifact
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v186.js
          grep -Fq "r186-foryou-strict-realtime" apps/web/dist/app-v186.js
          grep -Fq "foryou-strict-quality-year-history-realtime" apps/web/dist/app-v186.js
          grep -Fq "tmdb-gte-7.5-release-year-gt-1990" apps/web/dist/app-v186.js
          grep -Fq "block-pure-drama-18-and-any-documentary-99" apps/web/dist/app-v186.js
          grep -Fq "seven-slots-no-duplicate-media" apps/web/dist/app-v186.js
          grep -Fq "missing-watchlist-kind-uses-popular-unseen-equivalent" apps/web/dist/app-v186.js
          grep -Fq "watch_history+media_overrides-postgres-changes" apps/web/dist/app-v186.js
          grep -Fq "profile-discover-hot-route-reuse" apps/web/dist/app-v186.js
          grep -Fq "home-entry-top-anchor" apps/web/dist/app-v186.js
          grep -Fq "detect-skipped-released-episodes-before-manual-watch" apps/web/dist/app-v186.js
          grep -Fq '"revision":"r186-foryou-strict-realtime"' apps/web/dist/release.json
          grep -Fq -- '--ct185c-radius-panel' apps/web/dist/app-v186.css
          test ! -f apps/web/dist/app-v185c.js

  android_099722_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.22
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.22'" apps/android/app/build.gradle
          grep -q 'versionCode 9992' apps/android/app/build.gradle
          node --check scripts/prepare-android-v099722.mjs
          node --check scripts/test-android-v099722.mjs
          node scripts/test-r185a-instant-cache.mjs
          node scripts/test-r185c-performance-polish.mjs
          node scripts/test-r186-foryou-strict.mjs
          node scripts/prepare-android-v099722.mjs
          node scripts/test-android-v099722.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Production Web serves r186
        run: |
          set -euo pipefail
          for i in $(seq 1 70); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r186-foryou-strict-realtime"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v186.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v186.css?ct=$(date +%s%N)" || true)"
              if grep -Fq "foryou-strict-quality-year-history-realtime" <<<"$JS" && grep -Fq "watch_history+media_overrides-postgres-changes" <<<"$JS" && grep -Fq "profile-discover-hot-route-reuse" <<<"$JS" && grep -Fq -- '--ct185c-radius-panel' <<<"$CSS"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
