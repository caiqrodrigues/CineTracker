name: Verify Web 1.0.37 r246 Complete UI Authority

on:
  push:
    branches: [main, 'fix/r246-complete-ui-authority']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_37_complete_ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax inherited + restored r240 + r246
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.37"' apps/web/package.json
          node --check apps/web/runtime-r240-sports-four-tabs.js
          node --check apps/web/runtime-r240-user-video-semantics.js
          node --check scripts/test-r240-sports-four-tabs-browser.mjs
          node --check scripts/test-r240-user-video-semantics-browser.mjs
          node --check apps/web/runtime-r243-home-interaction-catchup.js
          node --check apps/web/build-r243.mjs
          node --check apps/web/test-r243.mjs
          node --check scripts/test-r239-video-ground-truth-browser.mjs
          node --check scripts/test-r243-home-browser.mjs
          node --check apps/web/runtime-r244-series-horizontal-overflow.js
          node --check apps/web/build-r244.mjs
          node --check apps/web/test-r244.mjs
          node --check scripts/test-r244-series-overflow-browser.mjs
          node --check apps/web/runtime-r245-horizontal-home-authority.js
          node --check apps/web/build-r245.mjs
          node --check apps/web/test-r245.mjs
          node --check scripts/test-r245-horizontal-home-browser.mjs
          node --check apps/web/runtime-r246-complete-ui-authority.js
          node --check apps/web/build-r246.mjs
          node --check apps/web/test-r246.mjs
          node --check scripts/test-r246-complete-ui-browser.mjs
      - name: Chromium r239 regression ground truth
        run: node scripts/test-r239-video-ground-truth-browser.mjs
      - name: Chromium r240 sports four-tab contract
        run: node scripts/test-r240-sports-four-tabs-browser.mjs
      - name: Chromium r240 exclusions and atomic Discover contract
        run: node scripts/test-r240-user-video-semantics-browser.mjs
      - name: Build inherited r243
        working-directory: apps/web
        run: node build-r243.mjs
      - name: Static inherited r243
        working-directory: apps/web
        run: node test-r243.mjs
      - name: Chromium r243 Home regression
        run: node scripts/test-r243-home-browser.mjs
      - name: Build inherited r244
        working-directory: apps/web
        run: node build-r244.mjs
      - name: Static inherited r244
        working-directory: apps/web
        run: node test-r244.mjs
      - name: Chromium r244 overflow regression
        run: node scripts/test-r244-series-overflow-browser.mjs
      - name: Build inherited r245
        working-directory: apps/web
        run: node build-r245.mjs
      - name: Static inherited r245
        working-directory: apps/web
        run: node test-r245.mjs
      - name: Chromium r245 Home and drag regression
        run: node scripts/test-r245-horizontal-home-browser.mjs
      - name: Build r246
        working-directory: apps/web
        run: node build-r246.mjs
      - name: Static invariants r246
        working-directory: apps/web
        run: node test-r246.mjs
      - name: Final bundle identity r246
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v246.js
          grep -Fq "window.__ctWebBuild='1.0.37';window.__ctOfficialVersion='1.0.37';" dist/app-v246.js
          grep -Fq "const REVISION='r246-official-1.0.37';" dist/app-v246.js
          grep -Fq "window.__ctR239='production-video-ground-truth'" dist/app-v246.js
          grep -Fq "window.__ctR240='sports-four-data-authority'" dist/app-v246.js
          grep -Fq "window.__ctR240Semantic='user-video-semantic-authority'" dist/app-v246.js
          grep -Fq "window.__ctR240Home='follow-first-history-hidden'" dist/app-v246.js
          grep -Fq "window.__ctR240Discover='canonical-exclusions-atomic-switch'" dist/app-v246.js
          grep -Fq "window.__ctR240SportsSearch='search-focus-caret-stable'" dist/app-v246.js
          grep -Fq "window.__ctR245='real-horizontal-drag-and-started-series-authority'" dist/app-v246.js
          grep -Fq "window.__ctR246='complete-ui-authority'" dist/app-v246.js
          grep -Fq 'const CT245_SERIES_MAX=6;' dist/app-v246.js
          grep -Fq 'const CT245_PRIORITY_BATCH=24;' dist/app-v246.js
          grep -Fq 'setTimeout(ct245ReleaseMovies,500)' dist/app-v246.js
          grep -Fq 'app-v246.js' dist/index.html
          grep -Fq 'app-v246.css' dist/index.html
          grep -Fq '"version": "1.0.37"' dist/release.json
          grep -Fq '"revision": "r246-official-1.0.37"' dist/release.json
          grep -Fq 'overflow-x:clip!important' dist/app-v246.css
          grep -Fq 'touch-action:pan-x pan-y!important' dist/app-v246.css
          grep -Fq '@keyframes ct246WatchPop' dist/app-v246.css
      - name: Chromium r246 complete UI behavior
        run: node scripts/test-r246-complete-ui-browser.mjs

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_37_complete_ui]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Official production serves 1.0.37 r246
        run: |
          set -euo pipefail
          for i in $(seq 1 150); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.37"' <<<"$BODY" && grep -Fq '"revision": "r246-official-1.0.37"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v246.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v246.css?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR246='complete-ui-authority'" <<<"$JS" && grep -Fq "window.__ctR240='sports-four-data-authority'" <<<"$JS" && grep -Fq "window.__ctR240Semantic='user-video-semantic-authority'" <<<"$JS" && grep -Fq 'const CT245_SERIES_MAX=6;' <<<"$JS" && grep -Fq 'touch-action:pan-x pan-y!important' <<<"$CSS" && grep -Fq 'app-v246.js' <<<"$HTML" && grep -Fq 'app-v246.css' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
