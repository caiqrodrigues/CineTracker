name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax, gap logic and canonical repaint r177
        run: |
          node --check apps/web/runtime-r169.js
          node --check apps/web/runtime-r170.js
          node --check apps/web/runtime-r171.js
          node --check apps/web/runtime-r172.js
          node --check apps/web/runtime-r173.js
          node --check apps/web/runtime-r174.js
          node --check apps/web/runtime-r175.js
          node --check apps/web/runtime-r176.js
          node --check apps/web/runtime-r177.js
          node --check apps/web/build-r177.mjs
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r177-repaint.mjs
      - name: Build exact CineTracker Web r177 artifact used by Vercel
        working-directory: apps/web
        run: npm run build
      - name: Assert r177 canonical next repaint authority
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v177.js
          test "$(grep -o '<script' apps/web/dist/index.html | wc -l)" -eq 1
          grep -Fq "r177-canonical-next-repaint" apps/web/dist/app-v177.js
          grep -Fq "canonical-next-episode-repaint" apps/web/dist/app-v177.js
          grep -Fq "drawer-and-home-share-first-unwatched-immediate-repaint" apps/web/dist/app-v177.js
          grep -Fq "ct175SchedulePaint" apps/web/dist/app-v177.js
          grep -Fq "first-released-unwatched-gap-authority" apps/web/dist/app-v177.js
          grep -Fq "next=lowest-released-episode-not-watched-never-last-pointer-plus-one" apps/web/dist/app-v177.js
          grep -Fq "cinetracker_unmark_episode_v1" apps/web/dist/app-v177.js
          grep -Fq "ct174-flash" apps/web/dist/app-v177.css
          grep -Fq "ct175-next-episode" apps/web/dist/app-v177.css
          grep -Fq "ct173-detail-window" apps/web/dist/app-v177.js
          grep -Fq '"revision":"r177-canonical-next-repaint"' apps/web/dist/release.json
          test ! -f apps/web/dist/app-v176.js
      - name: Upload exact r177 web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-web-r177-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  android_099710_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Preserve current Android 0.99.7.10 identity during Web r177 validation
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.10'" apps/android/app/build.gradle
          grep -q 'versionCode 9980' apps/android/app/build.gradle
          node --check scripts/prepare-android-v099711.mjs
          node --check scripts/test-android-v099711.mjs
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r177-repaint.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Production domain serves r177
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 70); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r177-canonical-next-repaint"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v177.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v177.css?ct=$(date +%s%N)" || true)"
              if grep -Fq "const REVISION='r177-canonical-next-repaint';" <<<"$JS" && grep -Fq "canonical-next-episode-repaint" <<<"$JS" && grep -Fq "ct175-next-episode" <<<"$CSS"; then
                echo 'PRODUCTION_R177_OK canonical-next-repaint'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production domain did not serve r177-canonical-next-repaint in time.' >&2
          exit 1
