name: Verify Web 0.3.27 r500
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web_r500:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and full-browser r500 scoped gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v500.js
          grep -Fq 'real-history-anchor+isolated-movie-2x3+adaptive-top10-10x10' apps/web/dist/app-v500.js
          grep -Fq 'ct497-boot' apps/web/dist/index.html
          ! grep -Fq 'app-v498.js' apps/web/dist/index.html
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r500, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r500 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
            if grep -Fq '"version": "0.3.27"' <<<"$BODY" && grep -Fq '"revision": "r500-official-0.3.27"' <<<"$BODY" && grep -Fq 'app-v500.js?ct=r500-official-0.3.27' <<<"$HTML"; then exit 0; fi
            if [ "$i" -eq 240 ]; then exit 1; fi
            sleep 5
          done
