name: Verify Web 1.0.167 r376 Watchlist and Pra Voce Final
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_1_0_167_r376:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Syntax and identity
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.167"' package.json
          grep -Fq '"version": "1.0.167"' apps/web/package.json
          node --check apps/web/runtime-r376-home-watchlist-foryou-final.js
          node --check apps/web/build-r376.mjs
          node --check apps/web/test-r376.mjs
          node --check apps/web/test-r376-browser.mjs
      - name: Build and video-regression validation
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r376-official.mjs
          CT_R376_SKIP_BUILD=1 node test-r376.mjs
          CT_R376_SKIP_BUILD=1 node test-r376-browser.mjs
          node --check dist/app-v376.js
          grep -Fq 'app-v376.js' dist/index.html
          grep -Fq 'ct-web-1.0.167-r376' dist/service-worker.js
          grep -Fq "window.__ctR376Marker='watchlist-media-id-authority+sort-no-rebuild+foryou-final-owner+fresh-never-empty'" dist/app-v376.js
  android_current_source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_167_r376, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.167"' <<<"$BODY" && grep -Fq '"revision": "r376-official-1.0.167"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v376.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR376Marker='watchlist-media-id-authority+sort-no-rebuild+foryou-final-owner+fresh-never-empty'" <<<"$JS" && grep -Fq 'app-v376.js' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
