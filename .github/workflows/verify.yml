name: Verify Web 1.0.270 r480
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r480:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r480 Home Discover Profile regression gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v480.js
          grep -Fq "window.__ctR480Marker='home-cache-bootstrap+discover-v480-local-memory+profile-v480-pure-12+movies-history-watchlist'" apps/web/dist/app-v480.js
          grep -Fq 'cinetracker_discover_fresh_v480' apps/web/dist/app-v480.js
          grep -Fq 'cinetracker_discover_watch_smart_v480' apps/web/dist/app-v480.js
          grep -Fq 'cinetracker_record_recommendations_v480' apps/web/dist/app-v480.js
          grep -Fq 'cinetracker_profile_lists_v480' apps/web/dist/app-v480.js
          grep -Fq 'cinetracker_sports_payload_v479' apps/web/dist/app-v480.js
          grep -Fq 'cinetracker_f1_watch_sync_v462' apps/web/dist/app-v480.js
          grep -Fq 'data-ct479-preboot' apps/web/dist/index.html
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r480, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r480 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.270"' <<<"$BODY" && grep -Fq '"revision": "r480-official-1.0.270"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v480.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR480Marker='home-cache-bootstrap+discover-v480-local-memory+profile-v480-pure-12+movies-history-watchlist'" <<<"$JS" && grep -Fq 'app-v480.js' <<<"$HTML" && grep -Fq 'data-ct479-preboot' <<<"$HTML"; then exit 0; fi
            fi
            if [ "$i" -eq 240 ]; then exit 1; fi
            sleep 5
          done
