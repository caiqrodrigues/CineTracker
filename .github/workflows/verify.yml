name: Verify Web 1.0.39 r248 Complete Current UI

on:
  push:
    branches: [main, 'fix/r248-current-following-ui']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_39_r248:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax all authorities
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.39"' apps/web/package.json
          node --check apps/web/runtime-r240-user-video-semantics.js
          node --check apps/web/runtime-r243-home-interaction-catchup.js
          node --check apps/web/runtime-r244-series-horizontal-overflow.js
          node --check apps/web/runtime-r245-horizontal-home-authority.js
          node --check apps/web/runtime-r247-black-screen-recovery.js
          node --check apps/web/runtime-r248-current-following-ui.js
          node --check apps/web/runtime-r248-state-binding.js
          node --check apps/web/runtime-r248-following-sports-series.js
          node --check apps/web/runtime-r248-discover-final.js
          node --check apps/web/build-r248.mjs
          node --check apps/web/build-r248-official.mjs
          node --check apps/web/test-r248.mjs
          node --check scripts/test-r248-complete-ui-browser.mjs
          node --check scripts/test-r248-exact-bundle-browser.mjs
      - name: Chromium r239 production ground truth
        run: node scripts/test-r239-video-ground-truth-browser.mjs
      - name: Chromium r240 exclusions and atomic Discover
        run: node scripts/test-r240-user-video-semantics-browser.mjs
      - name: Build inherited r243
        working-directory: apps/web
        run: node build-r243.mjs
      - name: Static inherited r243
        working-directory: apps/web
        run: node test-r243.mjs
      - name: Chromium r243 Home
        run: node scripts/test-r243-home-browser.mjs
      - name: Build inherited r244
        working-directory: apps/web
        run: node build-r244.mjs
      - name: Static inherited r244
        working-directory: apps/web
        run: node test-r244.mjs
      - name: Chromium r244 overflow
        run: node scripts/test-r244-series-overflow-browser.mjs
      - name: Build inherited r245
        working-directory: apps/web
        run: node build-r245.mjs
      - name: Static inherited r245
        working-directory: apps/web
        run: node test-r245.mjs
      - name: Chromium r245 Home and drag
        run: node scripts/test-r245-horizontal-home-browser.mjs
      - name: Build inherited r247
        working-directory: apps/web
        run: node build-r247.mjs
      - name: Static inherited r247
        working-directory: apps/web
        run: node test-r247.mjs
      - name: Chromium inherited r247 sports
        run: node scripts/test-r247-sports-browser.mjs
      - name: Chromium inherited r247 exact boot
        run: node scripts/test-r247-exact-bundle-browser.mjs
      - name: Build official r248
        working-directory: apps/web
        run: node build-r248-official.mjs
      - name: Static invariants r248
        working-directory: apps/web
        run: node test-r248.mjs
      - name: Final bundle identity r248
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v248.js
          grep -Fq "window.__ctWebBuild='1.0.39';window.__ctOfficialVersion='1.0.39';" dist/app-v248.js
          grep -Fq "const REVISION='r248-official-1.0.39';" dist/app-v248.js
          grep -Fq "window.__ctR248='current-following-complete-ui-authority'" dist/app-v248.js
          grep -Fq "window.__ctR248Binding='sports-f1-current-runtime-binding'" dist/app-v248.js
          grep -Fq "window.__ctR248Following='mixed-backlog-new-release-and-sports-series'" dist/app-v248.js
          grep -Fq "window.__ctR248DiscoverFinal='content-only-tabs-stable-cards-personal-rules'" dist/app-v248.js
          grep -Fq 'const CT245_SERIES_MAX=8;' dist/app-v248.js
          grep -Fq 'const CT245_PRIORITY_BATCH=40;' dist/app-v248.js
          grep -Fq 'setTimeout(ct245ReleaseMovies,250)' dist/app-v248.js
          grep -Fq 'row._ct248HistoricalBacklogPreserved=true' dist/app-v248.js
          grep -Fq 'function rememberDiscover240(){return false}' dist/app-v248.js
          grep -Fq 'function restoreDiscover240(){return false}' dist/app-v248.js
          grep -Fq 'app-v248.js' dist/index.html
          grep -Fq 'app-v248.css' dist/index.html
          grep -Fq '"version": "1.0.39"' dist/release.json
          grep -Fq '"revision": "r248-official-1.0.39"' dist/release.json
          grep -Fq 'overflow-x:clip!important' dist/app-v248.css
          grep -Fq 'scrollbar-width:thin!important' dist/app-v248.css
      - name: Chromium r248 complete UI
        run: node scripts/test-r248-complete-ui-browser.mjs
      - name: Chromium r248 exact final bundle boot
        run: node scripts/test-r248-exact-bundle-browser.mjs

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_39_r248]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Official production serves and boots 1.0.39 r248
        run: |
          set -euo pipefail
          for i in $(seq 1 150); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.39"' <<<"$BODY" && grep -Fq '"revision": "r248-official-1.0.39"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v248.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v248.css?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR248='current-following-complete-ui-authority'" <<<"$JS" && grep -Fq "window.__ctR248Binding='sports-f1-current-runtime-binding'" <<<"$JS" && grep -Fq "window.__ctR248Following='mixed-backlog-new-release-and-sports-series'" <<<"$JS" && grep -Fq "window.__ctR248DiscoverFinal='content-only-tabs-stable-cards-personal-rules'" <<<"$JS" && grep -Fq 'overflow-x:clip!important' <<<"$CSS" && grep -Fq 'app-v248.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=4000 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
