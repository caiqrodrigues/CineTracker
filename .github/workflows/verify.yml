name: Verify Web 1.0.171 r380 Home Profile Discover
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r380:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check runtime-r380-home-profile-discover.js
          node --check build-r380.mjs
          node --check test-r380-browser.mjs
          node build-r380-official.mjs
          CT_R380_SKIP_BUILD=1 node test-r380.mjs
          CT_R380_SKIP_BUILD=1 node test-r380-browser.mjs
          node --check dist/app-v380.js
          grep -Fq 'app-v380.js' dist/index.html
          grep -Fq 'ct-web-1.0.171-r380' dist/service-worker.js
          grep -Fq "window.__ctR380Marker='home-active-first+watchlist-1382-sort+fresh-alias-seen+profile-direct+hearts-inside'" dist/app-v380.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r380, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.171"' <<<"$BODY" && grep -Fq '"revision": "r380-official-1.0.171"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v380.js?ct=$CT" || true)"
              if grep -Fq "window.__ctR380Marker='home-active-first+watchlist-1382-sort+fresh-alias-seen+profile-direct+hearts-inside'" <<<"$JS"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
