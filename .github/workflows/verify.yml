name: Verify Web 1.0.181 r390 Home and Pra Voce
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r390:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and scoped regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check runtime-r388-home-foryou-final.js
          node --check runtime-r390-home-foryou-validated.js
          node --check build-r390.mjs
          node --check test-r390-browser.mjs
          node build-r390-official.mjs
          CT_R390_SKIP_BUILD=1 node test-r390.mjs
          CT_R390_SKIP_BUILD=1 node test-r390-browser.mjs
          node --check dist/app-v390.js
          grep -Fq "window.__ctR390Marker='home-active-first-complete+movies-1382-six-sort+foryou-fast-strict-harry-block'" dist/app-v390.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r390, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.181"' <<<"$BODY" && grep -Fq '"revision": "r390-official-1.0.181"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v390.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR390Marker='home-active-first-complete+movies-1382-six-sort+foryou-fast-strict-harry-block'" <<<"$JS" && grep -Fq 'app-v390.js' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
