name: Verify Web 1.0.82 r291 Discover Actions Favorites Scroll

on:
  push:
    branches: [main, 'fix/web-r291-discover-actions-favorites-scroll']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_82_r291:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r291
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.82"' package.json
          grep -Fq '"version": "1.0.82"' apps/web/package.json
          grep -Fq 'build-r291-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r291-discover-actions-favorites-scroll.js
          test -f apps/web/build-r291.mjs
          test -f apps/web/build-r291-official.mjs
          test -f apps/web/test-r291.mjs
          test -f apps/web/test-r291-browser.mjs
          test -f scripts/test-r291-exact-bundle-browser.mjs
      - name: Syntax r291 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r291-discover-actions-favorites-scroll.js
          node --check apps/web/build-r291.mjs
          node --check apps/web/build-r291-official.mjs
          node --check apps/web/test-r291.mjs
          node --check apps/web/test-r291-browser.mjs
          node --check scripts/test-r291-exact-bundle-browser.mjs
      - name: Build official r291
        working-directory: apps/web
        run: node build-r291-official.mjs
      - name: Static regressions r291
        working-directory: apps/web
        run: node test-r291.mjs
      - name: Chromium inherited r285 regressions
        working-directory: apps/web
        run: node test-r285-browser.mjs
      - name: Chromium inherited r286 related interactions
        working-directory: apps/web
        run: node test-r286-browser.mjs
      - name: Chromium inherited r287 Home liveness and Continue
        working-directory: apps/web
        run: node test-r287-browser.mjs
      - name: Chromium inherited r288 Discover Android parity
        working-directory: apps/web
        run: node test-r288-browser.mjs
      - name: Chromium inherited r289 Discover geometry
        working-directory: apps/web
        run: node test-r289-browser.mjs
      - name: Chromium inherited r290 universal card geometry
        working-directory: apps/web
        run: node test-r290-browser.mjs
      - name: Chromium r291 action layout favorites and horizontal scroll
        working-directory: apps/web
        run: node test-r291-browser.mjs
      - name: Exact final bundle boot r291
        run: node scripts/test-r291-exact-bundle-browser.mjs
      - name: Final bundle identity r291
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v291.js
          grep -Fq "window.__ctWebBuild='1.0.82';window.__ctOfficialVersion='1.0.82';" dist/app-v291.js
          grep -Fq "const REVISION='r291-official-1.0.82';" dist/app-v291.js
          grep -Fq "window.__ctR290='universal-media-card-lock'" dist/app-v291.js
          grep -Fq "window.__ctR291='discover-actions-favorites-horizontal-scroll'" dist/app-v291.js
          grep -Fq "window.__ctR291Actions='footer-row-beside-swap-no-text-overlay'" dist/app-v291.js
          grep -Fq "window.__ctR291Favorites='liked-state-optimistic-heart-overlay'" dist/app-v291.js
          grep -Fq "window.__ctR291Scroll='local-drag-horizontal-carousels'" dist/app-v291.js
          grep -Fq 'data-ct291-favorite' dist/app-v291.js
          grep -Fq "p_state:'Liked'" dist/app-v291.js
          grep -Fq 'flex overflow-x-auto scrollbar-thin space-x-4 pb-4 snap-x touch-pan-x' dist/app-v291.js
          grep -Fq -- '-webkit-line-clamp:1!important' dist/app-v291.js
          grep -Fq 'app-v291.js' dist/index.html
          grep -Fq 'app-v291.css' dist/index.html
          grep -Fq '"discover_action_layout": "footer-row-beside-swap"' dist/release.json
          grep -Fq '"discover_favorite_state": "Liked"' dist/release.json
          grep -Fq '"discover_favorite_storage": "media_overrides"' dist/release.json
          grep -Fq '"discover_carousel_scroll": "local-horizontal-drag"' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.82-r291';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_82_r291]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.82 r291
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.82"' <<<"$BODY" && grep -Fq '"revision": "r291-official-1.0.82"' <<<"$BODY" && grep -Fq '"discover_action_layout": "footer-row-beside-swap"' <<<"$BODY" && grep -Fq '"discover_favorite_state": "Liked"' <<<"$BODY" && grep -Fq '"discover_carousel_scroll": "local-horizontal-drag"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v291.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR291='discover-actions-favorites-horizontal-scroll'" <<<"$JS" && grep -Fq 'data-ct291-favorite' <<<"$JS" && grep -Fq 'app-v291.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
