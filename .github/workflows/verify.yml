name: Verify Web 1.0.85 r294 Discover Density Scroll Order

on:
  push:
    branches: [main, 'fix/web-r294-discover-density-scroll-order']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_85_r294:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r294
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.85"' package.json
          grep -Fq '"version": "1.0.85"' apps/web/package.json
          grep -Fq 'build-r294-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r294-discover-density-scroll-order.js
          test -f apps/web/build-r294.mjs
          test -f apps/web/build-r294-official.mjs
          test -f apps/web/test-r294.mjs
          test -f apps/web/test-r294-browser.mjs
      - name: Syntax r294 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r294-discover-density-scroll-order.js
          node --check apps/web/build-r294.mjs
          node --check apps/web/build-r294-official.mjs
          node --check apps/web/test-r294.mjs
          node --check apps/web/test-r294-browser.mjs
      - name: Build official r294
        working-directory: apps/web
        run: node build-r294-official.mjs
      - name: Static regressions r294
        working-directory: apps/web
        run: node test-r294.mjs
      - name: Chromium inherited r286 related interactions
        working-directory: apps/web
        run: node test-r286-browser.mjs
      - name: Chromium inherited r291 actions favorites scroll
        working-directory: apps/web
        run: node test-r291-browser.mjs
      - name: Chromium inherited r293 Pra Você authority
        working-directory: apps/web
        run: node test-r293-browser.mjs
      - name: Chromium r294 compact density ten-up scroll order
        working-directory: apps/web
        run: node test-r294-browser.mjs
      - name: Final bundle identity r294
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v294.js
          grep -Fq "window.__ctWebBuild='1.0.85';window.__ctOfficialVersion='1.0.85';" dist/app-v294.js
          grep -Fq "const REVISION='r294-official-1.0.85';" dist/app-v294.js
          grep -Fq "window.__ctR291='discover-actions-favorites-horizontal-scroll'" dist/app-v294.js
          grep -Fq "window.__ctR292='related-actions-foryou-authority-compact-cards'" dist/app-v294.js
          grep -Fq "window.__ctR293='discover-navigation-foryou-actions-authority'" dist/app-v294.js
          grep -Fq "window.__ctR294='discover-density-scroll-order-top10-ten-up'" dist/app-v294.js
          grep -Fq "window.__ctR294Cards='158x237-desktop-154x231-mobile'" dist/app-v294.js
          grep -Fq "window.__ctR294Top10='ten-up-at-1920-reference'" dist/app-v294.js
          grep -Fq "window.__ctR294Actions='content-then-actions-then-scrollbar'" dist/app-v294.js
          grep -Fq 'app-v294.js' dist/index.html
          grep -Fq 'app-v294.css' dist/index.html
          grep -Fq '"discover_card_geometry": "158x237-desktop-154x231-mobile"' dist/release.json
          grep -Fq '"discover_top10": "ten-up-at-1920-reference"' dist/release.json
          grep -Fq '"discover_action_order": "content-actions-scrollbar"' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.85-r294';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_85_r294]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.85 r294
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.85"' <<<"$BODY" && grep -Fq '"revision": "r294-official-1.0.85"' <<<"$BODY" && grep -Fq '"discover_card_geometry": "158x237-desktop-154x231-mobile"' <<<"$BODY" && grep -Fq '"discover_action_order": "content-actions-scrollbar"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v294.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR294='discover-density-scroll-order-top10-ten-up'" <<<"$JS" && grep -Fq 'app-v294.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
