name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  statuses: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run verify
      - run: npm run build

  android74:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore dedicated CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize dedicated signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate Android modules
        shell: bash
        run: |
          set -euo pipefail
          for f in ct41.js ct47.js ct48.js ct49.js ct50.js ct51.js ct58.js ct59.js ct60.js; do node --check "apps/android/app/src/main/assets/$f"; done
      - name: Build debug APK
        working-directory: apps/android
        shell: bash
        run: gradle assembleDebug --stacktrace
      - name: Prepare APK name
        shell: bash
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk cinetracker-android-0.0.74-debug.apk
      - name: Verify package and version
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs cinetracker-android-0.0.74-debug.apk
          PACKAGE="$($AAPT dump badging cinetracker-android-0.0.74-debug.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging cinetracker-android-0.0.74-debug.apk | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.0.74"
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.0.74-debug
          path: cinetracker-android-0.0.74-debug.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view android-v0.0.74 >/dev/null 2>&1 || gh release create android-v0.0.74 --title "CineTracker Android 0.0.74" --notes-file docs/releases/0.0.74.md
          gh release upload android-v0.0.74 cinetracker-android-0.0.74-debug.apk --clobber
