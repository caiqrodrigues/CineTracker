name: Verify Web 1.0.196 r405 Home Movies + Pra Voce
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r405:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and scoped regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check runtime-r405-live-authority-bridge.js
          node --check build-r405.mjs
          node --check build-r405-official.mjs
          node --check test-r405.mjs
          node --check test-r405-browser.mjs
          node build-r405-official.mjs
          node --check dist/app-v405.js
          grep -Fq "window.__ctR405Marker='home-movies-real-closure+foryou-real-closure+complete-swap'" dist/app-v405.js
          grep -Fq "cinetracker_home_movies_v405" dist/app-v405.js
          grep -Fq "if(window.__ctR405?.loadMovies)return window.__ctR405.loadMovies(force)" dist/app-v405.js
          grep -Fq "if(tab==='foryou'&&window.__ctR405?.loadForYou)" dist/app-v405.js
          grep -Fq "if(window.__ctR405?.renderForYou)return window.__ctR405.renderForYou()" dist/app-v405.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r405, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.196"' <<<"$BODY" && grep -Fq '"revision": "r405-official-1.0.196"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v405.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR405Marker='home-movies-real-closure+foryou-real-closure+complete-swap'" <<<"$JS" && grep -Fq 'cinetracker_home_movies_v405' <<<"$JS" && grep -Fq 'app-v405.js' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
