name: Verify Web 1.0.138 r347 Production Layout Buttons

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_138_r347:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Version identity r347
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.138"' package.json
          grep -Fq '"version": "1.0.138"' apps/web/package.json
          grep -Fq 'build-r347-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r347-production-layout-buttons.js
          test -f apps/web/build-r347.mjs
          test -f apps/web/build-r347-official.mjs
          test -f apps/web/test-r347.mjs
          test -f apps/web/test-r347-browser.mjs
          test -f supabase/migrations/20260923030000_r337_episode_catalog_search.sql
      - name: Syntax r347
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r347-production-layout-buttons.js
          node --check apps/web/build-r347.mjs
          node --check apps/web/build-r347-official.mjs
          node --check apps/web/test-r347.mjs
          node --check apps/web/test-r347-browser.mjs
      - name: Current regression lineage
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run test:r330
          npm run test:r331
          npm run test:r332
          npm run test:r333
          npm run test:r334
          npm run test:r335
          npm run test:r336
          npm run test:r337
          npm run test:r337:browser
          npm run test:r338
          npm run test:r338:browser
          npm run test:r339
          npm run test:r339:browser
          npm run test:r340
          npm run test:r340:browser
          npm run test:r341
          npm run test:r342
          npm run test:r342:browser
          npm run test:r343
          npm run test:r343:browser
          npm run test:r344
          npm run test:r344:browser
          npm run test:r345
          npm run test:r345:browser
          npm run test:r346
          npm run test:r346:browser
      - name: Focused r347 1664x936 Home + Pra Voce button gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run test:r347
          npm run test:r347:browser
      - name: Final bundle identity r347
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r347-official.mjs
          node --check dist/app-v347.js
          CT_R347_SKIP_BUILD=1 node test-r347.mjs
          grep -Fq 'app-v347.js' dist/index.html
          grep -Fq 'app-v347.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.138'
            && r.revision==='r347-official-1.0.138'
            && r.search_global==='movies+series+actors+episodes'
            && r.search_episode_local==='cinetracker_episode_search_v337'
            && r.home_navigation==='r337-desired-tab-authority+multi-settle+user-scroll-cancel'
            && r.discover_foryou_swap==='same-bucket+same-kind-only'
            && r.sports_startup==='every-open-warm+force-provider-sync+auth-retry+refresh-payload'
            && r.discover_foryou_owner==='r336-only-no-legacy-late-dom-repaint'
            && r.discover_foryou_genres==='exactly-one-primary-genre'
            && r.page_layout==='content-normal-flow+home-full-inner-width'
            && r.navigation_back==='dedicated-search-row-icon-only'
            && r.discover_filters==='r318+r336-source-removed'
            && r.discover_foryou_legacy_css==='r338+r339-removed-at-runtime'
            && r.discover_foryou_buttons==='nonzero-grid-buttons+swap-visible+poster-width-row'
            && r.discover_top10_geometry==='desktop-ten-equal-columns-visible-in-viewport'
            && r.home_startup==='fresh-payload+history+live-reconcile+metadata-hydrate-before-reveal'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_138_r347, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.138 r347
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.138"' <<<"$BODY" \
              && grep -Fq '"revision": "r347-official-1.0.138"' <<<"$BODY" \
              && grep -Fq '"search_episode_local": "cinetracker_episode_search_v337"' <<<"$BODY" \
              && grep -Fq '"sports_startup": "every-open-warm+force-provider-sync+auth-retry+refresh-payload"' <<<"$BODY" \
              && grep -Fq '"page_layout": "content-normal-flow+home-full-inner-width"' <<<"$BODY" \
              && grep -Fq '"discover_foryou_legacy_css": "r338+r339-removed-at-runtime"' <<<"$BODY" \
              && grep -Fq '"discover_foryou_buttons": "nonzero-grid-buttons+swap-visible+poster-width-row"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v347.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR347Marker='remove-r338-zero-width-css+full-home-width+stable-foryou-buttons'" <<<"$JS" \
                && grep -Fq 'repairForYou347' <<<"$JS" \
                && grep -Fq 'cinetracker_episode_search_v337' <<<"$JS" \
                && grep -Fq 'app-v347.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=8000 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" \
                  && grep -Fq 'v1.0.138' <<<"$DOM" \
                  && grep -Fq 'r347-official-1.0.138' <<<"$DOM" \
                  && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
