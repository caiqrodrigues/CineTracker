name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build exact CineTracker Web r167 artifact used by Vercel
        working-directory: apps/web
        run: npm run build
      - name: Assert single r167 authority and requested fixes
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v167.js
          test "$(grep -o '<script' apps/web/dist/index.html | wc -l)" -eq 1
          ! grep -Eq 'patch-v[0-9]|hotfix' apps/web/dist/index.html
          test "$(find apps/web/dist -maxdepth 1 -type f -name 'patch-v*.js' | wc -l)" -eq 0
          test ! -f apps/web/dist/app-v162.js
          test ! -f apps/web/dist/app-v163.js
          test ! -f apps/web/dist/app-v164.js
          test ! -f apps/web/dist/app-v165.js
          test ! -f apps/web/dist/app-v166.js
          grep -Fq "single-clean-runtime" apps/web/dist/app-v167.js
          grep -Fq "r167-ui-home-sports-complete" apps/web/dist/app-v167.js
          grep -Fq "no-string-appendChild" apps/web/dist/app-v167.js
          grep -Fq "two-rows-five-cards" apps/web/dist/app-v167.js
          grep -Fq "instant-main-history-hidden" apps/web/dist/app-v167.js
          grep -Fq "force-current-day-and-favorite-round" apps/web/dist/app-v167.js
          grep -Fq "insertAdjacentHTML('beforeend',ct163MoreButton" apps/web/dist/app-v167.js
          grep -Fq "Tempo total de tela" apps/web/dist/app-v167.js
          grep -Fq "Tempo em Séries" apps/web/dist/app-v167.js
          grep -Fq "Tempo em Filmes" apps/web/dist/app-v167.js
          grep -Fq "Tempo de série em Watchlist" apps/web/dist/app-v167.js
          grep -Fq "Tempo de filme em Watchlist" apps/web/dist/app-v167.js
          grep -Fq "Tempo total em Watchlist" apps/web/dist/app-v167.js
          grep -Fq "watchlist_series_remaining_minutes" apps/web/dist/app-v167.js
          grep -Fq "watchlist_movie_minutes" apps/web/dist/app-v167.js
          grep -Fq "vp.style.scrollBehavior='auto'" apps/web/dist/app-v167.js
          grep -Fq "ct167EnsureCurrentSports" apps/web/dist/app-v167.js
          grep -Fq "date_from:localDay(),date_to:localDay()" apps/web/dist/app-v167.js
          grep -Fq "date_from:shiftDays(-2),date_to:localDay()" apps/web/dist/app-v167.js
          grep -Fq "force:true" apps/web/dist/app-v167.js
          grep -Fq "cinetracker_sport_favorite_events_v2" apps/web/dist/app-v167.js
          grep -Fq "45d-chunked-by-sport" apps/web/dist/app-v167.js
          grep -Fq "ct-sports-sync" apps/web/dist/app-v167.js
          grep -Fq "ct166FmtMinutes" apps/web/dist/app-v167.js
          grep -Fq "ct-reconcile-library-user" apps/web/dist/app-v167.js
          grep -Fq '"revision":"r167-ui-home-sports-complete"' apps/web/dist/release.json
          grep -Fq '"outputDirectory": "dist"' apps/web/vercel.json
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('apps/web/dist/app-v167.js','utf8');
          const labels=[
            'Episódios','Filmes','Séries Watchlist','Filmes Watchlist','Tempo total de tela',
            'Tempo em Séries','Tempo em Filmes','Tempo de série em Watchlist','Tempo de filme em Watchlist','Tempo total em Watchlist'
          ];
          let at=-1;
          for(const label of labels){const next=js.indexOf("['"+label+"'",at+1);if(next<=at)throw new Error('Profile stat order missing: '+label);at=next;}
          if(!js.includes("ct163Decorate=function(){\n  if(route()!=='profile')return;"))throw new Error('Discover legacy decorator was not disabled');
          NODE
      - name: Upload exact r167 web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-web-r167-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  android_0997_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.3 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.3'" apps/android/app/build.gradle
          grep -q 'versionCode 9973' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.3-r151-library-sync' scripts/prepare-android-v09973.mjs
          grep -q 'window.__ct0997R151Loaded' scripts/prepare-android-v09973.mjs
          grep -q 'cinetracker:app-foreground' scripts/test-android-v09973.mjs
          grep -q 'android:id="@+id/nav_history"' apps/android/app/src/main/res/layout/activity_main.xml
          grep -q 'android:visibility="gone"' apps/android/app/src/main/res/layout/activity_main.xml
          node --check scripts/prepare-android-v09973.mjs
          node --check scripts/test-android-v09973.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Production domain serves r167
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r167-ui-home-sports-complete"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v167.js?ct=$(date +%s%N)" || true)"
              if grep -Fq "const REVISION='r167-ui-home-sports-complete';" <<<"$JS" && grep -Fq "no-string-appendChild" <<<"$JS" && grep -Fq "two-rows-five-cards" <<<"$JS" && grep -Fq "instant-main-history-hidden" <<<"$JS" && grep -Fq "force-current-day-and-favorite-round" <<<"$JS"; then
                echo 'PRODUCTION_R167_OK discover+profile+home+sports'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production domain did not serve r167-ui-home-sports-complete in time.' >&2
          exit 1
