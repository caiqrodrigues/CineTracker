name: Verify Web 1.0.201 r410 Pra Voce
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r410:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and Pra Voce regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check build-r410.mjs
          node --check build-r410-official.mjs
          node --check test-r410.mjs
          node --check test-r410-browser.mjs
          node --check runtime-r410-discover-foryou-owner.js
          node build-r410-official.mjs
          CT_R410_SKIP_BUILD=1 node test-r410.mjs
          CT_R410_SKIP_BUILD=1 node test-r410-browser.mjs
          node --check dist/app-v410.js
          grep -Fq "window.__ctR410Marker='r319-local-closure+legacy-painter-block+active-complete-actions'" dist/app-v410.js
          grep -Fq "async function loadForYou319(force=false){" dist/app-v410.js
          grep -Fq "if(window.__ctR410?.loadForYou)return window.__ctR410.loadForYou(force);" dist/app-v410.js
          grep -Fq 'class="chip ct410-action"' dist/app-v410.js
          grep -Fq 'data-ct409-action="swap"' dist/app-v410.js
          grep -Fq '↻ Trocar' dist/app-v410.js
          ! grep -Fq "window.location.reload(" runtime-r410-discover-foryou-owner.js
          ! grep -Fq "router.refresh(" runtime-r410-discover-foryou-owner.js
          ! grep -Fq "while(true)" runtime-r410-discover-foryou-owner.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r410, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.201"' <<<"$BODY" && grep -Fq '"revision": "r410-official-1.0.201"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v410.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR410Marker='r319-local-closure+legacy-painter-block+active-complete-actions'" <<<"$JS" \
                && grep -Fq 'class="chip ct410-action"' <<<"$JS" \
                && grep -Fq 'async function loadForYou319(force=false)' <<<"$JS" \
                && grep -Fq 'app-v410.js' <<<"$HTML"; then
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1
