name: Verify Web 1.0.53 r262 Real Video Regressions

on:
  push:
    branches: [main, 'fix/r262-real-video-regressions']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_53_r262:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r262
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.53"' package.json
          grep -Fq '"version": "1.0.53"' apps/web/package.json
          test -f apps/web/runtime-r262-real-video-regressions.js
          test -f apps/web/build-r262.mjs
          test -f apps/web/build-r262-official.mjs
          test -f apps/web/test-r262.mjs
          test -f apps/web/test-r262-algorithms.mjs
          test -f apps/web/test-r262-browser.mjs
          test -f scripts/test-r262-exact-bundle-browser.mjs
      - name: Syntax r262 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r262-real-video-regressions.js
          node --check apps/web/build-r262.mjs
          node --check apps/web/build-r262-official.mjs
          node --check apps/web/test-r262.mjs
          node --check apps/web/test-r262-algorithms.mjs
          node --check apps/web/test-r262-browser.mjs
          node --check scripts/test-r262-exact-bundle-browser.mjs
      - name: Build official r262
        working-directory: apps/web
        run: node build-r262-official.mjs
      - name: Static authority regression r262
        working-directory: apps/web
        run: node test-r262.mjs
      - name: Logic regressions r262
        working-directory: apps/web
        run: node test-r262-algorithms.mjs
      - name: Chromium user-video structures mobile r262
        working-directory: apps/web
        run: node test-r262-browser.mjs
      - name: Exact final bundle boot r262
        run: node scripts/test-r262-exact-bundle-browser.mjs
      - name: Final bundle identity r262
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v262.js
          grep -Fq "window.__ctWebBuild='1.0.53';window.__ctOfficialVersion='1.0.53';" dist/app-v262.js
          grep -Fq "const REVISION='r262-official-1.0.53';" dist/app-v262.js
          grep -Fq "window.__ctR262='real-video-regressions-horizontal-series-sports'" dist/app-v262.js
          grep -Fq "window.__ctR262Home='local-horizontal-buckets+recent-weekly-frontier'" dist/app-v262.js
          grep -Fq "window.__ctR262Discover='standard-2x3-local-rails+resilient-personal-state'" dist/app-v262.js
          grep -Fq "window.__ctR262Sports='page-x-contained+local-match-f1-rails'" dist/app-v262.js
          grep -Fq "window.__ctR262Detail='nonblank-series-recovery'" dist/app-v262.js
          grep -Fq "window.__ctR262Horizontal='page-fixed-component-local-x'" dist/app-v262.js
          grep -Fq 'function sanitizeWeekly262(row)' dist/app-v262.js
          grep -Fq 'function recoverSeriesDetail262(id)' dist/app-v262.js
          grep -Fq '.ct262-home-rail' dist/app-v262.css
          grep -Fq '.ct262-media-rail' dist/app-v262.css
          grep -Fq '.ct262-sports-root' dist/app-v262.css
          grep -Fq '.ct262-series-detail' dist/app-v262.css
          grep -Fq 'app-v262.js' dist/index.html
          grep -Fq 'app-v262.css' dist/index.html
          ! grep -Fq 'app-v261.js' dist/index.html
          grep -Fq '"version": "1.0.53"' dist/release.json
          grep -Fq '"revision": "r262-official-1.0.53"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.53-r262';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_53_r262]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.53 r262
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.53"' <<<"$BODY" && grep -Fq '"revision": "r262-official-1.0.53"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v262.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v262.css?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR262='real-video-regressions-horizontal-series-sports'" <<<"$JS" && grep -Fq "window.__ctR262Home='local-horizontal-buckets+recent-weekly-frontier'" <<<"$JS" && grep -Fq "window.__ctR262Discover='standard-2x3-local-rails+resilient-personal-state'" <<<"$JS" && grep -Fq "window.__ctR262Sports='page-x-contained+local-match-f1-rails'" <<<"$JS" && grep -Fq '.ct262-home-rail' <<<"$CSS" && grep -Fq '.ct262-series-detail' <<<"$CSS" && grep -Fq 'app-v262.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
