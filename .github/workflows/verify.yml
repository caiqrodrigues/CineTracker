name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate r179 regressions and r180 rules
        run: |
          node --check apps/web/runtime-r179.js
          node --check apps/web/runtime-r180.js
          node --check apps/web/build-r180.mjs
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r178-stable-home.mjs
          node scripts/test-r179-target-card.mjs
          node scripts/test-r180-discover-profile.mjs
      - name: Build Web r180
        working-directory: apps/web
        run: npm run build
      - name: Assert Web r180 artifact
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v180.js
          grep -Fq "r180-discover-profile-parity" apps/web/dist/app-v180.js
          grep -Fq "all-tabs-scroll-strict-business-rules" apps/web/dist/app-v180.js
          grep -Fq "const lo=shiftDays(-30),hi=localDay()" apps/web/dist/app-v180.js
          grep -Fq "const lo=shiftDays(-7),hi=shiftDays(30)" apps/web/dist/app-v180.js
          grep -Fq "collapsible-stats-wide-time-cards" apps/web/dist/app-v180.js
          grep -Fq '"revision":"r180-discover-profile-parity"' apps/web/dist/release.json
          grep -Fq 'touch-action:pan-x!important' apps/web/dist/app-v180.css
          grep -Fq '.ct-r180-stat-wide{grid-column:span 2!important}' apps/web/dist/app-v180.css
          test ! -f apps/web/dist/app-v179.js

  android_099716_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.16
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.16'" apps/android/app/build.gradle
          grep -q 'versionCode 9986' apps/android/app/build.gradle
          node --check scripts/prepare-android-v099716.mjs
          node --check scripts/test-android-v099716.mjs
          node scripts/test-r180-discover-profile.mjs
          node scripts/prepare-android-v099716.mjs
          node scripts/test-android-v099716.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Production Web serves r180
        run: |
          set -euo pipefail
          for i in $(seq 1 70); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r180-discover-profile-parity"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v180.js?ct=$(date +%s%N)" || true)"
              if grep -Fq "all-tabs-scroll-strict-business-rules" <<<"$JS" && grep -Fq "collapsible-stats-wide-time-cards" <<<"$JS"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
