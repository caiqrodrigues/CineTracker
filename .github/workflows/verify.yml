name: Verify Web 0.3.8 r481
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r481:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r481 v0.3.8 Home Discover Profile regression gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v481.js
          grep -Fq "window.__ctR481Marker='v038-home-skeleton+movie-2x3+smart-discover-cache+stable-sports+profile-12-header-only'" apps/web/dist/app-v481.js
          grep -Fq 'cinetracker_discover_fresh_v480' apps/web/dist/app-v481.js
          grep -Fq 'cinetracker_discover_watch_smart_v480' apps/web/dist/app-v481.js
          grep -Fq 'cinetracker_record_recommendations_v480' apps/web/dist/app-v481.js
          grep -Fq 'cinetracker_profile_lists_v480' apps/web/dist/app-v481.js
          grep -Fq 'cinetracker_sports_payload_v479' apps/web/dist/app-v481.js
          grep -Fq 'cinetracker_f1_watch_sync_v462' apps/web/dist/app-v481.js
          grep -Fq 'POOL_CACHE_TTL481' apps/web/dist/app-v481.js
          grep -Fq 'SPORTS_CACHE481' apps/web/dist/app-v481.js
          grep -Fq 'async function openAll(key)' apps/web/dist/app-v481.js
          grep -Fq 'ct481-home-skeleton' apps/web/dist/app-v481.js
          grep -Fq 'data-ct479-preboot' apps/web/dist/index.html
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r481, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r481 v0.3.8 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "0.3.8"' <<<"$BODY" && grep -Fq '"revision": "r481-official-0.3.8"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v481.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR481Marker='v038-home-skeleton+movie-2x3+smart-discover-cache+stable-sports+profile-12-header-only'" <<<"$JS" && grep -Fq 'app-v481.js' <<<"$HTML" && grep -Fq 'data-ct479-preboot' <<<"$HTML"; then exit 0; fi
            fi
            if [ "$i" -eq 240 ]; then exit 1; fi
            sleep 5
          done
