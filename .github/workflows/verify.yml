name: Verify Web 0.3.16 r489
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r489:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r489 video regression gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v489.js
          grep -Fq "window.__ctR489Marker='video-truth+single-home-owner+movies-real-2x3+foryou-one-rpc+profile-fast-12+sports-no-flicker'" apps/web/dist/app-v489.js
          grep -Fq 'cinetracker_foryou_payload_v489' apps/web/dist/app-v489.js
          grep -Fq 'cinetracker_profile_summary_v489' apps/web/dist/app-v489.js
          grep -Fq 'ct489-movie-card' apps/web/dist/app-v489.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r489, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r489 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "0.3.16"' <<<"$BODY" && grep -Fq '"revision": "r489-official-0.3.16"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v489.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR489Marker='video-truth+single-home-owner+movies-real-2x3+foryou-one-rpc+profile-fast-12+sports-no-flicker'" <<<"$JS" && grep -Fq 'app-v489.js' <<<"$HTML"; then exit 0; fi
            fi
            if [ "$i" -eq 240 ]; then exit 1; fi
            sleep 5
          done
