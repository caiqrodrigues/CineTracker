name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate r179-r183 regressions
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r179.js
          node --check apps/web/runtime-r180.js
          node --check apps/web/runtime-r181.js
          node --check apps/web/runtime-r182.js
          node --check apps/web/runtime-r183.js
          node --check apps/web/build-r183.mjs
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r178-stable-home.mjs
          node scripts/test-r179-target-card.mjs
          node scripts/test-r180-discover-profile.mjs
          node scripts/test-r181-season-toggle.mjs
          node scripts/test-r182-home-season-polish.mjs
          node scripts/test-r183-web-clean-profile.mjs
      - name: Build Web r183
        working-directory: apps/web
        run: npm run build
      - name: Assert Web r183 artifact
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v183.js
          grep -Fq "r183-web-clean-profile" apps/web/dist/app-v183.js
          grep -Fq "remove-redundant-page-title-copy-preserve-back" apps/web/dist/app-v183.js
          grep -Fq "four-column-balanced-stats-wide-totals" apps/web/dist/app-v183.js
          grep -Fq "collapsible-sports-extra-statistics" apps/web/dist/app-v183.js
          grep -Fq "compact-inline-season-toggle-no-giant-button" apps/web/dist/app-v183.js
          grep -Fq "mark-unmark-all-released-episodes" apps/web/dist/app-v183.js
          grep -Fq '"revision":"r183-web-clean-profile"' apps/web/dist/release.json
          grep -Fq '.content>.header>div{display:none!important}' apps/web/dist/app-v183.css
          grep -Fq '.ct-r183-stats-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important' apps/web/dist/app-v183.css
          grep -Fq '.ct-r183-extra-stats-body.hidden{display:none!important}' apps/web/dist/app-v183.css
          test ! -f apps/web/dist/app-v182.js

  android_099718_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android remains 0.99.7.18
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.18'" apps/android/app/build.gradle
          grep -q 'versionCode 9988' apps/android/app/build.gradle
          node --check scripts/prepare-android-v099718.mjs
          node --check scripts/test-android-v099718.mjs
          node scripts/test-r181-season-toggle.mjs
          node scripts/test-r182-home-season-polish.mjs
          node scripts/prepare-android-v099718.mjs
          node scripts/test-android-v099718.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Production Web serves r183
        run: |
          set -euo pipefail
          for i in $(seq 1 70); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r183-web-clean-profile"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v183.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v183.css?ct=$(date +%s%N)" || true)"
              if grep -Fq "remove-redundant-page-title-copy-preserve-back" <<<"$JS" && grep -Fq "collapsible-sports-extra-statistics" <<<"$JS" && grep -Fq '.content>.header>div{display:none!important}' <<<"$CSS"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
