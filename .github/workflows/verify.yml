name: Verify Web 1.0.103 r312 Latest Video Discover Auth Profile Sports

on:
  push:
    branches: [main, 'fix/r312-video-truth-discover-auth-sports-profile']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_103_r312:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r312
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.103"' package.json
          grep -Fq '"version": "1.0.103"' apps/web/package.json
          grep -Fq 'build-r312-official.mjs' apps/web/package.json
          test -f apps/web/build-r312.mjs
          test -f apps/web/build-r312-official.mjs
          test -f apps/web/runtime-r312-video-truth.js.gz.b64
          test -f apps/web/test-r312.mjs
          test -f apps/web/test-r312-browser.mjs
      - name: Syntax r312 release chain
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'),z=require('zlib');fs.writeFileSync('/tmp/runtime-r312.js',z.gunzipSync(Buffer.from(fs.readFileSync('apps/web/runtime-r312-video-truth.js.gz.b64','utf8').trim(),'base64')))"
          node --check /tmp/runtime-r312.js
          node --check apps/web/build-r312.mjs
          node --check apps/web/build-r312-official.mjs
          node --check apps/web/test-r312.mjs
          node --check apps/web/test-r312-browser.mjs
      - name: Regression suite through r312 including latest-video Discover/Auth/Profile/Sports failures
        working-directory: apps/web
        run: npm run verify
      - name: Final bundle identity r312 latest-video truth
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r312-official.mjs
          node --check dist/app-v312.js
          CT_R312_SKIP_BUILD=1 node test-r312.mjs
          test -f dist/app-v312.js
          test -f dist/app-v312.css
          grep -Fq 'app-v312.js' dist/index.html
          grep -Fq 'app-v312.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.103'
            && r.revision==='r312-official-1.0.103'
            && r.discover_single_shell===true
            && r.discover_tabs_persistent_during_load===true
            && r.discover_public_exclusion==='seen+watchlist-before-markup'
            && r.discover_public_own_cards===true
            && r.discover_metadata_unclipped===true
            && r.discover_foryou_compact===true
            && r.auth_expired_jwt_refresh_retry===true
            && r.profile_stadium_button_guaranteed===true
            && r.profile_actor_source==='favorite_actors-live-table'
            && r.profile_actor_write_invalidation===true
            && r.sports_inline_filter_tabs==='next+previous'
            && r.sports_inline_filter_source==='payload.sports'
            && r.f1_session_watch===true
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_103_r312, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.103 r312
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.103"' <<<"$BODY" \
              && grep -Fq '"revision": "r312-official-1.0.103"' <<<"$BODY" \
              && grep -Fq '"discover_single_shell": true' <<<"$BODY" \
              && grep -Fq '"discover_tabs_persistent_during_load": true' <<<"$BODY" \
              && grep -Fq '"discover_metadata_unclipped": true' <<<"$BODY" \
              && grep -Fq '"discover_foryou_compact": true' <<<"$BODY" \
              && grep -Fq '"auth_expired_jwt_refresh_retry": true' <<<"$BODY" \
              && grep -Fq '"profile_stadium_button_guaranteed": true' <<<"$BODY" \
              && grep -Fq '"profile_actor_source": "favorite_actors-live-table"' <<<"$BODY" \
              && grep -Fq '"sports_inline_filter_source": "payload.sports"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v312.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR312='discover-single-shell+auth-refresh+profile-live-favorites+stadium-button+sports-inline-filters'" <<<"$JS" \
                && grep -Fq "window.__ctR312EarlyCapture=true" <<<"$JS" \
                && grep -Fq "grant_type=refresh_token" <<<"$JS" \
                && grep -Fq "favorite_actors?select=id,tmdb_person_id,actor_name,profile_path" <<<"$JS" \
                && grep -Fq "data-ct312-sport-filter" <<<"$JS" \
                && grep -Fq "window.__ctR311='profile-stat-single-version+f1-clickable-weekend+discover-public-single-renderer'" <<<"$JS" \
                && grep -Fq 'app-v312.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=7500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
