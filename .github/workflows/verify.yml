name: Verify Web 0.3.9 r482
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r482:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r482 Home Movies Discover Profile regression gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v482.js
          grep -Fq "window.__ctR482Marker='home-no-anchor-churn+movies-compact-rows+discover-v421-fallback+profile-12-plus-more'" apps/web/dist/app-v482.js
          grep -Fq 'cinetracker_home_series_v452' apps/web/dist/app-v482.js
          grep -Fq 'cinetracker_home_history_v391' apps/web/dist/app-v482.js
          grep -Fq 'cinetracker_home_movies_v405' apps/web/dist/app-v482.js
          grep -Fq 'cinetracker_discover_fresh_v480' apps/web/dist/app-v482.js
          grep -Fq 'cinetracker_discover_watch_smart_v480' apps/web/dist/app-v482.js
          grep -Fq 'cinetracker_discover_fresh_v421' apps/web/dist/app-v482.js
          grep -Fq 'cinetracker_discover_watch_unseen_v421' apps/web/dist/app-v482.js
          grep -Fq 'ct482-profile-more' apps/web/dist/app-v482.js
          grep -Fq 'nth-child(n+14)' apps/web/dist/app-v482.js
          grep -Fq 'data-ct479-preboot' apps/web/dist/index.html
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r482, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r482 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "0.3.9"' <<<"$BODY" && grep -Fq '"revision": "r482-official-0.3.9"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v482.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR482Marker='home-no-anchor-churn+movies-compact-rows+discover-v421-fallback+profile-12-plus-more'" <<<"$JS" && grep -Fq 'app-v482.js' <<<"$HTML" && grep -Fq 'data-ct479-preboot' <<<"$HTML"; then exit 0; fi
            fi
            if [ "$i" -eq 240 ]; then exit 1; fi
            sleep 5
          done
