name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax, gap logic and stable Home DOM r178
        run: |
          node --check apps/web/runtime-r169.js
          node --check apps/web/runtime-r170.js
          node --check apps/web/runtime-r171.js
          node --check apps/web/runtime-r172.js
          node --check apps/web/runtime-r173.js
          node --check apps/web/runtime-r174.js
          node --check apps/web/runtime-r175.js
          node --check apps/web/runtime-r176.js
          node --check apps/web/runtime-r177.js
          node --check apps/web/runtime-r178.js
          node --check apps/web/build-r178.mjs
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r177-repaint.mjs
          node scripts/test-r178-stable-home.mjs
      - name: Build exact CineTracker Web r178 artifact used by Vercel
        working-directory: apps/web
        run: npm run build
      - name: Assert r178 stable Home DOM authority
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v178.js
          test "$(grep -o '<script' apps/web/dist/index.html | wc -l)" -eq 1
          grep -Fq "r178-stable-home-dom" apps/web/dist/app-v178.js
          grep -Fq "stable-home-dom-no-repaint-loop" apps/web/dist/app-v178.js
          grep -Fq "no-global-repaint-scroll-click-history-stable" apps/web/dist/app-v178.js
          grep -Fq "ct178PatchHomeSeries" apps/web/dist/app-v178.js
          grep -Fq "ct176PrimeCanonical=ct177PrimeCanonicalBase" apps/web/dist/app-v178.js
          grep -Fq "first-released-unwatched-gap-authority" apps/web/dist/app-v178.js
          grep -Fq "cinetracker_unmark_episode_v1" apps/web/dist/app-v178.js
          grep -Fq "ct174-flash" apps/web/dist/app-v178.css
          grep -Fq "ct175-next-episode" apps/web/dist/app-v178.css
          grep -Fq "ct173-detail-window" apps/web/dist/app-v178.js
          grep -Fq '"revision":"r178-stable-home-dom"' apps/web/dist/release.json
          test ! -f apps/web/dist/app-v177.js
      - name: Upload exact r178 web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-web-r178-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  android_099712_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.12 r178 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.12'" apps/android/app/build.gradle
          grep -q 'versionCode 9982' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.12-r178-stable-home-dom' scripts/prepare-android-v099712.mjs
          grep -q 'web-r178-stable-home-dom-parity' scripts/prepare-android-v099712.mjs
          grep -q 'stable-home-dom-no-repaint-loop' scripts/prepare-android-v099712.mjs
          node --check scripts/prepare-android-v099712.mjs
          node --check scripts/test-android-v099712.mjs
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r178-stable-home.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Production domain serves r178
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 70); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r178-stable-home-dom"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v178.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v178.css?ct=$(date +%s%N)" || true)"
              if grep -Fq "const REVISION='r178-stable-home-dom';" <<<"$JS" && grep -Fq "stable-home-dom-no-repaint-loop" <<<"$JS" && grep -Fq "ct175-next-episode" <<<"$CSS"; then
                echo 'PRODUCTION_R178_OK stable-home-dom'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production domain did not serve r178-stable-home-dom in time.' >&2
          exit 1
