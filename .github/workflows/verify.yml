name: Verify Web 1.0.177 r386 Home and Pra Voce Only
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r386:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Scope and build
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check runtime-r386-home-discover-fresh-client.js
          node --check build-r386.mjs
          node build-r386-official.mjs
          CT_R386_SKIP_BUILD=1 node test-r386.mjs
          CT_R385_SKIP_BUILD=1 node test-r385-browser.mjs
          node --check dist/app-v386.js
          grep -Fq 'app-v386.js' dist/index.html
          grep -Fq 'ct-web-1.0.177-r386' dist/service-worker.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r386, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.177"' <<<"$BODY" && grep -Fq '"revision": "r386-official-1.0.177"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v386.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR386Marker='home-discover-fresh-client+release-check+sw-update'" <<<"$JS" && grep -Fq 'http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
