name: Verify Web 1.0.35 r244 Series Overflow

on:
  push:
    branches: [main, 'fix/r244-series-horizontal-overflow']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_35_series_overflow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax r243 + r244
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.35"' apps/web/package.json
          node --check apps/web/runtime-r243-home-interaction-catchup.js
          node --check apps/web/build-r243.mjs
          node --check apps/web/test-r243.mjs
          node --check scripts/test-r239-video-ground-truth-browser.mjs
          node --check scripts/test-r243-home-browser.mjs
          node --check apps/web/runtime-r244-series-horizontal-overflow.js
          node --check apps/web/build-r244.mjs
          node --check apps/web/test-r244.mjs
          node --check scripts/test-r244-series-overflow-browser.mjs
      - name: Build inherited r243 baseline
        working-directory: apps/web
        run: node build-r243.mjs
      - name: Static invariants inherited r243
        working-directory: apps/web
        run: node test-r243.mjs
      - name: Chromium r239 regression ground truth
        run: node scripts/test-r239-video-ground-truth-browser.mjs
      - name: Chromium r243 Home regression
        run: node scripts/test-r243-home-browser.mjs
      - name: Build r244
        working-directory: apps/web
        run: node build-r244.mjs
      - name: Static invariants r244
        working-directory: apps/web
        run: node test-r244.mjs
      - name: Final bundle identity r244
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v244.js
          grep -Fq "window.__ctWebBuild='1.0.35';window.__ctOfficialVersion='1.0.35';" dist/app-v244.js
          grep -Fq "const REVISION='r244-official-1.0.35';" dist/app-v244.js
          grep -Fq "window.__ctR239='production-video-ground-truth'" dist/app-v244.js
          grep -Fq "window.__ctR243='home-interaction-bounded-metadata-canonical-catchup'" dist/app-v244.js
          grep -Fq "window.__ctR244='series-detail-local-horizontal-overflow'" dist/app-v244.js
          grep -Fq 'app-v244.js' dist/index.html
          grep -Fq 'app-v244.css' dist/index.html
          grep -Fq '"version": "1.0.35"' dist/release.json
          grep -Fq '"revision": "r244-official-1.0.35"' dist/release.json
          grep -Fq 'html,body{width:100%;max-width:100%;overflow-x:hidden}' dist/app-v244.css
          grep -Fq 'touch-action:pan-x pan-y!important' dist/app-v244.css
      - name: Chromium r244 series overflow behavior
        run: node scripts/test-r244-series-overflow-browser.mjs

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_35_series_overflow]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Official production serves 1.0.35 r244
        run: |
          set -euo pipefail
          for i in $(seq 1 150); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.35"' <<<"$BODY" && grep -Fq '"revision": "r244-official-1.0.35"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v244.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v244.css?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR244='series-detail-local-horizontal-overflow'" <<<"$JS" && grep -Fq 'touch-action:pan-x pan-y!important' <<<"$CSS" && grep -Fq 'app-v244.js' <<<"$HTML" && grep -Fq 'app-v244.css' <<<"$HTML"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
