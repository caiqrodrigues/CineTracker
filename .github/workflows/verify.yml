name: Verify Web 0.3.51 r524
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r524:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r524 Home special-series gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v524.js
          grep -Fq "window.__ctR524Marker='home-toolbar-same-row+special-total-season+direct-special-open'" apps/web/dist/app-v524.js
          grep -Fq "window.__ctR523Marker='home-r509-hidden+movies-r514-rail+foryou-v517-audit+top10-strict-retry'" apps/web/dist/app-v524.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r524, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r524 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "0.3.51"' <<<"$BODY" && grep -Fq '"revision": "r524-official-0.3.51"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v524.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR524Marker='home-toolbar-same-row+special-total-season+direct-special-open'" <<<"$JS" && grep -Fq 'app-v524.js' <<<"$HTML"; then exit 0; fi
            fi
            [ "$i" -eq 240 ] && exit 1
            sleep 5
          done
