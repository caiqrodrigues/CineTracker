name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0993:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build and verify CineTracker Web 0.99.3
        run: npm run build
      - name: Preserve Bingers semantics and authentication
        run: |
          node scripts/test-hotfix13-bingers-semantics.mjs
          node scripts/test-auth-recovery-red.mjs
          node scripts/test-hotfix10-native-bridge.mjs
      - name: Assert Web 0.99.3 runtime invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"version": "0.99.3"' package.json
          grep -q 'ct-web-0.99.3' dist/service-worker.js
          grep -q 'patch-v092-v0991.js' dist/index.html
          grep -q 'patch-v093-v0992.js' dist/index.html
          grep -q 'patch-v094-v0992-compat.js' dist/index.html
          grep -q 'patch-v097-v0993-nav-pre.js' dist/index.html
          grep -q 'patch-v095-v0992-fix.js' dist/index.html
          grep -q 'patch-v096-v0992-unfreeze.js' dist/index.html
          grep -q 'patch-v098-v0993-web.js' dist/index.html
          test "$(grep -o 'patch-v097-v0993-nav-pre.js' dist/index.html | wc -l)" -eq 1
          test "$(grep -o 'patch-v098-v0993-web.js' dist/index.html | wc -l)" -eq 1
          grep -q 'web-0.99.3-navigation-discover-pre' dist/patch-v097-v0993-nav-pre.js
          grep -q 'web-0.99.3-sidebar-discover-footer' dist/patch-v098-v0993-web.js
          grep -q 'data-dtab991' dist/patch-v097-v0993-nav-pre.js
          grep -q 'data-dfilter991' dist/patch-v097-v0993-nav-pre.js
          grep -q 'purgeHistory993' dist/patch-v098-v0993-web.js
          grep -q 'pointer-events:auto' dist/patch-v098-v0993-web.js
          grep -q 'Atualizar recomendações' dist/patch-v098-v0993-web.js
          grep -q 'Importar / sincronizar dados' dist/patch-v098-v0993-web.js
          grep -q 'CineTracker • v0.99.3' dist/patch-v098-v0993-web.js
          grep -q 'fix2-idempotent-dom-mutation-guard' dist/patch-v096-v0992-unfreeze.js
          grep -q 'v.profile_id=pid' dist/patch-v095-v0992-fix.js
          grep -q "table==='media'&&!v.media_kind" dist/patch-v095-v0992-fix.js
          grep -q 'Histórico oculto · puxe para baixo para revelar' dist/patch-v093-v0992.js
          grep -q 'Vistos ocultos · puxe para baixo para revelar' dist/patch-v093-v0992.js
          grep -q 'Toda atualização' docs/DEVELOPMENT_RULES.md

  android_identity_unchanged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert Android publication identity was not changed by Web 0.99.3
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.2.3'" apps/android/app/build.gradle
          grep -q 'versionCode 9923' apps/android/app/build.gradle
          grep -q "window.__ctAndroidBundle = 'v0.99.2.3-fix2-unfreeze-authoritative'" apps/android/app/src/main/assets/hotfix5/index.html
          grep -q "window.__ctAndroidBuild = '0.99.2.3'" apps/android/app/src/main/assets/hotfix5/index.html
