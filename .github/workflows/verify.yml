name: Verify Web 1.0.54 r263 User Ground Truth

on:
  push:
    branches: [main, 'fix/r263-video-regressions-home-discover-sports-f1']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_54_r263:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r263
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.54"' package.json
          grep -Fq '"version": "1.0.54"' apps/web/package.json
          test -f apps/web/runtime-r263-user-ground-truth.js
          test -f apps/web/build-r263.mjs
          test -f apps/web/build-r263-official.mjs
          test -f apps/web/test-r263.mjs
          test -f apps/web/test-r263-browser.mjs
          test -f scripts/test-r263-exact-bundle-browser.mjs
          test -f supabase/functions/ct-f1-sports-sync-r263/index.ts
          test -f supabase/migrations/20260913213817_r263_sports_watch_rpc_compat.sql
      - name: Syntax r263 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r263-user-ground-truth.js
          node --check apps/web/build-r263.mjs
          node --check apps/web/build-r263-official.mjs
          node --check apps/web/test-r263.mjs
          node --check apps/web/test-r263-browser.mjs
          node --check scripts/test-r263-exact-bundle-browser.mjs
      - name: Build official r263
        working-directory: apps/web
        run: node build-r263-official.mjs
      - name: Static regressions r263
        working-directory: apps/web
        run: node test-r263.mjs
      - name: Chromium user-video ground truth r263
        working-directory: apps/web
        run: node test-r263-browser.mjs
      - name: Exact final bundle boot r263
        run: node scripts/test-r263-exact-bundle-browser.mjs
      - name: Final bundle identity r263
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v263.js
          grep -Fq "window.__ctWebBuild='1.0.54';window.__ctOfficialVersion='1.0.54';" dist/app-v263.js
          grep -Fq "const REVISION='r263-official-1.0.54';" dist/app-v263.js
          grep -Fq "window.__ctR263='user-ground-truth-home-list-detail-discover-sports-f1'" dist/app-v263.js
          grep -Fq "window.__ctR263Home='vertical-list-only-no-carousel'" dist/app-v263.js
          grep -Fq "window.__ctR263Detail='local-x-seasons-season-graphs-similar-only'" dist/app-v263.js
          grep -Fq "window.__ctR263Discover='all-tabs-local-x-standard-2x3'" dist/app-v263.js
          grep -Fq "window.__ctR263Sports='canonical-watch-rpc+fresh-f1-jolpica-sync'" dist/app-v263.js
          grep -Fq "p_event_id:id" dist/app-v263.js
          ! grep -Fq "p_provider:provider,p_provider_event_id:id" dist/app-v263.js
          grep -Fq '.ct263-home-list' dist/app-v263.css
          grep -Fq '.ct263-discover-card' dist/app-v263.css
          grep -Fq 'app-v263.js' dist/index.html
          grep -Fq 'app-v263.css' dist/index.html
          ! grep -Fq 'app-v262.js' dist/index.html
          grep -Fq '"version": "1.0.54"' dist/release.json
          grep -Fq '"revision": "r263-official-1.0.54"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.54-r263';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_54_r263]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.54 r263
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.54"' <<<"$BODY" && grep -Fq '"revision": "r263-official-1.0.54"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v263.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v263.css?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR263='user-ground-truth-home-list-detail-discover-sports-f1'" <<<"$JS" && grep -Fq "window.__ctR263Home='vertical-list-only-no-carousel'" <<<"$JS" && grep -Fq "window.__ctR263Discover='all-tabs-local-x-standard-2x3'" <<<"$JS" && grep -Fq "window.__ctR263Sports='canonical-watch-rpc+fresh-f1-jolpica-sync'" <<<"$JS" && grep -Fq '.ct263-home-list' <<<"$CSS" && grep -Fq '.ct263-discover-card' <<<"$CSS" && grep -Fq 'app-v263.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
