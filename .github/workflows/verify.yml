name: Verify Web 1.0.64 r273 Home History and Flex Rows

on:
  push:
    branches: [main, 'fix/r273-history-flex-validation']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_64_r273:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r273
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.64"' package.json
          grep -Fq '"version": "1.0.64"' apps/web/package.json
          grep -Fq 'build-r273-official.mjs' apps/web/package.json
          grep -Fq '## 1.0.64 — 2026-09-14 — Web r273' CHANGELOG.md
          grep -Fq 'Web 1.0.64 / r273' README.md
          test -f apps/web/build-r273.mjs
          test -f apps/web/build-r273-official.mjs
          test -f apps/web/test-r273.mjs
          test -f apps/web/test-r273-browser.mjs
          test -f scripts/test-r273-exact-bundle-browser.mjs
      - name: Syntax r273 release chain
        run: |
          set -euo pipefail
          node --check apps/web/build-r273.mjs
          node --check apps/web/build-r273-official.mjs
          node --check apps/web/test-r273.mjs
          node --check apps/web/test-r273-browser.mjs
          node --check scripts/test-r273-exact-bundle-browser.mjs
      - name: Build official r273
        working-directory: apps/web
        run: node build-r273-official.mjs
      - name: Static regressions r273
        working-directory: apps/web
        run: node test-r273.mjs
      - name: Chromium Home history and flex-row regression r273
        working-directory: apps/web
        run: node test-r273-browser.mjs
      - name: Exact final bundle boot r273
        run: node scripts/test-r273-exact-bundle-browser.mjs
      - name: Final bundle identity r273
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v273.js
          grep -Fq "window.__ctWebBuild='1.0.64';window.__ctOfficialVersion='1.0.64';" dist/app-v273.js
          grep -Fq "const REVISION='r273-official-1.0.64';" dist/app-v273.js
          grep -Fq "window.__ctR273='home-r5-direct+history-undo+strict-flex-row'" dist/app-v273.js
          grep -Fq "async function ct273FetchHome(){return ct273NormalizeHomePayload(await rpc('cinetracker_profile_home_payload_v0997_r5'" dist/app-v273.js
          grep -Fq "rpc('cinetracker_unmark_episode_v1'" dist/app-v273.js
          grep -Fq "rpc('cinetracker_unmark_media_seen_v1'" dist/app-v273.js
          grep -Fq 'paintHome=ct273PaintHome;renderHome=ct273RenderHome;' dist/app-v273.js
          ! grep -Fq "rpc('cinetracker_home_live_v0997_r3'" dist/app-v273.js
          grep -Fq 'app-v273.js' dist/index.html
          grep -Fq 'app-v273.css' dist/index.html
          grep -Fq '"version": "1.0.64"' dist/release.json
          grep -Fq '"revision": "r273-official-1.0.64"' dist/release.json
          grep -Fq '"home_history_direct_fetch": true' dist/release.json
          grep -Fq '"home_history_undo": true' dist/release.json
          grep -Fq '"home_card_layout": "flex-row-nowrap"' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.64-r273';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_64_r273]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.64 r273
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.64"' <<<"$BODY" && grep -Fq '"revision": "r273-official-1.0.64"' <<<"$BODY" && grep -Fq '"home_history_direct_fetch": true' <<<"$BODY" && grep -Fq '"home_history_undo": true' <<<"$BODY" && grep -Fq '"home_card_layout": "flex-row-nowrap"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v273.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR273='home-r5-direct+history-undo+strict-flex-row'" <<<"$JS" && grep -Fq "rpc('cinetracker_profile_home_payload_v0997_r5'" <<<"$JS" && grep -Fq 'data-ct273-history-undo' <<<"$JS" && grep -Fq 'app-v273.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
