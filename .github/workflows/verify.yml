name: Verify Web 1.0.120 r329 Discover Geometry

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_120_r329:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r329
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.120"' package.json
          grep -Fq '"version": "1.0.120"' apps/web/package.json
          grep -Fq 'build-r329-official.mjs' apps/web/package.json
          test -f apps/web/build-r329.mjs
          test -f apps/web/build-r329-official.mjs
          test -f apps/web/runtime-r329-discover-geometry.js
          test -f apps/web/test-r329.mjs
          test -f apps/web/test-r329-browser.mjs
      - name: Syntax r329 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r329-discover-geometry.js
          node --check apps/web/build-r329.mjs
          node --check apps/web/build-r329-official.mjs
          node --check apps/web/test-r329.mjs
          node --check apps/web/test-r329-browser.mjs
      - name: Focused mobile browser gate r329
        working-directory: apps/web
        run: npm run test:r329:browser
      - name: Preserve r328 and current regressions
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run test:r324
          npm run test:r324:browser
          npm run test:r325
          npm run test:r325:browser
          npm run test:r326
          npm run test:r326:browser
          npm run test:r327
          npm run test:r327:browser
          npm run test:r328
          npm run test:r328:browser
      - name: Final bundle identity r329
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r329-official.mjs
          node --check dist/app-v329.js
          CT_R329_SKIP_BUILD=1 node test-r329.mjs
          grep -Fq 'app-v329.js' dist/index.html
          grep -Fq 'app-v329.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.120'
            && r.revision==='r329-official-1.0.120'
            && r.discover_filter_authority==='cinetracker_discover_filter_v326'
            && r.discover_foryou_renderer==='r329-fixed-card-horizontal-rails'
            && r.discover_foryou_actions==='unique-classes-single-row-no-wrap'
            && r.discover_foryou_cards==='154-mobile+176-desktop+2x3'
            && r.discover_foryou_overflow==='rail-only-no-document-horizontal-scroll'
            && r.home_changes==='none-r329'
            && r.profile_changes==='none-r329'
            && r.episode_sync==='r325-preserved'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_120_r329, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.120 r329
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.120"' <<<"$BODY" \
              && grep -Fq '"revision": "r329-official-1.0.120"' <<<"$BODY" \
              && grep -Fq '"discover_foryou_renderer": "r329-fixed-card-horizontal-rails"' <<<"$BODY" \
              && grep -Fq '"discover_foryou_overflow": "rail-only-no-document-horizontal-scroll"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v329.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR329Marker='discover-fixed-card-rail+one-line-actions+no-page-overflow'" <<<"$JS" \
                && grep -Fq 'cinetracker_discover_filter_v326' <<<"$JS" \
                && grep -Fq 'app-v329.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --window-size=390,844 --virtual-time-budget=8000 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
