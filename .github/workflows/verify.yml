name: Verify Web 0.3.39 r512
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web_r512:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r512 Home movies + historical UFC/F1 regression gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v512.js
          grep -Fq "window.__ctR512Marker='historical-f1-1950+ufc-1993+single-special-owner+stable-remount+movies-standard-rows'" apps/web/dist/app-v512.js
          grep -Fq 'cinetracker_f1_series_v512' apps/web/dist/app-v512.js
          grep -Fq 'cinetracker_f1_watch_sync_v462' apps/web/dist/app-v512.js
          grep -Fq 'cinetracker_ufc_series_v512' apps/web/dist/app-v512.js
          grep -Fq 'ct512-movie-list' apps/web/dist/app-v512.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r512, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r511 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "0.3.39"' <<<"$BODY" && grep -Fq '"revision": "r512-official-0.3.39"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v512.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR512Marker='historical-f1-1950+ufc-1993+single-special-owner+stable-remount+movies-standard-rows'" <<<"$JS" && grep -Fq 'app-v512.js?ct=r512-official-0.3.39' <<<"$HTML"; then exit 0; fi
            fi
            if [ "$i" -eq 240 ]; then exit 1; fi
            sleep 5
          done
