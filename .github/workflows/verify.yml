name: Verify

on:
  push:
    branches: [main, release-v0.0.97-hotfix2]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify preserved CineTracker features and recovery invariants
        run: npm run verify
      - name: Build recovered Web app
        run: npm run build
      - name: Execute auth recovery runtime suite
        run: node scripts/test-auth-recovery-red.mjs
      - name: Assert recovered production HTML
        shell: bash
        run: |
          set -euo pipefail
          grep -q "window.__ctAuthRecovery = 'v97-base'" dist/index.html
          grep -q 'void bootstrap();' dist/index.html
          grep -q 'ctFetchWithTimeout' dist/index.html
          ! grep -q 'auth-preboot-fix7.js' dist/index.html
          ! grep -q 'patch-v073-v097-fix7.js' dist/index.html

  android97hotfix2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore dedicated CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize dedicated signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and validate self-contained HOTFIX 2 runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node scripts/test-auth-recovery-red.mjs
          node scripts/prepare-android-hotfix2-web.mjs
          test -f apps/android/app/src/main/assets/hotfix2/index.html
          grep -q "window.__ctAuthRecovery = 'v97-base'" apps/android/app/src/main/assets/hotfix2/index.html
          grep -q "window.__ctAndroidBundle = 'hotfix2-inline'" apps/android/app/src/main/assets/hotfix2/index.html
          grep -q '0.0.97 HOTFIX 2' apps/android/app/src/main/assets/hotfix2/index.html
          grep -q 'data-ct-inline=' apps/android/app/src/main/assets/hotfix2/index.html
          ! grep -q '<script src="/' apps/android/app/src/main/assets/hotfix2/index.html
          ! grep -q 'patch-v073-v097-fix7.js' apps/android/app/src/main/assets/hotfix2/index.html
          ! grep -q 'auth-preboot-fix7.js' apps/android/app/src/main/assets/hotfix2/index.html
          grep -q 'loadDataWithBaseURL' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          grep -q 'verifyStartupOrFallback' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          grep -q 'loadRemoteFallback' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          grep -q '&release=hotfix2' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! grep -q 'WebViewAssetLoader' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! grep -q 'appassets.androidplatform.net' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          ! grep -q 'restoreState(savedInstanceState)' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
      - name: Build debug HOTFIX 2 APK
        working-directory: apps/android
        shell: bash
        run: gradle assembleDebug --stacktrace
      - name: Verify embedded runtime, package and HOTFIX 2 version
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          unzip -l "$APK" | grep -q 'assets/hotfix2/index.html'
          unzip -p "$APK" assets/hotfix2/index.html | grep -q "window.__ctAndroidBundle = 'hotfix2-inline'"
          unzip -p "$APK" assets/hotfix2/index.html | grep -q '0.0.97 HOTFIX 2'
          if unzip -p "$APK" assets/hotfix2/index.html | grep -q 'patch-v073-v097-fix7.js'; then exit 1; fi
          "$APKSIGNER" verify --print-certs "$APK"
          PACKAGE="$($AAPT dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging "$APK" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$($AAPT dump badging "$APK" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.0.97 HOTFIX 2"
          test "$VERSION_CODE" = "980"
      - name: Upload HOTFIX 2 APK for validation
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-0.0.97-hotfix2-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
