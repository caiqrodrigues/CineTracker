name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax, gap logic, stable DOM and target card r179
        run: |
          node --check apps/web/runtime-r169.js
          node --check apps/web/runtime-r170.js
          node --check apps/web/runtime-r171.js
          node --check apps/web/runtime-r172.js
          node --check apps/web/runtime-r173.js
          node --check apps/web/runtime-r174.js
          node --check apps/web/runtime-r175.js
          node --check apps/web/runtime-r176.js
          node --check apps/web/runtime-r177.js
          node --check apps/web/runtime-r178.js
          node --check apps/web/runtime-r179.js
          node --check apps/web/build-r179.mjs
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r178-stable-home.mjs
          node scripts/test-r179-target-card.mjs
      - name: Build exact frozen CineTracker Web r179 artifact used by Vercel
        working-directory: apps/web
        run: npm run build
      - name: Assert Web remains exactly r179
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v179.js
          test "$(grep -o '<script' apps/web/dist/index.html | wc -l)" -eq 1
          grep -Fq "r179-home-target-card" apps/web/dist/app-v179.js
          grep -Fq "home-target-card-by-media-id" apps/web/dist/app-v179.js
          grep -Fq "history-duplicate-safe-next-episode-card" apps/web/dist/app-v179.js
          grep -Fq 'data-home-mark-episode="${mediaId}"' apps/web/dist/app-v179.js
          grep -Fq "stable-home-dom-no-repaint-loop" apps/web/dist/app-v179.js
          grep -Fq "first-released-unwatched-gap-authority" apps/web/dist/app-v179.js
          grep -Fq "cinetracker_unmark_episode_v1" apps/web/dist/app-v179.js
          grep -Fq '"revision":"r179-home-target-card"' apps/web/dist/release.json
          test ! -f apps/web/dist/app-v178.js
      - name: Upload exact r179 web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-web-r179-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  android_099714_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.14 composition identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.14'" apps/android/app/build.gradle
          grep -q 'versionCode 9984' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.14-r179-immersive-detail-nav' scripts/prepare-android-v099714.mjs
          grep -q 'web-r179-frozen-android-ui-parity' scripts/prepare-android-v099714.mjs
          grep -q 'persistent-five-tab-nav-immersive-poster-compact-where' scripts/prepare-android-v099714.mjs
          grep -q 'always-visible-five-tabs' scripts/prepare-android-v099714.mjs
          grep -q 'poster-first-no-detail-header' scripts/prepare-android-v099714.mjs
          grep -q 'compact-provider-icons' scripts/prepare-android-v099714.mjs
          node --check scripts/prepare-android-v099714.mjs
          node --check scripts/test-android-v099714.mjs
          node scripts/test-r179-target-card.mjs
          node scripts/prepare-android-v099714.mjs
          node scripts/test-android-v099714.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Production Web remains r179
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 70); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r179-home-target-card"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v179.js?ct=$(date +%s%N)" || true)"
              if grep -Fq "const REVISION='r179-home-target-card';" <<<"$JS" && grep -Fq "home-target-card-by-media-id" <<<"$JS"; then
                echo 'PRODUCTION_R179_FROZEN_OK'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production Web is not serving frozen r179.' >&2
          exit 1
