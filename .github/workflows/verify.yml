name: Verify Web 1.0.145 r354 Pra Voce Actions Sports Sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_145_r354:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Version identity r354
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.145"' package.json
          grep -Fq '"version": "1.0.145"' apps/web/package.json
          grep -Fq 'build-r354-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r354-foryou-actions-sports-sync.js
          test -f apps/web/build-r354.mjs
          test -f apps/web/build-r354-official.mjs
          test -f apps/web/test-r354.mjs
          test -f apps/web/test-r354-browser.mjs
          test -f supabase/migrations/20260923030000_r337_episode_catalog_search.sql
      - name: Syntax r354
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r354-foryou-actions-sports-sync.js
          node --check apps/web/build-r354.mjs
          node --check apps/web/build-r354-official.mjs
          node --check apps/web/test-r354.mjs
          node --check apps/web/test-r354-browser.mjs
      - name: Current regression lineage
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run test:r330
          npm run test:r331
          npm run test:r332
          npm run test:r333
          npm run test:r334
          npm run test:r335
          npm run test:r336
          npm run test:r337
          npm run test:r337:browser
          npm run test:r338
          npm run test:r338:browser
          npm run test:r339
          npm run test:r339:browser
          npm run test:r340
          npm run test:r340:browser
          npm run test:r341
          npm run test:r342
          npm run test:r342:browser
          npm run test:r343
          npm run test:r343:browser
          npm run test:r344
          npm run test:r344:browser
          npm run test:r345
          npm run test:r345:browser
          npm run test:r346
          npm run test:r346:browser
          npm run test:r347
          npm run test:r347:browser
          npm run test:r348
          npm run test:r348:browser
          npm run test:r349
          npm run test:r349:browser
          npm run test:r350
          npm run test:r350:browser
          npm run test:r351
          npm run test:r351:browser
          npm run test:r352
          npm run test:r352:browser
          npm run test:r353
          npm run test:r353:browser
      - name: Focused r354 Pra Voce actions + Sports sync browser gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run test:r354
          npm run test:r354:browser
      - name: Final bundle identity r354
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r354-official.mjs
          node --check dist/app-v354.js
          CT_R354_SKIP_BUILD=1 node test-r354.mjs
          grep -Fq 'app-v354.js' dist/index.html
          grep -Fq 'app-v354.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.145'
            && r.revision==='r354-official-1.0.145'
            && r.search_global==='movies+series+actors+episodes'
            && r.search_episode_local==='cinetracker_episode_search_v337'
            && r.home_navigation==='r337-desired-tab-authority+multi-settle+user-scroll-cancel'
            && r.discover_foryou_swap==='same-slot-immediate+subtle-enter'
            && r.sports_startup==='every-open-warm+force-provider-sync+auth-retry+refresh-payload'
            && r.discover_foryou_owner==='r336-only-no-legacy-late-dom-repaint'
            && r.discover_foryou_genres==='exactly-one-primary-genre'
            && r.page_layout==='content-normal-flow+home-full-inner-width'
            && r.navigation_back==='dedicated-search-row-icon-only'
            && r.discover_filters==='r318+r336-source-removed'
            && r.discover_foryou_legacy_css==='r338+r339-removed-at-runtime'
            && r.discover_card_actions==='local-slot-only+prevent-default+stop-propagation'
            && r.discover_foryou_actions==='repair-metadata+local-r352-first+safe-fallback'
            && r.discover_watchlist_selection==='weighted-random+history-affinity+watchlist-affinity+quality'
            && r.discover_watchlist_order==='not-list-order+not-index-plus-one'
            && r.discover_watchlist_initial==='smart-weighted-random'
            && r.discover_watchlist_swap==='smart-weighted-random-same-kind'
            && r.discover_foryou_click_owner==='r354-first-branch-before-r351-r352'
            && r.sports_manual_sync==='header-button-restored'
            && r.sports_every_open_window==='past-3+future-9-days'
            && r.discover_foryou_reload==='forbidden-no-paintForYou-no-loadForYou-no-renderDiscover'
            && r.discover_public_watchlist==='instant-saved-state+background-persist+no-card-swap'
            && r.discover_public_seen==='instant-seen-state+background-persist+no-card-swap'
            && r.discover_foryou_spacing==='slot-width-equals-poster+6px-gap'
            && r.discover_foryou_heart==='inside-poster-top-right'
            && r.discover_top10_geometry==='desktop-ten-equal-columns-visible-in-viewport'
            && r.home_startup==='fresh-payload+history+live-reconcile+metadata-hydrate-before-reveal'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_145_r354, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.145 r354
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.145"' <<<"$BODY" \
              && grep -Fq '"revision": "r354-official-1.0.145"' <<<"$BODY" \
              && grep -Fq '"search_episode_local": "cinetracker_episode_search_v337"' <<<"$BODY" \
              && grep -Fq '"sports_startup": "every-open-warm+force-provider-sync+auth-retry+refresh-payload"' <<<"$BODY" \
              && grep -Fq '"page_layout": "content-normal-flow+home-full-inner-width"' <<<"$BODY" \
              && grep -Fq '"discover_foryou_legacy_css": "r338+r339-removed-at-runtime"' <<<"$BODY" \
              && grep -Fq '"discover_card_actions": "local-slot-only+prevent-default+stop-propagation"' <<<"$BODY" \
              && grep -Fq '"discover_foryou_actions": "repair-metadata+local-r352-first+safe-fallback"' <<<"$BODY" \
              && grep -Fq '"discover_foryou_click_owner": "r354-first-branch-before-r351-r352"' <<<"$BODY" \
              && grep -Fq '"sports_manual_sync": "header-button-restored"' <<<"$BODY" \
              && grep -Fq '"sports_every_open_window": "past-3+future-9-days"' <<<"$BODY" \
              && grep -Fq '"discover_watchlist_selection": "weighted-random+history-affinity+watchlist-affinity+quality"' <<<"$BODY" \
              && grep -Fq '"discover_watchlist_order": "not-list-order+not-index-plus-one"' <<<"$BODY" \
              && grep -Fq '"discover_foryou_reload": "forbidden-no-paintForYou-no-loadForYou-no-renderDiscover"' <<<"$BODY" \
              && grep -Fq '"discover_foryou_spacing": "slot-width-equals-poster+6px-gap"' <<<"$BODY" \
              && grep -Fq '"discover_foryou_heart": "inside-poster-top-right"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v354.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR354Marker='foryou-actions-live-first-capture+sports-manual-sync+future-window'" <<<"$JS" \
                && grep -Fq 'weightedPick353' <<<"$JS" \
                && grep -Fq 'cinetracker_episode_search_v337' <<<"$JS" \
                && grep -Fq 'app-v354.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=8000 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" \
                  && grep -Fq 'v1.0.145' <<<"$DOM" \
                  && grep -Fq 'r354-official-1.0.145' <<<"$DOM" \
                  && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
