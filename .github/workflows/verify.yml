name: Verify Web 1.0.80 r289 Discover Standard Card Size

on:
  push:
    branches: [main, 'fix/web-r289-discover-standard-card-size']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_80_r289:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r289
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.80"' package.json
          grep -Fq '"version": "1.0.80"' apps/web/package.json
          grep -Fq 'build-r289-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r289-discover-standard-card-size.js
          test -f apps/web/build-r289.mjs
          test -f apps/web/build-r289-official.mjs
          test -f apps/web/test-r289.mjs
          test -f apps/web/test-r289-browser.mjs
          test -f scripts/test-r289-exact-bundle-browser.mjs
      - name: Syntax r289 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r289-discover-standard-card-size.js
          node --check apps/web/build-r289.mjs
          node --check apps/web/build-r289-official.mjs
          node --check apps/web/test-r289.mjs
          node --check apps/web/test-r289-browser.mjs
          node --check scripts/test-r289-exact-bundle-browser.mjs
      - name: Build official r289
        working-directory: apps/web
        run: node build-r289-official.mjs
      - name: Static regressions r289
        working-directory: apps/web
        run: node test-r289.mjs
      - name: Chromium inherited r285 regressions
        working-directory: apps/web
        run: node test-r285-browser.mjs
      - name: Chromium inherited r286 related interactions
        working-directory: apps/web
        run: node test-r286-browser.mjs
      - name: Chromium inherited r287 Home liveness and Continue
        working-directory: apps/web
        run: node test-r287-browser.mjs
      - name: Chromium inherited r288 Discover Android parity
        working-directory: apps/web
        run: node test-r288-browser.mjs
      - name: Chromium r289 Discover standard card geometry
        working-directory: apps/web
        run: node test-r289-browser.mjs
      - name: Exact final bundle boot r289
        run: node scripts/test-r289-exact-bundle-browser.mjs
      - name: Final bundle identity r289
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v289.js
          grep -Fq "window.__ctWebBuild='1.0.80';window.__ctOfficialVersion='1.0.80';" dist/app-v289.js
          grep -Fq "const REVISION='r289-official-1.0.80';" dist/app-v289.js
          grep -Fq "window.__ctR287='home-interaction-liveness+available-episode-priority'" dist/app-v289.js
          grep -Fq "window.__ctR288='discover-android-parity-web-only'" dist/app-v289.js
          grep -Fq "window.__ctR288Discover='nine-tabs+stable-shell+provider-top10+three-slot-foryou'" dist/app-v289.js
          grep -Fq "window.__ctR289='discover-standard-card-size'" dist/app-v289.js
          grep -Fq "window.__ctR289Cards='legacy-standard-128-152px-2x3'" dist/app-v289.js
          grep -Fq -- '--ct289-card-w:clamp(128px,14vw,152px)' dist/app-v289.js
          grep -Fq 'grid-auto-columns:var(--ct289-card-w)!important' dist/app-v289.js
          grep -Fq 'grid-template-columns:repeat(auto-fill,var(--ct289-card-w))!important' dist/app-v289.js
          grep -Fq 'app-v289.js' dist/index.html
          grep -Fq 'app-v289.css' dist/index.html
          grep -Fq '"discover_tabs": 9' dist/release.json
          grep -Fq '"discover_tab_switch": "content-only-no-shell-rebuild"' dist/release.json
          grep -Fq '"discover_card_size": "legacy-standard-128-152px"' dist/release.json
          grep -Fq '"discover_card_ratio": "2:3"' dist/release.json
          grep -Fq '"discover_card_layout": "fixed-local-rail-no-stretch"' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.80-r289';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_80_r289]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.80 r289
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.80"' <<<"$BODY" && grep -Fq '"revision": "r289-official-1.0.80"' <<<"$BODY" && grep -Fq '"discover_tabs": 9' <<<"$BODY" && grep -Fq '"discover_card_size": "legacy-standard-128-152px"' <<<"$BODY" && grep -Fq '"discover_card_ratio": "2:3"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v289.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR288='discover-android-parity-web-only'" <<<"$JS" && grep -Fq "window.__ctR289='discover-standard-card-size'" <<<"$JS" && grep -Fq -- '--ct289-card-w:clamp(128px,14vw,152px)' <<<"$JS" && grep -Fq 'app-v289.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
