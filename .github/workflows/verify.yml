name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate r179-r181 regressions
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r179.js
          node --check apps/web/runtime-r180.js
          node --check apps/web/runtime-r181.js
          node --check apps/web/build-r181.mjs
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r178-stable-home.mjs
          node scripts/test-r179-target-card.mjs
          node scripts/test-r180-discover-profile.mjs
          node scripts/test-r181-season-toggle.mjs
      - name: Build Web r181
        working-directory: apps/web
        run: npm run build
      - name: Assert Web r181 artifact
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v181.js
          grep -Fq "r181-season-whole-toggle" apps/web/dist/app-v181.js
          grep -Fq "mark-unmark-all-released-episodes" apps/web/dist/app-v181.js
          grep -Fq "ask-before-marking-incomplete-previous-seasons" apps/web/dist/app-v181.js
          grep -Fq "data-ct181-season-toggle" apps/web/dist/app-v181.js
          grep -Fq "cinetracker_unmark_episode_v1" apps/web/dist/app-v181.js
          grep -Fq "ct176PrimeWithWatched" apps/web/dist/app-v181.js
          grep -Fq "all-tabs-scroll-strict-business-rules" apps/web/dist/app-v181.js
          grep -Fq '"revision":"r181-season-whole-toggle"' apps/web/dist/release.json
          grep -Fq '.ct181-season-toggle.on' apps/web/dist/app-v181.css
          test ! -f apps/web/dist/app-v180.js

  android_099717_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.17
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.17'" apps/android/app/build.gradle
          grep -q 'versionCode 9987' apps/android/app/build.gradle
          node --check scripts/prepare-android-v099717.mjs
          node --check scripts/test-android-v099717.mjs
          node scripts/test-r181-season-toggle.mjs
          node scripts/prepare-android-v099717.mjs
          node scripts/test-android-v099717.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Production Web serves r181
        run: |
          set -euo pipefail
          for i in $(seq 1 70); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r181-season-whole-toggle"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v181.js?ct=$(date +%s%N)" || true)"
              if grep -Fq "mark-unmark-all-released-episodes" <<<"$JS" && grep -Fq "ask-before-marking-incomplete-previous-seasons" <<<"$JS"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
