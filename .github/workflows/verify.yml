name: Verify Web 1.0.119 r328 Home Discover Authority

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_119_r328:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r328
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.119"' package.json
          grep -Fq '"version": "1.0.119"' apps/web/package.json
          grep -Fq 'build-r328-official.mjs' apps/web/package.json
          test -f apps/web/build-r328.mjs
          test -f apps/web/build-r328-official.mjs
          test -f apps/web/runtime-r328-home-discover-authority.js
          test -f apps/web/test-r328.mjs
          test -f apps/web/test-r328-browser.mjs
          test -f apps/web/runtime-r325-home-episode-sync.js
          test -f apps/web/runtime-r324-home-discover-profile.js
          test -f supabase/migrations/20260921113000_r326_discover_all_user_aliases.sql
      - name: Syntax r328 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r328-home-discover-authority.js
          node --check apps/web/build-r328.mjs
          node --check apps/web/build-r328-official.mjs
          node --check apps/web/test-r328.mjs
          node --check apps/web/test-r328-browser.mjs
      - name: Focused browser gate r328
        working-directory: apps/web
        run: npm run test:r328:browser
      - name: Preserve green regressions
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run test:r323
          npm run test:r323:browser
          npm run test:r324
          npm run test:r324:browser
          npm run test:r325
          npm run test:r325:browser
          npm run test:r326
          npm run test:r326:browser
          npm run test:r327
          npm run test:r327:browser
      - name: Final bundle identity r328
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r328-official.mjs
          node --check dist/app-v328.js
          CT_R328_SKIP_BUILD=1 node test-r328.mjs
          grep -Fq 'app-v328.js' dist/index.html
          grep -Fq 'app-v328.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.119'
            && r.revision==='r328-official-1.0.119'
            && r.home_history_behavior==='r276-history-above-initial-viewport-newest-nearest-content'
            && r.home_initial_anchor==='series-assistir-a-seguir+movies-assistir-a-seguir-watchlist'
            && r.discover_filter_authority==='cinetracker_discover_filter_v326'
            && r.discover_foryou_renderer==='r328-owned-no-legacy-action-layout'
            && r.discover_foryou_filters==='always-visible-all+movies+series+anime'
            && r.discover_navigation==='stale-top10-stops-before-refill'
            && r.home_episode_live_reconcile==='r325-preserved'
            && r.profile_watchlist_counts==='r324-preserved-exact'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_119_r328, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.119 r328
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.119"' <<<"$BODY" \
              && grep -Fq '"revision": "r328-official-1.0.119"' <<<"$BODY" \
              && grep -Fq '"home_initial_anchor": "series-assistir-a-seguir+movies-assistir-a-seguir-watchlist"' <<<"$BODY" \
              && grep -Fq '"discover_foryou_renderer": "r328-owned-no-legacy-action-layout"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v328.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR328Marker='r276-home-anchor+owned-foryou-one-row+visible-filters+strict-discover'" <<<"$JS" \
                && grep -Fq 'cinetracker_discover_filter_v326' <<<"$JS" \
                && grep -Fq 'ct-refresh-tv-state-user' <<<"$JS" \
                && grep -Fq 'app-v328.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=8000 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
