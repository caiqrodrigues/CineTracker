name: Verify Web 1.0.42 r251 Video Ground Truth

on:
  push:
    branches: [main, 'fix/r251-video-ground-truth']
  pull_request:

permissions:
  contents: write

jobs:
  web_1_0_42_r251:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax current release chain
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.42"' apps/web/package.json
          node --check apps/web/runtime-r250-source-aligned.js
          node --check apps/web/runtime-r251-ground-truth.js
          node --check apps/web/build-r251.mjs
          node --check apps/web/build-r251-official.mjs
          node --check apps/web/test-r251.mjs
          node --check apps/web/test-r251-algorithms.mjs
          node --check apps/web/test-r251-ground-truth-browser.mjs
      - name: Build inherited r250
        working-directory: apps/web
        run: node build-r250-official.mjs
      - name: Static inherited r250
        working-directory: apps/web
        run: node test-r250.mjs
      - name: Chromium inherited r250 regression
        run: node scripts/test-r250-regression-browser.mjs
      - name: Build official r251
        working-directory: apps/web
        run: node build-r251-official.mjs
      - name: Static invariants r251
        working-directory: apps/web
        run: node test-r251.mjs
      - name: Logic regressions r251
        working-directory: apps/web
        run: node test-r251-algorithms.mjs
      - name: Chromium r251 user-video ground truth
        working-directory: apps/web
        run: node test-r251-ground-truth-browser.mjs
      - name: Final bundle identity r251
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v251.js
          grep -Fq "window.__ctWebBuild='1.0.42';window.__ctOfficialVersion='1.0.42';" dist/app-v251.js
          grep -Fq "const REVISION='r251-official-1.0.42';" dist/app-v251.js
          grep -Fq "window.__ctR251='video-ground-truth-direct-renderers'" dist/app-v251.js
          grep -Fq "window.__ctR251Home='frontier-current-release-priority-fast-prime'" dist/app-v251.js
          grep -Fq "window.__ctR251Discover='strict-three-block-recommendation-authority'" dist/app-v251.js
          grep -Fq "window.__ctR251Sports='four-tabs-direct-renderer'" dist/app-v251.js
          grep -Fq "window.__ctR251F1='single-owned-hub-persistent-collapse'" dist/app-v251.js
          grep -Fq "window.__ctR251Profile='one-collapsible-statistics-block'" dist/app-v251.js
          grep -Fq 'window.__ctR251LegacyR250ReconcileDisabled=true' dist/app-v251.js
          grep -Fq 'shown_recommendations' dist/app-v251.js
          grep -Fq 'cinetracker_sports_payload_v1' dist/app-v251.js
          grep -Fq 'cinetracker_sport_mark_watched_v1' dist/app-v251.js
          grep -Fq 'cinetracker_set_episode_watched' dist/app-v251.js
          ! grep -Fq 'cinetracker_sports_events_v0997' dist/app-v251.js
          grep -Fq 'app-v251.js' dist/index.html
          grep -Fq 'app-v251.css' dist/index.html
          grep -Fq '"version": "1.0.42"' dist/release.json
          grep -Fq '"revision": "r251-official-1.0.42"' dist/release.json
          grep -Fq 'html,body,#app{overflow-x:clip!important}' dist/app-v251.css
          grep -Fq '.ct251-xrail' dist/app-v251.css
          grep -Fq '.ct251-home-row' dist/app-v251.css
          grep -Fq '.ct251-profile-grid' dist/app-v251.css

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  changelog_once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/r251-video-ground-truth'
    needs: [web_1_0_42_r251]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepend Web 1.0.42 r251 changelog without rewriting history
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          text=p.read_text(encoding='utf-8')
          marker='## 1.0.42 — 2026-09-11 — Web r251'
          if marker in text:
              raise SystemExit(0)
          intro="# Changelog\n\nMudanças relevantes do CineTracker. A partir da 1.0.0, esta é a baseline oficial; detalhes históricos completos da linha 0.x permanecem preservados no histórico Git e nos documentos de `docs/releases/`.\n\n"
          section="""## 1.0.42 — 2026-09-11 — Web r251

### Autoridade direta / Home
- Home, Descobrir, Esportes/F1 e Perfil passam a assumir os renderizadores ativos antes do `boot()`, removendo a dependência da reconciliação tardia que permitiu às r249/r250 passarem no CI sem refletir corretamente a tela real.
- A Home usa a fronteira efetivamente assistida: backlog histórico permanece preservado, mas só episódio liberado depois da fronteira atual volta para `Assistir a seguir`.
- A auditoria canônica de episódios roda de forma concorrente e repinta a Home assim que o estado atual é confirmado.

### Descobrir / recomendações
- Recomendações exigem TMDB >= 7,5 e ano posterior a 1990, removem Drama/Documentário puro, vistos, em andamento, `NotInterested`, WWE e Watchlist fora do bloco próprio.
- `Indicação do Dia`, `Da sua Watchlist` e `100% Novos` são blocos obrigatórios com antirrepetição; `Trocar` substitui o item elegível sem reload global.
- A migration `20260911175655_r251_shown_recommendations.sql` cria `shown_recommendations` com RLS e sustenta a janela de 7 dias sem repetir recomendações já exibidas.

### Esportes / F1 / Perfil / layout
- Esportes mantém somente `Próximos`, `Anteriores`, `Favoritos` e `Assistidos`, usando `cinetracker_sports_payload_v1` e `cinetracker_sport_mark_watched_v1`; o bundle r251 não chama `cinetracker_sports_events_v0997`.
- O F1 Hub possui uma única instância e respeita o estado persistido de minimizar/expandir sem autoexpansão herdada.
- Perfil possui um único bloco expansível de `Estatísticas`, incluindo Esportes; Home, Perfil, Configurações e sidebar recebem polish de proporção e espaçamento.
- Overflow horizontal global permanece bloqueado; temporadas, gráficos, trilhos, Descobrir e F1 usam scroll horizontal somente no componente local.

### Build / validação
- Web atualizada para `1.0.42 / r251-official-1.0.42`; Android permanece `1.0.20 / versionCode 10062`.
- Build oficial: `apps/web/build-r251-official.mjs`; runtime final: `apps/web/runtime-r251-ground-truth.js`.
- Pipeline preserva a regressão r250 e valida invariantes, lógica, Chromium ground-truth e identidade final do bundle r251 antes da promoção ao `main`.

"""
          p.write_text((intro+section+text[len(intro):]) if text.startswith(intro) else (section+text),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: prepend Web 1.0.42 r251 changelog'
          git push

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_42_r251]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.42 r251
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.42"' <<<"$BODY" && grep -Fq '"revision": "r251-official-1.0.42"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v251.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v251.css?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR251='video-ground-truth-direct-renderers'" <<<"$JS" && grep -Fq 'shown_recommendations' <<<"$JS" && grep -Fq 'cinetracker_sports_payload_v1' <<<"$JS" && ! grep -Fq 'cinetracker_sports_events_v0997' <<<"$JS" && grep -Fq 'overflow-x:clip!important' <<<"$CSS" && grep -Fq 'app-v251.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
