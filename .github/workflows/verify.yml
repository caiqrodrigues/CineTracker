name: Verify Web 1.0.32 r241 Home

on:
  push:
    branches: [main, 'fix/1.0.32-r241-home-only']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_32_home:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax r241
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.32"' apps/web/package.json
          node --check apps/web/runtime-r241-home-fast-metadata.js
          node --check apps/web/build-r241.mjs
          node --check apps/web/test-r241.mjs
      - name: Build r241
        working-directory: apps/web
        run: node build-r241.mjs
      - name: Home invariants r241
        working-directory: apps/web
        run: node test-r241.mjs
      - name: Final bundle identity r241
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v241.js
          grep -Fq "window.__ctWebBuild='1.0.32';window.__ctOfficialVersion='1.0.32';" dist/app-v241.js
          grep -Fq "const REVISION='r241-official-1.0.32';" dist/app-v241.js
          grep -Fq "window.__ctR241Home='fast-first-paint-episode-and-movie-metadata'" dist/app-v241.js
          grep -Fq "window.__ctR241Scope='home-only'" dist/app-v241.js
          grep -Fq '"revision": "r241-official-1.0.32"' dist/release.json

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_32_home]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Official production serves 1.0.32 r241
        run: |
          set -euo pipefail
          for i in $(seq 1 150); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.32"' <<<"$BODY" && grep -Fq '"revision": "r241-official-1.0.32"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v241.js?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR241Home='fast-first-paint-episode-and-movie-metadata'" <<<"$JS"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1