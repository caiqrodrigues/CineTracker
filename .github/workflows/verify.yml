name: Verify Web 0.3.48 r521
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r521:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: |
          set -euo pipefail
          node --check apps/web/runtime-r521-catalog.js
          node --check apps/web/runtime-r521-summary.js
          node --check apps/web/runtime-r521-home-sports.js
          npm run build
          npm run verify
          node --check apps/web/dist/app-v521.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r521, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "0.3.48"' <<<"$BODY" && grep -Fq '"revision": "r521-official-0.3.48"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v521.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR521Marker='complete-counts+same-row-home+deterministic-movies+sports-drilldown-preserved'" <<<"$JS" && grep -Fq 'app-v521.js' <<<"$HTML"; then exit 0; fi
            fi
            [ "$i" -eq 240 ] && exit 1
            sleep 5
          done
