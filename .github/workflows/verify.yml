name: Verify Web 0.3.44 r517
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web_r517:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r517 scoped video regression gate
        run: |
          set -euo pipefail
          npm run build
          npm run verify
          node --check apps/web/dist/app-v517.js
          grep -Fq "window.__ctR517Marker='profile-movies+recommendation-v517+detail-first-paint+home-stable+top-logo+special-history'" apps/web/dist/app-v517.js
          grep -Fq 'cinetracker_activity_by_day_v517' apps/web/dist/app-v517.js
          grep -Fq 'cinetracker_recommendation_filter_v517' apps/web/dist/app-v517.js
          grep -Fq 'ct517MoviesSource' apps/web/dist/app-v517.js
          grep -Fq 'topEligible514' apps/web/dist/app-v517.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r517, android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for r517 production
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "0.3.44"' <<<"$BODY" && grep -Fq '"revision": "r517-official-0.3.44"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v517.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR517Marker='profile-movies+recommendation-v517+detail-first-paint+home-stable+top-logo+special-history'" <<<"$JS" && grep -Fq 'app-v517.js' <<<"$HTML"; then exit 0; fi
            fi
            if [ "$i" -eq 240 ]; then exit 1; fi
            sleep 5
          done
