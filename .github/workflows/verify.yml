name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax and deterministic gap logic r176
        run: |
          node --check apps/web/runtime-r169.js
          node --check apps/web/runtime-r170.js
          node --check apps/web/runtime-r171.js
          node --check apps/web/runtime-r172.js
          node --check apps/web/runtime-r173.js
          node --check apps/web/runtime-r174.js
          node --check apps/web/runtime-r175.js
          node --check apps/web/runtime-r176.js
          node --check apps/web/build-r176.mjs
          node scripts/test-r176-gap-logic.mjs
      - name: Build exact CineTracker Web r176 artifact used by Vercel
        working-directory: apps/web
        run: npm run build
      - name: Assert r176 first-unwatched authority
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v176.js
          test "$(grep -o '<script' apps/web/dist/index.html | wc -l)" -eq 1
          grep -Fq "r176-first-unwatched-gap" apps/web/dist/app-v176.js
          grep -Fq "first-released-unwatched-gap-authority" apps/web/dist/app-v176.js
          grep -Fq "next=lowest-released-episode-not-watched-never-last-pointer-plus-one" apps/web/dist/app-v176.js
          grep -Fq "unwatch-rewinds-next-episode-and-successor-queue" apps/web/dist/app-v176.js
          grep -Fq "ct176PickUnwatched" apps/web/dist/app-v176.js
          grep -Fq "optimistic-instant-motion-episode-toggle" apps/web/dist/app-v176.js
          grep -Fq "cinetracker_unmark_episode_v1" apps/web/dist/app-v176.js
          grep -Fq "ct174-flash" apps/web/dist/app-v176.css
          grep -Fq "ct175-next-episode" apps/web/dist/app-v176.css
          grep -Fq "ct173-detail-window" apps/web/dist/app-v176.js
          grep -Fq '"revision":"r176-first-unwatched-gap"' apps/web/dist/release.json
          test ! -f apps/web/dist/app-v175.js
      - name: Upload exact r176 web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-web-r176-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  android_099710_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.10 r176 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.10'" apps/android/app/build.gradle
          grep -q 'versionCode 9980' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.10-r176-gap-rewind' scripts/prepare-android-v099710.mjs
          grep -q 'web-r176-gap-safe-functional-parity' scripts/prepare-android-v099710.mjs
          grep -q 'first-released-unwatched-gap-authority' scripts/prepare-android-v099710.mjs
          node --check scripts/prepare-android-v099710.mjs
          node --check scripts/test-android-v099710.mjs
          node scripts/test-r176-gap-logic.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Production domain serves r176
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 70); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r176-first-unwatched-gap"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v176.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v176.css?ct=$(date +%s%N)" || true)"
              if grep -Fq "const REVISION='r176-first-unwatched-gap';" <<<"$JS" && grep -Fq "first-released-unwatched-gap-authority" <<<"$JS" && grep -Fq "ct175-next-episode" <<<"$CSS"; then
                echo 'PRODUCTION_R176_OK first-unwatched-gap-rewind'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production domain did not serve r176-first-unwatched-gap in time.' >&2
          exit 1
