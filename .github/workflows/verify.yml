name: Verify Web 1.0.211 r420 Standup F1 Profile
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web_r420:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and r420 regression gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check build-r420.mjs
          node --check build-r420-official.mjs
          node --check test-r420.mjs
          node --check runtime-r420-standup-f1-profile.js
          node build-r420-official.mjs
          CT_R420_SKIP_BUILD=1 node test-r420.mjs
          node --check dist/app-v420.js
          grep -Fq "window.__ctR420Marker='no-standup+f1-series-865-no-sports-mirror+profile-watchlist-minutes+no-card-slice'" dist/app-v420.js
          grep -Fq 'cinetracker_discover_watch_unseen_v420' dist/app-v420.js
          grep -Fq 'cinetracker_discover_fresh_v420' dist/app-v420.js
          grep -Fq 'cinetracker_profile_watchlist_runtime_v420' dist/app-v420.js
          grep -Fq 'cinetracker_sport_stats_v420' dist/app-v420.js
          grep -Fq 'cinetracker_f1_episode_watch_set_v420' dist/app-v420.js
          grep -Fq "window.__ctR420?.toggleF1?.(watch)" dist/app-v420.js
          ! grep -Fq "if(watch){void toggleF1Session311(watch);return true}" dist/app-v420.js
          ! grep -Fq 'rows.slice(0,10).map(mediaCard)' dist/app-v420.js
          ! grep -Fq "window.location.reload(" runtime-r420-standup-f1-profile.js
          ! grep -Fq "router.refresh(" runtime-r420-standup-f1-profile.js
          ! grep -Fq "while(true)" runtime-r420-standup-f1-profile.js
          ! grep -Fq "new MutationObserver" runtime-r420-standup-f1-profile.js
          ! grep -Fq "setInterval(" runtime-r420-standup-f1-profile.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_r420, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            CT="$(date +%s%N)"
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$CT" || true)"
            if grep -Fq '"version": "1.0.211"' <<<"$BODY" && grep -Fq '"revision": "r420-official-1.0.211"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v420.js?ct=$CT" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$CT" || true)"
              if grep -Fq "window.__ctR420Marker='no-standup+f1-series-865-no-sports-mirror+profile-watchlist-minutes+no-card-slice'" <<<"$JS"                 && grep -Fq 'cinetracker_discover_watch_unseen_v420' <<<"$JS"                 && grep -Fq 'cinetracker_profile_watchlist_runtime_v420' <<<"$JS"                 && grep -Fq 'cinetracker_f1_episode_watch_set_v420' <<<"$JS"                 && grep -Fq 'app-v420.js' <<<"$HTML"; then
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1
