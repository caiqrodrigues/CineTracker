name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build exact CineTracker Web artifact used by Vercel
        working-directory: apps/web
        run: npm run build
      - name: Assert Vercel apps/web/dist is single r161 authority
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v161.js
          test "$(grep -o '<script' apps/web/dist/index.html | wc -l)" -eq 1
          ! grep -Eq 'patch-v[0-9]|hotfix' apps/web/dist/index.html
          test "$(find apps/web/dist -maxdepth 1 -type f -name 'patch-v*.js' | wc -l)" -eq 0
          test ! -f apps/web/dist/app-v158.js
          test ! -f apps/web/dist/app-v159.js
          test ! -f apps/web/dist/app-v160.js
          grep -Fq "single-clean-runtime" apps/web/dist/app-v161.js
          grep -Fq "r161-release-guard" apps/web/dist/app-v161.js
          grep -Fq "release.json" apps/web/dist/app-v161.js
          grep -Fq "b.dataset.sportsTab='yesterday'" apps/web/dist/app-v161.js
          grep -Fq "Jogos de ontem" apps/web/dist/app-v161.js
          grep -Fq "watchedAt161" apps/web/dist/app-v161.js
          grep -Fq "Tempo esportivo assistido" apps/web/dist/app-v161.js
          grep -Fq "data-sport-watch" apps/web/dist/app-v161.js
          grep -Fq "data-home-mark-episode" apps/web/dist/app-v161.js
          grep -Fq "Indicação do dia" apps/web/dist/app-v161.js
          grep -Fq "Minha Watchlist" apps/web/dist/app-v161.js
          grep -Fq "ct-web-0.99.7-r161-release-guard" apps/web/dist/service-worker.js
          grep -Fq '"revision":"r161-release-guard"' apps/web/dist/release.json
          grep -Fq 'VERCEL_WEB_R161_READY' apps/web/build-vercel-v161.mjs
          grep -Fq '"outputDirectory": "dist"' apps/web/vercel.json

  android_0997_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.3 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.3'" apps/android/app/build.gradle
          grep -q 'versionCode 9973' apps/android/app/build.gradle
          grep -q 'android-v0.99.7.3-r151-library-sync' scripts/prepare-android-v09973.mjs
          grep -q 'window.__ct0997R151Loaded' scripts/prepare-android-v09973.mjs
          grep -q 'cinetracker:app-foreground' scripts/test-android-v09973.mjs
          grep -q 'android:id="@+id/nav_history"' apps/android/app/src/main/res/layout/activity_main.xml
          grep -q 'android:visibility="gone"' apps/android/app/src/main/res/layout/activity_main.xml
          node --check scripts/prepare-android-v09973.mjs
          node --check scripts/test-android-v09973.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Production domain serves r161
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if printf '%s' "$BODY" | grep -Fq '"revision":"r161-release-guard"'; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v161.js?ct=$(date +%s%N)" || true)"
              if printf '%s' "$JS" | grep -Fq "const REVISION='r161-release-guard';"; then
                echo 'PRODUCTION_R161_OK release+js'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production domain did not serve r161-release-guard in time.' >&2
          exit 1
