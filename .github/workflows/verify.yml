name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_0997:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate r179-r184 regressions
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r179.js
          node --check apps/web/runtime-r180.js
          node --check apps/web/runtime-r181.js
          node --check apps/web/runtime-r182.js
          node --check apps/web/runtime-r183.js
          node --check apps/web/runtime-r184-shared.js
          node --check apps/web/runtime-r184-web.js
          node --check apps/web/build-r184.mjs
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r178-stable-home.mjs
          node scripts/test-r179-target-card.mjs
          node scripts/test-r180-discover-profile.mjs
          node scripts/test-r181-season-toggle.mjs
          node scripts/test-r182-home-season-polish.mjs
          node scripts/test-r183-web-clean-profile.mjs
          node scripts/test-r184-profile-gap.mjs
      - name: Build Web r184
        working-directory: apps/web
        run: npm run build
      - name: Assert Web r184 artifact
        run: |
          set -euo pipefail
          node --check apps/web/dist/app-v184.js
          grep -Fq "r184-favorites-gap-prompt" apps/web/dist/app-v184.js
          grep -Fq "restore-series-movie-actor-add-controls" apps/web/dist/app-v184.js
          grep -Fq 'data-add-favorite="tv"' apps/web/dist/app-v184.js
          grep -Fq 'data-add-favorite="movie"' apps/web/dist/app-v184.js
          grep -Fq 'data-add-favorite="person"' apps/web/dist/app-v184.js
          grep -Fq "detect-skipped-released-episodes-before-manual-watch" apps/web/dist/app-v184.js
          grep -Fq "Pular e marcar só" apps/web/dist/app-v184.js
          grep -Fq "Marcar anteriores +" apps/web/dist/app-v184.js
          grep -Fq "all-released-episodes-before-target-across-seasons" apps/web/dist/app-v184.js
          grep -Fq "remove-redundant-page-title-copy-preserve-back" apps/web/dist/app-v184.js
          grep -Fq '"revision":"r184-favorites-gap-prompt"' apps/web/dist/release.json
          grep -Fq '.ct184-gap-confirm' apps/web/dist/app-v184.css
          grep -Fq '.ct184-favorite-add' apps/web/dist/app-v184.css
          grep -Fq '.content>.header>div{display:none!important}' apps/web/dist/app-v184.css
          test ! -f apps/web/dist/app-v183.js

  android_099719_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assert Android 0.99.7.19
        run: |
          set -euo pipefail
          grep -q "versionName '0.99.7.19'" apps/android/app/build.gradle
          grep -q 'versionCode 9989' apps/android/app/build.gradle
          node --check scripts/prepare-android-v099719.mjs
          node --check scripts/test-android-v099719.mjs
          node scripts/test-r181-season-toggle.mjs
          node scripts/test-r182-home-season-polish.mjs
          node scripts/test-r184-profile-gap.mjs
          node scripts/prepare-android-v099719.mjs
          node scripts/test-android-v099719.mjs

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_0997]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Production Web serves r184
        run: |
          set -euo pipefail
          for i in $(seq 1 70); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            echo "attempt=$i body=$BODY"
            if grep -Fq '"revision":"r184-favorites-gap-prompt"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v184.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v184.css?ct=$(date +%s%N)" || true)"
              if grep -Fq "restore-series-movie-actor-add-controls" <<<"$JS" && grep -Fq "detect-skipped-released-episodes-before-manual-watch" <<<"$JS" && grep -Fq "Pular e marcar só" <<<"$JS" && grep -Fq '.ct184-gap-confirm' <<<"$CSS"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
