name: Verify Web 1.0.120 r329 Discover Performance Layout

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_120_r329:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r329
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.120"' package.json
          grep -Fq '"version": "1.0.120"' apps/web/package.json
          grep -Fq 'build-r329-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r329-discover-performance-layout.js
          test -f apps/web/build-r329.mjs
          test -f apps/web/build-r329-official.mjs
          test -f apps/web/test-r329.mjs
          test -f apps/web/test-r329-browser.mjs
      - name: Syntax r329 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r329-discover-performance-layout.js
          node --check apps/web/build-r329.mjs
          node --check apps/web/build-r329-official.mjs
          node --check apps/web/test-r329.mjs
          node --check apps/web/test-r329-browser.mjs
      - name: Focused r329 browser gate
        working-directory: apps/web
        run: |
          set -euo pipefail
          node test-r329.mjs
          node test-r329-browser.mjs
      - name: Regression suite through r329
        working-directory: apps/web
        run: npm run verify
      - name: Final bundle identity r329
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r329-official.mjs
          node --check dist/app-v329.js
          CT_R329_SKIP_BUILD=1 node test-r329.mjs
          grep -Fq 'app-v329.js' dist/index.html
          grep -Fq 'app-v329.css' dist/index.html
          node - <<'NODE'
          const r=require('./dist/release.json');
          const ok=r.version==='1.0.120'
            && r.revision==='r329-official-1.0.120'
            && r.discover_navigation==='cache-first-return+no-loader-for-fresh-cache'
            && r.discover_prefetch==='idle-public-source-prefetch'
            && r.discover_r327_mutation_sweep===false
            && r.discover_foryou_layout==='three-158px-cards-start-aligned'
            && r.discover_foryou_actions==='three-buttons-one-row-24px'
            && r.home==='r328-preserved'
            && r.profile_watchlist_counts==='r324-preserved-exact'
            && r.android==='1.0.20/10062';
          if(!ok){console.error(r);process.exit(1)}
          NODE

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_120_r329, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.120 r329
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.120"' <<<"$BODY" \
              && grep -Fq '"revision": "r329-official-1.0.120"' <<<"$BODY" \
              && grep -Fq '"discover_navigation": "cache-first-return+no-loader-for-fresh-cache"' <<<"$BODY" \
              && grep -Fq '"discover_foryou_actions": "three-buttons-one-row-24px"' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v329.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR329Marker='discover-cache-first-tabs+idle-prefetch+compact-foryou-cards'" <<<"$JS" \
                && grep -Fq 'app-v329.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=8500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" \
                  && grep -Fq 'v1.0.120' <<<"$DOM" \
                  && grep -Fq 'r329-official-1.0.120' <<<"$DOM" \
                  && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
