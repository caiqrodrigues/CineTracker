name: Verify Web 1.0.68 r277 Watch Action Fixed Sidebar

on:
  push:
    branches: [main, 'fix/r277-watch-action-fixed-sidebar']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_68_r277:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r277
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.68"' package.json
          grep -Fq '"version": "1.0.68"' apps/web/package.json
          grep -Fq 'build-r277-official.mjs' apps/web/package.json
          test -f apps/web/runtime-r277-watch-action-fixed-sidebar.js
          test -f apps/web/build-r277.mjs
          test -f apps/web/build-r277-official.mjs
          test -f apps/web/test-r277.mjs
          test -f apps/web/test-r277-browser.mjs
          test -f scripts/test-r277-exact-bundle-browser.mjs
      - name: Syntax r277 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r277-watch-action-fixed-sidebar.js
          node --check apps/web/build-r277.mjs
          node --check apps/web/build-r277-official.mjs
          node --check apps/web/test-r277.mjs
          node --check apps/web/test-r277-browser.mjs
          node --check scripts/test-r277-exact-bundle-browser.mjs
      - name: Build official r277
        working-directory: apps/web
        run: node build-r277-official.mjs
      - name: Static regressions r277
        working-directory: apps/web
        run: node test-r277.mjs
      - name: Chromium watched actions and fixed sidebar r277
        working-directory: apps/web
        run: node test-r277-browser.mjs
      - name: Exact final bundle boot r277
        run: node scripts/test-r277-exact-bundle-browser.mjs
      - name: Final bundle identity r277
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v277.js
          grep -Fq "window.__ctWebBuild='1.0.68';window.__ctOfficialVersion='1.0.68';" dist/app-v277.js
          grep -Fq "const REVISION='r277-official-1.0.68';" dist/app-v277.js
          grep -Fq "window.__ctR276='history-above-initial-viewport+episode-card-parity'" dist/app-v277.js
          grep -Fq "window.__ctR277='watch-action-host+fixed-sidebar'" dist/app-v277.js
          grep -Fq "window.__ctR277Watch='continue+dust+movie-watchlist-visible-right'" dist/app-v277.js
          grep -Fq "window.__ctR277Sidebar='desktop-fixed-full-height'" dist/app-v277.js
          grep -Fq 'app-v277.js' dist/index.html
          grep -Fq 'app-v277.css' dist/index.html
          grep -Fq '"version": "1.0.68"' dist/release.json
          grep -Fq '"revision": "r277-official-1.0.68"' dist/release.json
          grep -Fq '"home_watch_action_host_fixed": true' dist/release.json
          grep -Fq '"sidebar_fixed": true' dist/release.json
          grep -Fq '"sidebar_mode": "fixed-desktop-full-height"' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.68-r277';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_68_r277]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Official production serves and boots 1.0.68 r277
        run: |
          set -euo pipefail
          for i in $(seq 1 200); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.68"' <<<"$BODY" && grep -Fq '"revision": "r277-official-1.0.68"' <<<"$BODY" && grep -Fq '"home_watch_action_host_fixed": true' <<<"$BODY" && grep -Fq '"sidebar_fixed": true' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v277.js?ct=$(date +%s%N)" || true)"
              CSS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v277.css?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR277='watch-action-host+fixed-sidebar'" <<<"$JS" && grep -Fq '.sidebar{position:fixed!important' <<<"$CSS" && grep -Fq 'app-v277.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=5500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
