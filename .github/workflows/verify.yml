name: Verify Web 1.0.92 r301 F1 Sports Discover Profile

on:
  push:
    branches: [main, 'fix/r301-profile-sports-f1-order']
  pull_request:

permissions:
  contents: read

jobs:
  web_1_0_92_r301:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version identity r301
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.92"' package.json
          grep -Fq '"version": "1.0.92"' apps/web/package.json
          grep -Fq 'build-r301-official.mjs' apps/web/package.json
          test -f apps/web/build-r301.mjs
          test -f apps/web/build-r301-official.mjs
          test -f apps/web/runtime-r301-profile-sports-f1-order.js
          test -f apps/web/test-r301.mjs
          test -f apps/web/test-r301-browser.mjs
      - name: Syntax r301 release chain
        run: |
          set -euo pipefail
          node --check apps/web/runtime-r301-profile-sports-f1-order.js
          node --check apps/web/build-r301.mjs
          node --check apps/web/build-r301-official.mjs
          node --check apps/web/test-r301.mjs
          node --check apps/web/test-r301-browser.mjs
      - name: Regression suite r301
        working-directory: apps/web
        run: npm run verify
      - name: Final bundle identity r301
        working-directory: apps/web
        run: |
          set -euo pipefail
          node build-r301-official.mjs
          node --check dist/app-v301.js
          grep -Fq "window.__ctWebBuild='1.0.92';window.__ctOfficialVersion='1.0.92';" dist/app-v301.js
          grep -Fq "const REVISION='r301-official-1.0.92';" dist/app-v301.js
          grep -Fq "window.__ctR301='f1-calendar-interactive+sports-next-wide+discover-fast-1-3-3+profile-stable'" dist/app-v301.js
          grep -Fq "window.__ctR301F1='no-drivers-tab+calendar-detail+canonical-watch'" dist/app-v301.js
          grep -Fq "window.__ctR301Sports='f1-first+next-120d+four-tabs'" dist/app-v301.js
          grep -Fq "window.__ctR301Discover='fast-exact-1+3+3+stable-watchlist-actions'" dist/app-v301.js
          grep -Fq "window.__ctR301Profile='stable-stats+watchlist-match-stadium-style'" dist/app-v301.js
          grep -Fq 'app-v301.js' dist/index.html
          grep -Fq 'app-v301.css' dist/index.html
          grep -Fq '"version": "1.0.92"' dist/release.json
          grep -Fq '"revision": "r301-official-1.0.92"' dist/release.json
          grep -Fq '"sports_tabs": "next+previous+watched+favorites"' dist/release.json
          grep -Fq '"sports_next_days": 120' dist/release.json
          grep -Fq '"f1_drivers_tab": false' dist/release.json
          grep -Fq '"f1_calendar_interactive": true' dist/release.json
          grep -Fq '"f1_watch_profile_sync": true' dist/release.json
          grep -Fq '"discover_for_you": "1+3+3"' dist/release.json
          grep -Fq '"discover_fast_pipeline": true' dist/release.json
          grep -Fq '"discover_watchlist_action_stable": true' dist/release.json
          grep -Fq '"profile_stats_stable": true' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.92-r301';" dist/service-worker.js

  android_current_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle

  production_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web_1_0_92_r301, android_current_source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Official production serves and boots 1.0.92 r301
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/release.json?ct=$(date +%s%N)" || true)"
            if grep -Fq '"version": "1.0.92"' <<<"$BODY" && grep -Fq '"revision": "r301-official-1.0.92"' <<<"$BODY" && grep -Fq '"sports_tabs": "next+previous+watched+favorites"' <<<"$BODY" && grep -Fq '"sports_next_days": 120' <<<"$BODY" && grep -Fq '"f1_drivers_tab": false' <<<"$BODY" && grep -Fq '"f1_calendar_interactive": true' <<<"$BODY" && grep -Fq '"discover_for_you": "1+3+3"' <<<"$BODY" && grep -Fq '"profile_stats_stable": true' <<<"$BODY"; then
              JS="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/app-v301.js?ct=$(date +%s%N)" || true)"
              HTML="$(curl -fsS -H 'Cache-Control: no-cache' "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" || true)"
              if grep -Fq "window.__ctR301='f1-calendar-interactive+sports-next-wide+discover-fast-1-3-3+profile-stable'" <<<"$JS" && grep -Fq 'buildForYou301' <<<"$JS" && grep -Fq 'f1CalendarHtml301' <<<"$JS" && grep -Fq 'app-v301.js' <<<"$HTML"; then
                DOM="$(google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=6500 --dump-dom "https://mycinetracker.vercel.app/?ct=$(date +%s%N)" 2>/dev/null || true)"
                if grep -Fq 'CineTracker' <<<"$DOM" && ! grep -Fq '<div id="app"></div>' <<<"$DOM"; then exit 0; fi
              fi
            fi
            sleep 5
          done
          exit 1
