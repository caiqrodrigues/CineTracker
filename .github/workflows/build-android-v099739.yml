name: Build Android 0.99.7.39 — Real DOM Roots

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-099737-discover-profile-sports-layout
    paths:
      - 'apps/android/app/build.gradle'
      - 'apps/android/runtime-r211-selector-root-fix.js'
      - 'scripts/prepare-android-v099739.mjs'
      - 'scripts/test-android-v099739.mjs'
      - '.github/workflows/build-android-v099739.yml'
      - 'scripts/prepare-android-v099738.mjs'
      - 'apps/android/runtime-r210-discover-profile-order.js'

permissions:
  contents: read

concurrency:
  group: cinetracker-android-v099739-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099739:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.39
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r211-selector-root-fix.js
          node --check scripts/prepare-android-v099739.mjs
          node --check scripts/test-android-v099739.mjs
          node scripts/prepare-android-v099739.mjs
          node scripts/test-android-v099739.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r211-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r211 embedded JS missing');
          fs.writeFileSync('/tmp/ct99739-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99739-prebuild.js

      - name: Build Android 0.99.7.39 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate APK identity, runtime, signing and digest
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.39-real-dom-roots-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.39"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "10009"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99739-index.html
          for marker in \
            'android-v0.99.7.39-r211-real-dom-roots' \
            'real-dom-roots-discover-profile' \
            '[data-discover] [data-discover-tab]' \
            '[data-profile] .ct210-stats-grid' \
            'window.ct210SelectDiscoverTab=selectTab210' \
            'single-minimal-item-search-no-date-no-summary' \
            'single-inline-action-no-duplicate-full-width' \
            'calc((100% - 16px)/3)' \
            'detail-watchlist-toggle'; do
            grep -Fq "$marker" /tmp/ct99739-index.html
          done
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/ct99739-index.html','utf8');
          const marker='<script data-ct-android="r211-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('embedded r211 JS missing');
          fs.writeFileSync('/tmp/ct99739.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99739.js
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099739-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.39-real-dom-roots-debug
          path: |
            cinetracker-android-0.99.7.39-real-dom-roots-debug.apk
            android-v099739-sha256.txt
          if-no-files-found: error
          retention-days: 14
