name: Fix r235 reconciler

on:
  push:
    branches:
      - fix/1.0.27-r235-live-authority
    paths:
      - .github/workflows/fix-r235-reconciler.yml

permissions:
  contents: write

jobs:
  patch-reconciler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1.0.27-r235-live-authority
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch reconciler scheduler
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'apps/web/runtime-r235-v127-live-authority.js';
          let s = fs.readFileSync(path, 'utf8');
          const old = 'requestAnimationFrame(normalizeAll127);';
          const replacement = 'setTimeout(normalizeAll127, 0);';
          if (!s.includes(old)) throw new Error('Expected reconciler scheduler not found');
          s = s.replace(old, replacement);
          fs.writeFileSync(path, s);
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/runtime-r235-v127-live-authority.js
          git diff --cached --check
          git commit -m "fix(r235): reconcile async DOM changes outside animation frame"
          git push origin HEAD:fix/1.0.27-r235-live-authority
