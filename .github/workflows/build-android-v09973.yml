name: Build Android 0.99.7.3 r150 Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci-status/android-v09973-trigger.txt'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v09973-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v09973:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and verify frozen Web runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          grep -q 'ct-web-0.99.7-r150b' dist/service-worker.js
          grep -q "window.__ct0997R150Loaded" dist/patch-v150-v0997-calendar-release-sync.js
          grep -q "window.__ct0997R150bLoaded" dist/patch-v150b-v0997-realtime-sync.js
          grep -q 'cinetracker_calendar_watchlist_v0997' dist/patch-v150-v0997-calendar-release-sync.js
          grep -q "event==='postgres_changes'" dist/patch-v150b-v0997-realtime-sync.js
          grep -q 'cinetracker:app-foreground' dist/patch-v150b-v0997-realtime-sync.js

      - name: Prepare Android 0.99.7.3 embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-android-v09973.mjs
          node scripts/test-android-v09973.mjs

      - name: Build Android 0.99.7.3 APK
        working-directory: apps/android
        shell: bash
        run: gradle assembleDebug --stacktrace

      - name: Validate APK identity, r150 runtime and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.3-r150-sync-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          PACKAGE="$($AAPT dump badging "$OUT" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.99.7.3"
          test "$VERSION_CODE" = "9973"
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'android-v0.99.7.3-r150-realtime'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'v09973-r150-realtime-sync'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q '__ct0997R150Loaded'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q '__ct0997R150bLoaded'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'cinetracker_calendar_watchlist_v0997'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'postgres_changes'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'cinetracker:app-foreground'
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v09973-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.3-r150-sync-debug
          path: |
            cinetracker-android-0.99.7.3-r150-sync-debug.apk
            android-v09973-sha256.txt
          if-no-files-found: error

      - name: Publish Android 0.99.7.3 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Android 0.99.7.3 sobre o Web r150/r150b congelado. Corrige episódios lançados no próprio dia, Calendário/Minha Watchlist, sincronização Supabase Realtime entre dispositivos, revalidação ao retornar ao app e preserva o layout Android existente.'
          gh release view android-v0.99.7.3 >/dev/null 2>&1 || gh release create android-v0.99.7.3 --title "CineTracker Android 0.99.7.3" --notes "$NOTES"
          gh release edit android-v0.99.7.3 --title "CineTracker Android 0.99.7.3" --notes "$NOTES"
          gh release upload android-v0.99.7.3 cinetracker-android-0.99.7.3-r150-sync-debug.apk android-v09973-sha256.txt --clobber
