name: CineTracker Android 1.0 — Official Release
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-android-v10-official.mjs'
      - 'scripts/test-android-v10-official.mjs'
      - 'apps/android/app/build.gradle'
      - '.github/workflows/release-android-v10-official.yml'
      - 'CHANGELOG.md'
      - 'VERSIONS.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinetracker-android-official-1-0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official_release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify Android-only source changes
        shell: bash
        run: |
          set -euo pipefail
          FREEZE='43f5f0c5d87802fac80365c62388276c0b2d7255'
          git cat-file -e "$FREEZE^{commit}"
          git diff --exit-code HEAD^ HEAD -- apps/web
          test "$(git hash-object apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java)" = '641f8766951077947c57cf34959bac43b94e2648'
          test "$(git hash-object apps/android/app/src/main/res/layout/activity_main.xml)" = '30edbb633685c3a77ce114c92c4f07dfa07a3271'
          grep -Fq 'CineTrackerNative' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          grep -Fq 'onShowFileChooser' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          grep -Fq 'requestNotificationPermission' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java
          grep -Fq 'bindNativeNavigation' apps/android/app/src/main/java/com/cinetracker/app/MainActivity.java

      - name: Restore dedicated signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Require unchanged signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.cinetracker/cinetracker.keystore" || {
            echo 'Original signing key unavailable. Refusing to rotate the official certificate.'
            exit 1
          }
          keytool -list -keystore "$HOME/.cinetracker/cinetracker.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Download certified Android 1.0.61 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download android-v1.0.61 --pattern 'CineTracker-Android-1.0.61.apk' --dir /tmp --clobber
          test -s /tmp/CineTracker-Android-1.0.61.apk

      - name: Prepare and verify official 1.0 is functionally identical to 1.0.61
        env:
          CINETRACKER_REQUIRE_BASELINE: '1'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10104' apps/android/app/build.gradle
          grep -Fq "applicationId 'com.cinetracker.app'" apps/android/app/build.gradle
          grep -Fq 'signingConfig signingConfigs.official' apps/android/app/build.gradle
          node --check scripts/prepare-android-v10-official.mjs
          node --check scripts/test-android-v10-official.mjs
          node scripts/prepare-android-v10-official.mjs
          node scripts/test-android-v10-official.mjs

      - name: Build production release APK, not debug
        working-directory: apps/android
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleRelease --stacktrace

      - name: Validate production APK and certificate compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK='apps/android/app/build/outputs/apk/release/app-release.apk'
          OUT='CineTracker-Android-1.0.apk'
          test -s "$APK"
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$("$AAPT" dump badging "$OUT")"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          grep -Fq "versionName='1.0'" <<<"$BADGING"
          grep -Fq "versionCode='10104'" <<<"$BADGING"
          if grep -Fq 'application-debuggable' <<<"$BADGING"; then echo 'Refusing debuggable APK'; exit 1; fi
          "$APKSIGNER" verify --print-certs "$OUT" > /tmp/cinetracker-1.0-signer.txt
          "$APKSIGNER" verify --print-certs /tmp/CineTracker-Android-1.0.61.apk > /tmp/cinetracker-1.0.61-signer.txt
          OLD_CERT="$(awk '/certificate SHA-256 digest:/ {print $NF;exit}' /tmp/cinetracker-1.0.61-signer.txt)"
          NEW_CERT="$(awk '/certificate SHA-256 digest:/ {print $NF;exit}' /tmp/cinetracker-1.0-signer.txt)"
          printf 'Previous signing SHA-256: %s\\nOfficial signing SHA-256: %s\\n' "$OLD_CERT" "$NEW_CERT"
          test -n "$OLD_CERT" && test "$OLD_CERT" = "$NEW_CERT" || {
            echo 'Official 1.0 signing certificate incompatible with prior installation'
            exit 1
          }
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/cinetracker-1.0-index.html
          grep -Fq 'name="ct-official-version" content="1.0"' /tmp/cinetracker-1.0-index.html
          grep -Fq 'data-ct-android="r303-android-stable-js"' /tmp/cinetracker-1.0-index.html
          grep -Fq 'window.__ctAndroidOfficialCode=10104' /tmp/cinetracker-1.0-index.html
          grep -Fq 'window.__ctR303SinglePaint' /tmp/cinetracker-1.0-index.html
          grep -Fq 'window.__ctR296WweHome' /tmp/cinetracker-1.0-index.html
          grep -Fq 'cinetracker_recommendation_filter_v525' /tmp/cinetracker-1.0-index.html
          sha256sum "$OUT" | tee CineTracker-Android-1.0-SHA256.txt
          stat -c '%s' "$OUT" | tee CineTracker-Android-1.0-size.txt
          echo 'ANDROID_OFFICIAL_1_0_VALIDATED'

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-official-1.0
          path: |
            CineTracker-Android-1.0.apk
            CineTracker-Android-1.0-SHA256.txt
            CineTracker-Android-1.0-size.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish Android 1.0 official GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='android-v1.0'
          cat > /tmp/release-1.0-notes.md <<'NOTES'
          # CineTracker Android 1.0 — Lançamento oficial

          Versão estável oficial baseada integralmente na Android 1.0.61/r303, sem modificações funcionais.

          - Android versionName 1.0, versionCode 10104.
          - APK de produção não depurável, mesmo package com.cinetracker.app e mesma assinatura de 1.0.61.
          - Atualiza a instalação oficial existente sem precisar desinstalar.
          - Descobrir/Pra Você, Home, Raw/SmackDown, Esportes, F1 e Perfil preservados.
          - Web e Supabase não modificados.
          - SHA-256 de integridade disponibilizado junto do APK.

          Este lançamento oficial é no GitHub. Não representa publicação na Google Play.
          O lançamento histórico v1.0.0 (versionCode 10042) é anterior e diferente desta promoção.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title 'CineTracker Android 1.0 — Oficial' --notes-file /tmp/release-1.0-notes.md --latest
          else
            gh release create "$TAG" --title 'CineTracker Android 1.0 — Oficial' --notes-file /tmp/release-1.0-notes.md --latest
          fi
          gh release upload "$TAG" CineTracker-Android-1.0.apk CineTracker-Android-1.0-SHA256.txt CineTracker-Android-1.0-size.txt --clobber
