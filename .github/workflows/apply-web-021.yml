name: Apply CineTracker Web 0.2.1

on:
  push:
    paths:
      - '.github/workflows/apply-web-021.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Web 0.2.1 changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('apps/web/index.html')
          s = p.read_text()

          def rep(old, new, count=1):
              global s
              if old not in s:
                  raise SystemExit(f'pattern not found: {old[:100]!r}')
              s = s.replace(old, new, count)

          # Black / Blue visual identity.
          replacements = {
              '#d6b55b':'#4da3ff', '#8f783c':'#2f80ed', '#4b4026':'#173b63', '#201c12':'#0d1a2a',
              '#211c11':'#07111f', '#302b20':'#17304f', '#4b4530':'#1e4f7a', '#3b3320':'#17304f',
              '#353126':'#17304f', '#5b5134':'#255b8f', '#47402d':'#17304f', '#18150e':'#0a1624',
              '#15130e':'#0b1420'
          }
          for a,b in replacements.items():
              s = s.replace(a,b)
          s = s.replace('rgba(214,181,91,.22)', 'rgba(77,163,255,.20)')

          # Favicon and version.
          rep('<title>CineTracker</title>', '<title>CineTracker</title><link rel="icon" type="image/svg+xml" href="/favicon.svg">')
          s = s.replace('CineTracker Oficial v0.2.0', 'CineTracker Oficial v0.2.1')

          # Profile layout and settings styles.
          rep('.profile{margin-top:auto;border-top:1px solid #252525;padding-top:13px}', '.profile{margin-top:auto;border-top:1px solid #252525;padding-top:13px;min-width:0}.profile strong{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile-email{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.settings-field{display:grid;gap:7px}.settings-field.full{grid-column:1/-1}.settings-field input,.settings-field select{width:100%;padding:10px 11px;border-radius:11px;border:1px solid #304258;background:#0b0f14;color:#fff}.settings-field input:focus,.settings-field select:focus{outline:none;border-color:#2f80ed}.settings-note{padding:11px 12px;border:1px solid #17304f;border-radius:11px;background:#0a1420;color:#a9bdd1;font-size:12px}.settings-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:700px){.settings-grid{grid-template-columns:1fr}.settings-field.full{grid-column:auto}}')
          s = s.replace('.mobile-nav{display:grid;grid-template-columns:repeat(4,1fr);', '.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);')

          # Account update API and helpers.
          rep("async function signOut() { try {\n    await authRequest('logout');\n}\ncatch { } localStorage.removeItem('cinetracker_session'); ctSession = null; currentUser = null; cloudConnected = false; }",
          "async function signOut() { try {\n    await authRequest('logout');\n}\ncatch { } localStorage.removeItem('cinetracker_session'); ctSession = null; currentUser = null; cloudConnected = false; }\nfunction profileDisplayName() { return currentUser?.user_metadata?.display_name || currentUser?.user_metadata?.name || currentUser?.email?.split('@')[0] || 'Usuário'; }\nasync function updateUserAccount(payload) {\n    if (!ctSession?.access_token) throw new Error('Faça login para alterar sua conta');\n    const r = await fetch(`${SUPABASE_URL}/auth/v1/user`, { method: 'PUT', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });\n    const d = await r.json().catch(() => ({}));\n    if (!r.ok) throw new Error(d.msg || d.message || d.error_description || d.error || 'Não foi possível atualizar a conta');\n    currentUser = d;\n    if (ctSession) { ctSession.user = d; localStorage.setItem('cinetracker_session', JSON.stringify(ctSession)); }\n    return d;\n}")

          # Sidebar profile + settings navigation.
          old_shell = "function shell(content) {\n    return `<div class=\"app\"><aside class=\"sidebar\"><div><div class=\"logo\"><span class=\"gold\">CINE</span>TRACKER</div><div class=\"small muted\">Seu universo de mídia</div></div><nav class=\"nav\">${navButton('home', '⌂ Hoje')}${navButton('library', '▤ Biblioteca')}${navButton('discover', '✦ Descobrir')}${navButton('import', '⇧ Importar')}${navButton('stats', '◫ Estatísticas')}</nav><div class=\"profile\"><strong>${escapeHtml(currentUser?.email || 'Usuário')}</strong><div class=\"small muted\">Perfil principal</div><button id=\"logout\" class=\"btn-secondary logout-btn\" type=\"button\">Sair</button></div></aside><main class=\"content\"><div class=\"cloud-bar ${cloudConnected ? 'ok' : 'warn'}\"><span>${cloudConnected ? '● Banco persistente conectado' : '● ' + escapeHtml(cloudStatus)}</span><span class=\"small muted\">CineTracker Oficial v0.2.1</span></div>${content}<nav class=\"mobile-nav\">${navButton('home', 'Hoje')}${navButton('library', 'Biblioteca')}${navButton('discover', 'Descobrir')}${navButton('import', 'Importar')}${navButton('stats', 'Stats')}</nav><div id=\"toast\" class=\"toast hidden\" aria-live=\"polite\"></div></main></div>`;\n}"
          new_shell = "function shell(content) {\n    return `<div class=\"app\"><aside class=\"sidebar\"><div><div class=\"logo\"><span class=\"gold\">CINE</span>TRACKER</div><div class=\"small muted\">Seu universo de mídia</div></div><nav class=\"nav\">${navButton('home', '⌂ Hoje')}${navButton('library', '▤ Biblioteca')}${navButton('discover', '✦ Descobrir')}${navButton('import', '⇧ Importar')}${navButton('stats', '◫ Estatísticas')}${navButton('settings', '⚙ Configurações')}</nav><div class=\"profile\"><strong title=\"${escapeHtml(profileDisplayName())}\">${escapeHtml(profileDisplayName())}</strong><span class=\"small muted profile-email\" title=\"${escapeHtml(currentUser?.email || '')}\">${escapeHtml(currentUser?.email || '')}</span><div class=\"small muted\">Perfil principal</div><button id=\"logout\" class=\"btn-secondary logout-btn\" type=\"button\">Sair</button></div></aside><main class=\"content\"><div class=\"cloud-bar ${cloudConnected ? 'ok' : 'warn'}\"><span>${cloudConnected ? '● Banco persistente conectado' : '● ' + escapeHtml(cloudStatus)}</span><span class=\"small muted\">CineTracker Oficial v0.2.1</span></div>${content}<nav class=\"mobile-nav\">${navButton('home', 'Hoje')}${navButton('library', 'Biblioteca')}${navButton('discover', 'Descobrir')}${navButton('stats', 'Stats')}${navButton('settings', 'Conta')}</nav><div id=\"toast\" class=\"toast hidden\" aria-live=\"polite\"></div></main></div>`;\n}"
          rep(old_shell, new_shell)

          # Settings screen.
          marker = "function stats() {\n"
          settings_fn = r'''function settings() {
    const lang = currentUser?.user_metadata?.language || 'pt-BR';
    const name = profileDisplayName();
    const phone = currentUser?.phone || '';
    return shell(`<header class="header"><div><div class="eyebrow">CONFIGURAÇÕES</div><h1 class="h1">Conta e preferências</h1><p class="subtitle">As configurações ficam vinculadas à sua conta CineTracker.</p></div></header>
    <section class="panel section" style="padding:18px"><form id="account-settings"><div class="settings-grid">
      <label class="settings-field"><span>Nome do perfil</span><input id="settings-name" value="${escapeHtml(name)}" maxlength="60" required></label>
      <label class="settings-field"><span>Idioma</span><select id="settings-language"><option value="pt-BR"${lang === 'pt-BR' ? ' selected' : ''}>Português (Brasil)</option><option value="en"${lang === 'en' ? ' selected' : ''}>English</option></select></label>
      <label class="settings-field"><span>E-mail</span><input id="settings-email" type="email" value="${escapeHtml(currentUser?.email || '')}" required></label>
      <label class="settings-field"><span>Telefone</span><input id="settings-phone" type="tel" value="${escapeHtml(phone)}" placeholder="+55 11 99999-9999"></label>
      <div class="settings-field full settings-note">Mudanças de e-mail ou telefone podem exigir confirmação pelo Supabase antes de entrarem em vigor. O idioma fica salvo no perfil e será usado pela camada de internacionalização do Web/Android.</div>
    </div><div class="settings-actions"><button class="btn-primary" type="submit">Salvar configurações</button></div><div id="settings-status" class="auth-error"></div></form></section>`);
}
'''
          rep(marker, settings_fn + marker)

          # Render settings view.
          rep("app.innerHTML = view === 'home' ? home() : view === 'library' ? library() : view === 'discover' ? discover() : view === 'import' ? importView() : stats();",
              "app.innerHTML = view === 'home' ? home() : view === 'library' ? library() : view === 'discover' ? discover() : view === 'import' ? importView() : view === 'settings' ? settings() : stats();")

          # Bind account form.
          bind_marker = "function bind() {\n    document.querySelector('#logout')?.addEventListener('click', async () => { await signOut(); render(); });"
          bind_new = "function bind() {\n    document.querySelector('#logout')?.addEventListener('click', async () => { await signOut(); render(); });\n    document.querySelector('#account-settings')?.addEventListener('submit', async (event) => {\n        event.preventDefault();\n        const status = document.querySelector('#settings-status');\n        const display_name = (document.querySelector('#settings-name')?.value || '').trim();\n        const language = document.querySelector('#settings-language')?.value || 'pt-BR';\n        const email = (document.querySelector('#settings-email')?.value || '').trim();\n        const phone = (document.querySelector('#settings-phone')?.value || '').trim();\n        const payload = { data: { ...(currentUser?.user_metadata || {}), display_name, language } };\n        if (email && email !== currentUser?.email) payload.email = email;\n        if (phone !== (currentUser?.phone || '')) payload.phone = phone || null;\n        try {\n            if (status) status.textContent = 'Salvando…';\n            await updateUserAccount(payload);\n            if (status) status.textContent = 'Configurações salvas.';\n            toast('Configurações da conta atualizadas.');\n            render();\n        } catch (error) { if (status) status.textContent = error instanceof Error ? error.message : 'Falha ao salvar'; }\n    });"
          rep(bind_marker, bind_new)

          p.write_text(s)

          # TV + cinema-play favicon.
          Path('apps/web/favicon.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="5" y="12" width="54" height="40" rx="8" fill="#05070a" stroke="#4da3ff" stroke-width="4"/><path d="M23 4l9 8 9-8" fill="none" stroke="#4da3ff" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="32" r="13" fill="#0d1a2a" stroke="#4da3ff" stroke-width="2"/><path d="M28 24l13 8-13 8z" fill="#fff"/></svg>''')

          # Version/catalog documentation.
          vp = Path('VERSIONS.md')
          v = vp.read_text().replace('| Web | **0.2.0** |','| Web | **0.2.1** |')
          v = v.replace('- **0.2.0** — início da linha oficial com autenticação e persistência Supabase, importação JSON/ZIP e arquitetura de sincronização.', '- **0.2.0** — início da linha oficial com autenticação e persistência Supabase, importação JSON/ZIP e arquitetura de sincronização.\n- **0.2.1** — identidade Black/Blue, favicon oficial, configurações de conta e correção do perfil na sidebar.')
          vp.write_text(v)
          cp = Path('CHANGELOG.md')
          c = cp.read_text()
          entry = '''## Web 0.2.1 — 2026-08-21\n\n### Adicionado\n- Identidade visual Black/Blue.\n- Favicon CineTracker com TV e símbolo de reprodução/cinema.\n- Tela Configurações com nome do perfil, e-mail, telefone e idioma PT-BR/English.\n- Persistência das preferências de conta no Supabase Auth.\n\n### Ajustado\n- Sidebar passa a priorizar o nome do perfil, mantendo o e-mail secundário.\n- Nome/e-mail não extrapolam mais a largura da área de perfil.\n- Versão Web exibida atualizada para 0.2.1.\n\n'''
          cp.write_text(c.replace('## Web 0.2.0 — 2026-08-21', entry + '## Web 0.2.0 — 2026-08-21'))
          pp = Path('package.json')
          pp.write_text(pp.read_text().replace('"version": "0.2.0"','"version": "0.2.1"'))
          PY
      - name: Validate
        run: npm run verify
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/index.html apps/web/favicon.svg VERSIONS.md CHANGELOG.md package.json
          git commit -m "feat(web): account settings and black-blue theme v0.2.1"
          git push origin main
