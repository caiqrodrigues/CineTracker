name: Build Android 0.99.7.65

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/runtime-r237-two-fixes-only.js'
      - 'apps/android/app/build.gradle'
      - 'scripts/prepare-android-v099765.mjs'
      - '.github/workflows/build-android-v099765.yml'

permissions:
  contents: read

concurrency:
  group: cinetracker-android-v099765-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Install cached signing key
        run: |
          test -f ~/.cinetracker/cinetracker.keystore
          mkdir -p ~/.android
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and validate the two Android fixes
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r237-two-fixes-only.js
          node --check scripts/prepare-android-v099765.mjs
          node scripts/prepare-android-v099765.mjs
          INDEX='apps/android/app/src/main/assets/hotfix5/index.html'
          grep -Fq "versionName '0.99.7.65'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10035' apps/android/app/build.gradle
          grep -Fq 'android-v0.99.7.65-r237-two-fixes-only' "$INDEX"
          grep -Fq 'merge-ct166-ct186-watchlist-direct-slot' "$INDEX"
          grep -Fq "key.startsWith('watchlist:')?watch:fresh" "$INDEX"
          grep -Fq "if(typeof ct166ForYouData==='object'" "$INDEX"
          grep -Fq "if(typeof ct186ForYouData==='object'" "$INDEX"
          grep -Fq "window.addEventListener('pointerup',activateSwap237" "$INDEX"
          grep -Fq 'native-webview-horizontal-no-manual-touch' "$INDEX"
          grep -Fq 'touch-action:pan-x pan-y!important' "$INDEX"
          grep -Fq 'overflow-x:scroll!important' "$INDEX"
          ! grep -Fq "addEventListener('touchmove'" apps/android/runtime-r237-two-fixes-only.js
          ! grep -Fq "addEventListener('touchstart'" apps/android/runtime-r237-two-fixes-only.js
          ! grep -Fq 'touch-action:pan-y!important' apps/android/runtime-r237-two-fixes-only.js
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r237-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r237 embedded JS missing');
          fs.writeFileSync('/tmp/ct99765-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99765-prebuild.js

      - name: Build Android APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate final Android APK
        run: |
          set -euo pipefail
          APK='apps/android/app/build/outputs/apk/debug/app-debug.apk'
          OUT='CineTracker-0.99.7.65.apk'
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          grep -Fq "versionName='0.99.7.65'" <<<"$BADGING"
          grep -Fq "versionCode='10035'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99765-index.html
          grep -Fq 'android-v0.99.7.65-r237-two-fixes-only' /tmp/ct99765-index.html
          grep -Fq 'merge-ct166-ct186-watchlist-direct-slot' /tmp/ct99765-index.html
          grep -Fq 'native-webview-horizontal-no-manual-touch' /tmp/ct99765-index.html
          grep -Fq 'touch-action:pan-x pan-y!important' /tmp/ct99765-index.html
          grep -Fq "key.startsWith('watchlist:')?watch:fresh" /tmp/ct99765-index.html
          ! grep -Fq 'android-v0.99.7.64-r236' /tmp/ct99765-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          stat -c '%s' "$OUT" | tee android-v099765-size.txt
          sha256sum "$OUT" | tee android-v099765-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.65
          path: |
            CineTracker-0.99.7.65.apk
            android-v099765-sha256.txt
            android-v099765-size.txt
          if-no-files-found: error
          retention-days: 14
