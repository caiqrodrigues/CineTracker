name: Verify HOTFIX11 Import Sync

on:
  push:
    branches: [recovery/v097-hotfix11-import-sync]

permissions:
  contents: read

concurrency:
  group: hotfix11-import-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import_sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore dedicated CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize dedicated signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Web runtime
        run: npm run build
      - name: Prove authentication and HOTFIX10 navigation regression suites
        run: |
          node scripts/test-auth-recovery-red.mjs
          node scripts/test-hotfix10-native-bridge.mjs
      - name: Install real-browser harness
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Prove Web navigation and reliable dual CSV import/sync
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node scripts/test-real-browser-hotfix10-selective.mjs
          node scripts/test-real-browser-hotfix11-import-sync.mjs
      - name: Prepare exact embedded Android runtime
        run: node scripts/prepare-android-hotfix2-web.mjs
      - name: Compile every Android inline script
        run: node scripts/test-android-inline-hotfix6.mjs
      - name: Prove embedded Android navigation and reliable dual CSV import/sync
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          CINETRACKER_TEST_ROOT=apps/android/app/src/main/assets/hotfix5 node scripts/test-real-browser-hotfix10-selective.mjs
          CINETRACKER_TEST_ROOT=apps/android/app/src/main/assets/hotfix5 node scripts/test-real-browser-hotfix11-import-sync.mjs
      - name: Assert stable architecture and HOTFIX11 layer
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'patch-v078-hotfix11-import-sync.js' dist/index.html
          grep -q 'patch-v079-hotfix11-compat.js' dist/index.html
          ! grep -q '<script src="/patch-v068-v097.js"' dist/index.html
          grep -q '__ctHotfix11ImportSync' apps/android/app/src/main/assets/hotfix5/index.html
          grep -q '__ctHotfix11Compat' apps/android/app/src/main/assets/hotfix5/index.html
          grep -q '__ctHotfix10Selective' apps/android/app/src/main/assets/hotfix5/index.html
          ! grep -q '__ct97Loaded' apps/android/app/src/main/assets/hotfix5/index.html
      - name: Build signed Android validation APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Verify APK identity signature and HOTFIX11 runtime
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          unzip -l "$APK" | grep -q 'assets/hotfix5/index.html'
          unzip -p "$APK" assets/hotfix5/index.html | grep -q '__ctHotfix11ImportSync'
          unzip -p "$APK" assets/hotfix5/index.html | grep -q '__ctHotfix11Compat'
          if unzip -p "$APK" assets/hotfix5/index.html | grep -q '__ct97Loaded'; then exit 1; fi
          "$APKSIGNER" verify --print-certs "$APK"
          PACKAGE="$($AAPT dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-hotfix11-import-sync-validation
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
