name: Validate CineTracker 1.0.22 Web Final Feedback

on:
  push:
    branches:
      - fix/1.0.22-web-recommendations-sports-profile
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate 1.0.22 source contract
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.22"' package.json
          grep -Fq '"version": "1.0.22"' apps/web/package.json
          grep -Fq 'build-r228.mjs' apps/web/package.json
          node --check apps/web/runtime-r228-v122-web-authority.js
          node --check apps/web/runtime-r228b-v122-card-metadata.js
          node --check apps/web/runtime-r228c-v122-authority-guards.js
          node --check apps/web/build-r228.mjs
          node --check scripts/test-v122c-web-final-feedback-browser.mjs
          grep -Fq 'css-loading-preserves-empty-authority+year-genres' apps/web/runtime-r228-v122-web-authority.js
          grep -Fq 'global-grid-direct-children-two-actions' apps/web/runtime-r228-v122-web-authority.js
          grep -Fq 'exact-renderable-watchlist-counts' apps/web/runtime-r228-v122-web-authority.js

      - name: Reproduce physical Web feedback in Chromium
        run: node scripts/test-v122c-web-final-feedback-browser.mjs

      - name: Preserve Pra Voce affinity
        run: node scripts/test-v118-foryou-affinity-profile-browser.mjs

      - name: Preserve final Watchlist and F1 authorities
        run: node scripts/test-v116-final-authorities-browser.mjs

      - name: Preserve 1.0.20 final authority conflicts
        run: node scripts/test-v120-final-authority-browser.mjs

      - name: Build Web 1.0.22
        run: npm run build

      - name: Inspect Web 1.0.22 bundle
        run: |
          set -euo pipefail
          B=apps/web/dist/app-v228.js
          test -f "$B"
          grep -Fq "const REVISION='r228-official-1.0.22';" "$B"
          grep -Fq "window.__ctR228V122='discover-metadata-series-settle-sports-source-counts-exact'" "$B"
          grep -Fq "window.__ctR228bV122='all-discover-cards-year-genres'" "$B"
          grep -Fq "window.__ctR228cV122='neutralize-legacy-watchlist-stat-selectors'" "$B"
          grep -Fq "ct-web-1.0.22-r228" apps/web/dist/service-worker.js
          grep -Fq 'r228-official-1.0.22' apps/web/dist/release.json
