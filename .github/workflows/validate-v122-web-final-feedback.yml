name: Validate CineTracker 1.0.22 Web Consolidated

on:
  push:
    branches:
      - fix/1.0.22-web-recommendations-sports-profile
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate r230 source
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.22"' package.json
          grep -Fq '"version": "1.0.22"' apps/web/package.json
          grep -Fq 'build-r230.mjs' apps/web/package.json
          node --check apps/web/runtime-r230-v122-web-final.js
          node --check apps/web/build-r230.mjs
          node --check scripts/test-v122-r229-web-browser.mjs
          grep -Fq "single-final-web-authority" apps/web/runtime-r230-v122-web-final.js

      - name: Reproduce physical Web screenshots in Chromium
        run: node scripts/test-v122-r229-web-browser.mjs

      - name: Preserve Pra Voce affinity
        run: node scripts/test-v118-foryou-affinity-profile-browser.mjs

      - name: Preserve Watchlist and F1 authorities
        run: node scripts/test-v116-final-authorities-browser.mjs

      - name: Build Web 1.0.22 r230
        run: npm run build

      - name: Inspect Web 1.0.22 r230 bundle
        run: |
          set -euo pipefail
          B=apps/web/dist/app-v230.js
          test -f "$B"
          grep -Fq "const REVISION='r230-official-1.0.22';" "$B"
          grep -Fq "window.__ctR230V122='single-final-web-authority'" "$B"
          grep -Fq "ct-web-1.0.22-r230" apps/web/dist/service-worker.js
          grep -Fq 'r230-official-1.0.22' apps/web/dist/release.json
          grep -Fq 'single-final-web-authority' apps/web/dist/release.json
