name: Validate CineTracker 1.0.22 Web Consolidated

on:
  push:
    branches:
      - fix/1.0.22-web-recommendations-sports-profile
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate r229 source
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.22"' package.json
          grep -Fq '"version": "1.0.22"' apps/web/package.json
          grep -Fq 'build-r229.mjs' apps/web/package.json
          node --check apps/web/runtime-r229-v122-web-consolidated.js
          node --check apps/web/build-r229.mjs
          node --check scripts/test-v122-r229-web-browser.mjs
          grep -Fq "final-web-authority-discover-sports-profile-no-legends" apps/web/runtime-r229-v122-web-consolidated.js

      - name: Reproduce physical Web screenshots in Chromium
        run: node scripts/test-v122-r229-web-browser.mjs

      - name: Preserve Pra Voce affinity
        run: node scripts/test-v118-foryou-affinity-profile-browser.mjs

      - name: Preserve Watchlist and F1 authorities
        run: node scripts/test-v116-final-authorities-browser.mjs

      - name: Build Web 1.0.22 r229
        run: npm run build

      - name: Inspect Web 1.0.22 r229 bundle
        run: |
          set -euo pipefail
          B=apps/web/dist/app-v229.js
          test -f "$B"
          grep -Fq "const REVISION='r229-official-1.0.22';" "$B"
          grep -Fq "window.__ctR229V122='final-web-authority-discover-sports-profile-no-legends'" "$B"
          grep -Fq "ct-web-1.0.22-r229" apps/web/dist/service-worker.js
          grep -Fq 'r229-official-1.0.22' apps/web/dist/release.json
          grep -Fq 'single-consolidated-web' apps/web/dist/release.json
