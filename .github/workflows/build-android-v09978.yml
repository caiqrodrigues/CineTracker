name: Build Android 0.99.7.8 — r174 Instant Motion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android_v09978:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Historical rebuild only
        shell: bash
        run: |
          node scripts/prepare-android-v09978.mjs
          node scripts/test-android-v09978.mjs
          cd apps/android && gradle assembleDebug --stacktrace
