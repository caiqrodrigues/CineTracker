name: Build Android 0.99.7.15 — Fast Clean Tabs

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  android_v099715:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare archived Android 0.99.7.15
        run: |
          node scripts/prepare-android-v099715.mjs
          node scripts/test-android-v099715.mjs
      - name: Build archived APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
