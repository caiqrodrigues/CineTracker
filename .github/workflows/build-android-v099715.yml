name: Build Android 0.99.7.15 — Fast Clean Tabs

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099715-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099715:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android 0.99.7.15 with frozen Web r179
        run: |
          node scripts/test-r179-target-card.mjs
          node scripts/prepare-android-v099715.mjs
          node scripts/test-android-v099715.mjs
      - name: Build Android 0.99.7.15 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate APK identity and embedded UI fixes
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.15-r179-fast-clean-tabs-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test "$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)" = "0.99.7.15"
          test "$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)" = "9985"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99715-index.html
          grep -Fq 'android-v0.99.7.15-r179-fast-clean-tabs' /tmp/ct99715-index.html
          grep -Fq 'cache-first-view-snapshots-background-refresh' /tmp/ct99715-index.html
          grep -Fq 'no-redundant-route-header' /tmp/ct99715-index.html
          grep -Fq 'safe-inside-poster-no-transform' /tmp/ct99715-index.html
          grep -Fq 'transform:none!important' /tmp/ct99715-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099715-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.15-r179-fast-clean-tabs-debug
          path: |
            cinetracker-android-0.99.7.15-r179-fast-clean-tabs-debug.apk
            android-v099715-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish Android 0.99.7.15 release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES='Android 0.99.7.15 mantém a Web r179 congelada. Corrige o selo Assistido cortado, remove o cabeçalho redundante CineTracker/nome da aba no topo das 5 abas e adiciona cache-first de snapshots: a última tela válida aparece imediatamente enquanto os dados são atualizados em segundo plano.'
          gh release view android-v0.99.7.15 >/dev/null 2>&1 || gh release create android-v0.99.7.15 --title "CineTracker Android 0.99.7.15 — Fast Clean Tabs" --notes "$NOTES"
          gh release edit android-v0.99.7.15 --title "CineTracker Android 0.99.7.15 — Fast Clean Tabs" --notes "$NOTES"
          gh release upload android-v0.99.7.15 cinetracker-android-0.99.7.15-r179-fast-clean-tabs-debug.apk android-v099715-sha256.txt --clobber
