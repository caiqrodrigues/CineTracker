name: Build Android 0.99.7.6 — r173 Mobile Frame

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'ci-status/android-v09976-trigger.txt'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v09976-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v09976:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Assert Web r173 remains frozen
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "r173-detail-left-window" apps/web/build-r173.mjs
          grep -Fq "detail-left-windowed-hero" apps/web/runtime-r173.js
          grep -Fq "poster-title-meta-synopsis-actions-left-window" apps/web/runtime-r173.js

      - name: Prepare Android 0.99.7.6 mobile runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-android-v09976.mjs
          node scripts/test-android-v09976.mjs

      - name: Build Android 0.99.7.6 APK
        working-directory: apps/android
        shell: bash
        run: gradle assembleDebug --stacktrace

      - name: Validate APK identity, embedded JS and mobile framing
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.6-r173-mobile-frame-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          PACKAGE="$($AAPT dump badging "$OUT" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.99.7.6"
          test "$VERSION_CODE" = "9976"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct9976-index.html
          python3 - <<'PY'
          from pathlib import Path
          h=Path('/tmp/ct9976-index.html').read_text()
          marker='<script data-ct-android="r173-js">'
          a=h.index(marker)+len(marker)
          b=h.index('</script>',a)
          js=h[a:b]
          assert 'const $$=(s,r=document)=>' in js
          assert js.count('const $=(s,r=document)=>') == 1
          Path('/tmp/ct9976-embedded.js').write_text(js)
          for marker in ['android-v0.99.7.6-r173-mobile-frame','phone-framed-carousels-scroll-snap','scroll-snap-type:x proximity','overflow-x:auto','ct169-related-row','ct171-top-row','ct169-season-chart-carousel']:
              assert marker in h, marker
          PY
          node --check /tmp/ct9976-embedded.js
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v09976-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.6-r173-mobile-frame-debug
          path: |
            cinetracker-android-0.99.7.6-r173-mobile-frame-debug.apk
            android-v09976-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android 0.99.7.6 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Android 0.99.7.6 mantém a Web r173 congelada e adapta o APK ao viewport real de telefone: enquadramento sem overflow horizontal de página, hero de filme/série responsivo, Home e formulários dimensionados para a largura útil, grids compactos e carrosséis horizontais com swipe/scroll local em Descobrir, Top 10, atores, temporadas, relacionados, streamings e gráficos. Mantém a correção de boot da 0.99.7.5 e toda a paridade funcional r173.'
          gh release view android-v0.99.7.6 >/dev/null 2>&1 || gh release create android-v0.99.7.6 --title "CineTracker Android 0.99.7.6 — r173 Mobile Frame" --notes "$NOTES"
          gh release edit android-v0.99.7.6 --title "CineTracker Android 0.99.7.6 — r173 Mobile Frame" --notes "$NOTES"
          gh release upload android-v0.99.7.6 cinetracker-android-0.99.7.6-r173-mobile-frame-debug.apk android-v09976-sha256.txt --clobber
