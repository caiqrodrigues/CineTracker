name: Validate CineTracker 1.0.13 Memory and F1 Grid

on:
  push:
    branches:
      - fix/1.0.13-foryou-memory-f1-grid
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Validate 1.0.13 source contract
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.13"' package.json
          grep -Fq '"version": "1.0.13"' apps/web/package.json
          grep -Fq 'build-r219.mjs' apps/web/package.json
          grep -Fq "versionName '1.0.13'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10055' apps/android/app/build.gradle
          node --check apps/web/runtime-r219-v113-memory-f1-grid.js
          node --check apps/web/build-r219.mjs
          node --check scripts/prepare-android-v1013.mjs
          node --check scripts/test-v113-memory-f1-browser.mjs
          grep -Fq 'recommendation_memory_v113' supabase/migrations/20260908112900_cinetracker_recommendation_memory_v113.sql
          grep -Fq 'nextQualifying' supabase/functions/cinetracker-f1-v1/index.ts

      - name: Prove recommendation memory and F1 UI in Chromium
        run: node scripts/test-v113-memory-f1-browser.mjs

      - name: Verify live F1 v6 browser contract
        run: |
          set -euo pipefail
          U='https://pjmkxryboypluleuuupp.supabase.co/functions/v1/cinetracker-f1-v1'
          KEY='sb_publishable_UERbQXkZk4rnnu6Y8XJSgw_vcZd_V_Q'
          H=$(mktemp)
          curl -fsS -D "$H" -o /tmp/f1-options -X OPTIONS "$U" -H 'Origin: https://cine-tracker-omega.vercel.app' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: apikey,content-type'
          grep -Eiq '^access-control-allow-origin: \*' "$H"
          grep -Eiq '^access-control-allow-methods: .*POST' "$H"
          curl -fsS "$U" -H "apikey: $KEY" -H 'content-type: application/json' --data '{"season":2026}' -o /tmp/f1.json
          node - <<'NODE'
          const d=JSON.parse(require('fs').readFileSync('/tmp/f1.json','utf8'));
          if(!Array.isArray(d.races)||d.races.length<20)throw new Error('F1 races incomplete');
          if(!Object.prototype.hasOwnProperty.call(d,'nextQualifying'))throw new Error('nextQualifying field missing');
          console.log('V113_F1_LIVE_OK races='+d.races.length+' next='+(d.next?.raceName||'none')+' grid='+(d.nextQualifying?'available':'pending'));
          NODE

      - name: Preserve 1.0.12 regressions
        run: node scripts/test-v112-foryou-profile-browser.mjs

      - name: Build Web 1.0.13
        run: npm run build

      - name: Inspect Web 1.0.13 bundle
        run: |
          set -euo pipefail
          B=apps/web/dist/app-v219.js
          test -f "$B"
          grep -Fq "window.__ctR219V113='persistent-foryou-memory-f1-collapse-grid'" "$B"
          grep -Fq 'cinetracker_recommendation_memory_v113' "$B"
          grep -Fq 'cinetracker_recommendation_record_v113' "$B"
          grep -Fq 'score113(x)>7.8' "$B"
          grep -Fq 'year113(x)>1990' "$B"
          grep -Fq 'g.includes(99)||g.includes(18)||g.includes(10766)' "$B"
          grep -Fq 'data-ct113-f1-grid' "$B"
          grep -Fq "ct-web-1.0.13-r219" apps/web/dist/service-worker.js

      - name: Prepare Android 1.0.13
        run: node scripts/prepare-android-v1013.mjs

      - name: Inspect prepared Android runtime
        run: |
          set -euo pipefail
          I=apps/android/app/src/main/assets/hotfix5/index.html
          grep -Fq "const REVISION='r255-android-official-1.0.13';" "$I"
          grep -Fq 'window.__ctAndroidOfficialCode=10055' "$I"
          grep -Fq "window.__ctR219V113='persistent-foryou-memory-f1-collapse-grid'" "$I"
          grep -Fq 'cinetracker_recommendation_record_v113' "$I"
          grep -Fq 'data-ct113-f1-grid' "$I"
          node - <<'NODE'
          const fs=require('fs'),h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const m=h.match(/<script data-ct-android="r255-android-js">([\s\S]*?)<\/script>/);if(!m)throw new Error('r255 script missing');fs.writeFileSync('/tmp/r255.js',m[1]);
          NODE
          node --check /tmp/r255.js

      - name: Build Android 1.0.13 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Inspect exact APK payload
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          rm -rf /tmp/v113-apk && mkdir -p /tmp/v113-apk
          unzip -q "$APK" -d /tmp/v113-apk
          I=/tmp/v113-apk/assets/hotfix5/index.html
          grep -Fq "const REVISION='r255-android-official-1.0.13';" "$I"
          grep -Fq 'cinetracker_recommendation_memory_v113' "$I"
          grep -Fq 'data-ct113-f1-toggle' "$I"
          grep -Fq 'data-ct113-f1-grid' "$I"
          sha256sum "$APK" | tee /tmp/v113-sha256.txt
          echo 'V113_APK_PAYLOAD_OK version=1.0.13 code=10055 runtime=r255'

      - uses: actions/upload-artifact@v4
        with:
          name: CineTracker-1.0.13-memory-f1-grid
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            /tmp/v113-sha256.txt
          if-no-files-found: error
