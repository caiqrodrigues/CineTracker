name: Activate Web r450
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Activate clean Pra Voce build
        run: |
          node -e "const fs=require('fs');for(const f of ['package.json','apps/web/package.json']){const p=JSON.parse(fs.readFileSync(f));p.version='1.0.240';if(f.startsWith('apps/')){p.scripts.build='node build-r450.mjs';p.scripts.verify='node test-r450.mjs';p.scripts['test:r450']='node test-r450.mjs'}fs.writeFileSync(f,JSON.stringify(p))}"
          grep -q '^## 1.0.240 / r450' CHANGELOG.md || { printf '%s\n\n' '## 1.0.240 / r450 — Descobrir > Pra Você — 2026-10-02' '- Escopo exclusivo em Descobrir > Pra Você.' '- Build parte da base limpa r444 e aplica somente o owner RPC-first novo.' '- Diário e 100% Novos: Watchlist + Visto + Trocar.' '- Da sua Watchlist: Visto + Trocar, sem botão Watchlist cinza.' '- Sem full-page reload, router.refresh, MutationObserver, setInterval ou loop infinito.' | cat - CHANGELOG.md > /tmp/c && mv /tmp/c CHANGELOG.md; }
          grep -q '^## Web 1.0.240 / r450' README.md || { printf '%s\n\n' '## Web 1.0.240 / r450 — Pra Você' 'Owner RPC-first único sobre a base limpa r444; 7 slots e ações completas.' | cat - README.md > /tmp/r && mv /tmp/r README.md; }
          grep -q '^## Web 1.0.240 / r450' VERSIONS.md || { printf '%s\n\n' '## Web 1.0.240 / r450' '- Descobrir > Pra Você corrigido; demais áreas preservadas na base r444.' | cat - VERSIONS.md > /tmp/v && mv /tmp/v VERSIONS.md; }
      - name: Validate r450
        run: |
          npm run build
          npm run verify
      - name: Commit activation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions
          git config user.email actions@github.com
          git add package.json apps/web/package.json CHANGELOG.md README.md VERSIONS.md
          git commit -m "fix: activate r450 Pra Voce"
          git push origin main
