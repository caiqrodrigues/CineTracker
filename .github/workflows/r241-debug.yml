name: Inspect r241 runtime
on:
  push:
    branches: [fix/1.0.33-r241-complete-user-video]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: node build-r239.mjs
      - name: Dump authorities
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const s=readFileSync('dist/app-v239.js','utf8');
          for(const q of ['sportsTabs','sportsPayload','sportsFiltered','sportsEmptyTitle','ctR180ProfileStats','ct175PrimeHome','ct176PrimeCanonical','ct239RestoreForYou','data-ct127-f1tabs','100% novos','Pra você','WWE']){
            let i=s.indexOf(q); console.log('\n===== '+q+' @ '+i+' =====');
            if(i>=0) console.log(s.slice(Math.max(0,i-1800),Math.min(s.length,i+5000)));
          }
          NODE
