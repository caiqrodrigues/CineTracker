name: Build Android HOTFIX 10

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci-status/android-hotfix10-trigger.txt'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-hotfix10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_hotfix10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark HOTFIX 10 build pending
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"pending","context":"Android HOTFIX 10","description":"Building CineTracker Android 0.0.97 HOTFIX 10"}'
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Restore dedicated CineTracker signing key
        uses: actions/cache@v4
        with: { path: ~/.cinetracker/cinetracker.keystore, key: cinetracker-signing-v2 }
      - name: Initialize dedicated signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and prove HOTFIX10 Web runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node scripts/test-auth-recovery-red.mjs
          node scripts/test-hotfix10-native-bridge.mjs
          npm install --no-save --no-package-lock playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node scripts/test-real-browser-hotfix10-selective.mjs
      - name: Prepare and prove exact embedded Android runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-android-hotfix2-web.mjs
          node scripts/test-android-inline-hotfix6.mjs
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          CINETRACKER_TEST_ROOT=apps/android/app/src/main/assets/hotfix5 node scripts/test-real-browser-hotfix10-selective.mjs
          grep -q "window.__ctAndroidBundle = 'hotfix10-selective-v95-core-inline-authoritative'" apps/android/app/src/main/assets/hotfix5/index.html
          grep -q '__ctHotfix10Selective' apps/android/app/src/main/assets/hotfix5/index.html
          grep -q '__ctHotfix10Actions' apps/android/app/src/main/assets/hotfix5/index.html
          grep -q '__ctHotfix10NativeBridge' apps/android/app/src/main/assets/hotfix5/index.html
          ! grep -q '__ct97Loaded' apps/android/app/src/main/assets/hotfix5/index.html
      - name: Build debug HOTFIX 10 APK
        working-directory: apps/android
        shell: bash
        run: gradle assembleDebug --stacktrace
      - name: Verify HOTFIX 10 APK identity signature and embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.0.97-HOTFIX10-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          unzip -l "$OUT" | grep -q 'assets/hotfix5/index.html'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q "window.__ctAndroidBundle = 'hotfix10-selective-v95-core-inline-authoritative'"
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q '__ctHotfix10Selective'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q '__ctHotfix10Actions'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q '__ctHotfix10NativeBridge'
          if unzip -p "$OUT" assets/hotfix5/index.html | grep -q '__ct97Loaded'; then exit 1; fi
          "$APKSIGNER" verify --print-certs "$OUT"
          PACKAGE="$($AAPT dump badging "$OUT" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.0.97 HOTFIX 10"
          test "$VERSION_CODE" = "988"
          sha256sum "$OUT" | tee hotfix10-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.0.97-HOTFIX10-debug
          path: |
            cinetracker-android-0.0.97-HOTFIX10-debug.apk
            hotfix10-sha256.txt
          if-no-files-found: error
      - name: Publish Android 0.0.97 HOTFIX 10 release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: |
          set -euo pipefail
          gh release view android-v0.0.97-hotfix10 >/dev/null 2>&1 || gh release create android-v0.0.97-hotfix10 --title "CineTracker Android 0.0.97 HOTFIX 10" --notes-file docs/releases/0.0.97-HOTFIX10.md
          gh release edit android-v0.0.97-hotfix10 --title "CineTracker Android 0.0.97 HOTFIX 10" --notes-file docs/releases/0.0.97-HOTFIX10.md
          gh release upload android-v0.0.97-hotfix10 cinetracker-android-0.0.97-HOTFIX10-debug.apk hotfix10-sha256.txt --clobber
      - name: Mark HOTFIX 10 build success
        if: success()
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"Android HOTFIX 10","description":"0.0.97 HOTFIX 10 selective recovery published"}'
      - name: Mark HOTFIX 10 build failure
        if: failure()
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"failure","context":"Android HOTFIX 10","description":"0.0.97 HOTFIX 10 build failed"}'
