name: Validate Android 0.99.7.45 PR

on:
  pull_request:
    branches:
      - fix/android-099744-top10-person-season-graph

permissions:
  contents: read

jobs:
  validate_android_099745:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare and test runtime
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r217-f1-top10-person-profile.js
          node --check scripts/prepare-android-v099745.mjs
          node --check scripts/test-android-v099745.mjs
          node scripts/prepare-android-v099745.mjs
          node scripts/test-android-v099745.mjs
      - name: Build APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate APK and signing
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/debug/app-debug.apk
          OUT=cinetracker-android-0.99.7.45-f1-top10-person-profile-debug.apk
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = 0.99.7.45
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = 10015
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/index.html
          grep -Fq 'android-v0.99.7.45-r217-f1-top10-person-profile' /tmp/index.html
          grep -Fq 'synchronous-own-shell-tokenized-provider-flow' /tmp/index.html
          grep -Fq 'invalid-id-unique-exact-title-fallback-positive-id' /tmp/index.html
          grep -Fq 'remove-cinetracker-person-header-direct-photo-bio' /tmp/index.html
          grep -Fq "row214(2,[card214('Episódios'" /tmp/index.html
          ! grep -Fq "row214(3,[card214('Séries',fmt214(seriesCount))" /tmp/index.html
          ! grep -Fq 'await window.ctR216RenderTop10(seq);' /tmp/index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          stat -c '%s' "$OUT" > android-v099745-size.txt
          sha256sum "$OUT" > android-v099745-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.45-f1-top10-person-profile-debug
          path: |
            cinetracker-android-0.99.7.45-f1-top10-person-profile-debug.apk
            android-v099745-sha256.txt
            android-v099745-size.txt
          if-no-files-found: error
          retention-days: 14
