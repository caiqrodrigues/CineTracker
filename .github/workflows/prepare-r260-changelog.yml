name: Prepare r260 changelog

on:
  push:
    branches:
      - fix/r260-discover-home-modal-scroll

permissions:
  contents: write

jobs:
  prepend_changelog:
    if: ${{ !contains(github.event.head_commit.message, 'docs: add Web 1.0.51 r260 changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r260-discover-home-modal-scroll
      - name: Prepend r260 release notes once
        env:
          R260_SECTION_B64: 
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os
          p=Path('CHANGELOG.md')
          text=p.read_text(encoding='utf-8')
          marker='## 1.0.51 — 2026-09-12 — Web r260'
          if marker not in text:
              section=base64.b64decode(os.environ['R260_SECTION_B64']).decode('utf-8')
              anchor=text.find('\n## ')
              if anchor < 0:
                  raise SystemExit('CHANGELOG anchor not found')
              text=text[:anchor+1]+'\n'+section+text[anchor+1:]
              p.write_text(text,encoding='utf-8')
          PY
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git config user.name 'Caique Rodrigues'
          git config user.email '73994301+caiqrodrigues@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'docs: add Web 1.0.51 r260 changelog'
          git push origin HEAD:fix/r260-discover-home-modal-scroll
