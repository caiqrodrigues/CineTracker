name: Build Android 0.99.4

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/android-0.99.4-startup
    paths:
      - 'ci-status/android-v0994-trigger.txt'

permissions:
  contents: write

concurrency:
  group: cinetracker-android-v0994-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v0994:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Build verified Web 0.99.4 runtime
        run: |
          set -euo pipefail
          npm run build
          grep -q 'patch-v107-v0994-data-ui-fix.js' dist/index.html
          grep -q 'ct-web-0.99.4' apps/web/service-worker.js
      - name: Prepare exact embedded Android 0.99.4 runtime
        run: |
          set -euo pipefail
          node scripts/prepare-android-v0994.mjs
          node scripts/test-android-v0994.mjs
      - name: Build Android 0.99.4 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate APK identity, runtime and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.4-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          PACKAGE="$($AAPT dump badging "$OUT" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.99.4"
          test "$VERSION_CODE" = "9940"
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'android-v0.99.4-startup-resilient'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'void preloadRoute994(target);'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'window.ct15Navigate = navigate994'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'patch-v107-v0994-data-ui-fix.js'
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v0994-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.4-debug
          path: |
            cinetracker-android-0.99.4-debug.apk
            android-v0994-sha256.txt
          if-no-files-found: error
      - name: Publish Android 0.99.4 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Android 0.99.4: runtime Web 0.99.4 embutido, navegação nativa apontando para o roteador 0.99.4, preload inicial não bloqueante e proteção contra sincronização infinita da Home.'
          gh release view android-v0.99.4 >/dev/null 2>&1 || gh release create android-v0.99.4 --title "CineTracker Android 0.99.4" --notes "$NOTES"
          gh release edit android-v0.99.4 --title "CineTracker Android 0.99.4" --notes "$NOTES"
          gh release upload android-v0.99.4 cinetracker-android-0.99.4-debug.apk android-v0994-sha256.txt --clobber
