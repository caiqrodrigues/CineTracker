name: Build Android 0.99.7.34 — Discover Core Events

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/android-099734-discover-core-events
    paths:
      - 'apps/android/app/build.gradle'
      - 'apps/android/runtime-r206-discover-core-events.js'
      - 'scripts/prepare-android-v099734.mjs'
      - 'scripts/test-android-v099734.mjs'
      - '.github/workflows/build-android-v099734.yml'
      - 'apps/web/runtime-r196-web.js'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099734-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099734:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.34
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r198-mobile-performance.js
          node --check apps/android/runtime-r206-discover-core-events.js
          node --check apps/web/runtime-r196-web.js
          node --check scripts/prepare-android-v099734.mjs
          node --check scripts/test-android-v099734.mjs
          node scripts/prepare-android-v099734.mjs
          node scripts/test-android-v099734.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r206-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r206 embedded JS missing');
          fs.writeFileSync('/tmp/ct99734-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99734-prebuild.js

      - name: Build Android 0.99.7.34 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate APK identity, scope, signing and digest
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.34-discover-core-events-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.34"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "10004"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99734-index.html
          for marker in \
            'android-v0.99.7.34-r206-discover-core-events' \
            'discover-core-events-three-cards' \
            'core-document-click-no-android-capture' \
            'discover-state-aware-foreground-throttle' \
            'discover-only-no-global-render-no-sports-profile-nav-overrides' \
            'calc((100% - 16px)/3)' \
            'detail-watchlist-toggle' \
            'mobile-first-cache-swr-progressive-render' \
            'embedded-apk-never-reloads-from-web-release-json'; do
            grep -Fq "$marker" /tmp/ct99734-index.html
          done
          for old in restore-route-render-and-discover-pan-x discover-direct-tabs-manual-horizontal-scroll pointer-capture-discover-tabs-horizontal-rails discover-direct-pointerup-native-horizontal-carousels discover-compact-foryou-reliable-touch-tabs discover-three-cards-touchstart-tabs discover-native-tab-grid-direct-button-listeners; do
            ! grep -Fq "$old" /tmp/ct99734-index.html
          done
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/ct99734-index.html','utf8');
          const marker='<script data-ct-android="r206-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('embedded r206 JS missing');
          fs.writeFileSync('/tmp/ct99734.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99734.js
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099734-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.34-discover-core-events-debug
          path: |
            cinetracker-android-0.99.7.34-discover-core-events-debug.apk
            android-v099734-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android 0.99.7.34 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES='Android-only scoped recovery. Built from the clean r198 base; r199-r205 Discover input controllers are absent. Discover returns to the original application data-discover-tab/data-discover-type delegated click handler. r198 foreground suppression is state-aware only for Discover tab/type changes. The approved 0.99.7.32 three-card layout and PRA VOCE filter behavior are preserved. No r206 global render, Sports, Profile, or navigation override is installed. Web remains unchanged at r196.'
          gh release view android-v0.99.7.34 >/dev/null 2>&1 || gh release create android-v0.99.7.34 --title "CineTracker Android 0.99.7.34 — Discover Core Events" --notes "$NOTES"
          gh release edit android-v0.99.7.34 --title "CineTracker Android 0.99.7.34 — Discover Core Events" --notes "$NOTES"
          gh release upload android-v0.99.7.34 cinetracker-android-0.99.7.34-discover-core-events-debug.apk android-v099734-sha256.txt --clobber
