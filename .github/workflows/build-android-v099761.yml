name: Build Android 0.99.7.61

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/runtime-r233-discover-physical-scroll-swap.js'
      - 'apps/android/app/build.gradle'
      - 'scripts/prepare-android-v099761.mjs'
      - 'scripts/test-android-v099761.mjs'
      - '.github/workflows/build-android-v099761.yml'

permissions:
  contents: read

concurrency:
  group: cinetracker-android-v099761-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Install cached signing key
        run: |
          test -f ~/.cinetracker/cinetracker.keystore
          mkdir -p ~/.android
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.61
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r233-discover-physical-scroll-swap.js
          node --check scripts/prepare-android-v099761.mjs
          node --check scripts/test-android-v099761.mjs
          node scripts/prepare-android-v099761.mjs
          node scripts/test-android-v099761.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r233-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r233 embedded JS missing');
          fs.writeFileSync('/tmp/ct99761-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99761-prebuild.js

      - name: Build Android APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate Android APK
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="CineTracker-0.99.7.61.apk"
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.61"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "10031"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99761-index.html
          for marker in 'android-v0.99.7.61-r233-physical-discover-fix' 'branch-from-r226-reject-r227-r232' 'keep-ct166-layout-class-private-data-direct-element-listeners' 'window-capture-move-scrollleft-provider-series-movies' 'equal-three-columns-grid-row-stretch' 'class="btn btn-secondary ct166-swap ct233-swap"' 'data-ct233-swap' 'touch-action:pan-y!important' 'grid-template-columns:repeat(3,minmax(0,1fr))!important' 'grid-auto-rows:1fr!important' 'optimistic-immediate-remove-next-card-background-sync' 'detail-seen-toggle-reversible-via-unmark-rpc' 'discover-filter-right-of-search' 'single-row-compact-auto-width-28px-pills' 'persistent-2x-3x-4x-no-disable' 'r217-library-behavior-no-r219-synthetic-fallback'; do grep -Fq "$marker" /tmp/ct99761-index.html; done
          for rejected in 'android-v0.99.7.55-r227-discover-swap-top10-swipe' 'android-v0.99.7.56-r228-discover-swap-top10-gesture' 'android-v0.99.7.57-r229-discover-swap-top10-pointer' 'android-v0.99.7.58-r230-discover-original-trocar-native-top10' 'android-v0.99.7.59-r231-clean-discover-actions' 'android-v0.99.7.60-r232-device-discover-fix' 'ct219-manual-cover' 'negative-id-resolve-or-local-detail'; do ! grep -Fq "$rejected" /tmp/ct99761-index.html; done
          "$APKSIGNER" verify --print-certs "$OUT"
          stat -c '%s' "$OUT" | tee android-v099761-size.txt
          sha256sum "$OUT" | tee android-v099761-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.61
          path: |
            CineTracker-0.99.7.61.apk
            android-v099761-sha256.txt
            android-v099761-size.txt
          if-no-files-found: error
          retention-days: 14
