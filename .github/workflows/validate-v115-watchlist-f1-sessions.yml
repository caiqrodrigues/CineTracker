name: Validate CineTracker 1.0.15 Watchlist and F1 Sessions

on:
  push:
    branches:
      - fix/1.0.15-watchlist-f1-sessions
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Validate 1.0.15 source contract
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.15"' package.json
          grep -Fq '"version": "1.0.15"' apps/web/package.json
          grep -Fq 'build-r221.mjs' apps/web/package.json
          grep -Fq "versionName '1.0.15'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10057' apps/android/app/build.gradle
          node --check apps/web/runtime-r221-v115-watchlist-f1-sessions.js
          node --check apps/web/build-r221.mjs
          node --check scripts/prepare-android-v1015.mjs
          node --check scripts/test-v115-watchlist-f1-browser.mjs
          grep -Fq 'known-is-required-not-excluded-no-fresh-quality-memory-soft-fallback' apps/web/runtime-r221-v115-watchlist-f1-sessions.js
          grep -Fq 'practice+sprint+qualifying+race-merged-into-generic-sports' apps/web/runtime-r221-v115-watchlist-f1-sessions.js

      - name: Prove Watchlist own contract and F1 sessions in Chromium
        run: node scripts/test-v115-watchlist-f1-browser.mjs

      - name: Preserve 1.0.14 regressions
        run: node scripts/test-v114-watchlist-stats-browser.mjs

      - name: Verify live F1 schedule has race and qualifying data
        run: |
          set -euo pipefail
          U='https://pjmkxryboypluleuuupp.supabase.co/functions/v1/cinetracker-f1-v1'
          KEY='sb_publishable_UERbQXkZk4rnnu6Y8XJSgw_vcZd_V_Q'
          curl -fsS "$U" -H "apikey: $KEY" -H 'content-type: application/json' --data '{"season":2026}' -o /tmp/f1.json
          node - <<'NODE'
          const d=JSON.parse(require('fs').readFileSync('/tmp/f1.json','utf8'));
          if(!Array.isArray(d.races)||d.races.length<20)throw new Error('F1 races incomplete');
          const withQual=d.races.filter(r=>r.Qualifying?.date).length,withRace=d.races.filter(r=>r.date).length;
          if(!withQual||!withRace)throw new Error('F1 session schedule incomplete');
          console.log('V115_F1_LIVE_OK races='+d.races.length+' qualifying='+withQual+' race='+withRace);
          NODE

      - name: Build Web 1.0.15
        run: npm run build

      - name: Inspect Web 1.0.15 bundle
        run: |
          set -euo pipefail
          B=apps/web/dist/app-v221.js
          test -f "$B"
          grep -Fq "window.__ctR221V115='watchlist-own-contract-f1-complete-sessions'" "$B"
          grep -Fq 'known-is-required-not-excluded-no-fresh-quality-memory-soft-fallback' "$B"
          grep -Fq 'practice+sprint+qualifying+race-merged-into-generic-sports' "$B"
          grep -Fq "ct-web-1.0.15-r221" apps/web/dist/service-worker.js

      - name: Prepare Android 1.0.15
        run: node scripts/prepare-android-v1015.mjs

      - name: Inspect prepared Android runtime
        run: |
          set -euo pipefail
          I=apps/android/app/src/main/assets/hotfix5/index.html
          grep -Fq "const REVISION='r257-android-official-1.0.15';" "$I"
          grep -Fq 'window.__ctAndroidOfficialCode=10057' "$I"
          grep -Fq "window.__ctR221V115='watchlist-own-contract-f1-complete-sessions'" "$I"
          grep -Fq 'known-is-required-not-excluded-no-fresh-quality-memory-soft-fallback' "$I"
          grep -Fq 'practice+sprint+qualifying+race-merged-into-generic-sports' "$I"
          node - <<'NODE'
          const fs=require('fs'),h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const m=h.match(/<script data-ct-android="r257-android-js">([\s\S]*?)<\/script>/);if(!m)throw new Error('r257 script missing');fs.writeFileSync('/tmp/r257.js',m[1]);
          NODE
          node --check /tmp/r257.js

      - name: Build Android 1.0.15 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Inspect exact APK payload
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          rm -rf /tmp/v115-apk && mkdir -p /tmp/v115-apk
          unzip -q "$APK" -d /tmp/v115-apk
          I=/tmp/v115-apk/assets/hotfix5/index.html
          grep -Fq "const REVISION='r257-android-official-1.0.15';" "$I"
          grep -Fq "window.__ctR221V115='watchlist-own-contract-f1-complete-sessions'" "$I"
          grep -Fq 'practice+sprint+qualifying+race-merged-into-generic-sports' "$I"
          sha256sum "$APK" | tee /tmp/v115-sha256.txt
          echo 'V115_APK_PAYLOAD_OK version=1.0.15 code=10057 runtime=r257'

      - uses: actions/upload-artifact@v4
        with:
          name: CineTracker-1.0.15-watchlist-f1-sessions
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            /tmp/v115-sha256.txt
          if-no-files-found: error
