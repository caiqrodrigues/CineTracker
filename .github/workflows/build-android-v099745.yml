name: Build Android 0.99.7.45 — F1 Top10 Person Profile

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-099745-f1-top10-person-profile
    paths:
      - 'apps/android/app/build.gradle'
      - 'apps/android/runtime-r217-f1-top10-person-profile.js'
      - 'scripts/prepare-android-v099745.mjs'
      - 'scripts/test-android-v099745.mjs'
      - '.github/workflows/build-android-v099745.yml'
      - 'scripts/prepare-android-v099744.mjs'
      - 'apps/android/runtime-r216-top10-person-season.js'
      - 'apps/android/runtime-r215-profile-posters-discover.js'
      - 'apps/android/runtime-r214-discover-state-clean-captions-density.js'

permissions:
  contents: read

concurrency:
  group: cinetracker-android-v099745-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099745:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.45
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r217-f1-top10-person-profile.js
          node --check scripts/prepare-android-v099745.mjs
          node --check scripts/test-android-v099745.mjs
          node scripts/prepare-android-v099745.mjs
          node scripts/test-android-v099745.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r217-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r217 embedded JS missing');
          fs.writeFileSync('/tmp/ct99745-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99745-prebuild.js

      - name: Build Android 0.99.7.45 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate APK identity, runtime, signing and digest
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.45-f1-top10-person-profile-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.45"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "10015"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99745-index.html
          for marker in \
            'android-v0.99.7.45-r217-f1-top10-person-profile' \
            'synchronous-own-shell-tokenized-provider-flow' \
            'invalid-id-unique-exact-title-fallback-positive-id' \
            'remove-cinetracker-person-header-direct-photo-bio' \
            'remove-series-count-card-only' \
            'data-ct217-top10' \
            "typeof window.ctR217RenderTop10==='function'" \
            'await window.ctR217RenderTop10(seq);' \
            'ct217Recovered' \
            "host.dataset.media=j.type+':'+Number(r.id)" \
            'cleanPersonHeader217' \
            "row214(2,[card214('Episódios'" \
            'main-and-sports-collapse-together-tight-gap' \
            'grid-template-columns:repeat(3,minmax(0,1fr))' \
            'whole-season-one-screen-swipe-season-only' \
            'overflow-x:hidden!important' \
            'max=420'; do
            grep -Fq "$marker" /tmp/ct99745-index.html
          done
          ! grep -Fq 'await window.ctR216RenderTop10(seq);' /tmp/ct99745-index.html
          ! grep -Fq "row214(3,[card214('Séries',fmt214(seriesCount))" /tmp/ct99745-index.html
          ! grep -Fq "setApp(shell('Pessoa','','discover'" /tmp/ct99745-index.html
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/ct99745-index.html','utf8');
          const marker='<script data-ct-android="r217-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('embedded r217 JS missing');
          fs.writeFileSync('/tmp/ct99745.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99745.js
          "$APKSIGNER" verify --print-certs "$OUT"
          stat -c '%s' "$OUT" | tee android-v099745-size.txt
          sha256sum "$OUT" | tee android-v099745-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.45-f1-top10-person-profile-debug
          path: |
            cinetracker-android-0.99.7.45-f1-top10-person-profile-debug.apk
            android-v099745-sha256.txt
            android-v099745-size.txt
          if-no-files-found: error
          retention-days: 14
