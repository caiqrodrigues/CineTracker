name: Build Android 0.99.7.29 — Discover Pointer Controller

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/web/runtime-r196-web.js'
      - 'scripts/prepare-android-v099729.mjs'
      - 'scripts/test-android-v099729.mjs'
      - '.github/workflows/build-android-v099729.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099729-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099729:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.29
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r198-mobile-performance.js
          node --check apps/android/runtime-r201-discover-pointer-controller.js
          node --check apps/web/runtime-r196-web.js
          node --check scripts/prepare-android-v099729.mjs
          node --check scripts/test-android-v099729.mjs
          node scripts/prepare-android-v099729.mjs
          node scripts/test-android-v099729.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r201-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r201 embedded JS missing');
          const js=h.slice(a+marker.length,b);
          if(js.includes('discover-direct-tabs-manual-horizontal-scroll')||js.includes('restore-route-render-and-discover-pan-x'))throw new Error('old touch patches still embedded');
          fs.writeFileSync('/tmp/ct99729-prebuild.js',js);
          NODE
          node --check /tmp/ct99729-prebuild.js

      - name: Build Android 0.99.7.29 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate APK identity, pointer runtime, signing and digest
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.29-discover-pointer-controller-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.29"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "9999"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99729-index.html
          for marker in \
            'android-v0.99.7.29-r201-discover-pointer-controller' \
            'pointer-capture-discover-tabs-horizontal-rails' \
            'pointer-events-pan-y-manual-scrollleft-with-arrow-fallback' \
            'ct201-scroll-controls' \
            'detail-watchlist-toggle' \
            'mobile-first-cache-swr-progressive-render' \
            'embedded-apk-never-reloads-from-web-release-json'; do
            grep -Fq "$marker" /tmp/ct99729-index.html
          done
          ! grep -Fq 'discover-direct-tabs-manual-horizontal-scroll' /tmp/ct99729-index.html
          ! grep -Fq 'restore-route-render-and-discover-pan-x' /tmp/ct99729-index.html
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/ct99729-index.html','utf8');
          const marker='<script data-ct-android="r201-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('embedded r201 JS missing');
          fs.writeFileSync('/tmp/ct99729.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99729.js
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099729-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.29-discover-pointer-controller-debug
          path: |
            cinetracker-android-0.99.7.29-discover-pointer-controller-debug.apk
            android-v099729-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android 0.99.7.29 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES='Android 0.99.7.29 remove completamente os patches de toque r199/r200 e volta à base estável r198. Descobrir usa controlador r201 com Pointer Events, captura de ponteiro somente após dominância horizontal, scrollLeft manual, clique direto nas subabas e setas de fallback em trilhos/carrosséis. Mantém desempenho mobile, autenticação isolada e toggle de Watchlist r196.'
          gh release view android-v0.99.7.29 >/dev/null 2>&1 || gh release create android-v0.99.7.29 --title "CineTracker Android 0.99.7.29 — Discover Pointer Controller" --notes "$NOTES"
          gh release edit android-v0.99.7.29 --title "CineTracker Android 0.99.7.29 — Discover Pointer Controller" --notes "$NOTES"
          gh release upload android-v0.99.7.29 cinetracker-android-0.99.7.29-discover-pointer-controller-debug.apk android-v099729-sha256.txt --clobber
