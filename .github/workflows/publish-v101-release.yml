name: Publish CineTracker v1.0.1 Release

on:
  workflow_dispatch:
  push:
    branches: [release/1.0.1]
    paths:
      - '.github/workflows/publish-v101-release.yml'

permissions:
  contents: write

concurrency:
  group: cinetracker-publish-v101-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Install signing key
        run: |
          set -euo pipefail
          test -f ~/.cinetracker/cinetracker.keystore
          mkdir -p ~/.android
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - name: Validate Web 1.0.1
        run: |
          set -euo pipefail
          node apps/web/build-r205.mjs
          grep -Fq 'r205-official-1.0.1' apps/web/dist/app-v205.js
          grep -Fq 'persistent-2x-3x-4x-no-disable' apps/web/dist/app-v205.js
          grep -Fq 'ct171RewatchMovie=async function' apps/web/dist/app-v205.js
          grep -Fq 'ct171RewatchEpisode=async function' apps/web/dist/app-v205.js
          grep -Fq 'remove-status-statistics-summary-card' apps/web/dist/app-v205.js
      - name: Prepare Android 1.0.1
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.1'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10043' apps/android/app/build.gradle
          node scripts/prepare-android-v1001.mjs
          node scripts/test-android-v1001.mjs
      - name: Build APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate and package APK
        run: |
          set -euo pipefail
          APK='apps/android/app/build/outputs/apk/debug/app-debug.apk'
          OUT='CineTracker-1.0.1.apk'
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          grep -Fq "versionName='1.0.1'" <<<"$BADGING"
          grep -Fq "versionCode='10043'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct101-index.html
          grep -Fq 'name="ct-official-version" content="1.0.1"' /tmp/ct101-index.html
          grep -Fq 'persistent-2x-3x-4x-no-disable' /tmp/ct101-index.html
          grep -Fq 'ct171RewatchMovie=async function' /tmp/ct101-index.html
          grep -Fq 'ct171RewatchEpisode=async function' /tmp/ct101-index.html
          grep -Fq 'remove-status-statistics-summary-card' /tmp/ct101-index.html
          grep -Fq 'watchlist-swap-uses-active-ct186-selected-pool' /tmp/ct101-index.html
          grep -Fq 'native-webview-horizontal-no-manual-touch' /tmp/ct101-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee CineTracker-1.0.1-SHA256.txt
          stat -c '%s' "$OUT" | tee CineTracker-1.0.1-size.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CineTracker-1.0.1
          path: |
            CineTracker-1.0.1.apk
            CineTracker-1.0.1-SHA256.txt
            CineTracker-1.0.1-size.txt
      - name: Publish GitHub Release v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          # CineTracker 1.0.1

          - Reassistir filmes com contador persistente 2x, 3x, 4x... sem limite
          - Reassistir qualquer episódio com o mesmo contador persistente
          - Remoção do card de status/estatísticas do Sports
          - Correções presentes em Web e Android
          - Preservados o pool validado de Watchlist e o scroll nativo do Top 10 no Android
          - APK Android 1.0.1 / versionCode 10043 validado por testes, aapt e apksigner
          EOF
          )
          if gh release view v1.0.1 >/dev/null 2>&1; then
            gh release upload v1.0.1 CineTracker-1.0.1.apk CineTracker-1.0.1-SHA256.txt CineTracker-1.0.1-size.txt --clobber
            gh release edit v1.0.1 --title 'CineTracker 1.0.1' --notes "$NOTES" --latest
          else
            gh release create v1.0.1 CineTracker-1.0.1.apk CineTracker-1.0.1-SHA256.txt CineTracker-1.0.1-size.txt --target "$GITHUB_SHA" --title 'CineTracker 1.0.1' --notes "$NOTES" --latest
          fi
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.0.1 --json tagName,name,isDraft,isPrerelease,url,assets > /tmp/release.json
          grep -Fq 'CineTracker-1.0.1.apk' /tmp/release.json
          grep -Fq 'CineTracker-1.0.1-SHA256.txt' /tmp/release.json
          cat /tmp/release.json
