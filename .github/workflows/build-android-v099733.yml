name: Build Android 0.99.7.33 — Native Discover Tab Grid

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'scripts/prepare-android-v099733.mjs'
      - 'scripts/test-android-v099733.mjs'
      - '.github/workflows/build-android-v099733.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099733-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099733:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.33
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r198-mobile-performance.js
          node --check apps/android/runtime-r205-discover-native-tab-grid.js
          node --check apps/web/runtime-r196-web.js
          node --check scripts/prepare-android-v099733.mjs
          node --check scripts/test-android-v099733.mjs
          node scripts/prepare-android-v099733.mjs
          node scripts/test-android-v099733.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r205-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r205 embedded JS missing');
          const js=h.slice(a+marker.length,b);
          for(const old of ['restore-route-render-and-discover-pan-x','discover-direct-tabs-manual-horizontal-scroll','pointer-capture-discover-tabs-horizontal-rails','discover-direct-pointerup-native-horizontal-carousels','discover-compact-foryou-reliable-touch-tabs','discover-three-cards-touchstart-tabs'])if(js.includes(old))throw new Error('old Discover runtime still embedded: '+old);
          fs.writeFileSync('/tmp/ct99733-prebuild.js',js);
          NODE
          node --check /tmp/ct99733-prebuild.js

      - name: Build Android 0.99.7.33 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate APK identity, native Discover grid, signing and digest
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.33-native-discover-tab-grid-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.33"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "10003"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99733-index.html
          for marker in \
            'android-v0.99.7.33-r205-discover-native-tab-grid' \
            'discover-native-tab-grid-direct-button-listeners' \
            'android-owned-grid-no-legacy-data-discover-tab' \
            'data-a33-tab' \
            'data-a33-type' \
            'ct205-tab-grid' \
            'calc((100% - 16px)/3)' \
            'detail-watchlist-toggle' \
            'mobile-first-cache-swr-progressive-render' \
            'embedded-apk-never-reloads-from-web-release-json'; do
            grep -Fq "$marker" /tmp/ct99733-index.html
          done
          for old in restore-route-render-and-discover-pan-x discover-direct-tabs-manual-horizontal-scroll pointer-capture-discover-tabs-horizontal-rails discover-direct-pointerup-native-horizontal-carousels discover-compact-foryou-reliable-touch-tabs discover-three-cards-touchstart-tabs; do
            ! grep -Fq "$old" /tmp/ct99733-index.html
          done
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/ct99733-index.html','utf8');
          const marker='<script data-ct-android="r205-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('embedded r205 JS missing');
          fs.writeFileSync('/tmp/ct99733.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99733.js
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v099733-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.33-native-discover-tab-grid-debug
          path: |
            cinetracker-android-0.99.7.33-native-discover-tab-grid-debug.apk
            android-v099733-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android 0.99.7.33 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES='Android-only fix. Discover no longer uses the legacy r180 horizontal tab rail or its data-discover-tab/data-discover-type controls. The APK renders an Android-owned 3x3 pill grid with unique data-a33 attributes and direct listeners on each button. PRA VOCE keeps Todos/Filmes/Series removed. Three cards per visible carousel and native horizontal content swipe are preserved. Web production/runtime/build remain unchanged at r196.'
          gh release view android-v0.99.7.33 >/dev/null 2>&1 || gh release create android-v0.99.7.33 --title "CineTracker Android 0.99.7.33 — Native Discover Tab Grid" --notes "$NOTES"
          gh release edit android-v0.99.7.33 --title "CineTracker Android 0.99.7.33 — Native Discover Tab Grid" --notes "$NOTES"
          gh release upload android-v0.99.7.33 cinetracker-android-0.99.7.33-native-discover-tab-grid-debug.apk android-v099733-sha256.txt --clobber
