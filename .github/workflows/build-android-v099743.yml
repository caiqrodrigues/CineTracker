name: Build Android 0.99.7.43 — Profile Posters Discover

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-099743-profile-posters-discover
    paths:
      - 'apps/android/app/build.gradle'
      - 'apps/android/runtime-r215-profile-posters-discover.js'
      - 'scripts/prepare-android-v099743.mjs'
      - 'scripts/test-android-v099743.mjs'
      - '.github/workflows/build-android-v099743.yml'
      - 'scripts/prepare-android-v099742.mjs'
      - 'apps/android/runtime-r214-discover-state-clean-captions-density.js'

permissions:
  contents: read

concurrency:
  group: cinetracker-android-v099743-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099743:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.43
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r215-profile-posters-discover.js
          node --check scripts/prepare-android-v099743.mjs
          node --check scripts/test-android-v099743.mjs
          node scripts/prepare-android-v099743.mjs
          node scripts/test-android-v099743.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r215-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r215 embedded JS missing');
          fs.writeFileSync('/tmp/ct99743-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99743-prebuild.js

      - name: Build Android 0.99.7.43 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate APK identity, runtime, signing and digest
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.43-profile-posters-discover-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.43"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "10013"
          grep -Fq "package: name='com.cinetracker.app'" <<<"$BADGING"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99743-index.html
          for marker in \
            'android-v0.99.7.43-r215-profile-posters-discover' \
            'profile-unified-collapse-poster-recovery-discover-static-tabs' \
            'main-and-sports-collapse-together-tight-gap' \
            'safe-title-type-tmdb-fallback-cache' \
            'core-click-static-3x3-no-gesture-listener' \
            'data-ct215-poster-key' \
            'grid-template-columns:repeat(3,minmax(0,1fr))' \
            'static-nine-tab-grid-original-core-click-r214-state' \
            'window.ct214SelectDiscoverTab=selectTab214' \
            'selected-tab-is-render-state-and-fetch-state' \
            "const h=wide?'40px':'34px'" \
            'min-height:36px!important' \
            'single-minimal-item-search-no-date-no-summary' \
            'cinetracker_sport_stats_v1-authority' \
            'detail-watchlist-toggle'; do
            grep -Fq "$marker" /tmp/ct99743-index.html
          done
          for forbidden in \
            '__ctAndroidR199Loaded' '__ctAndroidR200Loaded' '__ctAndroidR201Loaded' '__ctAndroidR202Loaded' \
            '__ctAndroidR203Loaded' '__ctAndroidR204Loaded' '__ctAndroidR205Loaded' \
            '__ctAndroidR209Loaded' '__ctAndroidR210Loaded' '__ctAndroidR211Loaded' '__ctAndroidR212Loaded'; do
            ! grep -Fq "$forbidden" /tmp/ct99743-index.html
          done
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/ct99743-index.html','utf8');
          const marker='<script data-ct-android="r215-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('embedded r215 JS missing');
          fs.writeFileSync('/tmp/ct99743.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99743.js
          "$APKSIGNER" verify --print-certs "$OUT"
          stat -c '%s' "$OUT" | tee android-v099743-size.txt
          sha256sum "$OUT" | tee android-v099743-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.43-profile-posters-discover-debug
          path: |
            cinetracker-android-0.99.7.43-profile-posters-discover-debug.apk
            android-v099743-sha256.txt
            android-v099743-size.txt
          if-no-files-found: error
          retention-days: 14
