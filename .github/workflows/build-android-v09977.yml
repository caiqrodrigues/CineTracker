name: Build Android 0.99.7.7 — r173 Mobile Composition

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'ci-status/android-v09977-trigger.txt'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v09977-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v09977:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Assert Web r173 remains frozen
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "r173-detail-left-window" apps/web/build-r173.mjs
          grep -Fq "detail-left-windowed-hero" apps/web/runtime-r173.js
          grep -Fq "poster-title-meta-synopsis-actions-left-window" apps/web/runtime-r173.js

      - name: Prepare Android 0.99.7.7 mobile composition
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-android-v09977.mjs
          node scripts/test-android-v09977.mjs

      - name: Build Android 0.99.7.7 APK
        working-directory: apps/android
        shell: bash
        run: gradle assembleDebug --stacktrace

      - name: Validate APK identity, embedded JS and mobile composition
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.7-r173-mobile-composition-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          PACKAGE="$($AAPT dump badging "$OUT" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.99.7.7"
          test "$VERSION_CODE" = "9977"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct9977-index.html
          python3 - <<'PY'
          from pathlib import Path
          h=Path('/tmp/ct9977-index.html').read_text()
          marker='<script data-ct-android="r173-js">'
          a=h.index(marker)+len(marker)
          b=h.index('</script>',a)
          js=h[a:b]
          assert 'const $$=(s,r=document)=>' in js
          assert js.count('const $=(s,r=document)=>') == 1
          assert 'stacked-hero-readable-carousels-phone-panels' in h
          assert '.ct169-detail-hero.ct173-detail-window{display:block!important' in h
          assert '.ct169-related-card{flex:0 0 min(43vw,164px)!important' in h
          Path('/tmp/ct9977-embedded.js').write_text(js)
          PY
          node --check /tmp/ct9977-embedded.js
          for marker in \
            'android-v0.99.7.7-r173-mobile-composition' \
            'web-r173-full-functional-parity' \
            'r173-detail-left-window' \
            'phone-framed-carousels-scroll-snap' \
            'stacked-hero-readable-carousels-phone-panels' \
            'Top 10' \
            'Onde Assistir' \
            'Títulos Relacionados' \
            'Assistido por dia' \
            'window.ct48Back'; do
              grep -Fq "$marker" /tmp/ct9977-index.html
          done
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v09977-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.7-r173-mobile-composition-debug
          path: |
            cinetracker-android-0.99.7.7-r173-mobile-composition-debug.apk
            android-v09977-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android 0.99.7.7 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Android 0.99.7.7 mantém a Web r173 congelada e faz uma segunda adaptação visual baseada no smoke real em vídeo: hero de filme/série empilhado e legível, cards e painéis dimensionados para telefone, carrosséis mostrando cerca de 2–2,5 itens por viewport, Onde Assistir maior, drawer de episódios mais legível, Home/Perfil/Esportes refinados e gráficos com scroll local. Mantém integralmente a paridade funcional e o bootfix anteriores.'
          gh release view android-v0.99.7.7 >/dev/null 2>&1 || gh release create android-v0.99.7.7 --title "CineTracker Android 0.99.7.7 — r173 Mobile Composition" --notes "$NOTES"
          gh release edit android-v0.99.7.7 --title "CineTracker Android 0.99.7.7 — r173 Mobile Composition" --notes "$NOTES"
          gh release upload android-v0.99.7.7 cinetracker-android-0.99.7.7-r173-mobile-composition-debug.apk android-v09977-sha256.txt --clobber
