name: Build Android 0.99.7.7 — r173 Mobile Composition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci-status/android-v09977-trigger.txt'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v09977-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v09977:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Historical rebuild only
        shell: bash
        run: |
          node scripts/prepare-android-v09977.mjs
          node scripts/test-android-v09977.mjs
          cd apps/android && gradle assembleDebug --stacktrace
