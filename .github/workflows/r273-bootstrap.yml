name: Bootstrap Web 1.0.64 r273 Validation

on:
  push:
    branches: ['fix/r273-history-flex-validation']

permissions:
  contents: write

jobs:
  validate_r273:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Materialize r273 implementation and documentation
        env:
          R273_PAYLOAD: 
        run: |
          set -euo pipefail
          printf '%s' "$R273_PAYLOAD" | base64 -d > /tmp/r273.tar.gz
          tar -xzf /tmp/r273.tar.gz -C .
          python - <<'PY2'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          text=p.read_text(encoding='utf-8')
          marker='## 1.0.64 — 2026-09-14 — Web r273'
          if marker not in text:
              intro='# Changelog\n\nMudanças relevantes do CineTracker. A partir da 1.0.0, esta é a baseline oficial; detalhes históricos completos da linha 0.x permanecem preservados no histórico Git e nos documentos de `docs/releases/`.\n\n'
              entry='## 1.0.64 — 2026-09-14 — Web r273\n\n### Home / Histórico restaurado\n- `renderHome` passa a consultar diretamente `cinetracker_profile_home_payload_v0997_r5(p_today)` e valida `series`, `movie_watchlist`, `history_episodes` e `history_movies` antes de aceitar o estado como autoritativo. Payload incompleto deixa de ser interpretado como Histórico vazio.\n- `Histórico recente` volta a ser a primeira seção de Séries e `Filmes vistos` a primeira seção de Filmes. Durante a consulta, a UI exibe `Carregando histórico…`; os estados vazios só podem aparecer depois de uma resposta canônica válida do Supabase.\n- Cada item do Histórico recebe ação de desfazer: episódios usam `cinetracker_unmark_episode_v1` e filmes usam `cinetracker_unmark_media_seen_v1`; a Home recarrega o r5 após a alteração.\n- O payload r5 foi conferido diretamente no Supabase com dados reais de Histórico disponíveis nas duas coleções.\n\n### Home / layout horizontal estrito\n- Cards da Home passam a usar `display:flex`, `flex-direction:row`, `flex-wrap:nowrap`, conteúdo esquerdo com `min-width:0`/`flex:1` e ação fixa de 40×40 px à extrema direita.\n- O `✓` passa a ser um `<button>` real dentro da própria linha, com `flex:0 0 40px` e `position:static`, impedindo quebra para baixo em mobile ou desktop.\n\n### Build / validação\n- Web atualizada para `1.0.64 / r273-official-1.0.64`; Android permanece `1.0.20 / versionCode 10062`.\n- Build oficial: `apps/web/build-r273-official.mjs`; regressões: `test-r273.mjs`, `test-r273-browser.mjs` e `scripts/test-r273-exact-bundle-browser.mjs`.\n- Chromium valida 420 px e 1200 px, Histórico real, ausência de falso vazio, desfazer episódio/filme, `flex-row` sem wrap, botão 40×40 à direita, 500 mutações e 100 cliques sem congelamento.\n- Descobrir, detalhes/scroll e Sports/F1 permanecem preservados da r272.\n\n'
              if not text.startswith(intro):
                  raise SystemExit('CHANGELOG intro inesperado')
              p.write_text(intro+entry+text[len(intro):],encoding='utf-8')
          PY2
          git config user.name 'CineTracker Validation'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json apps/web/package.json README.md CHANGELOG.md apps/web/build-r273.mjs apps/web/build-r273-official.mjs apps/web/test-r273.mjs apps/web/test-r273-browser.mjs scripts/test-r273-exact-bundle-browser.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'test: stage Web 1.0.64 r273 validation candidate'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version and documentation identity
        run: |
          set -euo pipefail
          grep -Fq '"version": "1.0.64"' package.json
          grep -Fq '"version": "1.0.64"' apps/web/package.json
          grep -Fq 'build-r273-official.mjs' apps/web/package.json
          grep -Fq '## 1.0.64 — 2026-09-14 — Web r273' CHANGELOG.md
          grep -Fq 'Web 1.0.64 / r273' README.md
      - name: Syntax r273 release chain
        run: |
          set -euo pipefail
          node --check apps/web/build-r273.mjs
          node --check apps/web/build-r273-official.mjs
          node --check apps/web/test-r273.mjs
          node --check apps/web/test-r273-browser.mjs
          node --check scripts/test-r273-exact-bundle-browser.mjs
      - name: Build official r273
        working-directory: apps/web
        run: node build-r273-official.mjs
      - name: Static regressions r273
        working-directory: apps/web
        run: node test-r273.mjs
      - name: Chromium Home history and flex-row regression r273
        working-directory: apps/web
        run: node test-r273-browser.mjs
      - name: Exact final bundle boot r273
        run: node scripts/test-r273-exact-bundle-browser.mjs
      - name: Final bundle identity r273
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --check dist/app-v273.js
          grep -Fq "window.__ctWebBuild='1.0.64';window.__ctOfficialVersion='1.0.64';" dist/app-v273.js
          grep -Fq "const REVISION='r273-official-1.0.64';" dist/app-v273.js
          grep -Fq "window.__ctR273='home-r5-direct+history-undo+strict-flex-row'" dist/app-v273.js
          grep -Fq "async function ct273FetchHome(){return ct273NormalizeHomePayload(await rpc('cinetracker_profile_home_payload_v0997_r5'" dist/app-v273.js
          grep -Fq "rpc('cinetracker_unmark_episode_v1'" dist/app-v273.js
          grep -Fq "rpc('cinetracker_unmark_media_seen_v1'" dist/app-v273.js
          grep -Fq 'paintHome=ct273PaintHome;renderHome=ct273RenderHome;' dist/app-v273.js
          ! grep -Fq "rpc('cinetracker_home_live_v0997_r3'" dist/app-v273.js
          grep -Fq '"home_history_direct_fetch": true' dist/release.json
          grep -Fq '"home_history_undo": true' dist/release.json
          grep -Fq '"home_card_layout": "flex-row-nowrap"' dist/release.json
          grep -Fq '"android": "1.0.20/10062"' dist/release.json
          grep -Fq "const CACHE='ct-web-1.0.64-r273';" dist/service-worker.js
      - name: Preserve Android baseline
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.0.20'" apps/android/app/build.gradle
          grep -Fq 'versionCode 10062' apps/android/app/build.gradle
