name: Build Android 0.99.6

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/web-android-0.99.6-authoritative
    paths:
      - 'ci-status/android-v0996-trigger.txt'

permissions:
  contents: write

concurrency:
  group: cinetracker-android-v0996-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v0996:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then
            keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"
          fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Build verified Web 0.99.6 runtime
        run: |
          set -euo pipefail
          npm run build
          grep -q 'patch-v116-v0996-authoritative.js' dist/index.html
          grep -q 'ct-web-0.99.6' dist/service-worker.js
          grep -q 'v116-profile-discover-single-authority' dist/patch-v116-v0996-authoritative.js
      - name: Prepare exact embedded Android 0.99.6 runtime
        run: |
          set -euo pipefail
          node scripts/prepare-android-v0996.mjs
          node scripts/test-android-v0996.mjs
      - name: Build Android 0.99.6 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
      - name: Validate APK identity, runtime and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.6-debug.apk"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          PACKAGE="$($AAPT dump badging "$OUT" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$($AAPT dump badging "$OUT" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.cinetracker.app"
          test "$VERSION" = "0.99.6"
          test "$VERSION_CODE" = "9960"
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'android-v0.99.6-authoritative-preload'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'v116-profile-discover-single-authority'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'cinetracker_profile_payload_v0996'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'ct0996_discover_snapshot_v1'
          unzip -p "$OUT" assets/hotfix5/index.html | grep -q 'data-ct114-rewatch'
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee android-v0996-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.6-debug
          path: |
            cinetracker-android-0.99.6-debug.apk
            android-v0996-sha256.txt
          if-no-files-found: error
      - name: Publish Android 0.99.6 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Android 0.99.6: mesma árvore funcional da Web 0.99.6 embutida; Perfil/Descobrir autoritativos, preload/cache compartilhado, favoritos de mídias e atores, detalhe universal, episódios/revistos, gráfico de temporada, busca e filtros.'
          gh release view android-v0.99.6 >/dev/null 2>&1 || gh release create android-v0.99.6 --title "CineTracker Android 0.99.6" --notes "$NOTES"
          gh release edit android-v0.99.6 --title "CineTracker Android 0.99.6" --notes "$NOTES"
          gh release upload android-v0.99.6 cinetracker-android-0.99.6-debug.apk android-v0996-sha256.txt --clobber
