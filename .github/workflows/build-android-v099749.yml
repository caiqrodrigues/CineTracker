name: Build Android 0.99.7.49

on:
  workflow_dispatch:
  push:
    branches:
      - 099749-fixes
    paths:
      - 'apps/android/runtime-r221-rewatch-favorites-sports.js'
      - 'apps/android/app/build.gradle'
      - 'scripts/prepare-android-v099749.mjs'
      - 'scripts/test-android-v099749.mjs'
      - '.github/workflows/build-android-v099749.yml'

permissions:
  contents: read

concurrency:
  group: cinetracker-android-v099749-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.49
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r221-rewatch-favorites-sports.js
          node --check scripts/prepare-android-v099749.mjs
          node --check scripts/test-android-v099749.mjs
          node scripts/prepare-android-v099749.mjs
          node scripts/test-android-v099749.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r221-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r221 embedded JS missing');
          fs.writeFileSync('/tmp/ct99749-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99749-prebuild.js

      - name: Build Android APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate Android APK
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="cinetracker-android-0.99.7.49-rewatch-favorites-sports-debug.apk"
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.49"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "10019"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99749-index.html
          for marker in \
            'android-v0.99.7.49-r221-rewatch-favorites-sports' \
            'r214-selector-ticket-r217-authoritative-render' \
            'r217-library-behavior-no-r219-synthetic-fallback' \
            'persistent-2x-3x-4x-no-disable' \
            'view-more-opens-movie-series-person' \
            'remove-status-statistics-summary-card' \
            'data-ct221-open-media' \
            'data-ct221-open-person' \
            'btn.textContent=playLabel221(plays);btn.disabled=false;' \
            'overflow-x:auto!important'; do
            grep -Fq "$marker" /tmp/ct99749-index.html
          done
          ! grep -Fq 'ct219-manual-cover' /tmp/ct99749-index.html
          ! grep -Fq 'negative-id-resolve-or-local-detail' /tmp/ct99749-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          stat -c '%s' "$OUT" | tee android-v099749-size.txt
          sha256sum "$OUT" | tee android-v099749-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.49
          path: |
            cinetracker-android-0.99.7.49-rewatch-favorites-sports-debug.apk
            android-v099749-sha256.txt
            android-v099749-size.txt
          if-no-files-found: error
          retention-days: 14
