name: Bootstrap Web Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import approved CineTracker Web 0.2.0
        run: |
          mkdir -p apps/web
          curl --fail --location --silent --show-error 'https://27pmbigc9eus52009te348gm80kzjcp5.pastehtml.dev/' -o apps/web/index.html
          grep -q 'CineTracker Oficial v0.2.0' apps/web/index.html
          grep -q 'tmdb-proxy' apps/web/index.html
          grep -qi 'watchlist' apps/web/index.html
          test $(wc -c < apps/web/index.html) -gt 50000
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat(web): import approved CineTracker Web 0.2.0'
          git push
