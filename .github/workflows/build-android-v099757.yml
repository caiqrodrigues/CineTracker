name: Build Android 0.99.7.57

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/android/runtime-r229-discover-swap-top10-pointer.js'
      - 'apps/android/app/build.gradle'
      - 'scripts/prepare-android-v099757.mjs'
      - 'scripts/test-android-v099757.mjs'
      - '.github/workflows/build-android-v099757.yml'

permissions:
  contents: read

concurrency:
  group: cinetracker-android-v099757-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare and test Android 0.99.7.57
        run: |
          set -euo pipefail
          node --check apps/android/runtime-r229-discover-swap-top10-pointer.js
          node --check scripts/prepare-android-v099757.mjs
          node --check scripts/test-android-v099757.mjs
          node scripts/prepare-android-v099757.mjs
          node scripts/test-android-v099757.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('apps/android/app/src/main/assets/hotfix5/index.html','utf8');
          const marker='<script data-ct-android="r229-android-js">',a=h.indexOf(marker),b=h.indexOf('</script>',a+marker.length);
          if(a<0||b<a)throw new Error('r229 embedded JS missing');
          fs.writeFileSync('/tmp/ct99757-prebuild.js',h.slice(a+marker.length,b));
          NODE
          node --check /tmp/ct99757-prebuild.js

      - name: Build Android APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace

      - name: Validate Android APK
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="CineTracker-0.99.7.57.apk"
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          test "$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "0.99.7.57"
          test "$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)" = "10027"
          unzip -p "$OUT" assets/hotfix5/index.html > /tmp/ct99757-index.html
          for marker in \
            'android-v0.99.7.56-r228-discover-swap-top10-gesture' \
            'android-v0.99.7.57-r229-discover-swap-top10-pointer' \
            'direct-button-listeners-official-index-plus-fallback' \
            'pointer-capture-horizontal-scrollleft' \
            'disable-r227-r228-stale-gesture-authorities' \
            'android-only-web-r203-untouched' \
            'data-ct229-swap' \
            'data-ct229-swipe' \
            "clone.addEventListener('pointerup'" \
            "row.addEventListener('pointermove'" \
            'setPointerCapture' \
            'applyDrag229(row,s.left,dx)' \
            'data-ct227-swap-disabled-r229' \
            'data-ct228-swap-disabled-r229' \
            'optimistic-immediate-remove-next-card-background-sync' \
            'detail-seen-toggle-reversible-via-unmark-rpc' \
            'discover-filter-right-of-search' \
            'single-row-compact-auto-width-28px-pills' \
            'r217-library-behavior-no-r219-synthetic-fallback'; do
            grep -Fq "$marker" /tmp/ct99757-index.html
          done
          ! grep -Fq 'ct219-manual-cover' /tmp/ct99757-index.html
          ! grep -Fq 'negative-id-resolve-or-local-detail' /tmp/ct99757-index.html
          "$APKSIGNER" verify --print-certs "$OUT"
          stat -c '%s' "$OUT" | tee android-v099757-size.txt
          sha256sum "$OUT" | tee android-v099757-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-0.99.7.57
          path: |
            CineTracker-0.99.7.57.apk
            android-v099757-sha256.txt
            android-v099757-size.txt
          if-no-files-found: error
          retention-days: 14
