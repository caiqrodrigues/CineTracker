name: Diagnose r306 Chromium

on:
  push:
    branches: ['fix/r306-final-canonical']

permissions:
  contents: read

jobs:
  browser_debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build r306 and capture Chromium output
        working-directory: apps/web
        run: |
          set +e
          node build-r306.mjs > r306-browser-debug.txt 2>&1
          BUILD_CODE=$?
          node - <<'NODE' >> r306-browser-debug.txt 2>&1
          const fs=require('fs');
          const s=fs.readFileSync('dist/app-v306.js','utf8');
          for(const needle of ['const $=','const $$=','const txt=','const norm=','const esc=']){
            const hits=[];let i=-1;while((i=s.indexOf(needle,i+1))>=0)hits.push(i);
            console.log('SCAN',JSON.stringify(needle),'COUNT',hits.length,'HITS',hits.join(','));
            for(const p of hits)console.log('CTX',p,s.slice(Math.max(0,p-180),Math.min(s.length,p+260)).replace(/\n/g,'\\n'));
          }
          NODE
          node test-r306-browser.mjs >> r306-browser-debug.txt 2>&1
          TEST_CODE=$?
          echo "BUILD_CODE=$BUILD_CODE" >> r306-browser-debug.txt
          echo "TEST_CODE=$TEST_CODE" >> r306-browser-debug.txt
          exit 0
      - name: Upload Chromium diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: r306-browser-debug
          path: apps/web/r306-browser-debug.txt
          if-no-files-found: error
          retention-days: 1
