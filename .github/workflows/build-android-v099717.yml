name: Build Android 0.99.7.17 — r181 Season Toggle (archived)

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: cinetracker-android-v099717-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_v099717:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Restore CineTracker signing key
        uses: actions/cache@v4
        with:
          path: ~/.cinetracker/cinetracker.keystore
          key: cinetracker-signing-v2
      - name: Initialize signing key when cache is empty
        run: |
          mkdir -p ~/.cinetracker ~/.android
          if [ ! -f ~/.cinetracker/cinetracker.keystore ]; then keytool -genkeypair -v -keystore ~/.cinetracker/cinetracker.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineTracker Android,O=CineTracker,C=BR"; fi
          cp ~/.cinetracker/cinetracker.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare archived Android 0.99.7.17 with Web r181
        run: |
          node scripts/test-r176-gap-logic.mjs
          node scripts/test-r180-discover-profile.mjs
          node scripts/test-r181-season-toggle.mjs
          node scripts/prepare-android-v099717.mjs
          node scripts/test-android-v099717.mjs
      - name: Build Android 0.99.7.17 APK
        working-directory: apps/android
        run: gradle assembleDebug --stacktrace
