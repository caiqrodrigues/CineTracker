    return lines.slice(1).map(line => { const vals = parse(line), o = {}; headers.forEach((h, i) => o[h] = vals[i] ?? ''); return o; });
}
function recordsFromJson(value) {
    if (Array.isArray(value))
        return value;
    if (!value || typeof value !== 'object')
        return [];
    for (const key of ['items', 'media', 'movies', 'shows', 'entries', 'watchlist', 'history', 'data'])
        if (Array.isArray(value[key]))
            return value[key];
    const arrays = Object.values(value).filter(Array.isArray);
    return arrays.sort((a, b) => b.length - a.length)[0] || [];
}
async function readImportFile(file) {
    if (file.name.toLowerCase().endsWith('.json'))
        return recordsFromJson(JSON.parse(await file.text()));
    if (!file.name.toLowerCase().endsWith('.zip'))
        throw new Error('Use um arquivo .json ou .zip');
    const files = await unzipTextFiles(await file.arrayBuffer());
    const all = [];
    for (const entry of files) {
        try {
            if (entry.name.toLowerCase().endsWith('.json'))
                all.push(...recordsFromJson(JSON.parse(entry.text)));
            else if (entry.name.toLowerCase().endsWith('.csv'))
                all.push(...parseCsv(entry.text));
        }
        catch { }
    }
    if (!all.length)
        throw new Error('Nenhum JSON/CSV legível encontrado dentro do ZIP.');
    return all;
}
async function runImport() {
    if (!ctSession?.access_token) {
        toast('Faça login para importar.');
        return;
    }
    const btn = document.querySelector('#confirm-import');
    if (btn) {
        btn.disabled = true;
        btn.textContent = 'Importando…';
    }
    try {
        const normalized = importRecords.map((x, i) => ({ source_index: i, source_payload: x, title: String(x.title || x.name || x.nome || '').trim(), media_type: String(x.mediaType || x.type || x.tipo || '').toLowerCase(), release_year: Number(x.year || x.releaseYear || x.ano || 0) || null, imported_states: [String(x.state || x.status || x.list || x.lista || (x.watched ? 'AlreadySeen' : x.completed ? 'Completed' : x.watchlist ? 'AddedToWatchlist' : '')).trim()].filter(Boolean) }));
        const importIdRaw = await sbRpc('cinetracker_create_import', { p_filename: importFilename, p_file_type: importFileType, p_summary: { source: 'web' }, p_items: normalized });
        const importId = Array.isArray(importIdRaw) ? importIdRaw[0] : importIdRaw;
        const pending = await sbApi(`import_items?import_id=eq.${importId}&select=id,title,media_type,release_year,imported_states&order=id.asc`);
        let matched = 0, unmatched = 0;
        for (let i = 0; i < pending.length; i++) {
            const row = pending[i];
            const status = document.querySelector('#import-status');
            if (status)
                status.textContent = `Importando ${i + 1} de ${pending.length}…`;
            if (!row.title) {
                await sbRpc('cinetracker_resolve_import_item', { p_item_id: row.id, p_media_id: null, p_status: 'unmatched' });
                unmatched++;
                continue;
            }
            const typeHint = String(row.media_type || '').includes('movie') || String(row.media_type || '').includes('filme') ? 'movie' : String(row.media_type || '').includes('anime') || String(row.media_type || '').includes('serie') || String(row.media_type || '').includes('série') ? 'tv' : '';
            const found = await tmdbFetch({ mode: 'lookup', title: row.title, type: typeHint, year: row.release_year || '' }).catch(() => null);
            const m = found?.result;
            if (!m) {
                await sbRpc('cinetracker_resolve_import_item', { p_item_id: row.id, p_media_id: null, p_status: 'unmatched' });
                unmatched++;
                continue;
            }
            const mediaIdRaw = await sbRpc('cinetracker_upsert_media', { p_tmdb_id: m.id, p_media_type: m.mediaType, p_media_kind: m.mediaKind, p_title: m.title, p_release_year: m.year || null, p_poster_path: m.posterPath || null, p_genres: m.genres || [], p_raw_tmdb: m });
            const mediaId = Array.isArray(mediaIdRaw) ? mediaIdRaw[0] : mediaIdRaw;
            await sbRpc('cinetracker_resolve_import_item', { p_item_id: row.id, p_media_id: mediaId, p_status: 'matched' });
            for (const rawState of row.imported_states || []) {
                const k = String(rawState).toLowerCase().replace(/[ _-]/g, '');
                const state = k.includes('watchlist') ? 'AddedToWatchlist' : k.includes('complete') || k.includes('conclu') ? 'Completed' : k.includes('watch') || k.includes('seen') || k.includes('assist') ? 'AlreadySeen' : k.includes('progress') ? 'InProgress' : null;
                if (state)
                    await sbRpc('cinetracker_apply_import_state', { p_import_id: importId, p_media_id: mediaId, p_state: state });
            }
            matched++;
        }
        await sbRpc('cinetracker_finalize_import', { p_import_id: importId });
        toast(`Importação concluída: ${matched} encontrados, ${unmatched} para revisão.`);
        importRecords = [];
        importFilename = '';
        await loadCloudState();
        render();
    }
    catch (error) {
        toast(error instanceof Error ? error.message : 'Falha na importação');
        if (btn) {
            btn.disabled = false;
            btn.textContent = 'Importar para o banco';
        }
    }
}
async function primeOfficialSuggestions() {
    const types = ['FILME', 'SÉRIE', 'ANIME'];
    for (let slot = 0; slot < types.length; slot++) {
        const type = types[slot];
        const remoteIndexes = await fetchMoreSuggestions(type);
        const candidate = remoteIndexes.map(i => ({ i, item: media[i] })).find(x => x.item && !seenMedia.has(x.item.id) && !watchlist.has(x.item.id) && !permanentRecommendationHistory.has(x.item.id));
        if (candidate) {
            suggestionSlots[slot] = candidate.i;
            suggestionHistory.add(candidate.item.id);
            void persistRecommendation(candidate.item, 'outside', `slot-${slot}`);
        }
    }
}

async function hydrateMediaDetails() {
    const cards = Array.from(document.querySelectorAll('.card[data-media-id]'));
    await Promise.all(cards.map(async (card) => {
        const mediaId = card.dataset.mediaId || '';
        const item = mediaRegistry.get(mediaId);
        if (!item)
            return;
        const hasPersonIds = item.actors.some((actor) => Boolean(normalizeActor(actor).id));
        if (item.posterUrl && hasPersonIds) {
            applyMediaDetailsToCard(card, item);
            return;
        }
        try {
            const title = item.lookupTitle || item.title;
            const response = await Promise.resolve({ ok: true, json: async () => await tmdbFetch({ mode: 'lookup', title, type: mediaApiType(item), year: item.year }) });
            const data = await response.json();
            if (!response.ok || !data.result)
                return;
            const source = data.result;
            item.posterUrl = source.posterUrl || item.posterUrl || null;
            item.tmdbId = Number(source.id) || item.tmdbId;
            item.apiType = source.mediaType === 'movie' ? 'movie' : 'tv';
            if (Array.isArray(source.actors) && source.actors.length)
                item.actors = source.actors;
            if (Array.isArray(source.genres) && source.genres.length)
                item.genres = source.genres;
            if (source.availability) {
                item.availability = source.availability;
                availabilityCache.set(item.id, source.availability);
            }
            applyMediaDetailsToCard(card, item);

async function hydrateAvailability() {
    const elements = Array.from(document.querySelectorAll('.js-availability'));
    await Promise.all(elements.map(async (element) => {
        const mediaId = element.dataset.mediaId || '';
        const cached = availabilityCache.get(mediaId);
        if (cached) {
            applyAvailabilityToElement(element, cached);
            return;
        }
        const title = element.dataset.lookupTitle || '';
        const year = element.dataset.year || '';
        const apiType = element.dataset.apiType || 'tv';
        if (!title)
            return;
        try {
            const response = await Promise.resolve({ ok: true, json: async () => await tmdbFetch({ mode: 'lookup', title, type: apiType, year }) });
            const data = await response.json();
            if (!response.ok || !data.result?.availability)
                throw new Error(data.error || 'Disponibilidade indisponível');
            const availability = data.result.availability;
            availabilityCache.set(mediaId, availability);
            const item = mediaRegistry.get(mediaId);
            if (item)
                item.availability = availability;
            applyAvailabilityToElement(element, availability);
        }
        catch {
            element.innerHTML = '<strong>Onde assistir:</strong><span>Não foi possível consultar agora.</span><small>Disponibilidade: JustWatch via TMDB</small>';
        }
    }));
}
function applyAvailabilityToElement(element, availability) {
    const rows = [];
    if (availability.streaming?.length)
        rows.push(`<span><b>Streaming:</b> ${availability.streaming.map(escapeHtml).join(', ')}</span>`);
    if (!rows.length)
        rows.push('<span>Sem disponibilidade informada no Brasil.</span>');
    const link = availability.link ? `<a href="${escapeHtml(availability.link)}" target="_blank" rel="noopener noreferrer">ver opções</a>` : '';
    element.innerHTML = `<strong>Onde assistir:</strong>${rows.join('')}${link}<small>Disponibilidade: JustWatch via TMDB</small>`;

function bindMediaActions() {
    document.querySelectorAll('.js-seen').forEach((button) => button.addEventListener('click', async () => {
        const id = button.dataset.mediaId || '';
        const title = button.dataset.title || 'Título';
        const item = mediaRegistry.get(id);
        if (!item)
            return;
        const wasSeen = seenMedia.has(id);
        if (wasSeen)
            seenMedia.delete(id);
        else
            seenMedia.add(id);
        render();
        try {
            await persistState(item, 'AlreadySeen', wasSeen);
            toast(wasSeen ? `${title} removido de Já vistos.` : `${title} marcado como já visto e salvo.`);
        }
        catch (error) {
            if (wasSeen)
                seenMedia.add(id);
            else
                seenMedia.delete(id);
            render();
            toast(error instanceof Error ? error.message : 'Não foi possível salvar.');
        }
    }));
    document.querySelectorAll('.js-watchlist').forEach((button) => button.addEventListener('click', async () => {
        const id = button.dataset.mediaId || '';
        const title = button.dataset.title || 'Título';
        const item = mediaRegistry.get(id);
        if (!item)
            return;
        const wasIn = watchlist.has(id);
        if (wasIn)
            watchlist.delete(id);
        else
            watchlist.add(id);
        render();
        try {
            await persistState(item, 'AddedToWatchlist', wasIn);
            toast(wasIn ? `${title} removido da Watchlist.` : `${title} adicionado à Watchlist e salvo.`);
        }
        catch (error) {
            if (wasIn)
                watchlist.add(id);
            else
                watchlist.delete(id);
            render();
            toast(error instanceof Error ? error.message : 'Não foi possível salvar.');
        }
    }));

        }
