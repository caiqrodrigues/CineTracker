<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070a"><title>CineTracker</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><style>html,body{margin:0;width:100%;height:100%;background:#05070a;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#legacy{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05070a}.settings-backdrop{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:9999}.settings-backdrop.hidden{display:none}.settings-card{width:min(720px,100%);max-height:90vh;overflow:auto;background:#09111b;border:1px solid #194a78;border-radius:18px;box-shadow:0 20px 80px #000b;padding:22px}.settings-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.settings-head h1{font-size:22px;margin:0}.close{border:1px solid #315477;background:#101b28;color:#fff;border-radius:10px;width:36px;height:36px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:7px;font-size:13px;color:#b9c8d8}.field.full{grid-column:1/-1}.field input,.field select{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #304c68;border-radius:11px;background:#060b11;color:#fff;font:inherit}.field input:focus,.field select:focus{outline:none;border-color:#4da3ff}.note{grid-column:1/-1;padding:11px 12px;border:1px solid #173b63;border-radius:11px;background:#0a1725;color:#9db6cf;font-size:12px;line-height:1.45}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.primary{border:1px solid #4da3ff;background:#2f80ed;color:#fff;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.status{min-height:18px;margin-top:10px;font-size:12px;color:#9fc7ee}.danger{color:#ff9d9d}@media(max-width:650px){.grid{grid-template-columns:1fr}.field.full,.note{grid-column:auto}.settings-card{padding:17px}}</style></head><body><iframe id="legacy" src="/legacy.html" title="CineTracker"></iframe><div id="settings" class="settings-backdrop hidden"><section class="settings-card"><div class="settings-head"><div><div style="color:#4da3ff;font-size:12px;font-weight:800;letter-spacing:.06em">CINETRACKER</div><h1 id="settings-title">Conta e configurações</h1></div><button id="close-settings" class="close" type="button">×</button></div><form id="settings-form"><div class="grid"><label class="field"><span id="label-name">Nome do perfil</span><input id="profile-name" maxlength="60" required></label><label class="field"><span id="label-language">Idioma</span><select id="profile-language"><option value="pt-BR">Português (Brasil)</option><option value="en">English</option></select></label><label class="field"><span>E-mail</span><input id="profile-email" type="email" required></label><label class="field"><span id="label-phone">Telefone</span><input id="profile-phone" type="tel" placeholder="+55 11 99999-9999"></label><div id="settings-note" class="note">Mudanças de e-mail ou telefone podem exigir uma nova confirmação pelo Supabase. Nome e idioma ficam vinculados à sua conta e serão compartilhados com o Android.</div></div><div class="actions"><button id="save-settings" class="primary" type="submit">Salvar configurações</button></div><div id="settings-status" class="status"></div></form></section></div><script>"use strict";const SUPABASE_URL='https://pjmkxryboypluleuuupp.supabase.co';const SUPABASE_KEY='sb_publishable_UERbQXkZk4rnnu6Y8XJSgw_vcZd_V_Q';const frame=document.querySelector('#legacy');const modal=document.querySelector('#settings');const form=document.querySelector('#settings-form');let reinjectTimer=0;function session(){try{return JSON.parse(localStorage.getItem('cinetracker_session')||'null')}catch{return null}}function user(){return session()?.user||null}function displayName(){const u=user();return u?.user_metadata?.display_name||u?.user_metadata?.name||u?.email?.split('@')[0]||'Usuário'}function currentLang(){return user()?.user_metadata?.language||'pt-BR'}function setStatus(message,error=false){const el=document.querySelector('#settings-status');el.textContent=message||'';el.classList.toggle('danger',!!error)}function openSettings(){const u=user();document.querySelector('#profile-name').value=displayName();document.querySelector('#profile-language').value=currentLang();document.querySelector('#profile-email').value=u?.email||'';document.querySelector('#profile-phone').value=u?.phone||'';setStatus('');modal.classList.remove('hidden');translateSettings()}function closeSettings(){modal.classList.add('hidden')}document.querySelector('#close-settings').addEventListener('click',closeSettings);modal.addEventListener('click',e=>{if(e.target===modal)closeSettings()});function translateSettings(){const en=document.querySelector('#profile-language').value==='en';document.documentElement.lang=en?'en':'pt-BR';document.querySelector('#settings-title').textContent=en?'Account & settings':'Conta e configurações';document.querySelector('#label-name').textContent=en?'Profile name':'Nome do perfil';document.querySelector('#label-language').textContent=en?'Language':'Idioma';document.querySelector('#label-phone').textContent=en?'Phone':'Telefone';document.querySelector('#save-settings').textContent=en?'Save settings':'Salvar configurações';document.querySelector('#settings-note').textContent=en?'Email or phone changes may require a new Supabase confirmation. Name and language are linked to your account and will be shared with Android.':'Mudanças de e-mail ou telefone podem exigir uma nova confirmação pelo Supabase. Nome e idioma ficam vinculados à sua conta e serão compartilhados com o Android.'}document.querySelector('#profile-language').addEventListener('change',translateSettings);async function updateAccount(payload){const s=session();if(!s?.access_token)throw new Error('Sessão não encontrada. Entre novamente.');const r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{method:'PUT',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${s.access_token}`,'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||'Falha ao atualizar a conta');s.user=d;localStorage.setItem('cinetracker_session',JSON.stringify(s));return d}form.addEventListener('submit',async e=>{e.preventDefault();const s=session(),u=s?.user;if(!u){setStatus('Faça login novamente.',true);return}const display_name=document.querySelector('#profile-name').value.trim();const language=document.querySelector('#profile-language').value;const email=document.querySelector('#profile-email').value.trim();const phone=document.querySelector('#profile-phone').value.trim();const payload={data:{...(u.user_metadata||{}),display_name,language}};if(email&&email!==u.email)payload.email=email;if(phone!==(u.phone||''))payload.phone=phone||null;try{setStatus(language==='en'?'Saving…':'Salvando…');await updateAccount(payload);setStatus(language==='en'?'Settings saved.':'Configurações salvas.');applyToFrame()}catch(err){setStatus(err instanceof Error?err.message:'Falha ao salvar',true)}});function replaceText(root,from,to){const walker=root.createTreeWalker(root.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){if(n.nodeValue&&n.nodeValue.includes(from))n.nodeValue=n.nodeValue.replaceAll(from,to)}}function applyLanguage(doc){if(currentLang()!=='en')return;const map=[['Hoje','Today'],['Biblioteca','Library'],['Descobrir','Discover'],['Importar','Import'],['Estatísticas','Stats'],['Seu universo de mídia','Your media universe'],['Perfil principal','Main profile'],['Sair','Sign out'],['MENU DIÁRIO','DAILY MENU'],['O que vamos assistir hoje?','What are we watching today?'],['Continuar assistindo','Continue watching'],['Da sua Watchlist','From your Watchlist'],['Fora da lista','Outside your list'],['Gerar novo menu','Generate new menu']];for(const [a,b] of map)replaceText(doc,a,b)}function injectSettingsButtons(doc){const side=doc.querySelector('.sidebar .nav');if(side&&!side.querySelector('[data-ct-settings]')){const b=doc.createElement('button');b.type='button';b.dataset.ctSettings='1';b.textContent=currentLang()==='en'?'⚙ Settings':'⚙ Configurações';b.addEventListener('click',openSettings);side.appendChild(b)}const mobile=doc.querySelector('.mobile-nav');if(mobile&&!mobile.querySelector('[data-ct-settings]')){const b=doc.createElement('button');b.type='button';b.dataset.ctSettings='1';b.textContent=currentLang()==='en'?'Account':'Conta';b.addEventListener('click',openSettings);mobile.appendChild(b)}}function injectTheme(doc){if(doc.querySelector('#ct-blue-theme'))return;const st=doc.createElement('style');st.id='ct-blue-theme';st.textContent=`:root{--bg:#05070a!important;--panel:#0b0f14!important;--panel2:#101722!important;--border:#203246!important;--gold:#4da3ff!important;--muted:#91a3b5!important}body,.sidebar{background:#05070a!important}.sidebar{border-right-color:#132235!important}.nav button.active{background:#0d1a2a!important;border-color:#173b63!important;color:#4da3ff!important}.card:hover{border-color:#2f80ed!important}.poster{background:radial-gradient(circle at 78% 18%,rgba(77,163,255,.2),transparent 34%),linear-gradient(145deg,#172331,#0b0f14)!important}.feature{background:linear-gradient(110deg,#0a1624,#0b0f14 55%,#0b1420)!important;border-color:#17304f!important}.btn-primary{background:#2f80ed!important;border-color:#4da3ff!important;color:#fff!important}.actor-link,.auth-toggle,.gold,.eyebrow,.drop-icon{color:#4da3ff!important}.cloud-bar.ok{border-color:#1e4f7a!important}.auth-page{background:radial-gradient(circle at 50% 12%,#07111f 0,#070b10 36%,#030506 100%)!important}.auth-card{border-color:#17304f!important}.profile{min-width:0!important}.profile strong{display:block!important;max-width:100%!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}.mobile-nav{grid-template-columns:repeat(5,1fr)!important}`;doc.head.appendChild(st)}function applyProfile(doc){const profile=doc.querySelector('.profile');if(!profile)return;const strong=profile.querySelector('strong');if(strong){strong.textContent=displayName();strong.title=displayName()}let mail=profile.querySelector('.ct-profile-email');if(!mail){mail=doc.createElement('div');mail.className='small muted ct-profile-email';mail.style.cssText='overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;margin-top:2px';strong?.after(mail)}mail.textContent=user()?.email||'';mail.title=user()?.email||''}function applyVersion(doc){replaceText(doc,'CineTracker Oficial v0.2.0','CineTracker Oficial v0.2.1')}function applyToFrame(){const doc=frame.contentDocument;if(!doc?.body)return;injectTheme(doc);injectSettingsButtons(doc);applyProfile(doc);applyVersion(doc);applyLanguage(doc);clearTimeout(reinjectTimer);reinjectTimer=setTimeout(()=>{injectSettingsButtons(doc);applyProfile(doc);applyVersion(doc)},250)}frame.addEventListener('load',()=>{applyToFrame();const doc=frame.contentDocument;if(doc?.body)new MutationObserver(()=>applyToFrame()).observe(doc.body,{childList:true,subtree:true})});</script></body></html>
