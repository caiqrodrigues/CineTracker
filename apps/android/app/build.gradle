plugins { id 'com.android.application' }

android {
    namespace 'com.cinetracker.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cinetracker.app'
        minSdk 26
        targetSdk 34
        versionCode 10051
        versionName '1.0.9'
        def webUrl = project.findProperty('CINETRACKER_WEB_URL') ?: 'https://mycinetracker.vercel.app'
        buildConfigField 'String', 'WEB_URL', '"' + webUrl + '"'
    }

    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}

// CineTracker 1.0.9 — versionCode 10051. Preserves the validated 1.0.8 startup/continuity fixes and removes standalone History from Home on Web and Android.
