plugins { id 'com.android.application' }

android {
    namespace 'com.cinetracker.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cinetracker.app'
        minSdk 26
        targetSdk 34
        versionCode 10000
        versionName '0.99.7.30'
        def webUrl = project.findProperty('CINETRACKER_WEB_URL') ?: 'https://mycinetracker.vercel.app'
        buildConfigField 'String', 'WEB_URL', '"' + webUrl + '"'
    }

    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}

// release: android-v0.99.7.30 — Android-only Discover fix: no PRA VOCE type filters, direct tab taps, native content carousels
