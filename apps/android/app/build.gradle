plugins { id 'com.android.application' }

android {
    namespace 'com.cinetracker.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cinetracker.app'
        minSdk 26
        targetSdk 34
        versionCode 980
        versionName '0.0.97 HOTFIX 2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        def webUrl = project.findProperty('CINETRACKER_WEB_URL') ?: 'https://mycinetracker.vercel.app'
        buildConfigField 'String', 'WEB_URL', '"' + webUrl + '"'
    }

    buildFeatures { buildConfig true }
}

tasks.register('copyV095Asset', Copy) {
    from file('../../web/patch-v067-v095.js')
    into file('src/main/assets')
    rename { 'ct83-v095.js' }
}
tasks.register('copyV097Asset', Copy) {
    from file('../../web/patch-v068-v097.js')
    into file('src/main/assets')
    rename { 'ct84-v097.js' }
}
preBuild.dependsOn copyV095Asset, copyV097Asset

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'

    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}

