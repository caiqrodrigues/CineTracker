plugins { id 'com.android.application' }

android {
    namespace 'com.cinetracker.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cinetracker.app'
        minSdk 26
        targetSdk 34
        versionCode 10107
        versionName '1.0'
        def webUrl = project.findProperty('CINETRACKER_WEB_URL') ?: 'https://mycinetracker.vercel.app'
        buildConfigField 'String', 'WEB_URL', '"' + webUrl + '"'
    }


    // Stable signing identity for official 1.0 and subsequent releases.
    // Stored in the existing CineTracker signing-key cache, not regenerated.
    signingConfigs {
        official {
            storeFile file(System.getenv('CINETRACKER_OFFICIAL_KEYSTORE') ?: System.getProperty('user.home') + '/.cinetracker/cinetracker.keystore')
            storePassword System.getenv('CINETRACKER_OFFICIAL_STORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('CINETRACKER_OFFICIAL_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('CINETRACKER_OFFICIAL_KEY_PASSWORD') ?: 'android'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.official
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}

// CineTracker Android 1.0/r306: strict 30-day dust in Home, recent episode freshness, and stable verified movie/series history; other screens unchanged.
