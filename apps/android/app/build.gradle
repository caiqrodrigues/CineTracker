plugins { id 'com.android.application' }

android {
    namespace 'com.cinetracker.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cinetracker.app'
        minSdk 26
        targetSdk 34
        versionCode 10104
        versionName '1.0'
        def webUrl = project.findProperty('CINETRACKER_WEB_URL') ?: 'https://mycinetracker.vercel.app'
        buildConfigField 'String', 'WEB_URL', '"' + webUrl + '"'
    }


    // The installed 1.0.61 official APK is signed with Android's debug
    // signingConfig certificate. Use the identical signing config for the
    // non-debuggable release variant to permit in-place upgrades.
    // The action independently verifies SHA-256 certificate equivalence.
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}

// CineTracker Android 1.0 official: same r303 features as 1.0.61; signed release APK compatible with installed official application.
