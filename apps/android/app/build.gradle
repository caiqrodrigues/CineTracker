plugins { id 'com.android.application' }

android {
    namespace 'com.cinetracker.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cinetracker.app'
        minSdk 26
        targetSdk 34
        versionCode 10059
        versionName '1.0.17'
        def webUrl = project.findProperty('CINETRACKER_WEB_URL') ?: 'https://mycinetracker.vercel.app'
        buildConfigField 'String', 'WEB_URL', '"' + webUrl + '"'
    }

    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}

// CineTracker 1.0.17 — versionCode 10059. Adds complete Watchlist drill-down in Profile; Web Sports gets standardized cards and a single action bar.
