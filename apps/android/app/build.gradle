plugins { id 'com.android.application' }

android {
    namespace 'com.cinetracker.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cinetracker.app'
        minSdk 26
        targetSdk 34
        versionCode 977
        versionName '0.0.97 FIX 7'
        def webUrl = project.findProperty('CINETRACKER_WEB_URL') ?: 'https://mycinetracker.vercel.app'
        buildConfigField 'String', 'WEB_URL', '"' + webUrl + '"'
    }

    buildFeatures { buildConfig true }
}

tasks.register('copyV095Asset', Copy) {
    from file('../../web/patch-v067-v095.js')
    into file('src/main/assets')
    rename { 'ct83-v095.js' }
}
tasks.register('copyV097Asset', Copy) {
    from file('../../web/patch-v068-v097.js')
    into file('src/main/assets')
    rename { 'ct84-v097.js' }
}
tasks.register('copyV097Fix7Asset', Copy) {
    from file('../../web/patch-v073-v097-fix7.js')
    into file('src/main/assets')
    rename { 'ct89-v097-fix7.js' }
}
preBuild.dependsOn copyV095Asset, copyV097Asset, copyV097Fix7Asset

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}

