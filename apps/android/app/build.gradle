plugins { id 'com.android.application' }

android {
    namespace 'com.cinetracker.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cinetracker.app'
        minSdk 26
        targetSdk 34
        versionCode 10007
        versionName '0.99.7.37'
        def webUrl = project.findProperty('CINETRACKER_WEB_URL') ?: 'https://mycinetracker.vercel.app'
        buildConfigField 'String', 'WEB_URL', '"' + webUrl + '"'
    }

    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}

// test release: android-v0.99.7.37 — Discover core direct clicks/no-pan rail, compact ordered Profile stats, single inline Sports watched action
